    list(people.map((x) => lrow({
      onclick: () => goTab('tasks', { taskFilter: 'active', person: x.p.id }),
      left: h('span', { class: 'avatar' }, x.p.name.charAt(0)),
      title: x.p.name,
      sub: dots(x.open ? x.open + ' open' : 'Nothing open', x.waiting ? x.waiting + ' waiting' : null, x.fix ? x.fix + ' to fix' : null),
      end: [x.overdue ? h('span', { class: 'due red' }, x.overdue + ' late') : null]
    }))),
    log.length ? [h('div', { class: 'section' }, h('h2', null, 'Recent activity'),
      h('button', { class: 'btn ghost tiny', onclick: () => goTab('more', { more: 'activity', log: null }) }, 'See all')),
      h('div', { class: 'list' }, log.map(logRow))] : null);
}

/* ======================================================================
   Admin: Tasks
   ====================================================================== */
const TASK_FILTERS = [
  ['active', 'Open', isOpen],
  ['pending', 'Waiting approval', (t) => isOpen(t) && t.status === 'Pending Approval'],
  ['overdue', 'Overdue', (t) => isOpen(t) && t.overdue],
  ['edit', 'To fix', (t) => isOpen(t) && t.review === 'Edit'],
  ['notstarted', 'Not started', (t) => isOpen(t) && !t.status],
  ['today', 'Due today', (t) => isOpen(t) && t.deadline === S.state.today],
  ['tomorrow', 'Due tomorrow', (t) => isOpen(t) && t.deadline === addDays(S.state.today, 1)],
  ['done', 'Done', (t) => !t.cancelled && !isOpen(t)],
  ['cancelled', 'Cancelled', (t) => t.cancelled],
  ['all', 'All', () => true]
];

/** The filters of a list on one line, and a search box that opens from the magnifier. */
function filterBar(controls, qKey, placeholder) {
  const shown = S.ui.search === qKey || !!S.ui[qKey];
  const focusSearch = () => { const el = document.querySelector('.main input[type=search]'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
  const btn = h('button', { type: 'button', class: 'icon-btn search-btn', 'aria-label': 'Search', style: shown ? 'color:var(--ink);border-color:var(--ink)' : '',
    onclick: () => { if (shown) { S.ui.search = ''; S.ui[qKey] = ''; render(); } else { S.ui.search = qKey; render(); focusSearch(); } } }, icon('search'));
  const inp = shown ? h('input', { class: 'in', type: 'search', placeholder, value: S.ui[qKey], dir: 'auto', style: 'margin:-4px 0 12px',
    oninput: (e) => { S.ui[qKey] = e.target.value; clearTimeout(S.searchT); S.searchT = setTimeout(() => { render(); focusSearch(); }, 250); } }) : null;
  return [h('div', { class: 'filters' }, controls, btn), inp];
}

function adminTasksView() {
  const st = S.state;
  const q = S.ui.q.trim().toLowerCase();
  const base = st.tasks.filter((t) => !S.ui.person || t.assignedTo === S.ui.person)
    .filter((t) => !q || (t.id + ' ' + t.task + ' ' + t.idea + ' ' + t.assignee).toLowerCase().indexOf(q) >= 0);
  const filter = TASK_FILTERS.find((f) => f[0] === S.ui.taskFilter) || TASK_FILTERS[0];
  let items = base.filter(filter[2]);
  items = S.ui.taskFilter === 'done' || S.ui.taskFilter === 'cancelled' || S.ui.taskFilter === 'all'
    ? items.sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || '')) : items.sort(byUrgency);
  const people = (st.users || st.people.map((p) => Object.assign({ active: true }, p)))
    .filter((u) => u.active || st.tasks.some((t) => t.assignedTo === u.id));
  return h('div', null,
    h('div', { class: 'page-head' }, h('h1', null, 'Tasks'),
      h('button', { class: 'btn primary quick', onclick: () => quickTaskSheet() }, '+ Quick task')),
    filterBar([
      selectBox(TASK_FILTERS.map((f) => ({ value: f[0], label: f[1], n: base.filter(f[2]).length })), filter[0],
        (v) => { S.ui.taskFilter = v; render(); }, { label: 'Show', on: filter[0] !== 'active' }),
      selectBox([{ value: '', label: 'Everyone' }].concat(people.map((u) => ({ value: u.id, label: u.name }))), S.ui.person,
        (v) => { S.ui.person = v; render(); }, { label: 'Person', on: !!S.ui.person })
    ], 'q', 'Search ID, task, person…'),
    list(items.map(taskRow), 'No tasks here.'));
}

/** A task as one line: title; ID, person and deadline under it; its state on the right. */
function taskRow(t) {
  const open = isOpen(t);
  return lrow({
    onclick: () => openTask(t.key), late: open && t.color === 'red', done: !open,
    title: t.task,
    sub: dots(h('span', { class: 'idtag' }, t.id), t.assignee, dueChip(t)),
    end: [personalBadge(t), commentBadge(t.id), checkBadge(t), rowStatus(t)]
  });
}

/** The admin edits every task; a manager edits the tasks they made and works on the ones given to them. */
function openTask(key) {
  const t = S.state.tasks.find((x) => x.key === key);
  if (!t) return;
  if (isAdmin()) taskSheet(key);
  else if (t.canEdit || t.assignedTo === S.me.id) managerTaskSheet(key);
  else taskViewSheet(key);
}

/** Personal: outside work someone gave themselves. Nobody else sees the admin's; the admin also sees a manager's. */
function personalBadge(t) {
  if (!t.personal) return null;
  return h('span', { class: 'badge b-purple' }, t.createdBy === S.me.id ? '🔒 Personal' : '🔒 ' + t.personal);
}

function approve(btn, t) {
  const ideaTasks = S.state.tasks.filter((x) => x.id === t.id && !x.cancelled && x.key !== t.key);
  const last = ideaTasks.every((x) => x.review === 'Approved');
  return instant((st) => {
    const x = st.tasks.find((k) => k.key === t.key);
    if (x) Object.assign(x, { review: 'Approved', status: 'Done', color: 'none', overdue: false });
  }, 'task.approve', { key: t.key }, last ? 'Approved · ' + t.id + ' is ready to post' : 'Approved');
}

function requestEditSheet(t) {
  const f = { key: t.key, note: '' };
  const btn = h('button', { class: 'btn primary' }, 'Send back');
  btn.onclick = () => {
    if (!f.note.trim()) { toast('Write what should change.', true); return; }
    instant((st) => {
      const x = st.tasks.find((k) => k.key === t.key);
      if (x) Object.assign(x, { review: 'Edit', reviewNotes: f.note.trim(), status: 'Started' });
    }, 'task.requestEdit', f, 'Sent back to ' + t.assignee);
  };
  openSheet('Send back · ' + t.id, h('div', null,
    h('p', { class: 'muted small', style: 'margin-top:0' }, t.assignee + ' gets it back with your note.'),
    field('What to change', area(f, 'note', { rows: 4 }))), btn);
}

const STATUS_OPTIONS = [{ value: '', label: 'Not started' }, { value: 'Started', label: 'Started' }, { value: 'Pending Approval', label: 'Waiting approval' }, { value: 'Done', label: 'Done' }];

/** The file of a task: what's there (view), upload, and a link field. */
function fileField(t, f, onUploaded) {
  const fileIn = input(f, 'fileLink', { type: 'url', dir: 'ltr', placeholder: S.state.media ? 'Or paste a link' : 'Paste the link' });
  return field('File', h('div', null,
    h('div', { class: 'files', style: 'margin-bottom:6px' }, filesLink(t.files, { id: t.id, video: isVideoTask(t) }),
      uploadButton({ id: t.id, label: t.task, multi: true }, (links) => { f.files = links; f.fileLink = links[0]; fileIn.value = links[0]; onUploaded(links); })),
    fileIn));
}

function personSelect(f, key, current) {
  const people = peopleOptions();
  if (current && !people.some((p) => p.value === current.id)) people.push({ value: current.id, label: current.name + ' (inactive)' });
  return selectBox([{ value: '', label: 'Pick…' }].concat(people), f[key], (v) => { f[key] = v; }, { full: true, label: 'Person' });
}

function taskSheet(key) {
  const t = S.state.tasks.find((x) => x.key === key);
  if (!t) return;
  const f = { key: t.key, task: t.task, brief: t.brief, assignedTo: t.assignedTo, deadline: t.deadline, status: t.status,
    fileLink: t.fileLink, draftCaption: t.draftCaption, notes: t.notes, reviewNotes: t.reviewNotes };
  const others = S.state.tasks.filter((o) => o.id === t.id && o.key !== t.key && !o.cancelled);
  const save = h('button', { class: 'btn primary' }, 'Save');
  save.onclick = () => run(save, 'task.save', f, 'Saved');
  const cancel = h('button', { class: 'btn danger' }, t.cancelled ? 'Restore task' : 'Cancel task');
  cancel.onclick = () => {
    if (!t.cancelled && !confirm('Cancel this task? It disappears from ' + t.assignee + '\'s list (nothing is deleted).')) return;
    instant((st) => {
      const x = st.tasks.find((k) => k.key === t.key);
      if (x) x.cancelled = !t.cancelled;
    }, 'task.cancel', { key: t.key, cancelled: !t.cancelled }, t.cancelled ? 'Task restored' : 'Task cancelled');
  };
  const pending = isOpen(t) && t.status === 'Pending Approval';
  const hasNotes = !!(t.draftCaption || t.notes || t.reviewNotes);

  openSheet(t.id + ' · ' + t.task, h('div', null,
    h('div', { class: 'row', style: 'margin-bottom:12px' }, personalBadge(t), statusBadge(t), dueChip(t, true),
      t.delivered ? h('span', { class: 'small muted' }, '· delivered ' + fmtDT(t.delivered)) : null),
    liveBox(() => checkNote(S.state.tasks.find((x) => x.key === t.key) || t)),
    pending ? h('div', { class: 'note gold' },
      h('div', { class: 't' }, 'Waiting your approval'),
      t.fileLink ? h('div', { class: 'files', style: 'margin:6px 0 10px' }, filesLink(t.files, { id: t.id, video: isVideoTask(t) }, 'View file')) : null,
      h('div', { class: 'row' },
        h('button', { class: 'btn good small', onclick: (e) => approve(e.currentTarget, t) }, '✓ Approve'),
        h('button', { class: 'btn small', onclick: () => requestEditSheet(t) }, '↩ Send back'))) : null,
    !pending && isOpen(t) && t.delivered ? h('div', { class: 'row', style: 'margin-bottom:12px' },
      h('button', { class: 'btn good small', onclick: (e) => approve(e.currentTarget, t) }, '✓ Approve')) : null,
    field('Task', input(f, 'task')),
    h('div', { class: 'two' },
      field('Assigned to', personSelect(f, 'assignedTo', { id: t.assignedTo, name: t.assignee })),
      field('Status', selectBox(STATUS_OPTIONS, f.status, (v) => { f.status = v; }, { full: true }))),
    field('Deadline', datePicker(f.deadline, (v) => { f.deadline = v; }, { suggest: taskDates(t.type) })),
    field('Brief', area(f, 'brief', { rows: 3 })),
    t.reference ? field('Reference', refLinks(t.reference)) : null,
    fileField(t, f, (links) => toast((links.length > 1 ? links.length + ' files' : 'Uploaded') + ' ✓ Tap Save')),
    h('details', { class: 'more', open: hasNotes ? true : null }, h('summary', null, 'Caption & notes'),
      field('Draft caption', area(f, 'draftCaption', { rows: 2 })),
      field('Notes', area(f, 'notes', { rows: 2 })),
      field('What to fix', area(f, 'reviewNotes', { rows: 2 }))),
    others.length ? h('div', { class: 'related' }, h('div', { class: 'head' }, 'Other tasks on ' + t.id),
      others.map((o) => h('div', { class: 'r' }, h('b', null, o.assignee), h('span', { class: 'muted grow' }, o.task), rowStatus(o), filesLink(o.files, { id: o.id, video: isVideoTask(o) })))) : null,
    h('div', { class: 'small faint' }, 'Created ' + fmtDT(t.createdAt)),
    commentsBox(t.id, { video: t.type === 'Video' })),
  [cancel, save]);
}

/** Manager: a task, read only, with its comments. */
function taskViewSheet(key) {
  const t = S.state.tasks.find((x) => x.key === key);
  if (!t) return;
  const others = S.state.tasks.filter((o) => o.id === t.id && o.key !== t.key && !o.cancelled);
  openSheet(t.id + ' · ' + t.task, h('div', null,
    h('div', { class: 'row', style: 'margin-bottom:10px' }, statusBadge(t), dueChip(t, true)),
    h('div', { class: 'kv' }, h('b', null, t.assignee), t.idea && t.idea !== t.task ? [' · ', h('span', { dir: 'auto' }, t.idea)] : null),
    t.review === 'Edit' ? h('div', { class: 'note orange' }, h('div', { class: 't' }, 'To fix'), h('div', { class: 'pre', dir: 'auto' }, t.reviewNotes)) : null,
    liveBox(() => checkNote(S.state.tasks.find((x) => x.key === t.key) || t)),
    t.brief ? h('div', { class: 'brief pre', dir: 'auto' }, t.brief) : null,
    t.reference ? field('Reference', refLinks(t.reference)) : null,
    t.fileLink ? h('div', { class: 'files', style: 'margin:8px 0' }, filesLink(t.files, { id: t.id, video: isVideoTask(t) })) : null,
    others.length ? h('div', { class: 'related' }, h('div', { class: 'head' }, 'Other tasks on ' + t.id),
      others.map((o) => h('div', { class: 'r' }, h('b', null, o.assignee), h('span', { class: 'muted grow' }, o.task), rowStatus(o),
        filesLink(o.files, { id: o.id, video: isVideoTask(o) })))) : null,
    commentsBox(t.id, { video: t.type === 'Video' })));
}

/**
 * Manager: a task they made (edit, reassign, cancel) and/or one given to them (do the work).
 * Their personal tasks they also mark done themselves; everything else is approved by the admin.
 */
function managerTaskSheet(key) {
  const t = S.state.tasks.find((x) => x.key === key);
  if (!t) return;
  const mine = t.assignedTo === S.me.id;
  const personal = !!t.personal;
  const working = mine && isOpen(t) && !personal;
  const f = { key: t.key, task: t.task, brief: t.brief, assignedTo: t.assignedTo, deadline: t.deadline, status: t.status };
  const w = { fileLink: t.fileLink, draftCaption: t.draftCaption, notes: t.notes };
  const others = S.state.tasks.filter((o) => o.id === t.id && o.key !== t.key && !o.cancelled);

  const work = (btn, status) => {
    if (w.fileLink && !/^(https?:\/\/)?[^\s.]+\.[^\s]+$/i.test(w.fileLink.trim())) { toast('The file link doesn\'t look like a link.', true); return; }
    if (status === 'Pending Approval' && !(w.fileLink || '').trim()) { toast('Add the file first.', true); return; }
    run(btn, 'task.update', Object.assign({ key: t.key }, w, status ? { status } : {}),
      status === 'Pending Approval' ? 'Sent for approval ✓' : status === 'Started' ? 'Marked as started' : 'Saved');
  };

  let footer = null;
  if (t.canEdit) {
    const save = h('button', { class: 'btn primary' }, 'Save');
    save.onclick = () => {
      if (!f.task.trim()) { toast('Write a title.', true); return; }
      run(save, 'task.save', personal ? f : { key: f.key, task: f.task, brief: f.brief, assignedTo: f.assignedTo, deadline: f.deadline }, 'Saved');
    };
    const cancel = h('button', { class: 'btn danger' }, t.cancelled ? 'Restore task' : 'Cancel task');
    cancel.onclick = () => {
      if (!t.cancelled && !confirm('Cancel this task?' + (mine ? '' : ' It disappears from ' + t.assignee + '\'s list (nothing is deleted).'))) return;
      instant((st) => { const x = st.tasks.find((k) => k.key === t.key); if (x) x.cancelled = !t.cancelled; },
        'task.cancel', { key: t.key, cancelled: !t.cancelled }, t.cancelled ? 'Task restored' : 'Task cancelled');
    };
    footer = [cancel, save];
  }

  openSheet(t.id + ' · ' + t.task, h('div', null,
    h('div', { class: 'row', style: 'margin-bottom:12px' }, personalBadge(t), statusBadge(t), dueChip(t, true)),
    t.review === 'Edit' ? h('div', { class: 'note orange' }, h('div', { class: 't' }, 'To fix'), h('div', { class: 'pre', dir: 'auto' }, t.reviewNotes)) : null,
    liveBox(() => checkNote(S.state.tasks.find((x) => x.key === t.key) || t)),
    t.canEdit ? [
      field('Task', input(f, 'task')),
      h('div', { class: 'two' },
        field('Assigned to', personSelect(f, 'assignedTo', { id: t.assignedTo, name: t.assignee })),
        personal ? field('Status', selectBox([{ value: '', label: 'Not started' }, { value: 'Started', label: 'Started' }, { value: 'Done', label: 'Done' }],
          f.status === 'Pending Approval' ? 'Started' : f.status, (v) => { f.status = v; }, { full: true })) : h('div')),
      field('Deadline', datePicker(f.deadline, (v) => { f.deadline = v; }, { suggest: taskDates(t.type) })),
      field('Brief', area(f, 'brief', { rows: 3 }))
    ] : [
      h('div', { class: 'kv' }, h('b', null, t.assignee)),
      t.brief ? h('div', { class: 'brief pre', dir: 'auto' }, t.brief) : null
    ],
    t.reference ? field('Reference', refLinks(t.reference)) : null,
    working ? [
      h('div', { class: 'section' }, h('h2', null, 'Your work')),
      h('div', { class: 'statusbar' },
        h('button', { class: 'btn' + (t.status === 'Started' ? ' cur' : ''), onclick: (e) => work(e.currentTarget, 'Started') }, t.status === 'Started' ? '▶ Started' : '▶ Start'),
        h('button', { class: 'btn' + (t.status === 'Pending Approval' ? ' cur' : ' primary'), onclick: (e) => work(e.currentTarget, 'Pending Approval') },
          t.status === 'Pending Approval' ? '✓ Sent' : 'Send for approval')),
      fileField(t, w, (links) => run(null, 'task.update', { key: t.key, files: links }, (links.length > 1 ? links.length + ' files uploaded ✓' : 'Uploaded ✓') + ' Now tap Send for approval', { keepSheet: true })),
      h('details', { class: 'more', open: t.draftCaption || t.notes ? true : null }, h('summary', null, 'Caption & notes'),
        field('Draft caption', area(w, 'draftCaption', { rows: 2 })),
        field('Notes', area(w, 'notes', { rows: 2 }))),
      h('button', { class: 'btn block', onclick: (e) => work(e.currentTarget) }, 'Save my work')
    ] : t.fileLink ? h('div', { class: 'files', style: 'margin:8px 0' }, filesLink(t.files, { id: t.id, video: isVideoTask(t) })) : null,
    others.length ? h('div', { class: 'related' }, h('div', { class: 'head' }, 'Other tasks on ' + t.id),
      others.map((o) => h('div', { class: 'r' }, h('b', null, o.assignee), h('span', { class: 'muted grow' }, o.task), rowStatus(o),
        filesLink(o.files, { id: o.id, video: isVideoTask(o) })))) : null,
    commentsBox(t.id, { video: t.type === 'Video' })), footer);
}

/* ----- Creating tasks ----- */
function templateRows(idea) {
  return S.state.templates.filter((tp) => tp.active && tp.type === idea.type).map((tp) => ({
    task: tp.task,
    assignedTo: S.state.people.some((p) => p.id === tp.assignee) ? tp.assignee : '',
    brief: [idea.brief, tp.note].filter(Boolean).join('\n\n'),
    deadline: '',
    linkRole: tp.linkRole
  }));
}

function createTasksSheet(idea, rows) {
  rows = rows && rows.length ? rows : templateRows(idea);
  if (!rows.length) rows = [blankRow(idea)];
  const body = h('div');
  const btn = h('button', { class: 'btn primary' });
  const draw = () => {
    btn.textContent = 'Create ' + rows.length + ' task' + (rows.length === 1 ? '' : 's');
    fill(body,
      h('div', { class: 'kv', style: 'margin-bottom:12px' }, h('span', { class: 'idtag' }, idea.id), ' ', h('b', { dir: 'auto' }, idea.idea)),
      rows.map((r, i) => h('div', { class: 'card', style: 'margin-bottom:10px;box-shadow:none;border:1px solid var(--line)' },
        h('div', { class: 'row', style: 'margin-bottom:8px' }, h('span', { class: 'eyebrow grow' }, 'Task ' + (i + 1)),
          rows.length > 1 ? h('button', { class: 'icon-btn', 'aria-label': 'Remove', onclick: () => { rows.splice(i, 1); draw(); } }, '✕') : null),
        field('Task', input(r, 'task', { placeholder: 'Short title' })),
        h('div', { class: 'two' },
          field('Assigned to', personSelect(r, 'assignedTo')),
          field('Goes on the post as', selectBox(linkRoleOptions(idea.type), r.linkRole || 'Media', (v) => { r.linkRole = v; }, { full: true }))),
        field('Deadline', datePicker(r.deadline, (v) => { r.deadline = v; }, { suggest: taskDates(idea.type) })),
        field('Brief', area(r, 'brief', { rows: 3 })))),
      h('button', { class: 'btn block small', onclick: () => { rows.push(blankRow(idea)); draw(); } }, '+ Another task'));
  };
  btn.onclick = () => {
    for (let i = 0; i < rows.length; i++) {
      if (!rows[i].task.trim()) { toast('Task ' + (i + 1) + ': write a title.', true); return; }
      if (!rows[i].assignedTo) { toast('Task ' + (i + 1) + ': pick who does it.', true); return; }
      if (!rows[i].deadline) { toast('Task ' + (i + 1) + ': pick a deadline.', true); return; }
    }
    run(btn, 'tasks.create', { id: idea.id, tasks: rows }, rows.length === 1 ? 'Task created' : rows.length + ' tasks created');
  };
  draw();
  openSheet('Tasks for ' + idea.id, body, btn);
}

function quickTaskSheet() {
  const f = { task: '', brief: '', type: '', assignedTo: '', deadline: '', channel: 'Social', reference: '' };
  const btn = h('button', { class: 'btn primary' }, 'Create task');
  btn.onclick = () => {
    if (!f.task.trim()) { toast('Write a title.', true); return; }
    if (!f.type) { toast('Pick a type.', true); return; }
    if (!f.assignedTo) { toast('Pick who does it.', true); return; }
    if (!f.deadline) { toast('Pick a deadline.', true); return; }
    run(btn, 'task.quick', f, (d) => 'Task created · ' + d.id);
  };
  const hint = h('div');
  const showHint = () => fill(hint, f.channel === 'Outside' && f.assignedTo === S.me.id
    ? h('div', { class: 'note', style: 'background:var(--purple-bg);border-color:#e1dcf0' }, h('div', { class: 't' }, '🔒 Personal task'),
      isAdmin() ? 'Only you will see it.' : 'Only you and the admin will see it.') : null);
  const dates = h('div');
  const drawDates = () => fill(dates, datePicker(f.deadline, (v) => { f.deadline = v; }, { suggest: taskDates(f.type) }));
  drawDates();
  const types = [{ value: '', label: 'Pick…' }].concat(S.state.types.map((x) => ({ value: x, label: x })));
  openSheet('Quick task', h('div', null,
    field('Task', input(f, 'task', { placeholder: 'e.g. Open house stories' })),
    h('div', { class: 'two' },
      field('Type', selectBox(types, '', (v) => { f.type = v; drawDates(); }, { full: true })),
      channelField(f, showHint)),
    field('Assigned to', selectBox([{ value: '', label: 'Pick…' }].concat(peopleOptions()), '', (v) => { f.assignedTo = v; showHint(); }, { full: true })),
    hint,
    field('Deadline', dates),
    field('Brief', area(f, 'brief', { rows: 3 })),
    field('Reference', area(f, 'reference', { rows: 1, dir: 'ltr', placeholder: 'Links to similar work' }))), btn);
}

/* ======================================================================
   Admin: Ideas
   ====================================================================== */
const IDEA_VIEWS = [['Later', 'To decide'], ['Approved', 'Approved'], ['Rejected', 'Rejected'], ['all', 'All ideas'], ['Quick', 'Quick tasks'], ['Hidden', 'Hidden']];
function ideaIn(i, v) {
  if (v === 'Hidden') return i.hidden;
  if (i.hidden) return false;
  if (v === 'Quick') return i.source === 'Quick';
  if (i.source === 'Quick') return false;
  return v === 'all' || i.execution === v;
}

function adminIdeasView() {
  const st = S.state;
  const q = S.ui.ideaQ.trim().toLowerCase();
  const view = IDEA_VIEWS.some((v) => v[0] === S.ui.ideaView) ? S.ui.ideaView : 'Later';
  const typed = st.ideas.filter((i) => !S.ui.ideaType || i.type === S.ui.ideaType)
    .filter((i) => !q || (i.id + ' ' + i.idea + ' ' + i.by + ' ' + i.brief).toLowerCase().indexOf(q) >= 0);
  const items = typed.filter((i) => ideaIn(i, view)).slice().reverse();
  const types = Array.from(new Set(st.types.concat(st.ideas.map((i) => i.type))));
  return h('div', null,
    h('div', { class: 'page-head' }, h('h1', null, 'Ideas'),
      h('button', { class: 'btn primary quick', onclick: () => (isAdmin() ? ideaSheet(null) : newIdeaSheet()) }, '+ New idea')),
    filterBar([
      selectBox(IDEA_VIEWS.map(([v, l]) => ({ value: v, label: l, n: typed.filter((i) => ideaIn(i, v)).length })), view,
        (v) => { S.ui.ideaView = v; render(); }, { label: 'Show', on: view !== 'Later' }),
      selectBox([{ value: '', label: 'All types' }].concat(types.map((x) => ({ value: x, label: x }))), S.ui.ideaType,
        (v) => { S.ui.ideaType = v; render(); }, { label: 'Type', on: !!S.ui.ideaType })
    ], 'ideaQ', 'Search ideas…'),
    list(items.map((i) => {
      const tasks = st.tasks.filter((t) => t.id === i.id && !t.cancelled);
      const done = tasks.filter((t) => !isOpen(t)).length;
      return lrow({
        onclick: () => (isAdmin() ? ideaSheet(i.id) : ideaViewSheet(i.id)),
        title: i.idea,
        sub: dots(h('span', { class: 'idtag' }, i.id), i.type, i.by, fmtShort((i.submittedAt || '').slice(0, 10)), tasks.length ? done + '/' + tasks.length + ' done' : null),
        end: [commentBadge(i.id), view === 'all' ? execBadge(i.execution) : null]
      });
    }), view === 'Later' ? 'No ideas waiting for a decision.' : 'Nothing here.'));
}

function ideaSheet(id) {
  const i = id ? S.state.ideas.find((x) => x.id === id) : null;
  const f = i ? { id: i.id, idea: i.idea, type: i.type, scribble: i.scribble, brief: i.brief, reference: i.reference || '', execution: i.execution, channel: i.channel }
    : { idea: '', type: '', scribble: '', brief: '', reference: '', execution: 'Later', channel: 'Social' };
  const tasks = i ? S.state.tasks.filter((t) => t.id === i.id) : [];
  const cal = i ? S.state.calendar.filter((c) => c.id === i.id) : [];
  const valid = () => {
    if (!f.idea.trim()) { toast('Write the idea.', true); return false; }
    if (!f.type) { toast('Pick a type.', true); return false; }
    return true;
  };
  const briefIn = area(f, 'brief', { rows: 3 });
  // "Turn into brief": saves, then the brief is written from the Scribble (the Scribble stays private).
  let lastBrief = i ? i.brief : '';
  const toBrief = S.state.ai ? h('button', { type: 'button', class: 'btn tiny', style: 'margin:-6px 0 12px' }, '✨ Turn into brief') : null;
  if (toBrief) {
    toBrief.onclick = async () => {
      if (!f.scribble.trim()) { toast('Write the Scribble first.', true); return; }
      if (!valid()) return;
      const d = await run(toBrief, 'idea.save', Object.assign({}, f, { askBrief: true }), 'Writing the brief…', { keepSheet: true });
      if (d && !i) ideaSheet(d.id);
    };
  }
  const sugBox = i ? liveBox(() => {
    const cur = S.state.ideas.find((x) => x.id === i.id) || i;
    // The written brief arrived while this is open: show it (unless the brief was edited here meanwhile).
    if (cur.brief !== lastBrief && f.brief === lastBrief) { f.brief = cur.brief; briefIn.value = f.brief; grow(briefIn); }
    lastBrief = cur.brief;
    if (cur.agentStatus === 'Waiting') return h('div', { class: 'small', style: 'margin:-8px 0 12px;color:var(--gold-ink)' }, 'Writing the brief…');
    if (cur.agentStatus === 'Error') return h('div', { class: 'note orange' }, 'Couldn\'t write it. Tap "Turn into brief" again.');
    return null;
  }) : h('div');

  const types = Array.from(new Set(S.state.types.concat(f.type ? [f.type] : [])));
  const approved = i && i.execution === 'Approved';
  const typeSel = selectBox([{ value: '', label: 'Pick…' }].concat(types.map((x) => ({ value: x, label: x }))), f.type, (v) => { f.type = v; }, { full: true });

  // Bottom: Approve / Later / Reject for an idea still to decide. Reject deletes it (an idea with work is hidden).
  let footer;
  if (i && i.hidden) {
    const restore = h('button', { class: 'btn primary' }, 'Restore');
    restore.onclick = () => instant((st) => { const x = st.ideas.find((k) => k.id === i.id); if (x) x.hidden = false; }, 'idea.restore', { id: i.id }, i.id + ' restored');
    footer = [restore];
  } else if (approved) {
    const save = h('button', { class: 'btn primary' }, 'Save');
    save.onclick = () => valid() && run(save, 'idea.save', f, 'Saved');
    footer = [save];
  } else {
    const later = h('button', { class: 'btn' }, i ? 'Later' : 'Save');
    later.onclick = () => valid() && run(later, 'idea.save', Object.assign({}, f, { execution: 'Later' }), i ? 'Kept for later' : (d) => 'Idea ' + d.id + ' saved');
    const ok = h('button', { class: 'btn primary' }, '✓ Approve');
    ok.onclick = async () => {
      if (!valid()) return;
      if (i) { approveSheet(i, f); return; }
      const d = await run(ok, 'idea.save', Object.assign({}, f, { execution: 'Later' }), null, { keepSheet: true });
      if (d) approveSheet(S.state.ideas.find((x) => x.id === d.id), Object.assign({}, f, { id: d.id }));
    };
    footer = [later, ok];
    if (i) {
      const reject = h('button', { class: 'btn danger' }, 'Reject');
      reject.onclick = () => {
        const hard = deletable(i);
        if (!confirm(hard ? 'Reject and delete ' + i.id + '?' : i.id + ' already has work, so it will be hidden (not deleted).')) return;
        instant((st) => {
          if (hard) st.ideas = st.ideas.filter((k) => k.id !== i.id);
          else { const x = st.ideas.find((k) => k.id === i.id); if (x) x.hidden = true; }
        }, 'idea.delete', { id: i.id }, hard ? i.id + ' rejected and deleted' : i.id + ' hidden');
      };
      footer.unshift(reject);
    }
  }

  openSheet(i ? i.id + ' · Idea' : 'New idea', h('div', null,
    i ? h('div', { class: 'small muted', style: 'margin-bottom:12px' }, dots('by ' + i.by, fmtDT(i.submittedAt), i.source === 'Quick' ? 'quick task' : null, i.hidden ? 'hidden' : null)) : null,
    field('Idea', area(f, 'idea', { rows: 2 })),
    h('div', { class: 'two' }, field('Type', typeSel), channelField(f)),
    field(h('span', null, 'Scribble', h('i', null, 'only you')), area(f, 'scribble', { rows: 3, class: 'in private', placeholder: 'Your notes' })),
    toBrief,
    field(h('span', null, 'Brief', h('i', null, 'the team sees this')), briefIn),
    sugBox,
    field('Reference', area(f, 'reference', { rows: 1, dir: 'ltr', placeholder: 'Links to similar work' })),
    approved ? h('div', null,
      h('div', { class: 'section' }, h('h2', null, 'Tasks'), h('button', { class: 'btn ghost tiny', onclick: () => createTasksSheet(i, tasks.some((t) => !t.cancelled) ? [blankRow(i)] : null) }, '+ Add')),
      tasks.length ? list(tasks.map(taskRow)) : h('div', { class: 'small muted' }, 'No tasks yet.'),
      h('div', { class: 'section' }, h('h2', null, 'Post'), cal.length ? null : h('button', { class: 'btn ghost tiny', onclick: () => calSheet(null, i.id) }, '+ Add')),
      cal.length ? list(cal.map((c) => postRow(c, { date: true }))) : h('div', { class: 'small muted' }, 'Lands in Ready once every task is approved.')) : null,
    approved && !i.hidden ? h('div', { style: 'margin-top:14px' }, h('button', { class: 'btn ghost tiny', style: 'color:var(--faint)', onclick: () => {
      if (!confirm(i.id + ' will be hidden. Its tasks stay as they are.')) return;
      instant((st) => { const x = st.ideas.find((k) => k.id === i.id); if (x) x.hidden = true; }, 'idea.delete', { id: i.id }, i.id + ' hidden');
    } }, 'Hide this idea')) : null,
    i ? commentsBox(i.id, { video: i.type === 'Video' }) : null),
  footer);
}

/** Manager: an idea, read only (no Scribble), with its tasks, post and comments. */
function ideaViewSheet(id) {
  const i = S.state.ideas.find((x) => x.id === id);
  if (!i) return;
  const tasks = S.state.tasks.filter((t) => t.id === i.id && !t.cancelled);
  const cal = S.state.calendar.filter((c) => c.id === i.id);
  openSheet(i.id + ' · Idea', h('div', null,
    h('div', { class: 'row', style: 'margin-bottom:8px' }, execBadge(i.execution), h('span', { class: 'small muted' }, dots(i.type, i.channel === 'Outside' ? 'Outside' : null, 'by ' + i.by, fmtDT(i.submittedAt)))),
    h('div', { class: 'pre', dir: 'auto', style: 'font-weight:550;font-size:15.5px' }, i.idea),
    i.brief ? h('div', { class: 'brief pre', dir: 'auto' }, i.brief) : null,
    i.reference ? field('Reference', refLinks(i.reference)) : null,
    tasks.length ? [h('div', { class: 'section' }, h('h2', null, 'Tasks')), list(tasks.map(taskRow))] : null,
    cal.length ? [h('div', { class: 'section' }, h('h2', null, 'Post')), list(cal.map((c) => postRow(c, { date: true })))] : null,
    commentsBox(i.id, { video: i.type === 'Video' })));
}

function deletable(i) {
  return i.execution !== 'Approved' && !S.state.tasks.some((t) => t.id === i.id) && !S.state.calendar.some((c) => c.id === i.id);
}

function blankRow(idea) {
  return { task: '', assignedTo: '', brief: idea.brief || '', deadline: '', linkRole: 'Media' };
}

/** Approve: pick one deadline, every auto task for the type is created at once. */
function approveSheet(i, f) {
  const tpls = S.state.templates.filter((t) => t.active && t.type === f.type);
  const missing = tpls.filter((t) => !S.state.people.some((p) => p.id === t.assignee));
  const pick = { deadline: '' };
  const preview = h('div');
  const drawPreview = () => fill(preview, tpls.length ? h('div', { class: 'related' },
    h('div', { class: 'head' }, 'Tasks that will be created'),
    tpls.map((t) => h('div', { class: 'r' }, h('b', null, S.state.names[t.assignee] || '— nobody —'), h('span', { class: 'muted grow' }, t.task),
      h('span', { class: 'small muted' }, pick.deadline ? dayShort(addWorkdays(pick.deadline, t.daysAfter)) : (t.daysAfter ? '+' + t.daysAfter + ' day' : ''))))) :
    h('div', { class: 'note orange' }, 'No auto tasks for ' + f.type + '. Use Customize.'));
  drawPreview();
  const go = h('button', { class: 'btn primary' }, 'Approve');
  go.onclick = async () => {
    if (!pick.deadline) { toast('Pick the deadline.', true); return; }
    if (missing.length) { toast('An auto task has no person. Use Customize.', true); return; }
    await run(go, 'idea.approve', Object.assign({}, f, { id: i.id, deadline: pick.deadline }),
      (d) => d.created + ' task' + (d.created === 1 ? '' : 's') + ' created for ' + i.id);
  };
  const custom = h('button', { class: 'btn' }, 'Customize');
  custom.onclick = async () => {
    const d = await run(custom, 'idea.save', Object.assign({}, f, { execution: 'Approved' }), null, { keepSheet: true });
    if (d) createTasksSheet(S.state.ideas.find((x) => x.id === i.id));
  };
  openSheet('Approve ' + i.id, h('div', null,
    h('div', { class: 'kv', style: 'margin-bottom:12px' }, h('b', { dir: 'auto' }, f.idea)),
    field(tpls.length > 1 ? 'Deadline · ' + tpls[0].task : 'Deadline', datePicker('', (v) => { pick.deadline = v; drawPreview(); }, { suggest: taskDates(f.type) })),
    preview,
    missing.length ? h('div', { class: 'note orange' }, 'An auto task has no active person. Fix it in More → Auto tasks, or use Customize.') : null),
  tpls.length && !missing.length ? [custom, go] : [custom]);
}

/* ======================================================================
   Admin: Calendar
   ====================================================================== */
/** What the two links of a post are called, by type: a video has a video and a cover. */
function linkLabels(type) {
  if (type === 'Video') return { media: 'Video', cover: 'Cover' };
  if (type === 'Blog') return { media: 'Article', cover: 'Image' };
  return { media: 'Design', cover: 'Cover' };
}
function linkRoleOptions(type) {
  const l = linkLabels(type);
  return [{ value: 'Media', label: l.media }, { value: 'Cover', label: l.cover }];
}

/** Posts that are put together but have no publish date yet. */
function readyPosts() {
  return (S.state.calendar || []).filter((c) => !c.publishDate && c.status !== 'Published' && c.status !== 'Cancelled');
}

/** Posts marked published in the last 3 days, newest first: the place to undo a mistake. */
function postedPosts() {
  const st = S.state;
  const since = addDays(st.now.slice(0, 10), -3) + st.now.slice(10);
  return (st.calendar || []).filter((c) => c.status === 'Published' && c.publishedAt >= since)
    .sort((a, b) => b.publishedAt.localeCompare(a.publishedAt));
}

/** Dated posts before today that never went out: the app asks about them. */
function missedPosts() {
  return (S.state.calendar || []).filter((c) => c.publishDate && c.publishDate < S.state.today && c.status !== 'Published' && c.status !== 'Cancelled')
    .sort((a, b) => a.publishDate.localeCompare(b.publishDate));
}

/** A post as one line: title; ID, date, type and platforms under it. */
function postRow(c, opts) {
  opts = opts || {};
  const on = Object.keys(c.platforms || {}).filter((p) => c.platforms[p]);
  const open = () => (opts.onclick ? opts.onclick(c) : isAdmin() ? calSheet(c.key) : postViewSheet(c));
  return lrow({
    onclick: open,
    left: opts.datebox && c.publishDate ? h('div', { class: 'datebox' }, h('b', null, c.publishDate.slice(8, 10)), h('span', null, wd(c.publishDate))) : null,
    title: c.idea || c.id,
    sub: dots(h('span', { class: 'idtag' }, c.id), opts.date ? (c.publishDate ? dayShort(c.publishDate) : 'No date') : null, c.type,
      on.length ? on.map(pfShort).join(' ') : null, opts.postedAt && c.publishedAt ? 'marked ' + fmtDT(c.publishedAt) : null),
    end: [commentBadge(c.id), c.status === 'Draft' ? h('span', { class: 'badge b-orange' }, 'Draft') : c.status === 'Cancelled' ? h('span', { class: 'badge' }, 'Cancelled') : null]
  });
}

/** A post's main file, or its carousel. */
function mediaOf(c) {
  return (c.mediaFiles || []).length > 1 ? filesLink(c.mediaFiles, { id: c.id }) : fileLink(c.mediaLink, { id: c.id, video: c.type === 'Video' });
}

/** One-tap post moves: published, back to Ready, back to the calendar, cancelled. */
function calMove(c, action) {
  const msg = { published: c.id + ' marked as published', ready: c.id + ' moved back to Ready', cancel: c.id + ' cancelled',
    unpublish: c.id + ' back on the calendar' }[action];
  return instant((st) => {
    const x = st.calendar.find((k) => k.key === c.key);
    if (!x) return;
    const wasPublished = x.status === 'Published';
    if (action === 'published') { x.status = 'Published'; x.publishedAt = S.state.now; }
    if (action === 'cancel') { x.status = 'Cancelled'; x.publishedAt = ''; }
    if (action === 'ready') { x.publishDate = ''; x.status = x.status === 'Draft' ? 'Draft' : 'Final'; x.publishedAt = ''; }
    if (action === 'unpublish') { x.status = 'Final'; x.publishedAt = ''; }
    if (wasPublished && (action === 'ready' || action === 'unpublish')) x.postLinks = x.postLinks.map(() => '');
  }, 'cal.status', { key: c.key, action }, msg);
}

/** What to do with a post that didn't go out, went out by mistake, or was cancelled. */
function postActionsSheet(c, actions) {
  const b = {
    posted: () => h('button', { class: 'btn good block', onclick: () => calMove(c, 'published') }, '✓ It went out'),
    ready: () => h('button', { class: 'btn block', onclick: () => calMove(c, 'ready') }, '↩ Back to Ready'),
    unpublish: () => h('button', { class: 'btn block', onclick: () => calMove(c, 'unpublish') }, '↩ Back to the calendar'),
    cancel: () => h('button', { class: 'btn danger block', onclick: () => { if (confirm('Cancel ' + c.id + '? It leaves the calendar.')) calMove(c, 'cancel'); } }, '✕ Cancel post')
  };
  openSheet(c.id + ' · ' + (c.idea || 'Post'), h('div', null,
    h('div', { class: 'small muted', style: 'margin-bottom:14px' }, dots(c.type, c.publishDate ? dayLong(c.publishDate) : 'No date', c.publishedAt ? 'marked ' + fmtDT(c.publishedAt) : null)),
    h('div', { class: 'stack' }, actions.map((a) => b[a]()),
      h('button', { class: 'btn ghost block', onclick: () => calSheet(c.key) }, 'Open the post'))));
}

/** Read-only view of a post (team and manager). */
function postViewSheet(c) {
  const l = linkLabels(c.type);
  const on = Object.keys(c.platforms).filter((p) => c.platforms[p]);
  const links = c.postLinks.filter(Boolean);
  openSheet(c.id + ' · Post', h('div', null,
    h('div', { class: 'row', style: 'margin-bottom:8px' }, calBadge(c.status), h('span', { class: 'small muted' }, dots(c.type, c.publishDate ? dayLong(c.publishDate) : 'No date yet'))),
    h('div', { dir: 'auto', style: 'font-weight:550;font-size:15.5px;margin-bottom:10px' }, c.idea),
    h('div', { class: 'related' },
      h('div', { class: 'r' }, h('b', { style: 'min-width:70px' }, l.media), h('div', { class: 'files grow' }, mediaOf(c) || h('span', { class: 'faint' }, '—'))),
      h('div', { class: 'r' }, h('b', { style: 'min-width:70px' }, l.cover), h('div', { class: 'files grow' }, fileLink(c.coverLink, { id: c.id }) || h('span', { class: 'faint' }, '—')))),
    on.length ? h('div', { style: 'margin:10px 0' }, on.map((p) => h('span', { class: 'pf on' }, p))) : null,
    field('Caption', h('div', { class: 'brief pre', dir: 'auto' }, c.caption || '—')),
    c.captions ? generatedCaptions(c, false) : null,
    links.length ? field('Published posts', h('div', { class: 'files' }, links.map((u, i) => h('a', { class: 'fchip', href: u, target: '_blank', rel: 'noopener noreferrer' }, 'Post ' + (i + 1) + ' ↗')))) : null,
    commentsBox(c.id, { video: c.type === 'Video' })));
}

function readyList() {
  const items = readyPosts().slice().sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  return list(items.map((c) => postRow(c)), 'Nothing waiting. A post lands here when every task of its idea is approved.');
}

function postedList() {
  const admin = isAdmin();
  return list(postedPosts().map((c) => postRow(c, { postedAt: true, onclick: admin ? () => postActionsSheet(c, ['unpublish', 'ready']) : null })),
    'Nothing marked published in the last 3 days.');
}

function calendarView() {
  const staff = isStaff();
  const admin = isAdmin();
  const segVal = staff || S.ui.calSeg === 'posted' ? (S.ui.calSeg || 'calendar') : 'calendar';

    cancelled: () => list(S.state.calendar.filter((c) => c.status === 'Cancelled').sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''))
      .map((c) => postRow(c, { date: true, onclick: admin ? () => postActionsSheet(c, ['ready']) : null })), 'No cancelled posts.')
  }[segVal] || calendarList;
  return h('div', null,

    staff ? seg([{ value: 'calendar', label: 'Calendar' }, { value: 'ready', label: 'Ready', n: readyPosts().length }, { value: 'rhythm', label: 'Rhythm' }], segVal, go) : null,
    h('div', { class: 'subnav' },
      staff ? null : h('button', { class: segVal === 'calendar' ? 'on' : '', onclick: () => go('calendar') }, 'Upcoming'),
      h('button', { class: segVal === 'posted' ? 'on' : '', onclick: () => go('posted') }, 'Posted'),
      admin ? h('button', { class: segVal === 'cancelled' ? 'on' : '', onclick: () => go('cancelled') }, 'Cancelled') : null,
      missed.length ? h('button', { class: segVal === 'missed' ? 'on' : '', onclick: () => go('missed') }, h('span', { class: 'warnpill' }, missed.length + ' didn\'t go out')) : null),
    body());
}

function weekStartOf(ymd) { return addDays(ymd, -ymdUTC(ymd).getUTCDay()); }

/** Upcoming posts by day (or a week), with platform and type filters. */
function calendarList() {
  const st = S.state;
  const today = st.today;
  const flt = S.ui.calFilter;
  const match = (c) => (!flt.platform || c.platforms[flt.platform]) && (!flt.type || c.type === flt.type);
  const live = (c) => c.status !== 'Published' && c.status !== 'Cancelled';
  const types = Array.from(new Set(st.types.concat(st.calendar.map((c) => c.type).filter(Boolean))));
  const filters = h('div', { class: 'filters' },
    selectBox([{ value: 'list', label: 'List' }, { value: 'week', label: 'Week' }], S.ui.calMode === 'week' ? 'week' : 'list', (v) => { S.ui.calMode = v; render(); }, { label: 'View' }),
    selectBox([{ value: '', label: 'All platforms' }].concat(st.platforms.map((p) => ({ value: p, label: p }))), flt.platform, (v) => { flt.platform = v; render(); }, { label: 'Platform', on: !!flt.platform }),
    selectBox([{ value: '', label: 'All types' }].concat(types.map((x) => ({ value: x, label: x }))), flt.type, (v) => { flt.type = v; render(); }, { label: 'Type', on: !!flt.type }));

  if (S.ui.calMode === 'week') {
    const start = S.ui.weekStart || weekStartOf(today);
    const days = [0, 1, 2, 3, 4, 5, 6].map((n) => addDays(start, n));
    return h('div', null, filters,
      h('div', { class: 'row', style: 'margin-bottom:10px' },
        h('button', { class: 'btn tiny', onclick: () => { S.ui.weekStart = addDays(start, -7); render(); } }, '‹'),

/* ----- Rhythm: are we posting as often as planned? Days × platforms. ----- */
const PF_SHORT = { Instagram: 'IG', TikTok: 'TT', YouTube: 'YT', Facebook: 'FB', Snapchat: 'SC', LinkedIn: 'Li', X: 'X', Twitter: 'X', Threads: 'Th', Website: 'Web' };
function pfShort(p) { return PF_SHORT[p] || p.slice(0, 3); }

/** One day × one platform: how many posts the rule wants and what's planned (or went out, for past days). */
function rhythmCell(d, p) {
  const st = S.state;
  const r = (st.rhythm || {})[p] || { days: [], min: 0, time: '' };
  const need = r.min > 0 && r.days.indexOf(wd(d)) >= 0 ? r.min : 0;
  const posts = st.calendar.filter((c) => c.publishDate === d && c.platforms[p] && c.status !== 'Cancelled');
  const past = d < st.today;
  const counted = past ? posts.filter((c) => c.status === 'Published') : posts;
  const ready = counted.filter((c) => c.status !== 'Draft').length;
  let cls = 'ok', mark = '✓';
  if (!need) { cls = 'off'; mark = posts.length ? String(posts.length) : '·'; }
  else if (counted.length < need) { cls = 'miss'; mark = counted.length ? counted.length + '/' + need : '✕'; }
  else if (!past && ready < need) { cls = 'part'; mark = '✎'; }
  return { cls, mark, need, posts, r };
}

function rhythmView() {
  const st = S.state;
  const today = st.today;
  const plats = st.platforms;
  const anyRule = plats.some((p) => (st.rhythm[p] || {}).min > 0 && (st.rhythm[p] || {}).days.length);
  const days = [];
  for (let i = -7; i < 14; i++) days.push(addDays(today, i));
  const gaps = days.filter((d) => d >= today).reduce((n, d) => n + plats.filter((p) => rhythmCell(d, p).cls === 'miss').length, 0);
  return h('div', null,
    h('div', { class: 'row', style: 'margin-bottom:8px' },
      h('div', { class: 'grow small' }, anyRule ? (gaps ? h('span', { style: 'color:var(--red)' }, gaps + ' gap' + (gaps === 1 ? '' : 's') + ' in the next 2 weeks') : h('span', { style: 'color:var(--green)' }, '✓ Next 2 weeks covered'))
        : h('span', { class: 'muted' }, 'No rules yet.')),
      isAdmin() ? h('button', { class: 'btn tiny', onclick: rhythmRulesSheet }, 'Rules') : null),
    h('div', { class: 'card', style: 'padding:8px 6px' }, h('table', { class: 'rgrid' },
      h('thead', null, h('tr', null, h('th', { class: 'd' }, ''), plats.map((p) => h('th', { title: p }, pfShort(p))))),
      h('tbody', null, days.map((d) => h('tr', { class: (d === today ? 'today' : '') + (d < today ? ' past' : '') + (wd(d) === 'Sun' && d !== days[0] ? ' wk' : '') },
        h('td', { class: 'd' }, wd(d) + ' ' + fmtShort(d)),
        plats.map((p) => { const x = rhythmCell(d, p); return h('td', { class: x.cls, title: p, onclick: () => rhythmCellSheet(d, p) }, x.mark); })))))),
    h('div', { class: 'legend' },

function copyText(s) {
  const fallback = () => {
    const t = h('textarea', { style: 'position:fixed;opacity:0' });
    t.value = s;
    document.body.append(t);
    t.select();
    try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Select the text and copy it.', true); }
    t.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(() => toast('Copied'), fallback);
  else fallback();
}

    h('div', { class: 'two' },
      field('Username', userIn),
      field(h('span', null, 'ID prefix', h('i', null, hasIdeas ? 'locked' : 'unique')), prefixIn))), footer);
}

/** Auto tasks: when an idea of a type is approved, these tasks are made for it. */
function autoTasksView() {
  const st = S.state;
  const types = Array.from(new Set(st.settings.types.concat(st.templates.map((t) => t.type))));
  return h('div', null,
    h('p', { class: 'small muted', style: 'margin:0 0 6px' }, 'Approving an idea makes these tasks for it.'),
    types.map((type) => {
      const rows = st.templates.filter((t) => t.type === type);
      return [h('div', { class: 'section' }, h('h2', null, type), h('button', { class: 'btn ghost tiny', onclick: () => templateSheet(null, type) }, '+ Add')),
        rows.length ? h('div', { class: 'list' }, rows.map((t, i) => h('div', { class: 'lrow', style: t.active ? '' : 'opacity:.5' },
          h('div', { class: 'main-col', role: 'button', tabindex: 0, onclick: () => templateSheet(t.key) },
            h('div', { class: 't' }, t.task, t.active ? '' : ' (off)'),
            h('div', { class: 's' }, dots(st.names[t.assignee] || 'No one', t.daysAfter ? '+' + t.daysAfter + ' day' : null, t.linkRole === 'Cover' ? 'cover' : 'main file'))),
          h('button', { class: 'icon-btn', disabled: i === 0, 'aria-label': 'Move up', onclick: (e) => run(e.currentTarget, 'template.move', { key: t.key, dir: 'up' }) }, '↑'),
          h('button', { class: 'icon-btn', disabled: i === rows.length - 1, 'aria-label': 'Move down', onclick: (e) => run(e.currentTarget, 'template.move', { key: t.key, dir: 'down' }) }, '↓'))))
          : h('div', { class: 'small faint' }, 'None yet.')];
    }));
}

/** Captions: each platform's way of writing, the brief style, the license numbers; the fixed rules under Advanced. */
function captionsView() {
  const st = S.state;
  const set = st.settings;
  const styles = set.captionStyles || {};
  const addF = { v: '' };
  const lic = { licenseNumbers: set.licenseNumbers };
  const brief = { briefStyle: set.briefStyle || set.defaultBriefStyle };
  const adv = { captionRules: set.captionRules || set.defaultCaptionRules, model: set.model };
  const add = h('button', { class: 'btn small' }, 'Add');
  add.onclick = () => {
    const v = addF.v.trim();
    if (!v) return;
    if (set.platforms.some((p) => p.toLowerCase() === v.toLowerCase())) { toast(v + ' is already there.', true); return; }
    run(add, 'settings.save', { platforms: set.platforms.concat([v]) }, v + ' added').then((d) => { if (d) platformSheet(v); });
  };
  return h('div', null,
    !st.ai ? h('div', { class: 'note orange' }, 'Auto writing is not connected yet.') : null,
    h('div', { class: 'section', style: 'margin-top:4px' }, h('h2', null, 'Platforms')),
    list(set.platforms.map((p) => {
      const x = styles[p] || {};
      const n = String(x.examples || '').split(/\n---\n/).filter((e) => e.trim()).length;
      return lrow({ onclick: () => platformSheet(p), title: p,
        sub: dots(x.format === 'youtube' ? 'title, description, tags' : 'caption', n ? n + ' example' + (n === 1 ? '' : 's') : 'no examples yet') });
    })),
    h('div', { class: 'row', style: 'margin-top:8px' }, h('div', { class: 'grow' }, input(addF, 'v', { placeholder: 'New platform (e.g. Threads)' })), add),
    h('div', { class: 'section' }, h('h2', null, 'Brief from the Scribble')),
    h('div', { class: 'card' },
      area(brief, 'briefStyle', { rows: 6 }),
      h('div', { class: 'row', style: 'margin-top:8px' },
        h('button', { class: 'btn primary small', onclick: (e) => run(e.currentTarget, 'settings.save', brief, 'Brief style saved') }, 'Save'),
        h('button', { class: 'btn ghost tiny', onclick: (e) => { brief.briefStyle = set.defaultBriefStyle; run(e.currentTarget, 'settings.save', brief, 'Back to the default'); } }, 'Use the default'))),
    h('div', { class: 'section' }, h('h2', null, 'License numbers')),
    h('div', { class: 'card' },
      area(lic, 'licenseNumbers', { rows: 2, dir: 'ltr', placeholder: 'CN: 5119576\nADM: 202304448388' }),
      h('div', { class: 'small faint', style: 'margin:4px 0 8px' }, 'One per line. Every design must show them all.'),
      h('button', { class: 'btn primary small', onclick: (e) => run(e.currentTarget, 'settings.save', lic, 'Saved') }, 'Save')),
    h('details', { class: 'more', style: 'margin-top:18px' }, h('summary', null, 'Advanced'),
      h('div', { class: 'card' },
        field(h('span', null, 'Rules for every caption', h('i', null, 'never invent facts is always added')), area(adv, 'captionRules', { rows: 7, dir: 'ltr' })),
        field(h('span', null, 'Model', h('i', null, 'empty = automatic')), input(adv, 'model', { dir: 'ltr', placeholder: 'automatic' })),
        h('div', { class: 'row' },
          h('button', { class: 'btn primary small', onclick: (e) => run(e.currentTarget, 'settings.save', adv, 'Saved') }, 'Save'),
          h('button', { class: 'btn ghost tiny', onclick: (e) => { adv.captionRules = set.defaultCaptionRules; run(e.currentTarget, 'settings.save', { captionRules: adv.captionRules }, 'Back to the default'); } }, 'Use the default rules')))));
}

/** One platform: how its caption is written (format, examples, notes), or remove it. */
function platformSheet(name) {
  const set = S.state.settings;
  const x = (set.captionStyles || {})[name] || { format: 'caption', examples: '', notes: '' };
  const f = { format: x.format || 'caption', examples: x.examples || '', notes: x.notes || '' };
  const save = h('button', { class: 'btn primary' }, 'Save');
  save.onclick = () => run(save, 'settings.save', { captionStyles: { [name]: f } }, name + ' saved');
  const del = h('button', { class: 'btn danger' }, 'Remove');
  del.onclick = () => {
    if (set.platforms.length <= 1) { toast('Keep at least one platform.', true); return; }
    if (!confirm('Remove ' + name + '? Posts keep what they had.')) return;
    run(del, 'settings.save', { platforms: set.platforms.filter((p) => p !== name) }, name + ' removed');
  };
  openSheet(name, h('div', null,
    field('Writes', selectBox([{ value: 'caption', label: 'A caption' }, { value: 'youtube', label: 'Title, description and tags' }], f.format, (v) => { f.format = v; }, { full: true })),
    field(h('span', null, 'Examples', h('i', null, 'a line with --- between two')), area(f, 'examples', { rows: 10, dir: 'ltr', placeholder: 'Paste captions you like' })),
    field(h('span', null, 'How to write it', h('i', null, 'length, tone, hashtags')), area(f, 'notes', { rows: 3, dir: 'ltr' }))), [del, save]);
}

/** App: name, idea types, work hours. */
function appSettingsView() {
  const st = S.state;
  const set = st.settings;
  const listEditor = (key, items, label) => {
    const items2 = items.slice();
    const box = h('div');
    const add = { v: '' };
    const draw = () => fill(box,
      h('div', { class: 'chips' }, items2.map((x, i) => h('span', { class: 'chip' }, x,
        h('button', { type: 'button', class: 'btn ghost tiny', style: 'min-height:20px;padding:0 2px;color:var(--faint)', 'aria-label': 'Remove ' + x, onclick: () => { items2.splice(i, 1); draw(); } }, '✕')))),
      h('div', { class: 'row', style: 'margin-top:10px' },
        h('div', { class: 'grow' }, input(add, 'v', { placeholder: 'Add a ' + label.toLowerCase() })),
        h('button', { class: 'btn small', onclick: () => { const v = add.v.trim(); if (v) { items2.push(v); add.v = ''; draw(); } } }, 'Add')),
      h('button', { class: 'btn primary small', style: 'margin-top:10px', onclick: (e) => run(e.currentTarget, 'settings.save', { [key]: items2 }, 'Saved') }, 'Save'));
    draw();
    return box;
  };
  const hours = {};
  DAYN.forEach((d) => { hours[d] = set.hours[d] ? Object.assign({}, set.hours[d]) : null; });
  const hoursBox = h('div');
  const drawHours = () => fill(hoursBox,
    DAYN.map((d, i) => h('div', { class: 'row', style: 'padding:6px 0;border-bottom:1px solid var(--line)' },
      h('span', { style: 'width:44px;font-weight:550' }, d),
      selectBox([{ value: 'on', label: 'Work' }, { value: 'off', label: 'Off' }], hours[d] ? 'on' : 'off', (v) => { hours[d] = v === 'on' ? (hours[d] || { start: '09:00', end: '18:00' }) : null; drawHours(); }),
      hours[d] ? h('div', { class: 'row' },
        h('input', { class: 'in', type: 'time', style: 'width:auto;min-height:34px;padding:4px 8px', value: hours[d].start, onchange: (e) => { hours[d].start = e.target.value; } }), '–',
        h('input', { class: 'in', type: 'time', style: 'width:auto;min-height:34px;padding:4px 8px', value: hours[d].end, onchange: (e) => { hours[d].end = e.target.value; } })) : null)),
    h('button', { class: 'btn primary small', style: 'margin-top:10px', onclick: (e) => run(e.currentTarget, 'settings.save', { hours }, 'Work hours saved') }, 'Save'));
  drawHours();
  const app = { appName: set.appName };
  return h('div', null,
    h('div', { class: 'section', style: 'margin-top:4px' }, h('h2', null, 'Idea types')), h('div', { class: 'card' }, listEditor('types', set.types, 'Type')),
    h('div', { class: 'section' }, h('h2', null, 'Work hours')), h('div', { class: 'card' }, hoursBox),
    h('div', { class: 'section' }, h('h2', null, 'App name')), h('div', { class: 'card' }, input(app, 'appName'),
      h('button', { class: 'btn primary small', style: 'margin-top:10px', onclick: (e) => run(e.currentTarget, 'settings.save', { appName: app.appName }, 'Saved') }, 'Save')));
}

function templateSheet(key, type) {
  const t = key ? S.state.templates.find((x) => x.key === key) : null;
  const f = t ? { key: t.key, type: t.type, task: t.task, assignee: t.assignee, note: t.note, active: t.active, daysAfter: t.daysAfter, linkRole: t.linkRole }
    : { type: type || '', task: '', assignee: '', note: '', active: true, daysAfter: 0, linkRole: 'Media' };
  const btn = h('button', { class: 'btn primary' }, 'Save');
  btn.onclick = () => run(btn, 'template.save', f, 'Saved');
  openSheet(t ? 'Auto task' : 'New auto task', h('div', null,
    field('Task', input(f, 'task')),
    h('div', { class: 'two' },
      field('Type', selectBox(S.state.types.map((x) => ({ value: x, label: x })), f.type, (v) => { f.type = v; }, { full: true })),
      field('Person', selectBox(peopleOptions(true), f.assignee, (v) => { f.assignee = v; }, { full: true }))),
    h('div', { class: 'two' },
      field('Deadline', selectBox([0, 1, 2, 3].map((n) => ({ value: String(n), label: n ? '+' + n + ' workday' + (n > 1 ? 's' : '') : 'Same day' })), String(f.daysAfter), (v) => { f.daysAfter = Number(v); }, { full: true })),
      field('Goes on the post as', selectBox(linkRoleOptions(f.type), f.linkRole, (v) => { f.linkRole = v; }, { full: true }))),
    field(h('span', null, 'Note', h('i', null, 'added under the brief')), area(f, 'note', { rows: 2 })),
    field('Active', selectBox([{ value: 'on', label: 'On' }, { value: 'off', label: 'Off' }], f.active ? 'on' : 'off', (v) => { f.active = v === 'on'; }, { full: true }))), btn);
}

/* ----- Activity log ----- */
function describeKey(l) {
  const st = S.state;
  if (l.entity === 'Settings') return l.key;
  if (l.entity === 'Task') { const t = st.tasks.find((x) => x.key === l.key); return t ? t.id + ' · ' + t.task + ' (' + t.assignee + ')' : 'task'; }
  if (l.entity === 'Calendar') { const c = st.calendar.find((x) => x.key === l.key); return c ? 'calendar ' + c.id : 'calendar'; }
  if (l.entity === 'User') return st.names[l.key] || l.key;
  if (l.entity === 'Template') { const t = (st.templates || []).find((x) => x.key === l.key); return t ? 'template ' + t.type + ' · ' + t.task : 'template'; }
  return l.entity === 'Idea' ? l.key : l.entity + ' ' + l.key;
}
/** Makes log values readable: dates, people, yes/no. */
function niceVal(v) {
  if (!v) return '—';
  if (v === 'TRUE') return 'Yes';
  if (v === 'FALSE') return 'No';
  if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(v)) return fmtDT(v);
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return fmtD(v);
  v = v.replace(/\bU\d{3,}\b/g, (id) => S.state.names[id] || id);
  return v.length > 80 ? v.slice(0, 80) + '…' : v;
}
/** One save writes one log row per field; show them as one entry. */
function groupLog(rows) {
  const out = [];
  rows.forEach((l) => {
    const g = out[out.length - 1];
    if (g && g.at === l.at && g.user === l.user && g.action === l.action && g.key === l.key && g.entity === l.entity) g.items.push(l);
    else out.push({ at: l.at, user: l.user, action: l.action, entity: l.entity, key: l.key, items: [l] });
  });
  return out;
}
function logRow(g) {
  return h('div', { class: 'log-row' },
    h('div', null, h('b', null, g.user), ' · ', g.action.toLowerCase(), ' ', h('span', null, describeKey(g))),
    g.items.map((l) => l.field
      ? h('div', { class: 'small', dir: 'auto' }, l.field + ': ', h('span', { class: 'muted' }, niceVal(l.old)), ' → ', niceVal(l.new))
      : l.new ? h('div', { class: 'small muted', dir: 'auto' }, niceVal(l.new)) : null),
    h('div', { class: 'small faint' }, fmtDT(g.at)));
}
function activityView() {
  if (!S.ui.log) {
    S.ui.log = 'loading';
    call('log.list', { limit: 300 }).then((d) => { S.ui.log = d.log; render(); }).catch((e) => { S.ui.log = null; handleErr(e); });
  }
  if (S.ui.log === 'loading') return h('div', { class: 'loading', style: 'min-height:200px' }, h('div', { class: 'spinner' }));
  return S.ui.log.length ? h('div', { class: 'list' }, groupLog(S.ui.log).map(logRow)) : h('div', { class: 'empty' }, 'Nothing yet.');
}

boot();
</script>
