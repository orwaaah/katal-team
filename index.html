<html lang="en">

<style>
/* ===== KATAL: black, warm white and champagne gold. Calm, compact, made for the company. ===== */
:root {
  --brand: #141311;          /* top bar, main buttons */
  --brand-ink: #ffffff;
  --gold: #b39463;           /* KATAL accent */
  --gold-ink: #8a6d3f;
  --gold-soft: #f5efe4;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bg: #f6f4f0;
  --card: #ffffff;
  --ink: #1a1815;
  --muted: #8c867c;
  --faint: #b3ada3;
  --line: #ebe7df;
  --soft: #f8f6f2;
  --red: #b4483d;   --red-bg: #faefed;  --red-line: #e3b2ab;
  --green: #3d7a57; --green-bg: #edf5f0;
  --orange: #a3701f; --orange-bg: #faf3e6;
  --blue: #46658f;  --blue-bg: #eef2f7;
  --purple: #6c5da3; --purple-bg: #f2f0f8;
  --gray-bg: #f0ede7;
  --rh-empty: #f6f4f0; /* a Rhythm square with nothing in it: just there */
  --radius: 14px;
  --shadow: 0 1px 2px rgba(26,24,21,.04), 0 4px 14px rgba(26,24,21,.04);
  --nav-h: 58px;
  --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
/* The page always fits the phone: no zooming in or out, long links wrap, and nothing can make it wider. */
html { touch-action: pan-x pan-y; }
#app { overflow-x: clip; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; overflow-wrap: break-word; }
body.noscroll { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
/* Controls don't pick up their words on a long press or a quick double tap (no zoom, no stray selection);
   the words people read (names, briefs, captions, comments) can always be selected and copied. */
button, .btn, nav.tabs, .chip, .face, .bstrip, .seg, .subnav, .pbar, .pbar-top, .choice, .gkey { -webkit-user-select: none; user-select: none; }
button, a, [role=button], label, select, summary { touch-action: manipulation; }
/* With a keyboard, the focused control shows a gold ring (a tap shows nothing). */
button:focus-visible, a:focus-visible, [role=button]:focus-visible, [role=checkbox]:focus-visible, .datefield:focus-within { outline: 2px solid var(--gold); outline-offset: 2px; }
a { color: var(--gold-ink); }
h1, h2, h3 { margin: 0; line-height: 1.25; font-weight: 650; letter-spacing: -.01em; }
.pre { white-space: pre-wrap; word-break: break-word; }
/* Text that mixes Arabic and English (briefs, details, notes, comments, what's typed): each line goes in its own
   direction, so an English line reads left to right under an Arabic one, with its full stop at the end. */
.pre, .cmt .txt, textarea { unicode-bidi: plaintext; text-align: start; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.hidden { display: none !important; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ----- Top bar and tabs ----- */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; gap: 12px; height: calc(52px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
.brandmark { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brandmark img { height: 15px; width: auto; display: block; }
.brandmark .sep { width: 1px; height: 16px; background: rgba(255,255,255,.22); }
.brandmark .team { font-size: 11px; font-weight: 600; letter-spacing: .32em; color: var(--gold); text-transform: uppercase; }
.me-btn { background: none; border: 0; color: inherit; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 0 4px 4px; font-size: 14px; }
.me-btn .nm { opacity: .8; }
@media (max-width: 420px) { .me-btn .nm { display: none; } }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--gold-soft); color: var(--gold-ink); display: grid; place-items: center; font-weight: 650; font-size: 13px; flex: none; }
.topbar .avatar { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(179,148,99,.55); }
.topbar.as { background: #3a2f1c; }
.aspill { margin-left: auto; border: 1px solid rgba(179,148,99,.7); background: rgba(179,148,99,.18); color: #f1e3c6; border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
.topbar.as .me-btn { margin-left: 8px; }
/* The team chat's button, up top; a red count when something new came. */
.chat-btn { position: relative; flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.08); color: inherit; display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .2s; }
.chat-btn:hover { background: rgba(255,255,255,.16); }
.chat-btn svg { width: 19px; height: 19px; }
.chat-btn .dot { position: absolute; top: -3px; right: -4px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; line-height: 1; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--brand); }
.topbar.as .chat-btn .dot { box-shadow: 0 0 0 2px #3a2f1c; }
.asbar { display: flex; align-items: center; gap: 10px; padding: 8px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); background: var(--gold-soft); color: var(--gold-ink); font-size: 13px; }
.asbar b { font-weight: 650; }
.main { max-width: 860px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right)) calc(var(--nav-h) + 30px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.main.enter { animation: enter .22s var(--ease); }
.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: rgba(255,255,255,.94); -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px); border-top: 1px solid var(--line); display: flex; justify-content: center; padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.tabs button { flex: 1; min-width: 0; max-width: 120px; height: var(--nav-h); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10.5px; font-weight: 500; letter-spacing: .02em; color: var(--faint); cursor: pointer; position: relative; padding: 0 2px; transition: color .2s; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button.on { color: var(--ink); font-weight: 600; }
.tabs button.on::before { content: ""; position: absolute; top: 0; left: 50%; width: 22px; height: 2px; margin-left: -11px; border-radius: 0 0 2px 2px; background: var(--gold); }
.tabs .dot { position: absolute; top: 7px; left: calc(50% + 7px); background: var(--gold); color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; min-width: 16px; height: 16px; padding: 0 4px; display: grid; place-items: center; }
@media (min-width: 900px) {
  .tabs { position: sticky; top: calc(52px + env(safe-area-inset-top)); bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); }
  .tabs button { flex-direction: row; height: 46px; font-size: 14px; gap: 8px; max-width: 150px; }
  .tabs button svg { width: 18px; height: 18px; }
  .tabs button.on::before { top: auto; bottom: 0; width: 100%; left: 0; margin: 0; border-radius: 2px 2px 0 0; }
  .tabs .dot { position: static; }
  .main { padding-bottom: 40px; }
}
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin: 2px 0 14px; }
.page-head h1 { font-size: 23px; }
.page-head .eyebrow { margin-bottom: 4px; }
.section { margin: 24px 0 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.section h2 { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stack > * + * { margin-top: 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.empty { text-align: center; color: var(--muted); padding: 30px 16px; font-size: 14px; }
.empty .big { font-size: 22px; display: block; margin-bottom: 6px; color: var(--gold); }

/* ----- Buttons ----- */
.btn { border: 1px solid var(--line); border-radius: 11px; padding: 0 15px; min-height: 42px; font-weight: 550; font-size: 14.5px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; background: var(--card); color: var(--ink); position: relative; text-decoration: none; transition: transform .12s var(--ease), background .15s, border-color .15s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #fff; }
.btn.good { background: var(--green); border-color: var(--green); color: #fff; }
.btn.warn { background: var(--card); border-color: #e4cfa6; color: var(--orange); }
.btn.danger { background: var(--card); border-color: var(--red-line); color: var(--red); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--gold-ink); padding: 0 6px; }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 9px; }
.btn.tiny { min-height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.busy { color: transparent !important; }
.btn.busy::after { content: ""; position: absolute; width: 16px; height: 16px; border: 2px solid rgba(0,0,0,.18); border-top-color: var(--ink); border-radius: 50%; animation: spin .7s linear infinite; }
.btn.primary.busy::after, .btn.good.busy::after, .btn.gold.busy::after { border-color: rgba(255,255,255,.3); border-top-color: #fff; }
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn { border: 1px solid var(--line); background: var(--card); width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 14px; flex: none; display: grid; place-items: center; color: var(--muted); }
.icon-btn svg { width: 17px; height: 17px; }
.quick { min-height: 34px; padding: 0 13px; font-size: 13.5px; border-radius: 999px; }

/* ----- Chips, selects, segments ----- */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 0 12px; min-height: 34px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; font-size: 13.5px; position: relative; transition: background .15s, color .15s, border-color .15s; }
.chip.on { border-color: var(--brand); background: var(--brand); color: #fff; font-weight: 550; }
.chip .n { font-size: 11.5px; opacity: .6; }
.chip.date input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; pointer-events: none; }
.sel { position: relative; display: inline-flex; align-items: center; }
.sel select { appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 0 30px 0 13px; min-height: 34px; font-size: 13.5px; font-weight: 500; cursor: pointer; max-width: 100%; text-overflow: ellipsis; }
.sel::after { content: ""; position: absolute; right: 13px; top: 50%; width: 6px; height: 6px; margin-top: -5px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); pointer-events: none; }
.sel.on select { background: var(--brand); border-color: var(--brand); color: #fff; }
.sel.on::after { border-color: #fff; }
.sel.full { display: flex; }
.sel.full select { width: 100%; border-radius: 11px; min-height: 42px; font-size: 14.5px; font-weight: 400; }
.filters { display: flex; gap: 6px; align-items: center; margin-bottom: 12px; }
.filters .sel { min-width: 0; }
.filters .sel select { max-width: 46vw; }
.filters .search-btn { margin-left: auto; }
.seg { display: flex; background: var(--gray-bg); border-radius: 11px; padding: 3px; gap: 2px; margin-bottom: 14px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 9px; min-height: 32px; font-size: 13.5px; font-weight: 550; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .2s, color .2s; white-space: nowrap; padding: 0 8px; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(26,24,21,.08); }
.seg.cap-tabs button { font-size: 12.5px; min-height: 28px; }
/* Many platforms: the tabs scroll sideways inside their row (the page never does). */
.seg.cap-tabs { overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; }
.seg.cap-tabs::-webkit-scrollbar { display: none; }
.seg.cap-tabs button { flex: 1 0 auto; }
.seg button .n { font-size: 11px; background: var(--gold); color: #fff; border-radius: 999px; min-width: 17px; height: 17px; padding: 0 5px; display: inline-grid; place-items: center; }
.subnav { display: flex; gap: 14px; align-items: center; margin: -6px 0 12px; font-size: 13px; }
.subnav button { border: 0; background: none; padding: 4px 0; color: var(--muted); cursor: pointer; font-weight: 500; display: inline-flex; gap: 5px; align-items: center; }
.subnav button.on { color: var(--ink); }
.subnav .warnpill { background: var(--red-bg); color: var(--red); border-radius: 999px; padding: 2px 9px; font-weight: 600; font-size: 12px; }

/* ----- Lists ----- */
/* Each row is its own small card, with a little space between them. */
/* A list is one white block with thin lines between its rows (easier to scan than a pile of cards). */
.list { display: flex; flex-direction: column; gap: 0; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.list > .lrow { border-radius: 0; box-shadow: none; }
.list > .lrow + .lrow { border-top: 1px solid var(--line); }
.lrow { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 0; border-radius: 14px; box-shadow: var(--shadow); cursor: pointer; position: relative; background: var(--card); transition: background .15s; width: 100%; text-align: left; font: inherit; color: inherit; }
/* Inside a sheet (already white), a thin line instead of a shadow. */
.sheet .list { box-shadow: none; border: 1px solid var(--line); border-radius: 12px; }
.sheet .lrow { box-shadow: none; }
.sheet .list > .lrow { border-left: 0; border-right: 0; border-bottom: 0; }
.lrow:active { background: var(--soft); }
.lrow.late::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--red-line); }
.lrow.done { opacity: .62; }
/* One row for every list: the kind of work, the name and where it stands; under the name, always in the same places,
   the ID, who (or where) and when. Colour only where something needs attention. */
.lrow.item { align-items: flex-start; gap: 12px; padding: 11px 14px; }
.kind { flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--soft); color: var(--muted); display: grid; place-items: center; margin-top: 1px; }
.kind svg { width: 16px; height: 16px; }
.item .l1 { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
.lrow.item .t, .trow-head.item .t { flex: 1; min-width: 0; white-space: normal; text-overflow: clip; text-align: left; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.38; font-weight: 550; font-size: 14.5px; overflow-wrap: anywhere; }
.item .t .tpart { display: inline-block; vertical-align: 1px; margin-inline-start: 7px; max-width: none; }
.st { flex: none; font-size: 12.5px; font-weight: 550; color: var(--ink); white-space: nowrap; line-height: 1.6; }
.st.faint { color: var(--faint); font-weight: 500; }
.st.gold { color: var(--gold-ink); }
.st.orange { color: var(--orange); }
.st.green { color: var(--green); }
.st.red { color: var(--red); }
.item .meta { display: flex; align-items: center; margin-top: 3px; font-size: 12.5px; color: var(--muted); white-space: nowrap; min-width: 0; line-height: 1.5; }
.item .meta > span { flex: none; overflow: hidden; text-overflow: ellipsis; }
.item .m-id { width: 48px; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.item .m-who { width: 112px; padding-right: 10px; }
.item .m-who .person { font-weight: 500; color: var(--muted); }
.item .m-when { flex: 0 1 auto !important; min-width: 0; }
.item .m-marks { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; overflow: visible !important; }
.item .m-marks .badge { font-size: 11px; padding: 0 7px; }
@media (min-width: 760px) {
  .item .m-id { width: 60px; }
  .item .m-who { width: 150px; }
  .item .m-when { width: 170px; flex: none !important; }
  .item .st { min-width: 128px; text-align: right; }
}
.section .count { font-size: 12px; color: var(--faint); font-weight: 600; }
.namebox { display: flex; flex-direction: column; gap: 3px; }
.ncount { align-self: flex-end; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ncount.over { color: var(--orange); font-weight: 600; }
/* A task's facts in the same order as the list: who, when, where it stands. */
.facts { display: grid; grid-template-columns: 84px 1fr; gap: 8px 10px; align-items: center; margin-top: 10px; font-size: 14px; }
.facts .fl { font-size: 12px; color: var(--muted); }
.facts .fv { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.facts .fv .st { font-size: 14px; }
/* Every part of the same ID, in one place. */
.post-strip { border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; margin: 0 0 14px; }
.post-strip .head { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 8px 0 2px; }
.post-strip .r { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.post-strip .r:last-child { border-bottom: 0; }
.post-strip .r.here { font-weight: 600; }
.parts .pname { font-size: 12.5px; font-weight: 550; color: var(--ink); margin-left: 2px; }
.post-strip .r.go { cursor: pointer; border-radius: 8px; }
.sheet.page .post-strip { background: var(--card); border: 0; box-shadow: var(--shadow); border-radius: 16px; margin: 12px 0 0; padding: 4px 14px; }
.post-strip .r.go:active { background: var(--soft); }
.post-strip .r.go::after { content: "›"; color: var(--faint); font-size: 18px; line-height: 1; margin-left: -4px; }
.post-strip .r .kind { width: 26px; height: 26px; border-radius: 8px; margin: 0; }
.post-strip .r .kind svg { width: 14px; height: 14px; }
.post-strip .r .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.post-strip .r .who { width: 92px; flex: none; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* The work itself, as pictures to tap: images and video frames from Drive. */
.tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.tile { position: relative; width: 96px; height: 96px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--soft); padding: 0; cursor: pointer; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .play { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; background: rgba(0,0,0,.18); }
.tile .play svg { width: 28px; height: 28px; filter: drop-shadow(0 1px 3px rgba(0,0,0,.4)); }
.fedit .tile .tview { position: absolute; inset: 0; border: 0; padding: 0; background: none; cursor: pointer; color: inherit; }
.fedit .tile .tview img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fedit .tile .lnk { display: grid; place-items: center; height: 100%; font-size: 12px; font-weight: 600; color: var(--gold-ink); }
.fedit .tile .tx { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(20,19,17,.66); color: #fff; font-size: 11px; cursor: pointer; display: grid; place-items: center; padding: 0; }
.fedit .tile .tmove { position: absolute; left: 4px; bottom: 4px; display: flex; gap: 3px; }
.fedit .tile .tmove button { width: 24px; height: 22px; border-radius: 6px; border: 0; background: rgba(20,19,17,.66); color: #fff; font-size: 14px; line-height: 1; cursor: pointer; padding: 0; }
.fedit .tile .tmove button:disabled { opacity: .3; cursor: default; }
.fedit .tile .n { left: 5px; top: 5px; right: auto; bottom: auto; }
.tile .n { position: absolute; right: 5px; bottom: 5px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; border-radius: 6px; padding: 0 5px; }
.lrow .main-col { flex: 1; min-width: 0; }
.lrow .t { font-weight: 550; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* A task's name with its part (e.g. Video Cover) small next to it; a long name is cut, the part always shows. */
.ttl { display: flex; align-items: center; gap: 7px; min-width: 0; }
.ttl .tm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tpart { flex: none; max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 600; letter-spacing: .01em; line-height: 1.5; color: var(--gold-ink); background: var(--gold-soft); border-radius: 6px; padding: 0 6px; }
.info-top h3 .ttl { display: block; }
.info-top h3 .tm { white-space: normal; }
.info-top h3 .tpart { display: inline-block; vertical-align: middle; margin-inline-start: 8px; max-width: 100%; }
.lrow .s { font-size: 12.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .s .late-txt { color: var(--red); }
.lrow .end { display: flex; align-items: center; gap: 6px; flex: none; }
.lrow .datebox { width: 38px; flex: none; text-align: center; line-height: 1.1; }
.lrow .datebox b { display: block; font-size: 17px; font-weight: 650; }
.lrow .datebox span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.idtag { font-size: 12px; color: var(--muted); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.cdot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); flex: none; display: inline-block; }
.ccount { font-size: 12px; color: var(--faint); display: inline-flex; align-items: center; gap: 3px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; position: relative; }
.card.tap { cursor: pointer; }
.card h3 { font-size: 15.5px; margin: 0 0 8px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 550; border-radius: 999px; padding: 2px 8px; background: var(--gray-bg); color: var(--muted); white-space: nowrap; }
.b-blue { background: var(--blue-bg); color: var(--blue); }
.b-green { background: var(--green-bg); color: var(--green); }
.b-red { background: var(--red-bg); color: var(--red); }
.b-orange { background: var(--orange-bg); color: var(--orange); }
.b-purple { background: var(--purple-bg); color: var(--purple); }
.b-gold { background: var(--gold-soft); color: var(--gold-ink); }
.due { font-size: 13px; color: var(--muted); }
.due.red { color: var(--red); }
.due.green { color: var(--green); }
.note { border-radius: 12px; padding: 10px 12px; margin: 10px 0; font-size: 14px; background: var(--soft); border: 1px solid var(--line); }
.note.orange { background: var(--orange-bg); border-color: #efdcb8; }
.note.green { background: var(--green-bg); border-color: #cfe5d8; }
.note.gold { background: var(--gold-soft); border-color: #eadcc2; }
.note .t { font-weight: 600; font-size: 13.5px; margin-bottom: 2px; }
.brief { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 14px; }
.brief.clamp { max-height: 7.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.kv { font-size: 13.5px; color: var(--muted); }
.kv b { color: var(--ink); font-weight: 550; }
.related { border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; margin: 8px 0; font-size: 13.5px; }
.related .r { display: flex; gap: 8px; align-items: center; padding: 8px 0; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.related .r:last-child { border-bottom: 0; }
.related .head { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 8px 0 2px; }
.statusbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 4px; }
.statusbar .btn { min-height: 44px; }
.statusbar .btn.cur { border-color: var(--gold); background: var(--gold-soft); color: var(--gold-ink); }
.divider { height: 1px; background: var(--line); margin: 14px 0; }
.trow { padding: 0 !important; overflow: hidden; }
.trow-head { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; text-align: left; padding: 12px 14px; cursor: pointer; font: inherit; color: inherit; position: relative; }
.trow.late .trow-head::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--red-line); }
.trow-body { padding: 0 14px 14px; animation: enter .2s var(--ease); }
/* Open, the card shows the task's whole name (closed, a long one is cut with "…"). */
.trow.open .trow-head .ttl { align-items: flex-start; }
.trow.open .trow-head.item .t { -webkit-line-clamp: unset; display: block; }
.trow.open .trow-head .ttl .tm { white-space: normal; overflow: visible; overflow-wrap: anywhere; }
.chev { width: 8px; height: 8px; border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint); transform: rotate(-45deg); transition: transform .2s var(--ease); flex: none; margin-right: 2px; }
.trow.open .chev { transform: rotate(45deg); }
.actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.files { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: 9px; min-height: 32px; padding: 0 10px; font-size: 13px; cursor: pointer; text-decoration: none; color: var(--ink); }
.fchip.add { color: var(--gold-ink); border-style: dashed; }
.fchip svg { width: 15px; height: 15px; flex: none; }
details.more { margin: 6px 0 12px; }
details.more > summary { cursor: pointer; font-size: 13px; color: var(--gold-ink); list-style: none; padding: 6px 0; font-weight: 550; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+ "; }
details.more[open] > summary::before { content: "– "; }

/* ----- Forms ----- */
.field { display: block; margin: 0 0 14px; }
.field .lbl { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.field .lbl i { font-style: normal; font-weight: 400; color: var(--faint); margin-left: 4px; }
.field .hint { display: block; font-size: 12px; color: var(--faint); margin-top: 4px; }
.in { width: 100%; border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; background: var(--card); min-height: 42px; outline: none; font-size: 14.5px; transition: border-color .15s, box-shadow .15s; }
.in:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(179,148,99,.15); }
textarea.in { resize: vertical; min-height: 70px; line-height: 1.5; }
.in.private { background: #fdfaf3; border-color: #eadcc2; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 0; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--brand); }

/* ----- Today ----- */
.narrow { max-width: 760px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; margin: 0 0 4px; padding: 2px 0 6px; }
@media (min-width: 600px) { .stats { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); } }
.stat { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 10px 11px; cursor: pointer; border: 0; text-align: left; min-width: 0; transition: transform .12s var(--ease); }
.stat:active { transform: scale(.97); }
.chips-row { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 4px; padding: 2px 16px 6px; scrollbar-width: none; }
.chips-row::-webkit-scrollbar { display: none; }
.stat .v { font-size: 21px; font-weight: 650; line-height: 1.1; }
.stat .l { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.25; }
.stat.red .v { color: var(--red); }
.stat.gold .v { color: var(--gold-ink); }
.allclear { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; color: var(--muted); font-size: 14px; }
.allclear b { color: var(--green); font-weight: 600; }

/* ----- Calendar ----- */
.day-head { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
.week { display: grid; grid-template-columns: 1fr; gap: 6px; }
@media (min-width: 900px) { .week { grid-template-columns: repeat(7, 1fr); } }
.wday { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 9px 10px; min-height: 54px; }
.wday.today { box-shadow: inset 0 0 0 1.5px var(--gold), var(--shadow); }
.wday .d { font-weight: 600; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.wentry { font-size: 12.5px; border-radius: 8px; padding: 5px 8px; margin-top: 5px; background: var(--soft); cursor: pointer; }
.wentry .wsub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 3px; }
.wmark { font-size: 11px; font-weight: 600; }
.wmark.ok { color: var(--green); }
.wmark.miss { color: var(--red); }
.wmark.draft { color: var(--orange); }
.pf { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .03em; border-radius: 5px; padding: 1px 5px; background: var(--gray-bg); color: var(--muted); margin: 0 3px 0 0; }
.pf.on { background: var(--brand); color: #fff; }
.capbox { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; background: var(--soft); }
.capbox .pre { font-size: 14px; }
.capbox .cap-k { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 2px; display: flex; justify-content: space-between; align-items: center; }
.capbox .cap-k:first-child { margin-top: 0; }
.cap-opt { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); font-size: 13.5px; }
.cap-opt:first-of-type { border-top: 0; }
.cap-count { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--faint); }
.cap-count.over { color: var(--red); font-weight: 650; }
.cap-warn { margin-top: 8px; font-size: 12.5px; line-height: 1.45; color: var(--orange); background: var(--orange-bg); border-radius: 9px; padding: 7px 10px; }
/* Where Auto writes: open to type in at once, gold while it writes; orange when nothing came and a copy went in. */
.capbox.auto, .in.auto { border-color: var(--gold); background: var(--gold-soft); }
.capbox.auto .in { background: var(--card); }
.auto-lbl { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--gold-ink); margin: 0 0 6px; }
.auto-lbl::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); flex: none; animation: autopulse 1.2s ease-in-out infinite; }
.auto-under { margin: -6px 0 12px; }
@keyframes autopulse { 50% { opacity: .25; } }
.copied-tag { display: inline-block; font-size: 12px; font-weight: 600; line-height: 1.4; color: var(--orange); background: var(--orange-bg); border-radius: 7px; padding: 3px 8px; margin: 0 0 6px; }

/* ----- Sheet ----- */
#layer .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(20,19,17,.42); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
.sheet { background: var(--card); width: 100%; max-width: 620px; max-height: 92vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; animation: up .3s var(--ease); box-shadow: 0 -10px 40px rgba(20,19,17,.12); }
.sheet::before { content: ""; width: 36px; height: 4px; border-radius: 4px; background: var(--line); margin: 8px auto 0; flex: none; }
#layer .overlay.closing { animation: fadeout .18s ease forwards; pointer-events: none; }
#layer .overlay.closing .sheet { animation: down .2s ease forwards; }
@media (min-width: 700px) { #layer .overlay { align-items: center; } .sheet { border-radius: 18px; max-height: 88vh; } .sheet::before { display: none; } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px 12px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { flex: 1; font-size: 16px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-body { padding: 16px; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet-foot { padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; gap: 8px; }
.sheet-foot .btn { flex: 1; min-width: 0; }
/* The team chat: messages one after the other (yours on the right), the box to write in at the bottom. */
.sheet.chat { height: min(680px, 88vh); }
.sheet.chat .sheet-body { flex: 1; padding: 6px 14px 14px; background: var(--bg); }
.chat-list { display: flex; flex-direction: column; min-height: 100%; justify-content: flex-end; }
.chat-empty { margin: auto 0; padding: 40px 10px; color: var(--faint); font-size: 14px; text-align: center; }
.cmsg { display: flex; flex-direction: column; align-items: flex-start; max-width: 84%; margin-top: 12px; }
.cmsg.cont { margin-top: 3px; }
.cmsg.mine { align-self: flex-end; align-items: flex-end; }
.cmsg-who { display: flex; align-items: baseline; gap: 7px; margin: 0 6px 3px; font-size: 12.5px; font-weight: 650; color: var(--ink); }
.cmsg-at { font-size: 11px; font-weight: 500; color: var(--faint); }
.cmsg-text { background: var(--card); border-radius: 15px; padding: 8px 12px; font-size: 14.5px; line-height: 1.42; white-space: pre-wrap; overflow-wrap: anywhere; unicode-bidi: plaintext; box-shadow: 0 1px 2px rgba(26,24,21,.07); }
.cmsg.mine .cmsg-text { background: var(--gold-soft); }
.cmsg.pending { opacity: .55; }
.cmsg.new { animation: enter .22s var(--ease); }
.chat-compose { display: flex; align-items: flex-end; gap: 8px; width: 100%; }
textarea.in.chat-in { flex: 1; min-width: 0; min-height: 44px; max-height: 140px; resize: none; padding-top: 10px; padding-bottom: 10px; }
.sheet-foot .chat-send { flex: none; width: 44px; height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; }
.chat-send svg { width: 19px; height: 19px; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes down { to { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes enter { from { opacity: 0; transform: translateY(4px); } }

/* ----- Toast ----- */
#toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px); z-index: 80; background: var(--brand); color: #fff; padding: 11px 16px; border-radius: 12px; font-size: 14px; width: max-content; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .22s var(--ease), transform .22s var(--ease); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.err { background: #7a5a2b; box-shadow: 0 10px 30px rgba(122,90,43,.35); }
#toast.act { pointer-events: auto; display: flex; align-items: center; gap: 14px; }
#toast button { background: none; border: 0; color: var(--gold, #d8b26a); font: inherit; font-weight: 600; padding: 2px 0; cursor: pointer; }
@media (min-width: 900px) { #toast { bottom: 28px; } }

/* ----- Sign-in screens ----- */
.auth { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 18px; background: radial-gradient(120% 70% at 50% 0%, #262320 0%, var(--brand) 60%); }
.auth .mark { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 30px; animation: enter .5s var(--ease); }
.auth .mark img { height: 30px; }
.auth .mark .team { font-size: 12px; letter-spacing: .45em; color: var(--gold); font-weight: 600; text-transform: uppercase; padding-left: .45em; }
.auth .box { background: var(--card); border-radius: 18px; padding: 24px 20px; width: 100%; max-width: 380px; box-shadow: 0 30px 70px rgba(0,0,0,.35); animation: enter .5s var(--ease) .05s backwards; }
.auth h1 { font-size: 19px; margin-bottom: 4px; }
.auth .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
.auth .foot { margin-top: 18px; text-align: center; }
.auth .foot .btn.ghost { color: rgba(255,255,255,.55); }
.pw-wrap { position: relative; }
.pw-wrap .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: 12.5px; font-weight: 550; padding: 8px; cursor: pointer; }
.loading { min-height: 100vh; display: grid; place-items: center; }
.spinner { width: 28px; height: 28px; border: 2px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin .7s linear infinite; }
.copybox { background: var(--soft); border: 1px dashed var(--line); border-radius: 12px; padding: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; margin: 8px 0; }
.log-row { font-size: 13.5px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.log-row:last-child { border-bottom: 0; }

/* ----- Comments ----- */
.cmt { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cmt:last-child { border-bottom: 0; }
.cmt .avatar { width: 28px; height: 28px; font-size: 12px; }
.cmt .body { flex: 1; min-width: 0; }
.cmt .who { font-size: 12.5px; color: var(--muted); }
.cmt .who b { color: var(--ink); font-weight: 600; }
.mention { color: var(--gold-ink); font-weight: 650; }
.mention.me { background: var(--gold-soft); border-radius: 5px; padding: 0 3px; }
.cmt-for { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; max-height: 0; overflow: hidden; opacity: 0; transition: max-height .22s var(--ease), opacity .18s, margin .22s; }
.cmt-for.open { max-height: 120px; opacity: 1; margin: 10px 0 2px; }
.cmt-for .cf-l { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-right: 2px; }
.cmt-for .chip { min-height: 34px; }
.cmt .txt { white-space: pre-wrap; word-break: break-word; margin-top: 2px; font-size: 14px; }
.cmt-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; border-radius: 6px; padding: 2px 7px; background: var(--gold-soft); color: var(--gold-ink); margin: 3px 6px 0 0; border: 0; font-family: inherit; }
button.cmt-tag { cursor: pointer; }
.cmt-compose { display: flex; gap: 6px; align-items: flex-end; margin-top: 10px; }
.cmt-compose textarea.in { min-height: 42px; }
.cmt-compose .time { width: 58px; text-align: center; padding: 10px 4px; font-size: 13px; }
.cmt-compose .time::placeholder { color: var(--faint); }

/* ----- File preview, pins, uploads ----- */
/* The preview always fits on the screen with the comment box under it (same height in pvMaxH()). */
:root { --pv-h: max(220px, min(62vh, calc(100vh - 300px))); }
@supports (height: 1svh) { :root { --pv-h: max(220px, min(62svh, calc(100svh - 300px))); } }
.pv-frame { display: flex; justify-content: center; align-items: center; min-height: 160px; border-radius: 12px; overflow: hidden; background: #111; margin-bottom: 8px; }
/* Pins sit on .pv, which is exactly the image's size (the image is sized in fitPreviewImg). */
.pv { position: relative; flex: none; max-width: 100%; }
.pv img { display: block; max-width: 100%; max-height: var(--pv-h); width: auto; height: auto; cursor: crosshair; }
.pv-vid { position: relative; height: var(--pv-h); border-radius: 12px; overflow: hidden; background: #111; margin-bottom: 8px; }
.pv-vid iframe { position: absolute; top: 0; left: 0; display: block; width: 100%; height: 100%; border: 0; transform-origin: 0 0; }
.pv-vid iframe:fullscreen { transform: none !important; width: 100% !important; height: 100% !important; }
/* The app's own video player: the picture, then a slim bar of small buttons under it (nothing covers the video). */
.vp { margin-bottom: 8px; }
.vp-stage { position: relative; background: #111; border-radius: 12px 12px 0 0; overflow: hidden; }
.vp-stage video { display: block; width: 100%; height: calc(var(--pv-h) - 40px); object-fit: contain; background: #111; cursor: pointer; }
.vp-note { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 13px; background: rgba(0,0,0,.55); padding: 6px 12px; border-radius: 999px; pointer-events: none; white-space: nowrap; }
.vp-bar { display: flex; align-items: center; gap: 2px; padding: 3px 6px; background: var(--brand); color: #fff; border-radius: 0 0 12px 12px; }
.vp-b { flex: none; width: 34px; height: 34px; border: 0; background: none; color: inherit; display: grid; place-items: center; border-radius: 8px; cursor: pointer; padding: 0; }
.vp-b:active { background: rgba(255,255,255,.12); }
.vp-b svg { width: 18px; height: 18px; }
.vp-t { flex: none; font-size: 12px; font-variant-numeric: tabular-nums; opacity: .85; padding: 0 6px; }
.vp-b.vp-hd { width: auto; padding: 0 7px; font-size: 11px; font-weight: 700; letter-spacing: .04em; opacity: .55; }
.vp-b.vp-hd[aria-pressed="true"] { opacity: 1; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.7); }
#bgjob { position: fixed; right: 12px; bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom)); z-index: 70; background: var(--card); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); max-width: calc(100% - 24px); }
.vp-seek { flex: 1; min-width: 0; accent-color: var(--gold); margin: 0 4px; }
.pin { position: absolute; transform: translate(-50%, -50%); width: 24px; height: 24px; border-radius: 50%; background: var(--gold); color: #fff; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,.4); border: 2px solid #fff; pointer-events: none; }
.pin.new { background: var(--brand); }
.pin.focus { outline: 3px solid #ffd54a; }
.upl { display: inline-flex; flex-direction: column; gap: 4px; }
.progress { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress div { height: 100%; background: var(--gold); width: 0; transition: width .2s; }

/* ----- Rhythm ----- */
.rgrid { width: 100%; border-collapse: separate; border-spacing: 2px; font-size: 12px; table-layout: fixed; }
.rgrid th { font-size: 10.5px; color: var(--muted); font-weight: 600; padding: 2px 0 4px; text-align: center; overflow: hidden; letter-spacing: .04em; }
.rgrid th.d { width: 62px; }
.rgrid td { text-align: center; height: 24px; border-radius: 6px; background: var(--card); cursor: pointer; font-weight: 600; font-size: 11.5px; }
.rgrid td.d { text-align: left; padding: 0 2px; font-weight: 500; white-space: nowrap; background: none; cursor: default; font-size: 11.5px; color: var(--muted); }
.rgrid tr.today td.d { color: var(--gold-ink); font-weight: 650; }
.rgrid tr.wk td { border-top: 6px solid transparent; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--muted); margin: 10px 0 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }

/* ----- Round 2: info cards, dates, confirm, delete, people, platforms ----- */
.info { background: var(--soft); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
.info-top { display: flex; align-items: flex-start; gap: 8px; }
.info-top h3 { flex: 1; font-size: 17px; font-weight: 650; line-height: 1.3; margin: 0; }
.info-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.approve-box { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 0 0 14px; }
.datefield { position: relative; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 11px; min-height: 40px; padding: 0 14px; background: var(--card); cursor: pointer; font-size: 14.5px; font-weight: 500; color: var(--ink); }
.datefield svg { width: 16px; height: 16px; color: var(--gold-ink); flex: none; }
.datefield.empty span { color: var(--faint); font-weight: 400; }
.datefield input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; font-size: 16px; }
.ask-wrap { position: fixed; inset: 0; z-index: 90; background: rgba(20,19,17,.38); display: grid; place-items: center; padding: 24px; animation: fade .15s ease; }
.ask-wrap.closing { animation: fadeout .15s ease forwards; }
.ask { background: var(--card); border-radius: 16px; padding: 18px 16px 14px; width: 100%; max-width: 320px; box-shadow: 0 20px 60px rgba(0,0,0,.25); animation: pop .18s var(--ease); }
.ask-t { font-size: 15px; font-weight: 550; line-height: 1.45; }
.ask-b { display: flex; gap: 8px; margin-top: 16px; }
.ask-b .btn { flex: 1; min-height: 40px; }
@keyframes pop { from { transform: scale(.94); opacity: 0; } }
.btn.danger-solid { background: var(--red); border-color: var(--red); color: #fff; }
.sheet-foot .btn.trash { flex: 0 0 44px; padding: 0; color: var(--red); border-color: var(--red-line); background: var(--red-bg); }
.btn.trash svg { width: 18px; height: 18px; }
.sheet-foot .btn:disabled { opacity: .45; }
.person { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.pdot { width: 17px; height: 17px; border-radius: 50%; background: var(--gold-soft); color: var(--gold-ink); font-size: 9.5px; font-weight: 700; display: inline-grid; place-items: center; flex: none; }
.lrow .s .person { font-weight: 550; }
.pficon { display: inline-block; vertical-align: -2px; flex: none; }
.pfs { display: inline-flex; gap: 5px; align-items: center; color: var(--muted); }
.pfname { font-size: 11px; font-weight: 600; color: var(--muted); }
.pfpill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
.pfbox { width: 32px; height: 32px; border-radius: 9px; background: var(--soft); display: grid; place-items: center; color: var(--ink); flex: none; }
.chip.pfchip { gap: 7px; }
.fchip.view { color: var(--ink); font-weight: 550; }
.fchip.view svg { color: var(--gold-ink); }
/* Rhythm: day name and number, a gap between weeks, the month above its days */
.rgrid td.dn, .rgrid th.dn { width: 38px; text-align: left; padding: 0 2px; font-size: 11.5px; color: var(--muted); font-weight: 500; background: none; cursor: default; }
.rgrid td.dd, .rgrid th.dd { width: 24px; text-align: right; padding: 0 6px 0 0; font-size: 12px; font-weight: 600; background: none; cursor: default; color: var(--ink); }
.rgrid tr.past td.dn, .rgrid tr.past td.dd { color: var(--faint); }
.rgrid tr.today td.dn, .rgrid tr.today td.dd { color: var(--gold-ink); font-weight: 700; }
.rgrid tr.wk td { border-top: 7px solid transparent; }
.rgrid tr.month td { text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-ink); background: none; cursor: default; padding: 2px 2px 4px; height: auto; }
.rgrid tr.month.gap td { padding-top: 16px; }
.rgrid th { color: var(--ink); }
/* The platform icons stay in view while the days scroll under them. */
.rgrid thead th { position: sticky; top: calc(52px + env(safe-area-inset-top)); z-index: 3; background: var(--card); padding-top: 6px; box-shadow: 0 -4px 0 var(--card); }
@media (min-width: 900px) { .rgrid thead th { top: calc(99px + env(safe-area-inset-top)); } }
.rgrid thead th.dn, .rgrid thead th.dd { background: var(--card); }
.rgrid.rules thead th { position: static; box-shadow: none; }
.rgrid.rules td.c { height: 30px; }
/* Every square looks the same on every platform: faint gray, green with a post, a gold + where a post is needed, red when missed. */
.rgrid td.c { background: var(--rh-empty); }
/* A day off (Saturday): its empty squares a shade deeper, so the week reads at a glance. */
.rgrid tr.off td.c:not(.post):not(.work):not(.need):not(.miss) { background: #e8e3d9; }
.rgrid tr.off td.dn, .rgrid tr.off td.dd { color: var(--faint); }
.rgrid td.c.post { background: var(--green-bg); color: var(--green); }
.rgrid td.c.need { color: var(--gold-ink); font-weight: 700; font-size: 13px; }
.rgrid td.c.miss { background: var(--red-bg); color: var(--red); }
.legend i { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; font-style: normal; font-size: 10px; font-weight: 700; margin-right: 4px; vertical-align: -3px; }
.legend i { background: var(--rh-empty); }
.legend i.post { background: var(--green-bg); color: var(--green); }
.legend i.need { color: var(--gold-ink); font-size: 12px; }
.legend i.miss { background: var(--red-bg); color: var(--red); }
/* ===== The new system: a board of stages, one card everywhere, pages that open on top ===== */
:root {
  --st-todo: #8c867c; --st-todo-bg: #f1eee8;
  --st-doing: #3b68b0; --st-doing-bg: #eaf0fa;
  --st-approve: #a5700e; --st-approve-bg: #fbf2de;
  --st-changes: #b43a62; --st-changes-bg: #fbe9f0;
  --st-done: #2f7a52; --st-done-bg: #e7f3ec;
  --pr-high: #d03b2f; --pr-med: #e0961b; --pr-low: #4f87c4;
  --col-bg: #ece8e0;
}
.main.wide { max-width: 1360px; }
.main.board-page { padding-bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom)); }
/* Page head on every tab: the title, then its buttons on the right, always in the same place. */
.ph { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; min-height: 44px; }
.ph h1 { font-size: 23px; flex: 1; min-width: 0; }
.ph .icon-btn { width: 40px; height: 40px; border-radius: 12px; }
.newbtn { min-height: 40px; border-radius: 12px; padding: 0 14px 0 11px; gap: 6px; }
.newbtn svg { width: 17px; height: 17px; }
.newbtn.idea { background: var(--gold-soft); border-color: #e8d9bd; color: var(--gold-ink); }
/* People to filter by: a row of round faces. */
.faces { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 10px; padding: 2px 16px; scrollbar-width: none; }
.faces::-webkit-scrollbar { display: none; }
.face { flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px 0 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 13px; font-weight: 550; cursor: pointer; color: var(--ink); }
.face .avatar { width: 28px; height: 28px; font-size: 12px; }
.face.all { padding: 0 14px; }
.face.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.face.on .avatar { background: rgba(255,255,255,.14); color: #fff; }
/* The counts above the board (phone): one per column, tap to go there. */
/* The counts above the board stay in sight while a long column is scrolled (one scroll: the page). */
.bstrip { display: grid; grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); gap: 6px; margin: -8px -16px 6px; padding: 8px 16px 6px; position: sticky; top: calc(52px + env(safe-area-inset-top)); z-index: 6; background: var(--bg); }
.bstrip button { display: flex; flex-direction: column; gap: 5px; border: 0; background: none; padding: 2px 0 4px; text-align: left; cursor: pointer; min-width: 0; font: inherit; color: inherit; }
.bstrip .bar { height: 4px; border-radius: 2px; background: var(--c); opacity: .45; transition: opacity .2s; }
.bstrip .bl { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; overflow: hidden; }
.bstrip .bn { font-size: 16px; font-weight: 650; }
.bstrip .bt { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.bstrip button.on .bar { opacity: 1; }
.bstrip button.on .bt { color: var(--ink); font-weight: 600; }
/* Columns are as long as their cards: the page scrolls, never a column. On a phone the board is as tall as the column
   in view, so a short column doesn't leave a long empty page. */
.board { position: relative; display: flex; align-items: flex-start; gap: 10px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 0 16px 6px; scroll-padding: 0 16px; overscroll-behavior-x: contain; scrollbar-width: none; transition: height .22s var(--ease); }
.board::-webkit-scrollbar { display: none; }
.bcol { flex: 0 0 min(86vw, 340px); scroll-snap-align: start; background: var(--col-bg); border-radius: 16px; display: flex; flex-direction: column; min-height: 130px; min-width: 0; }
.bcol-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 14px; }
.bcol-head .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.bcol-head h2 { flex: 1; font-size: 13.5px; font-weight: 650; letter-spacing: 0; text-transform: none; color: var(--ink); margin: 0; }
.bcol-head .n { font-size: 12.5px; font-weight: 650; color: var(--muted); }
.bcol-body { padding: 0 8px 10px; display: flex; flex-direction: column; gap: 8px; }
.bcol-body > * { flex: none; }
.bcol-empty { font-size: 13px; color: var(--faint); padding: 10px 6px; }
.bcol-more { border: 0; background: none; color: var(--gold-ink); font: inherit; font-size: 13px; font-weight: 600; padding: 8px 6px; text-align: left; cursor: pointer; }
@media (min-width: 900px) {
  .board { display: grid; grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); align-items: start; overflow: visible; margin: 0; padding: 0 0 6px; height: auto !important; }
  .bcol { flex: none; }
  .bstrip { display: none; }
}
/* The card: the same for a task everywhere. A bar on its side for how urgent it is (three parts: high, medium, low). */
.tcard { position: relative; display: flex; background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(26,24,21,.07); cursor: pointer; min-height: 80px; transition: box-shadow .15s, transform .12s var(--ease); }
.tcard:active { transform: scale(.99); }
.tcard.urgent { box-shadow: 0 0 0 1px rgba(208,59,47,.20), 0 5px 16px rgba(208,59,47,.13); }
.tcard.wait { background: transparent; box-shadow: none; border: 1.5px dashed #cfc8bb; }
.tcard.gone { opacity: .55; }
/* The priority spine: the card's own left edge, in three parts (high on top, medium, low), empty until it's set.
   The part you tap is wider than the coloured edge. */
.pbar { flex: none; width: 28px; display: flex; flex-direction: column; gap: 2px; align-self: stretch; }
.pbar > * { flex: 1; position: relative; border: 0; background: none; padding: 0; margin: 0; width: 28px; min-height: 24px; cursor: default; }
.pbar button { cursor: pointer; }
.pbar > *::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 9px; background: #efebe3; transition: background .2s, width .2s var(--ease); }
.tcard.wait .pbar > *::before { background: #e8e3da; }
.pbar > .on::before { width: 11px; }
.pbar > .on.p-high::before { background: var(--pr-high); }
.pbar > .on.p-med::before { background: var(--pr-med); }
.pbar > .on.p-low::before { background: var(--pr-low); }
.pbar button:hover::before { background: #e2dcd1; }
.pbar button.on:hover::before { filter: brightness(.95); }
.pbar button:focus-visible { outline: none; }
.pbar button:focus-visible::before { box-shadow: inset 0 0 0 2px var(--gold); }
.tc-main { flex: 1; min-width: 0; padding: 10px 12px 10px 4px; display: flex; flex-direction: column; gap: 6px; }
.tc-top { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); min-height: 18px; }
.tc-top .k { display: inline-flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tc-top svg { width: 14px; height: 14px; flex: none; color: var(--c, var(--muted)); }
.tc-top .sp { flex: 1; }
.urgent-tag { font-size: 10.5px; font-weight: 750; letter-spacing: .08em; color: var(--pr-high); flex: none; }
.tc-title { font-size: 14.5px; font-weight: 600; line-height: 1.36; text-align: left; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; unicode-bidi: plaintext; }
.tc-foot { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.tc-foot .person { font-weight: 550; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.tc-due { margin-left: auto; flex: none; font-weight: 550; white-space: nowrap; }
.tc-due.late { color: var(--red); font-weight: 650; }
.tc-state { flex: none; font-size: 11.5px; font-weight: 650; border-radius: 6px; padding: 1px 7px; background: var(--sbg); color: var(--sc); }
/* New comments: a small red mark right after the name (only while there are new ones). A long name makes room for it. */
.tc-name { display: flex; align-items: center; gap: 7px; min-width: 0; }
.tc-name .tc-title { min-width: 0; }
.cmark { flex: none; display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; line-height: 1; border-radius: 999px; padding: 3px 6px 3px 5px; background: var(--red); color: #fff; }
.cmark svg { width: 11px; height: 11px; color: currentColor; }
/* Lists of cards outside the board (Today, an idea's road): the same card, one under the other. */
.cards { display: flex; flex-direction: column; gap: 8px; }
/* ----- Pages (a task, an idea, a post): open on top, full screen on a phone; back closes only the top one ----- */
#layer .overlay.pg { align-items: stretch; }
.sheet.page { max-width: 760px; max-height: none; height: 100%; border-radius: 0; background: var(--bg); animation: slide .26s var(--ease); }
.sheet.page::before { display: none; }
@keyframes slide { from { transform: translateX(28px); opacity: 0; } }
#layer .overlay.closing .sheet.page { animation: slideout .2s ease forwards; }
#layer .overlay.still:not(.closing), #layer .overlay.still:not(.closing) .sheet { animation: none; }
/* Phones set to reduce motion: pages and sheets fade in place instead of sliding; the game's floor still drops, gently. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; scroll-behavior: auto !important; }
  .sheet, .sheet.page, .main > * { animation-name: fade !important; }
  #layer .overlay.closing .sheet, #layer .overlay.closing .sheet.page { animation-name: fadeout !important; }
}
@keyframes slideout { to { transform: translateX(28px); opacity: 0; } }
@media (min-width: 700px) { #layer .overlay.pg { align-items: center; } .sheet.page { height: 92vh; border-radius: 18px; overflow: hidden; } }
.pbar-top { display: flex; align-items: center; gap: 4px; padding: calc(4px + env(safe-area-inset-top)) 8px 4px 2px; background: var(--card); border-bottom: 1px solid var(--line); flex: none; }
@media (min-width: 700px) { .pbar-top { padding-top: 4px; } }
.pbar-top .back { display: inline-flex; align-items: center; gap: 2px; height: 44px; padding: 0 10px 0 4px; border: 0; background: none; font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; border-radius: 10px; }
.pbar-top .back svg { width: 22px; height: 22px; }
.pbar-top .ttl { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.pbar-top .icon-btn { width: 40px; height: 40px; border: 0; background: none; color: var(--ink); }
.sheet.page .sheet-body { padding: 16px 16px 28px; flex: 1; }
.sheet.page .sheet-foot { background: var(--card); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
.sheet.page .sheet-foot .btn { min-height: 48px; border-radius: 13px; font-size: 15px; }
.pk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.pk svg { width: 16px; height: 16px; }
.ptitle-row { display: flex; align-items: flex-start; gap: 10px; }
.ptitle-row .ptitle { flex: 1; min-width: 0; }
.pedit { flex: none; margin-top: 8px; }
.pedit svg { width: 14px; height: 14px; }
.ptitle { font-size: 24px; font-weight: 650; letter-spacing: -.02em; line-height: 1.22; margin: 6px 0 0; overflow-wrap: anywhere; unicode-bidi: plaintext; text-align: left; }
.ptags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.ptag { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 650; border-radius: 8px; padding: 4px 10px; background: var(--sbg, var(--gray-bg)); color: var(--sc, var(--muted)); }
.ptag.dark { background: var(--brand); color: #fff; }
.pcard { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; margin-top: 12px; }
.pcard > .section:first-child { margin-top: 0; }
.psec { margin: 22px 2px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.psec h2 { font-size: 15px; font-weight: 650; letter-spacing: -.01em; text-transform: none; color: var(--ink); }
.psec .n { font-size: 13px; color: var(--muted); font-weight: 500; }
/* The stages, left to right; where the work is now in its colour. */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.step::before, .step::after { content: ""; position: absolute; top: 13px; height: 2px; width: 50%; background: #e3ded4; }
.step::before { left: 0; } .step::after { right: 0; }
.step:first-child::before, .step:last-child::after { display: none; }
.step.past::before, .step.past::after, .step.now::before { background: var(--brand); }
.step .o { position: relative; z-index: 1; width: 28px; height: 28px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 2px #d8d2c7; display: grid; place-items: center; color: #fff; }
.step.past .o { background: var(--brand); box-shadow: none; }
.step.now .o { background: var(--sc); box-shadow: 0 0 0 4px var(--sbg); }
.step.now .o::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
.step.done-all .o { background: var(--st-done); }
.step .o svg { width: 15px; height: 15px; }
.step .sl { font-size: 12px; line-height: 1.25; color: var(--muted); padding: 0 3px; }
.step.now .sl { color: var(--sc); font-weight: 700; }
.step.past .sl { color: var(--ink); }
.nextline { margin: 14px 0 0; padding: 11px 13px; border-radius: 12px; background: var(--sbg); color: var(--sc); font-size: 14px; line-height: 1.45; font-weight: 550; }
.nextline .note-t { display: block; font-size: 12px; font-weight: 700; letter-spacing: .02em; margin-bottom: 2px; }
.nextline .pre { color: var(--ink); font-weight: 450; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: var(--card); border-radius: 16px; box-shadow: var(--shadow); margin-top: 12px; overflow: hidden; }
.fgrid > div { padding: 12px 14px; min-width: 0; border-bottom: 1px solid var(--line); }
.fgrid > div:nth-child(odd) { border-right: 1px solid var(--line); }
.fgrid > div:nth-last-child(-n+2) { border-bottom: 0; }
.fgrid .fl { font-size: 12px; color: var(--muted); }

.fgrid .fv .due.red { font-weight: 650; }
.fgrid .datefield { min-height: 34px; padding: 0 10px; border-radius: 9px; font-size: 14px; font-weight: 600; }
.fgrid button.flink { border: 0; background: none; padding: 0; font: inherit; color: var(--gold-ink); font-weight: 600; cursor: pointer; text-align: left; overflow-wrap: anywhere; }
.prio { display: inline-flex; background: var(--gray-bg); border-radius: 10px; padding: 3px; gap: 2px; }
.prio button { border: 0; background: none; border-radius: 8px; min-height: 30px; padding: 0 10px; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.prio button i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); }
.prio button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(26,24,21,.1); }
.road { list-style: none; margin: 0; padding: 0; }
.road li { position: relative; display: flex; gap: 12px; padding-bottom: 12px; }
.road li::before { content: ""; position: absolute; left: 13px; top: 30px; bottom: 0; width: 2px; background: var(--rl, #e3ded4); }
.road li:last-child::before { display: none; }
.road .ro { position: relative; z-index: 1; flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--rc, var(--card)); box-shadow: inset 0 0 0 2px var(--rr, transparent); color: #fff; }
.road .ro svg { width: 15px; height: 15px; }
.road .rcard { flex: 1; min-width: 0; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); padding: 11px 13px; cursor: pointer; text-align: left; border: 0; font: inherit; color: inherit; display: block; width: 100%; }
.road .rcard.flat { background: transparent; box-shadow: inset 0 0 0 1.5px #e3ded4; cursor: default; }
.road .rt { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 650; }
.road .rt .grow { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.road .rs { margin-top: 3px; font-size: 13px; color: var(--muted); }
.checks { display: flex; flex-direction: column; gap: 2px; }
.chk { display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 14px; }
.chk .cb { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--gray-bg); color: var(--faint); font-size: 12px; font-weight: 700; }
.chk.ok .cb { background: var(--st-done-bg); color: var(--st-done); }
.chk.todo .cb { background: var(--st-approve-bg); color: var(--st-approve); }
.chk .cv { margin-left: auto; color: var(--muted); font-size: 13px; text-align: right; }
.menu-list { display: flex; flex-direction: column; }
.menu-list button { display: flex; align-items: center; gap: 12px; min-height: 52px; border: 0; border-bottom: 1px solid var(--line); background: none; font: inherit; font-size: 15px; text-align: left; padding: 0 4px; cursor: pointer; color: var(--ink); }
.menu-list button:last-child { border-bottom: 0; }
.menu-list button.danger { color: var(--red); }
.menu-list button svg { width: 19px; height: 19px; color: var(--muted); }
/* Two big choices (a day on the rhythm: a ready post, or a task for someone). */
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.choice { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; text-align: left; font: inherit; color: var(--ink); min-height: 112px; }
.choice svg { width: 22px; height: 22px; color: var(--gold-ink); }
.choice b { font-size: 15px; font-weight: 650; }
.choice span { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.choice:disabled { opacity: .5; cursor: default; }
.choice.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
/* The image viewer: swipe (or ‹ › and the arrow keys) between the images of a post or a task. */
.gal { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.gal-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(20,19,17,.55); color: #fff; display: grid; place-items: center; cursor: pointer; z-index: 3; font-size: 20px; line-height: 1; }
.gal-nav.l { left: 8px; } .gal-nav.r { right: 8px; }
.gal-nav:disabled { opacity: 0; pointer-events: none; }
.gal-dots { display: flex; justify-content: center; gap: 6px; margin: 2px 0 10px; }
.gal-dots i { width: 7px; height: 7px; border-radius: 50%; background: #d8d2c7; }
.gal-dots i.on { background: var(--brand); width: 18px; border-radius: 4px; }
.pv-frame.swiping { transition: none; }
.pv-frame .pv { transition: transform .22s var(--ease); }
.kindnote { display: flex; gap: 12px; align-items: flex-start; padding: 12px 13px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); margin: 0 0 16px; font-size: 13px; color: var(--muted); line-height: 1.45; }
.kindnote b { display: block; color: var(--ink); font-size: 14px; font-weight: 650; margin-bottom: 1px; }
.kindnote .ki { flex: none; width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--brand); color: #fff; }
.kindnote.idea .ki { background: var(--gold-soft); color: var(--gold-ink); }
.kindnote .ki svg { width: 19px; height: 19px; }
.parts { display: inline-flex; gap: 4px; min-width: 0; overflow: hidden; }
.part { flex: none; width: 22px; height: 22px; border-radius: 50%; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; background: var(--sbg); color: var(--sc); box-shadow: inset 0 0 0 1.5px var(--sc); }
.rgrid td.c.work { background: var(--st-doing-bg); color: var(--st-doing); }
.legend i.work { background: var(--st-doing-bg); color: var(--st-doing); }
.flow-n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--gold-soft); color: var(--gold-ink); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
/* ----- Play ----- */
.game { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .game { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; } }
.gmain { padding: 14px; }
.scene { position: relative; height: 230px; border-radius: 14px; overflow: hidden; background: #eef4f6; box-shadow: inset 0 0 0 1px #dfe9ec; }
.sea { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: #dceaf0; }
.sea i { position: absolute; height: 2px; border-radius: 2px; background: #c3d9e2; }
.sea i:nth-child(1) { left: 8%; width: 18%; bottom: 40px; } .sea i:nth-child(2) { right: 10%; width: 22%; bottom: 26px; } .sea i:nth-child(3) { left: 30%; width: 12%; bottom: 12px; }
.island { position: absolute; left: 50%; bottom: 40px; width: 250px; height: 40px; margin-left: -125px; background: #f1e6cc; border-radius: 50% 50% 46% 46% / 75% 75% 30% 30%; box-shadow: inset 0 0 0 1.5px #dccaa1; }
.palm { position: absolute; left: calc(50% + 74px); bottom: 66px; width: 6px; height: 46px; }
.palm i { position: absolute; left: 0; bottom: 0; width: 5px; height: 46px; border-radius: 3px; background: #b7966a; transform: rotate(8deg); transform-origin: bottom; }
.palm b { position: absolute; left: -16px; top: -10px; width: 40px; height: 18px; border-radius: 50%; border: 2px solid #6f9a6a; border-bottom-color: transparent; }
.tower { position: absolute; left: 50%; bottom: 64px; width: 92px; margin-left: -46px; display: flex; flex-direction: column-reverse; align-items: stretch; }
.floor { height: 22px; background: #fff; border: 1.5px solid var(--ink); border-bottom-width: 0; display: flex; justify-content: space-evenly; align-items: center; }
.floor.base { border-bottom-width: 1.5px; height: 24px; }
.floor i { width: 11px; height: 10px; border: 1.5px solid var(--gold-ink); border-radius: 2px; background: var(--gold-soft); }
.floor i.door { height: 15px; align-self: flex-end; border-bottom: 0; border-radius: 3px 3px 0 0; background: var(--gold); border-color: var(--gold-ink); }
.floor.fall { animation: floorfall 1s cubic-bezier(.5,0,.75,0) forwards; z-index: 2; }
@keyframes floorfall { 0% { transform: none; } 25% { transform: translate(6px, -4px) rotate(5deg); } 100% { transform: translate(90px, 150px) rotate(40deg); opacity: 0; } }
.roof { height: 10px; margin: 0 6px; border: 1.5px solid var(--ink); border-bottom: 0; background: var(--gold-soft); position: relative; }
.roof i { position: absolute; left: 50%; top: -14px; width: 1.5px; height: 14px; background: var(--ink); }
.scene.lost .island::after { content: ""; position: absolute; left: 30px; bottom: 14px; width: 90px; height: 12px; border: 1.5px solid var(--ink); background: #fff; transform: rotate(-6deg); }
.gword { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; margin: 16px 0 6px; }
.gw { display: flex; gap: 5px; max-width: 100%; }
.gbox { flex: 0 1 34px; min-width: 22px; height: 44px; border-radius: 9px; border: 1.5px solid #d8d2c7; background: var(--card); display: grid; place-items: center; font-size: 20px; font-weight: 700; color: var(--ink); transition: background .3s, border-color .3s, color .3s; }
.gbox.new { animation: turnover .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 90ms); }
@keyframes turnover { 0% { transform: rotateX(90deg) scale(.9); opacity: .2; } 60% { transform: rotateX(-12deg) scale(1.06); opacity: 1; } 100% { transform: none; } }
.gdev { display: table; margin: 0 auto 6px; font-size: 11.5px; font-weight: 650; color: var(--purple); background: var(--purple-bg); border-radius: 999px; padding: 2px 9px; }
.gmode { margin: 0; flex: none; }
.gmode button { padding: 0 12px; font-size: 13px; }
.tower.hurt { animation: hurt .5s ease; }

.floor.rise, .roof.rise { animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 110ms); }

.scene { transition: background .5s; }
.scene.won { background: #eef7ef; }

.roof .flag { position: absolute; left: calc(50% + 1px); top: -14px; width: 16px; height: 10px; background: var(--st-done); clip-path: polygon(0 0, 100% 50%, 0 100%); transform-origin: left center; animation: flag .6s .35s var(--ease) both; }

.gbox.on { border-color: var(--st-done); background: var(--st-done-bg); color: var(--st-done); }

.gstat b { color: var(--ink); }

.gkey.hit { background: var(--st-done-bg); border-color: #bfdccb; color: var(--st-done); }

.gkey.shake { animation: shake .35s; }

.gtype { width: 56px; text-align: center; font-size: 18px; font-weight: 700; text-transform: uppercase; }
.gstart { min-height: 50px; font-size: 16px; border-radius: 14px; }
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.pod { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 10px; display: flex; flex-direction: column; gap: 2px; align-items: center; text-align: center; min-width: 0; }
.pod b { font-size: 14px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pod span { font-size: 12px; color: var(--muted); }
.pod .pm { font-size: 11px; font-weight: 750; letter-spacing: .06em; color: var(--gold-ink); background: var(--gold-soft); border-radius: 999px; padding: 2px 8px; }
.pod.p1 { box-shadow: 0 0 0 1.5px var(--gold), var(--shadow); }
.gtable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.gtable th { font-size: 11px; font-weight: 600; color: var(--muted); text-align: left; padding: 8px 4px; letter-spacing: .04em; }
.gtable td { padding: 9px 4px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.gtable th:nth-child(n+3), .gtable td:nth-child(n+3) { text-align: right; }
.gtable tr.me td { font-weight: 650; }
.ends { display: inline-flex; align-items: center; gap: 4px; }
.ends button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; min-height: 30px; padding: 0 10px; font: inherit; font-size: 12.5px; font-weight: 550; color: var(--muted); cursor: pointer; }
.ends button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.sheet.page .related.slots { background: var(--card); border: 0; box-shadow: var(--shadow); border-radius: 16px; padding: 4px 14px; }
.related.slots .r { flex-direction: column; align-items: stretch; gap: 8px; }
