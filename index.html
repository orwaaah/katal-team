/** One-tap post moves: published, back to Ready, cancelled. */
function calMove(c, action) {
  const msg = { published: c.id + ' marked as published · undo it from Posted', ready: c.id + ' moved back to Ready', cancel: c.id + ' cancelled',
    unpublish: c.id + ' moved back to the Calendar' }[action];
  return instant((st) => {
    const x = st.calendar.find((k) => k.key === c.key);
    if (!x) return;
    const wasPublished = x.status === 'Published';
    if (action === 'published') { x.status = 'Published'; x.publishedAt = S.state.now; }
    if (action === 'cancel') { x.status = 'Cancelled'; x.publishedAt = ''; }
    if (action === 'ready') { x.publishDate = ''; x.status = x.status === 'Draft' ? 'Draft' : 'Final'; x.publishedAt = ''; }
    if (action === 'unpublish') { x.status = 'Final'; x.publishedAt = ''; }
    if (wasPublished && (action === 'ready' || action === 'unpublish')) x.postLinks = x.postLinks.map(() => '');
  }, 'cal.status', { key: c.key, action }, msg);
}

  const viewChips = [choice(views, view, (v) => { S.ui.calView = v; render(); }), h('div', { style: 'height:12px' })];

/* ----- Rhythm: are we posting as often as planned? Days × platforms. ----- */
const PF_SHORT = { Instagram: 'IG', TikTok: 'TT', YouTube: 'YT', Facebook: 'FB', Snapchat: 'SC', LinkedIn: 'Li', X: 'X', Twitter: 'X', Threads: 'Th', Website: 'Web' };
function pfShort(p) { return PF_SHORT[p] || p.slice(0, 3); }

/** One day × one platform: how many posts the rule wants and what's planned (or went out, for past days). */
function rhythmCell(d, p) {
  const st = S.state;
  const r = (st.rhythm || {})[p] || { days: [], min: 0, time: '' };
  const need = r.min > 0 && r.days.indexOf(wd(d)) >= 0 ? r.min : 0;
  const posts = st.calendar.filter((c) => c.publishDate === d && c.platforms[p] && c.status !== 'Cancelled');
  const past = d < st.today;
  const counted = past ? posts.filter((c) => c.status === 'Published') : posts;
  const ready = counted.filter((c) => c.status !== 'Draft').length;
  let cls = 'ok', mark = '✓';
  if (!need) { cls = 'off'; mark = posts.length ? String(posts.length) : '·'; }
  else if (counted.length < need) { cls = 'miss'; mark = counted.length ? counted.length + '/' + need : '✕'; }
  else if (!past && ready < need) { cls = 'part'; mark = '✎'; }
  return { cls, mark, need, posts, r };
}

function rhythmView() {
  const st = S.state;
  const today = st.today;
  const plats = st.platforms;
  const anyRule = plats.some((p) => (st.rhythm[p] || {}).min > 0 && (st.rhythm[p] || {}).days.length);
  const days = [];
  for (let i = -7; i < 14; i++) days.push(addDays(today, i));
  const gaps = days.filter((d) => d >= today).reduce((n, d) => n + plats.filter((p) => rhythmCell(d, p).cls === 'miss').length, 0);
  return h('div', null,
    h('div', { class: 'row', style: 'margin-bottom:10px' },
      h('div', { class: 'grow' }, anyRule ? h('b', null, gaps ? '⚠️ ' + gaps + ' gap' + (gaps === 1 ? '' : 's') + ' in the next 2 weeks' : '✓ The next 2 weeks are covered')
        : h('span', { class: 'muted' }, 'No rules yet. Set how often you post on each platform.')),
      isAdmin() ? h('button', { class: 'btn small', onclick: rhythmRulesSheet }, '⚙️ Rules') : null),
    h('table', { class: 'rgrid' },
      h('thead', null, h('tr', null, h('th', { class: 'd' }, ''), plats.map((p) => h('th', { title: p }, pfShort(p))))),
      h('tbody', null, days.map((d) => h('tr', { class: (d === today ? 'today' : '') + (d < today ? ' past' : '') },
        h('td', { class: 'd' }, (d === today ? '• ' : '') + wd(d) + ' ' + d.slice(8, 10) + '/' + d.slice(5, 7)),
        plats.map((p) => { const x = rhythmCell(d, p); return h('td', { class: x.cls, title: p, onclick: () => rhythmCellSheet(d, p) }, x.mark); }))))),
    h('div', { class: 'legend' },
      h('span', null, h('i', { style: 'background:var(--green-bg)' }), '✓ covered'),
      h('span', null, h('i', { style: 'background:var(--orange-bg)' }), '✎ planned, still a draft'),

    h('div', { class: 'muted small' }, 'Past days count only posts marked published. Tap a box to fill it from Ready.'));
}

      h('div', { class: 'list-row' },
        h('span', { class: 'avatar', style: 'background:var(--brand);color:#fff;width:40px;height:40px;font-size:16px' }, u.name.charAt(0)),
        h('div', { class: 'main-col' },
          h('div', { class: 't' }, u.name, ' ', h('span', { class: 'idtag' }, u.prefix)),
          h('div', { class: 'muted small' }, [u.title, '@' + u.username].filter(Boolean).join(' · ')),
          h('div', { class: 'muted small' }, u.lastLogin ? 'Last login ' + fmtDT(u.lastLogin) : 'Never logged in')),
        h('div', { class: 'row', style: 'justify-content:flex-end' },
          u.role === 'Admin' ? h('span', { class: 'badge b-blue' }, 'Admin') : u.role === 'Manager' ? h('span', { class: 'badge b-purple' }, 'Manager') : null,
          u.telegram ? h('span', { class: 'badge', title: 'Telegram connected' }, '📨') : null,
          !u.active ? h('span', { class: 'badge b-red' }, 'Inactive') : u.mustChange ? h('span', { class: 'badge b-orange' }, 'Temp password') : null))))));
}

function showTemps(temps, title) {
  const url = S.state && S.state.appUrl;
  const text = (t) => [S.state.appName + (url ? ': ' + url : ''), 'Username: ' + t.username, 'Temporary password: ' + t.password, 'You will pick your own password the first time you log in.'].join('\n');
  openSheet(title || 'Login details', h('div', null,
    h('p', { style: 'margin-top:0' }, 'Send each person their details (e.g. on Telegram). ', h('b', null, 'This is the only time the password is shown.')),
    temps.map((t) => h('div', { style: 'margin-bottom:14px' },
      h('b', null, t.name),
      h('div', { class: 'copybox' }, text(t)),
      h('button', { class: 'btn small', onclick: () => copyText(text(t)) }, 'Copy')))),
  h('button', { class: 'btn primary', onclick: closeSheet }, 'Done'));
}

function copyText(s) {
  const fallback = () => {
    const t = h('textarea', { style: 'position:fixed;opacity:0' });
    t.value = s;
    document.body.append(t);
    t.select();
    try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Select the text and copy it.', true); }
    t.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(() => toast('Copied'), fallback);
  else fallback();
}

function userSheet(id) {
  const u = id ? S.state.users.find((x) => x.id === id) : null;
  const f = u ? { id: u.id, name: u.name, prefix: u.prefix, role: u.role, title: u.title, username: u.username }
    : { name: '', prefix: '', role: 'Member', title: '', username: '' };
  const hasIdeas = u && S.state.ideas.some((i) => i.byId === u.id);
  const prefixIn = input(f, 'prefix', { dir: 'ltr', maxlength: 3, style: 'text-transform:uppercase', disabled: hasIdeas });
  const userIn = input(f, 'username', { dir: 'ltr', autocapitalize: 'none' });
  const nameIn = input(f, 'name', {
    oninput: (e) => {
      f.name = e.target.value;
      if (u) return;
      // Suggest a free prefix: first letter, else first two letters, else first + last.
      const letters = f.name.replace(/[^A-Za-z]/g, '').toUpperCase();
      const free = [letters.charAt(0), letters.slice(0, 2), letters.charAt(0) + letters.slice(-1)]
        .filter((x) => /^[A-Z]{1,3}$/.test(x)).find((x) => !S.state.users.some((u) => u.prefix === x));
      if (free) { f.prefix = free; prefixIn.value = free; }
      f.username = f.name.toLowerCase().replace(/[^a-z0-9]/g, '');
      userIn.value = f.username;
    }
  });
  const save = h('button', { class: 'btn primary' }, u ? 'Save' : 'Add person');
  save.onclick = async () => {
    const d = await run(save, 'user.save', f, u ? 'Saved' : 'Person added');
    if (d && d.temp) showTemps([d.temp], 'Login details for ' + d.temp.name);
  };
  const footer = [save];
  if (u) {
    const reset = h('button', { class: 'btn' }, 'Reset password');
    reset.onclick = async () => {
      if (!confirm('Reset ' + u.name + '\'s password? They will be logged out everywhere.')) return;
      const d = await run(reset, 'user.reset', { id: u.id }, 'Password reset');
      if (d && d.temp) showTemps([d.temp], 'New login for ' + d.temp.name);
    };
    const act = h('button', { class: 'btn ' + (u.active ? 'danger' : 'good') }, u.active ? 'Deactivate' : 'Reactivate');
    act.onclick = () => {
      if (u.active && !confirm('Deactivate ' + u.name + '? They can\'t log in anymore. Their ideas and tasks stay.')) return;
      run(act, 'user.active', { id: u.id, active: !u.active }, u.active ? u.name + ' deactivated' : u.name + ' reactivated');
    };
    if (u.id !== S.me.id) footer.unshift(act);
    footer.unshift(reset);
  }
  openSheet(u ? u.name : 'Add person', h('div', null,
    field('Name', nameIn),
    field('Title', input(f, 'title', { placeholder: 'e.g. Graphic Designer' })),
    field('Role', choice([{ value: 'Member', label: 'Member' }, { value: 'Manager', label: 'Manager' }, { value: 'Admin', label: 'Admin' }], f.role, (v) => { f.role = v; }),
      'Member: their own tasks. Manager: sees everything and comments, changes nothing, no Scribbles. Admin: everything.'),
    field('Username', userIn, 'Used to log in. Lowercase, no spaces.'),
    field('ID prefix', prefixIn, hasIdeas ? 'Locked: this person already has ideas.' : 'Their ideas get IDs like I' + (f.prefix || 'X') + '001. Must be unique.'),
    !u ? h('p', { class: 'muted small' }, 'A temporary password is created and shown once after saving.') : null), footer);
}

function settingsView() {
  const st = S.state;
  const set = st.settings;
  const card = (title, kids) => h('div', { class: 'card', style: 'margin-bottom:14px' }, h('h3', null, title), kids);

  // List editor for types and platforms
  const listEditor = (key, items, label, note) => {
    const list = items.slice();
    const box = h('div');
    const add = { v: '' };
    const draw = () => fill(box, 
      h('div', { class: 'chips' }, list.map((x, i) => h('span', { class: 'chip' }, x,
        h('button', { type: 'button', class: 'btn ghost small', style: 'min-height:24px;padding:0 4px;color:var(--red)', 'aria-label': 'Remove ' + x, onclick: () => { list.splice(i, 1); draw(); } }, '✕')))),
      h('div', { class: 'row', style: 'margin-top:10px' },
        h('div', { class: 'grow' }, input(add, 'v', { placeholder: 'Add ' + label.toLowerCase() })),
        h('button', { class: 'btn', onclick: () => { const v = add.v.trim(); if (v) { list.push(v); add.v = ''; draw(); } } }, 'Add')),
      note ? h('p', { class: 'muted small' }, note) : null,
      h('button', { class: 'btn primary', onclick: (e) => run(e.currentTarget, 'settings.save', { [key]: list }, label + 's saved') }, 'Save ' + label.toLowerCase() + 's'));
    draw();
    return box;
  };

  // Work hours
  const hours = {};
  DAYN.forEach((d) => { hours[d] = set.hours[d] ? Object.assign({}, set.hours[d]) : null; });
  const hoursBox = h('div');
  const drawHours = () => fill(hoursBox, 
    DAYN.map((d, i) => h('div', { class: 'row', style: 'padding:8px 0;border-bottom:1px solid var(--line)' },
      h('b', { style: 'width:96px' }, DAYL[i]),
      choice([{ value: 'on', label: 'Work' }, { value: 'off', label: 'Off' }], hours[d] ? 'on' : 'off', (v) => { hours[d] = v === 'on' ? (hours[d] || { start: '09:00', end: '18:00' }) : null; drawHours(); }),
      hours[d] ? h('div', { class: 'row' },
        h('input', { class: 'in', type: 'time', style: 'width:auto', value: hours[d].start, onchange: (e) => { hours[d].start = e.target.value; } }), '–',
        h('input', { class: 'in', type: 'time', style: 'width:auto', value: hours[d].end, onchange: (e) => { hours[d].end = e.target.value; } })) : null)),
    h('p', { class: 'muted small' }, 'Deadlines can only fall on workdays. Tasks turn red 2 hours before the end of the workday.'),
    h('button', { class: 'btn primary', onclick: (e) => run(e.currentTarget, 'settings.save', { hours }, 'Work hours saved') }, 'Save work hours'));
  drawHours();

  const app = { appName: set.appName };

  // Templates grouped by type
  const types = Array.from(new Set(set.types.concat(st.templates.map((t) => t.type))));
  const tplBox = h('div', null,
    h('p', { class: 'muted small', style: 'margin-top:0' }, 'When you approve an idea, these tasks are pre-filled for its type.'),
    types.map((type) => {
      const rows = st.templates.filter((t) => t.type === type);
      return h('div', { style: 'margin-bottom:14px' },
        h('div', { class: 'row', style: 'margin-bottom:6px' }, h('b', { class: 'grow' }, type),
          h('button', { class: 'btn small', onclick: () => templateSheet(null, type) }, '+ Add')),
        rows.length ? rows.map((t, i) => h('div', { class: 'row', style: 'padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;' + (t.active ? '' : 'opacity:.55') },
          h('div', { class: 'grow', style: 'cursor:pointer', onclick: () => templateSheet(t.key) },
            h('div', { style: 'font-weight:600' }, t.task, t.active ? '' : ' (off)'),
            h('div', { class: 'muted small' }, (st.names[t.assignee] || 'No default') + (t.daysAfter ? ' · +' + t.daysAfter + ' workday' : '') +
              ' · ' + (t.linkRole === 'Cover' ? 'cover' : 'main file') + (t.note ? ' · ' + t.note.slice(0, 40) : ''))),
          h('button', { class: 'icon-btn', disabled: i === 0, 'aria-label': 'Move up', onclick: (e) => run(e.currentTarget, 'template.move', { key: t.key, dir: 'up' }) }, '↑'),
          h('button', { class: 'icon-btn', disabled: i === rows.length - 1, 'aria-label': 'Move down', onclick: (e) => run(e.currentTarget, 'template.move', { key: t.key, dir: 'down' }) }, '↓')))
          : h('div', { class: 'muted small' }, 'No templates for ' + type + '.'));
    }));

  // Gemini
  const gem = { captionExamples: set.captionExamples || set.defaultCaptionExamples, licenseNumbers: set.licenseNumbers, geminiModel: set.geminiModel };
  const gemBox = h('div', null,
    h('p', { class: 'muted small', style: 'margin-top:0' }, st.ai
      ? '✓ Connected. Gemini only does three things: a caption next to the team\'s (never over it), the brief when you tap "Turn into brief", and two checks on every uploaded design (spelling, license numbers).'
      : 'Not connected yet.'),
    field('Caption examples', area(gem, 'captionExamples', { rows: 10, dir: 'ltr' }),
      'Gemini writes like these. Put a line with --- between two captions. 3–6 good examples is best.'),
    field('License numbers', area(gem, 'licenseNumbers', { rows: 2, dir: 'ltr', placeholder: 'CN: 5119576\nADM: 202304448388' }),
      'One per line. Every design must show all of them, otherwise it gets ✗.'),
    field('Model (optional)', input(gem, 'geminiModel', { dir: 'ltr', placeholder: 'automatic: the newest Gemini Flash' })),
    h('button', { class: 'btn primary', onclick: (e) => run(e.currentTarget, 'settings.save', gem, 'Gemini settings saved') }, 'Save'));

  return h('div', null,
    card('✨ Gemini', gemBox),
    card('Task templates', tplBox),
    card('Idea types', listEditor('types', set.types, 'Type')),
    card('Platforms', listEditor('platforms', set.platforms, 'Platform', 'New platforms get a new column in the calendar sheet.')),
    card('Work hours', hoursBox),
    card('App name', h('div', null, field('', input(app, 'appName')),
      h('button', { class: 'btn primary', onclick: (e) => run(e.currentTarget, 'settings.save', { appName: app.appName }, 'Saved') }, 'Save'))));
}

function templateSheet(key, type) {
  const t = key ? S.state.templates.find((x) => x.key === key) : null;
  const f = t ? { key: t.key, type: t.type, task: t.task, assignee: t.assignee, note: t.note, active: t.active, daysAfter: t.daysAfter, linkRole: t.linkRole }
    : { type: type || '', task: '', assignee: '', note: '', active: true, daysAfter: 0, linkRole: 'Media' };
  const btn = h('button', { class: 'btn primary' }, 'Save');
  btn.onclick = () => run(btn, 'template.save', f, 'Template saved');
  openSheet(t ? 'Template' : 'New template', h('div', null,
    field('Type', choice(S.state.types.map((x) => ({ value: x, label: x })), f.type, (v) => { f.type = v; })),
    field('Task title', input(f, 'task')),
    field('Default person', choice(peopleOptions(true), f.assignee, (v) => { f.assignee = v; })),
    field('Brief note', area(f, 'note', { rows: 2 }), 'Added under the idea brief on new tasks.'),
    field('Deadline', choice([0, 1, 2, 3].map((n) => ({ value: n, label: n ? '+' + n + ' workday' + (n > 1 ? 's' : '') : 'Same day' })), f.daysAfter, (v) => { f.daysAfter = v; }),
      'Counted from the deadline you pick when you approve. A cover usually comes +1 workday after the video.'),
    field('Their file goes on the post as', choice(linkRoleOptions(f.type), f.linkRole, (v) => { f.linkRole = v; })),
    field('Active', choice([{ value: true, label: 'On' }, { value: false, label: 'Off' }], f.active, (v) => { f.active = v; }))), btn);
}

/* ----- Activity log ----- */
function describeKey(l) {
  const st = S.state;
  if (l.entity === 'Settings') return l.key;
  if (l.entity === 'Task') { const t = st.tasks.find((x) => x.key === l.key); return t ? t.id + ' · ' + t.task + ' (' + t.assignee + ')' : 'task'; }
  if (l.entity === 'Calendar') { const c = st.calendar.find((x) => x.key === l.key); return c ? 'calendar ' + c.id : 'calendar'; }
  if (l.entity === 'User') return st.names[l.key] || l.key;
  if (l.entity === 'Template') { const t = (st.templates || []).find((x) => x.key === l.key); return t ? 'template ' + t.type + ' · ' + t.task : 'template'; }
  return l.entity === 'Idea' ? l.key : l.entity + ' ' + l.key;
}
/** Makes log values readable: dates, people, yes/no. */
function niceVal(v) {
  if (!v) return '—';
  if (v === 'TRUE') return 'Yes';
  if (v === 'FALSE') return 'No';
  if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(v)) return fmtDT(v);
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return fmtD(v);
  v = v.replace(/\bU\d{3,}\b/g, (id) => S.state.names[id] || id);
  return v.length > 80 ? v.slice(0, 80) + '…' : v;
}
/** One save writes one log row per field; show them as one entry. */
function groupLog(rows) {
  const out = [];
  rows.forEach((l) => {
    const g = out[out.length - 1];
    if (g && g.at === l.at && g.user === l.user && g.action === l.action && g.key === l.key && g.entity === l.entity) g.items.push(l);
    else out.push({ at: l.at, user: l.user, action: l.action, entity: l.entity, key: l.key, items: [l] });
  });
  return out;
}
function logRow(g) {
  return h('div', { class: 'log-row' },
    h('div', null, h('b', null, g.user), ' · ', g.action.replace(/Gemini/, '✨ Gemini').toLowerCase().replace('✨ gemini', '✨ Gemini'), ' ', h('span', null, describeKey(g))),
    g.items.map((l) => l.field
      ? h('div', { class: 'small', dir: 'auto' }, l.field + ': ', h('span', { class: 'muted' }, niceVal(l.old)), ' → ', niceVal(l.new))
      : l.new ? h('div', { class: 'small muted', dir: 'auto' }, niceVal(l.new)) : null),
    h('div', { class: 'muted small' }, fmtDT(g.at)));
}
function activityView() {
  if (!S.ui.log) {
    S.ui.log = 'loading';
    call('log.list', { limit: 300 }).then((d) => { S.ui.log = d.log; render(); }).catch((e) => { S.ui.log = null; handleErr(e); });
  }
  if (S.ui.log === 'loading') return h('div', { class: 'loading', style: 'min-height:200px' }, h('div', { class: 'spinner' }));
  return h('div', { class: 'card' }, S.ui.log.length ? groupLog(S.ui.log).map(logRow) : h('div', { class: 'muted' }, 'Nothing yet.'));
}

boot();
</script>

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
