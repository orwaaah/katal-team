<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KATAL Team</title>
<meta name="description" content="Tasks, ideas and posts for the KATAL content team.">
<meta name="theme-color" content="#1d3557">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KATAL">
<meta name="format-detection" content="telephone=no">
<script>window.KATAL_PWA = true;</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ===== KATAL: black, warm white and champagne gold. Calm, compact, made for the company. ===== */
:root {
  --brand: #141311;          /* top bar, main buttons */
  --brand-ink: #ffffff;
  --gold: #b39463;           /* KATAL accent */
  --gold-ink: #8a6d3f;
  --gold-soft: #f5efe4;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bg: #f6f4f0;
  --card: #ffffff;
  --ink: #1a1815;
  --muted: #8c867c;
  --faint: #b3ada3;
  --line: #ebe7df;
  --soft: #f8f6f2;
  --red: #b4483d;   --red-bg: #faefed;  --red-line: #e3b2ab;
  --green: #3d7a57; --green-bg: #edf5f0;
  --orange: #a3701f; --orange-bg: #faf3e6;
  --blue: #46658f;  --blue-bg: #eef2f7;
  --purple: #6c5da3; --purple-bg: #f2f0f8;
  --gray-bg: #f0ede7;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(26,24,21,.04), 0 4px 14px rgba(26,24,21,.04);
  --nav-h: 58px;
  --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
/* The page always fits the phone: no zooming in or out, long links wrap, and nothing can make it wider. */
html { touch-action: pan-x pan-y; }
#app { overflow-x: clip; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; overflow-wrap: break-word; }
body.noscroll { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--gold-ink); }
h1, h2, h3 { margin: 0; line-height: 1.25; font-weight: 650; letter-spacing: -.01em; }
.pre { white-space: pre-wrap; word-break: break-word; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.hidden { display: none !important; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ----- Top bar and tabs ----- */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; gap: 12px; height: calc(52px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
.brandmark { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brandmark img { height: 15px; width: auto; display: block; }
.brandmark .sep { width: 1px; height: 16px; background: rgba(255,255,255,.22); }
.brandmark .team { font-size: 11px; font-weight: 600; letter-spacing: .32em; color: var(--gold); text-transform: uppercase; }
.me-btn { background: none; border: 0; color: inherit; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 0 4px 4px; font-size: 14px; }
.me-btn .nm { opacity: .8; }
@media (max-width: 420px) { .me-btn .nm { display: none; } }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--gold-soft); color: var(--gold-ink); display: grid; place-items: center; font-weight: 650; font-size: 13px; flex: none; }
.topbar .avatar { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(179,148,99,.55); }
.main { max-width: 860px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right)) calc(var(--nav-h) + 30px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.main.enter { animation: enter .22s var(--ease); }
.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: rgba(255,255,255,.94); -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px); border-top: 1px solid var(--line); display: flex; justify-content: center; padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.tabs button { flex: 1; min-width: 0; max-width: 120px; height: var(--nav-h); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10.5px; font-weight: 500; letter-spacing: .02em; color: var(--faint); cursor: pointer; position: relative; padding: 0 2px; transition: color .2s; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button.on { color: var(--ink); font-weight: 600; }
.tabs button.on::before { content: ""; position: absolute; top: 0; left: 50%; width: 22px; height: 2px; margin-left: -11px; border-radius: 0 0 2px 2px; background: var(--gold); }
.tabs .dot { position: absolute; top: 7px; left: calc(50% + 7px); background: var(--gold); color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; min-width: 16px; height: 16px; padding: 0 4px; display: grid; place-items: center; }
@media (min-width: 900px) {
  .tabs { position: sticky; top: calc(52px + env(safe-area-inset-top)); bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); }
  .tabs button { flex-direction: row; height: 46px; font-size: 14px; gap: 8px; max-width: 150px; }
  .tabs button svg { width: 18px; height: 18px; }
  .tabs button.on::before { top: auto; bottom: 0; width: 100%; left: 0; margin: 0; border-radius: 2px 2px 0 0; }
  .tabs .dot { position: static; }
  .main { padding-bottom: 40px; }
}
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin: 2px 0 14px; }
.page-head h1 { font-size: 23px; }
.page-head .eyebrow { margin-bottom: 4px; }
.section { margin: 24px 0 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.section h2 { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stack > * + * { margin-top: 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.empty { text-align: center; color: var(--muted); padding: 30px 16px; font-size: 14px; }
.empty .big { font-size: 22px; display: block; margin-bottom: 6px; color: var(--gold); }

/* ----- Buttons ----- */
.btn { border: 1px solid var(--line); border-radius: 11px; padding: 0 15px; min-height: 42px; font-weight: 550; font-size: 14.5px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; background: var(--card); color: var(--ink); position: relative; text-decoration: none; transition: transform .12s var(--ease), background .15s, border-color .15s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #fff; }
.btn.good { background: var(--green); border-color: var(--green); color: #fff; }
.btn.warn { background: var(--card); border-color: #e4cfa6; color: var(--orange); }
.btn.danger { background: var(--card); border-color: var(--red-line); color: var(--red); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--gold-ink); padding: 0 6px; }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 9px; }
.btn.tiny { min-height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.busy { color: transparent !important; }
.btn.busy::after { content: ""; position: absolute; width: 16px; height: 16px; border: 2px solid rgba(0,0,0,.18); border-top-color: var(--ink); border-radius: 50%; animation: spin .7s linear infinite; }
.btn.primary.busy::after, .btn.good.busy::after, .btn.gold.busy::after { border-color: rgba(255,255,255,.3); border-top-color: #fff; }
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn { border: 1px solid var(--line); background: var(--card); width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 14px; flex: none; display: grid; place-items: center; color: var(--muted); }
.icon-btn svg { width: 17px; height: 17px; }
.quick { min-height: 34px; padding: 0 13px; font-size: 13.5px; border-radius: 999px; }

/* ----- Chips, selects, segments ----- */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 0 12px; min-height: 34px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; font-size: 13.5px; position: relative; transition: background .15s, color .15s, border-color .15s; }
.chip.on { border-color: var(--brand); background: var(--brand); color: #fff; font-weight: 550; }
.chip .n { font-size: 11.5px; opacity: .6; }
.chip.date input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; pointer-events: none; }
.sel { position: relative; display: inline-flex; align-items: center; }
.sel select { appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 0 30px 0 13px; min-height: 34px; font-size: 13.5px; font-weight: 500; cursor: pointer; max-width: 100%; text-overflow: ellipsis; }
.sel::after { content: ""; position: absolute; right: 13px; top: 50%; width: 6px; height: 6px; margin-top: -5px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); pointer-events: none; }
.sel.on select { background: var(--brand); border-color: var(--brand); color: #fff; }
.sel.on::after { border-color: #fff; }
.sel.full { display: flex; }
.sel.full select { width: 100%; border-radius: 11px; min-height: 42px; font-size: 14.5px; font-weight: 400; }
.filters { display: flex; gap: 6px; align-items: center; margin-bottom: 12px; }
.filters .sel { min-width: 0; }
.filters .sel select { max-width: 46vw; }
.filters .search-btn { margin-left: auto; }
.seg { display: flex; background: var(--gray-bg); border-radius: 11px; padding: 3px; gap: 2px; margin-bottom: 14px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 9px; min-height: 32px; font-size: 13.5px; font-weight: 550; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .2s, color .2s; white-space: nowrap; padding: 0 8px; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(26,24,21,.08); }
.seg.cap-tabs button { font-size: 12.5px; min-height: 28px; }
.seg button .n { font-size: 11px; background: var(--gold); color: #fff; border-radius: 999px; min-width: 17px; height: 17px; padding: 0 5px; display: inline-grid; place-items: center; }
.subnav { display: flex; gap: 14px; align-items: center; margin: -6px 0 12px; font-size: 13px; }
.subnav button { border: 0; background: none; padding: 4px 0; color: var(--muted); cursor: pointer; font-weight: 500; display: inline-flex; gap: 5px; align-items: center; }
.subnav button.on { color: var(--ink); }
.subnav .warnpill { background: var(--red-bg); color: var(--red); border-radius: 999px; padding: 2px 9px; font-weight: 600; font-size: 12px; }

/* ----- Lists ----- */
/* Each row is its own small card, with a little space between them. */
.list { display: flex; flex-direction: column; gap: 8px; }
.lrow { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 0; border-radius: 14px; box-shadow: var(--shadow); cursor: pointer; position: relative; background: var(--card); transition: background .15s; width: 100%; text-align: left; font: inherit; color: inherit; }
/* Inside a sheet (already white), a thin line instead of a shadow. */
.sheet .list { gap: 6px; }
.sheet .lrow { box-shadow: none; border: 1px solid var(--line); border-radius: 12px; }
.lrow:active { background: var(--soft); }
.lrow.late::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--red-line); }
.lrow.done { opacity: .62; }
.lrow .main-col { flex: 1; min-width: 0; }
.lrow .t { font-weight: 550; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* A task's name with its part (e.g. Video Cover) small next to it; a long name is cut, the part always shows. */
.ttl { display: flex; align-items: center; gap: 7px; min-width: 0; }
.ttl .tm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tpart { flex: none; max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 600; letter-spacing: .01em; line-height: 1.5; color: var(--gold-ink); background: var(--gold-soft); border-radius: 6px; padding: 0 6px; }
.info-top h3 .ttl { display: block; }
.info-top h3 .tm { white-space: normal; }
.info-top h3 .tpart { display: inline-block; vertical-align: middle; margin-inline-start: 8px; max-width: 100%; }
.lrow .s { font-size: 12.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .s .late-txt { color: var(--red); }
.lrow .end { display: flex; align-items: center; gap: 6px; flex: none; }
.lrow .datebox { width: 38px; flex: none; text-align: center; line-height: 1.1; }
.lrow .datebox b { display: block; font-size: 17px; font-weight: 650; }
.lrow .datebox span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.idtag { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }
.cdot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); flex: none; display: inline-block; }
.ccount { font-size: 12px; color: var(--faint); display: inline-flex; align-items: center; gap: 3px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; position: relative; }
.card.tap { cursor: pointer; }
.card h3 { font-size: 15.5px; margin: 0 0 8px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 550; border-radius: 999px; padding: 2px 8px; background: var(--gray-bg); color: var(--muted); white-space: nowrap; }
.b-blue { background: var(--blue-bg); color: var(--blue); }
.b-green { background: var(--green-bg); color: var(--green); }
.b-red { background: var(--red-bg); color: var(--red); }
.b-orange { background: var(--orange-bg); color: var(--orange); }
.b-purple { background: var(--purple-bg); color: var(--purple); }
.b-gold { background: var(--gold-soft); color: var(--gold-ink); }
.due { font-size: 13px; color: var(--muted); }
.due.red { color: var(--red); }
.due.green { color: var(--green); }
.note { border-radius: 12px; padding: 10px 12px; margin: 10px 0; font-size: 14px; background: var(--soft); border: 1px solid var(--line); }
.note.orange { background: var(--orange-bg); border-color: #efdcb8; }
.note.green { background: var(--green-bg); border-color: #cfe5d8; }
.note.gold { background: var(--gold-soft); border-color: #eadcc2; }
.note .t { font-weight: 600; font-size: 13.5px; margin-bottom: 2px; }
.brief { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 14px; }
.brief.clamp { max-height: 7.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.kv { font-size: 13.5px; color: var(--muted); }
.kv b { color: var(--ink); font-weight: 550; }
.related { border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; margin: 8px 0; font-size: 13.5px; }
.related .r { display: flex; gap: 8px; align-items: center; padding: 8px 0; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.related .r:last-child { border-bottom: 0; }
.related .head { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 8px 0 2px; }
.statusbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 4px; }
.statusbar .btn { min-height: 44px; }
.statusbar .btn.cur { border-color: var(--gold); background: var(--gold-soft); color: var(--gold-ink); }
.divider { height: 1px; background: var(--line); margin: 14px 0; }
.trow { padding: 0 !important; overflow: hidden; }
.trow-head { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; text-align: left; padding: 12px 14px; cursor: pointer; font: inherit; color: inherit; position: relative; }
.trow.late .trow-head::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--red-line); }
.trow-body { padding: 0 14px 14px; animation: enter .2s var(--ease); }
.chev { width: 8px; height: 8px; border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint); transform: rotate(-45deg); transition: transform .2s var(--ease); flex: none; margin-right: 2px; }
.trow.open .chev { transform: rotate(45deg); }
.actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.files { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: 9px; min-height: 32px; padding: 0 10px; font-size: 13px; cursor: pointer; text-decoration: none; color: var(--ink); }
.fchip.add { color: var(--gold-ink); border-style: dashed; }
.fchip svg { width: 15px; height: 15px; flex: none; }
details.more { margin: 6px 0 12px; }
details.more > summary { cursor: pointer; font-size: 13px; color: var(--gold-ink); list-style: none; padding: 6px 0; font-weight: 550; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+ "; }
details.more[open] > summary::before { content: "– "; }

/* ----- Forms ----- */
.field { display: block; margin: 0 0 14px; }
.field .lbl { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.field .lbl i { font-style: normal; font-weight: 400; color: var(--faint); margin-left: 4px; }
.field .hint { display: block; font-size: 12px; color: var(--faint); margin-top: 4px; }
.in { width: 100%; border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; background: var(--card); min-height: 42px; outline: none; font-size: 14.5px; transition: border-color .15s, box-shadow .15s; }
.in:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(179,148,99,.15); }
textarea.in { resize: vertical; min-height: 70px; line-height: 1.5; }
.in.private { background: #fdfaf3; border-color: #eadcc2; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 0; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--brand); }

/* ----- Today ----- */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; margin: 0 0 4px; padding: 2px 0 6px; }
@media (min-width: 600px) { .stats { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); } }
.stat { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 10px 11px; cursor: pointer; border: 0; text-align: left; min-width: 0; transition: transform .12s var(--ease); }
.stat:active { transform: scale(.97); }
.chips-row { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 4px; padding: 2px 16px 6px; scrollbar-width: none; }
.chips-row::-webkit-scrollbar { display: none; }
.stat .v { font-size: 21px; font-weight: 650; line-height: 1.1; }
.stat .l { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.25; }
.stat.red .v { color: var(--red); }
.stat.gold .v { color: var(--gold-ink); }
.allclear { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; color: var(--muted); font-size: 14px; }
.allclear b { color: var(--green); font-weight: 600; }

/* ----- Calendar ----- */
.day-head { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
.week { display: grid; grid-template-columns: 1fr; gap: 6px; }
@media (min-width: 900px) { .week { grid-template-columns: repeat(7, 1fr); } }
.wday { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 9px 10px; min-height: 54px; }
.wday.today { box-shadow: inset 0 0 0 1.5px var(--gold), var(--shadow); }
.wday .d { font-weight: 600; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.wentry { font-size: 12.5px; border-radius: 8px; padding: 5px 8px; margin-top: 5px; background: var(--soft); cursor: pointer; }
.wentry .wsub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 3px; }
.wmark { font-size: 11px; font-weight: 600; }
.wmark.ok { color: var(--green); }
.wmark.miss { color: var(--red); }
.wmark.draft { color: var(--orange); }
.pf { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .03em; border-radius: 5px; padding: 1px 5px; background: var(--gray-bg); color: var(--muted); margin: 0 3px 0 0; }
.pf.on { background: var(--brand); color: #fff; }
.capbox { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; background: var(--soft); }
.capbox .pre { font-size: 14px; }
.capbox .cap-k { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 2px; display: flex; justify-content: space-between; align-items: center; }
.capbox .cap-k:first-child { margin-top: 0; }

/* ----- Sheet ----- */
#layer .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(20,19,17,.42); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
.sheet { background: var(--card); width: 100%; max-width: 620px; max-height: 92vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; animation: up .3s var(--ease); box-shadow: 0 -10px 40px rgba(20,19,17,.12); }
.sheet::before { content: ""; width: 36px; height: 4px; border-radius: 4px; background: var(--line); margin: 8px auto 0; flex: none; }
#layer .overlay.closing { animation: fadeout .18s ease forwards; }
#layer .overlay.closing .sheet { animation: down .2s ease forwards; }
@media (min-width: 700px) { #layer .overlay { align-items: center; } .sheet { border-radius: 18px; max-height: 88vh; } .sheet::before { display: none; } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px 12px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { flex: 1; font-size: 16px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-body { padding: 16px; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet-foot { padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; gap: 8px; }
.sheet-foot .btn { flex: 1; min-width: 0; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes down { to { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes enter { from { opacity: 0; transform: translateY(4px); } }

/* ----- Toast ----- */
#toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px); z-index: 80; background: var(--brand); color: #fff; padding: 11px 16px; border-radius: 12px; font-size: 14px; width: max-content; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .22s var(--ease), transform .22s var(--ease); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.err { background: #7a5a2b; box-shadow: 0 10px 30px rgba(122,90,43,.35); }
#toast.act { pointer-events: auto; display: flex; align-items: center; gap: 14px; }
#toast button { background: none; border: 0; color: var(--gold, #d8b26a); font: inherit; font-weight: 600; padding: 2px 0; cursor: pointer; }
@media (min-width: 900px) { #toast { bottom: 28px; } }

/* ----- Sign-in screens ----- */
.auth { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 18px; background: radial-gradient(120% 70% at 50% 0%, #262320 0%, var(--brand) 60%); }
.auth .mark { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 30px; animation: enter .5s var(--ease); }
.auth .mark img { height: 30px; }
.auth .mark .team { font-size: 12px; letter-spacing: .45em; color: var(--gold); font-weight: 600; text-transform: uppercase; padding-left: .45em; }
.auth .box { background: var(--card); border-radius: 18px; padding: 24px 20px; width: 100%; max-width: 380px; box-shadow: 0 30px 70px rgba(0,0,0,.35); animation: enter .5s var(--ease) .05s backwards; }
.auth h1 { font-size: 19px; margin-bottom: 4px; }
.auth .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
.auth .foot { margin-top: 18px; text-align: center; }
.auth .foot .btn.ghost { color: rgba(255,255,255,.55); }
.pw-wrap { position: relative; }
.pw-wrap .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: 12.5px; font-weight: 550; padding: 8px; cursor: pointer; }
.loading { min-height: 100vh; display: grid; place-items: center; }
.spinner { width: 28px; height: 28px; border: 2px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin .7s linear infinite; }
.copybox { background: var(--soft); border: 1px dashed var(--line); border-radius: 12px; padding: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; margin: 8px 0; }
.log-row { font-size: 13.5px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.log-row:last-child { border-bottom: 0; }

/* ----- Comments ----- */
.cmt { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cmt:last-child { border-bottom: 0; }
.cmt .avatar { width: 28px; height: 28px; font-size: 12px; }
.cmt .body { flex: 1; min-width: 0; }
.cmt .who { font-size: 12.5px; color: var(--muted); }
.cmt .who b { color: var(--ink); font-weight: 600; }
.cmt .txt { white-space: pre-wrap; word-break: break-word; margin-top: 2px; font-size: 14px; }
.cmt-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; border-radius: 6px; padding: 2px 7px; background: var(--gold-soft); color: var(--gold-ink); margin: 3px 6px 0 0; border: 0; font-family: inherit; }
button.cmt-tag { cursor: pointer; }
.cmt-compose { display: flex; gap: 6px; align-items: flex-end; margin-top: 10px; }
.cmt-compose textarea.in { min-height: 42px; }
.cmt-compose .time { width: 58px; text-align: center; padding: 10px 4px; font-size: 13px; }
.cmt-compose .time::placeholder { color: var(--faint); }

/* ----- File preview, pins, uploads ----- */
/* The preview always fits on the screen with the comment box under it (same height in pvMaxH()). */
:root { --pv-h: max(220px, min(62vh, calc(100vh - 300px))); }
@supports (height: 1svh) { :root { --pv-h: max(220px, min(62svh, calc(100svh - 300px))); } }
.pv-frame { display: flex; justify-content: center; align-items: center; min-height: 160px; border-radius: 12px; overflow: hidden; background: #111; margin-bottom: 8px; }
/* Pins sit on .pv, which is exactly the image's size (the image is sized in fitPreviewImg). */
.pv { position: relative; flex: none; max-width: 100%; }
.pv img { display: block; max-width: 100%; max-height: var(--pv-h); width: auto; height: auto; cursor: crosshair; }
.pv-vid { position: relative; height: var(--pv-h); border-radius: 12px; overflow: hidden; background: #111; margin-bottom: 8px; }
.pv-vid iframe { position: absolute; top: 0; left: 0; display: block; width: 100%; height: 100%; border: 0; transform-origin: 0 0; }
.pv-vid iframe:fullscreen { transform: none !important; width: 100% !important; height: 100% !important; }
/* The app's own video player: the picture, then a slim bar of small buttons under it (nothing covers the video). */
.vp { margin-bottom: 8px; }
.vp-stage { position: relative; background: #111; border-radius: 12px 12px 0 0; overflow: hidden; }
.vp-stage video { display: block; width: 100%; height: calc(var(--pv-h) - 40px); object-fit: contain; background: #111; cursor: pointer; }
.vp-note { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 13px; background: rgba(0,0,0,.55); padding: 6px 12px; border-radius: 999px; pointer-events: none; white-space: nowrap; }
.vp-bar { display: flex; align-items: center; gap: 2px; padding: 3px 6px; background: var(--brand); color: #fff; border-radius: 0 0 12px 12px; }
.vp-b { flex: none; width: 34px; height: 34px; border: 0; background: none; color: inherit; display: grid; place-items: center; border-radius: 8px; cursor: pointer; padding: 0; }
.vp-b:active { background: rgba(255,255,255,.12); }
.vp-b svg { width: 18px; height: 18px; }
.vp-t { flex: none; font-size: 12px; font-variant-numeric: tabular-nums; opacity: .85; padding: 0 6px; }
.vp-seek { flex: 1; min-width: 0; accent-color: var(--gold); margin: 0 4px; }
.pin { position: absolute; transform: translate(-50%, -50%); width: 24px; height: 24px; border-radius: 50%; background: var(--gold); color: #fff; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,.4); border: 2px solid #fff; pointer-events: none; }
.pin.new { background: var(--brand); }
.pin.focus { outline: 3px solid #ffd54a; }
.upl { display: inline-flex; flex-direction: column; gap: 4px; }
.progress { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress div { height: 100%; background: var(--gold); width: 0; transition: width .2s; }

/* ----- Rhythm ----- */
.rgrid { width: 100%; border-collapse: separate; border-spacing: 2px; font-size: 12px; table-layout: fixed; }
.rgrid th { font-size: 10.5px; color: var(--muted); font-weight: 600; padding: 2px 0 4px; text-align: center; overflow: hidden; letter-spacing: .04em; }
.rgrid th.d { width: 62px; }
.rgrid td { text-align: center; height: 24px; border-radius: 6px; background: var(--card); cursor: pointer; font-weight: 600; font-size: 11.5px; }
.rgrid td.d { text-align: left; padding: 0 2px; font-weight: 500; white-space: nowrap; background: none; cursor: default; font-size: 11.5px; color: var(--muted); }
.rgrid td.off { background: transparent; color: var(--faint); font-weight: 400; }
.rgrid td.ok { background: var(--green-bg); color: var(--green); }
.rgrid td.part { background: var(--orange-bg); color: var(--orange); }
.rgrid td.miss { background: var(--red-bg); color: var(--red); }
.rgrid tr.today td.d { color: var(--gold-ink); font-weight: 650; }
.rgrid tr.wk td { border-top: 6px solid transparent; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--muted); margin: 10px 0 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }

/* ----- Round 2: info cards, dates, confirm, delete, people, platforms ----- */
.info { background: var(--soft); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
.info-top { display: flex; align-items: flex-start; gap: 8px; }
.info-top h3 { flex: 1; font-size: 17px; font-weight: 650; line-height: 1.3; margin: 0; }
.info-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.approve-box { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 0 0 14px; }
.datefield { position: relative; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 11px; min-height: 40px; padding: 0 14px; background: var(--card); cursor: pointer; font-size: 14.5px; font-weight: 500; color: var(--ink); }
.datefield svg { width: 16px; height: 16px; color: var(--gold-ink); flex: none; }
.datefield.empty span { color: var(--faint); font-weight: 400; }
.datefield input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; font-size: 16px; }
.ask-wrap { position: fixed; inset: 0; z-index: 90; background: rgba(20,19,17,.38); display: grid; place-items: center; padding: 24px; animation: fade .15s ease; }
.ask-wrap.closing { animation: fadeout .15s ease forwards; }
.ask { background: var(--card); border-radius: 16px; padding: 18px 16px 14px; width: 100%; max-width: 320px; box-shadow: 0 20px 60px rgba(0,0,0,.25); animation: pop .18s var(--ease); }
.ask-t { font-size: 15px; font-weight: 550; line-height: 1.45; }
.ask-b { display: flex; gap: 8px; margin-top: 16px; }
.ask-b .btn { flex: 1; min-height: 40px; }
@keyframes pop { from { transform: scale(.94); opacity: 0; } }
.btn.danger-solid { background: var(--red); border-color: var(--red); color: #fff; }
.sheet-foot .btn.trash { flex: 0 0 44px; padding: 0; color: var(--red); border-color: var(--red-line); background: var(--red-bg); }
.btn.trash svg { width: 18px; height: 18px; }
.sheet-foot .btn:disabled { opacity: .45; }
.person { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.pdot { width: 17px; height: 17px; border-radius: 50%; background: var(--gold-soft); color: var(--gold-ink); font-size: 9.5px; font-weight: 700; display: inline-grid; place-items: center; flex: none; }
.lrow .s .person { font-weight: 550; }
.pficon { display: inline-block; vertical-align: -2px; flex: none; }
.pfs { display: inline-flex; gap: 5px; align-items: center; color: var(--muted); }
.pfname { font-size: 11px; font-weight: 600; color: var(--muted); }
.pfpill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
.pfbox { width: 32px; height: 32px; border-radius: 9px; background: var(--soft); display: grid; place-items: center; color: var(--ink); flex: none; }
.chip.pfchip { gap: 7px; }
.fchip.view { color: var(--ink); font-weight: 550; }
.fchip.view svg { color: var(--gold-ink); }
/* Rhythm: day name and number, a gap between weeks, the month above its days */
.rgrid td.dn, .rgrid th.dn { width: 38px; text-align: left; padding: 0 2px; font-size: 11.5px; color: var(--muted); font-weight: 500; background: none; cursor: default; }
.rgrid td.dd, .rgrid th.dd { width: 24px; text-align: right; padding: 0 6px 0 0; font-size: 12px; font-weight: 600; background: none; cursor: default; color: var(--ink); }
.rgrid tr.past td.dn, .rgrid tr.past td.dd { color: var(--faint); }
.rgrid tr.today td.dn, .rgrid tr.today td.dd { color: var(--gold-ink); font-weight: 700; }
.rgrid tr.wk td { border-top: 7px solid transparent; }
.rgrid tr.month td { text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-ink); background: none; cursor: default; padding: 2px 2px 4px; height: auto; }
.rgrid tr.month.gap td { padding-top: 16px; }
.rgrid th { color: var(--ink); }
/* The platform icons stay in view while the days scroll under them. */
.rgrid thead th { position: sticky; top: calc(52px + env(safe-area-inset-top)); z-index: 3; background: var(--card); padding-top: 6px; box-shadow: 0 -4px 0 var(--card); }
@media (min-width: 900px) { .rgrid thead th { top: calc(99px + env(safe-area-inset-top)); } }
.rgrid thead th.dn, .rgrid thead th.dd { background: var(--card); }
.rgrid td.c { background: var(--soft); }
.rgrid td.c.off { background: transparent; }
.rgrid td.c.extra { background: var(--soft); color: var(--muted); font-weight: 600; }
.rgrid td.c.ok { background: var(--green-bg); color: var(--green); }
.rgrid td.c.part { background: var(--orange-bg); color: var(--orange); }
.rgrid td.c.need { background: transparent; box-shadow: inset 0 0 0 1.5px var(--red-line); color: var(--red); }
.rgrid td.c.miss { background: var(--red-bg); color: var(--red); }
.legend i { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; font-style: normal; font-size: 10px; font-weight: 700; margin-right: 4px; vertical-align: -3px; }
.legend i.ok { background: var(--green-bg); color: var(--green); }
.legend i.part { background: var(--orange-bg); color: var(--orange); }
.legend i.need { box-shadow: inset 0 0 0 1.5px var(--red-line); color: var(--red); }
.legend i.miss { background: var(--red-bg); color: var(--red); }
.legend i.extra { background: var(--soft); color: var(--muted); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* "Stay logged in" keeps the sign-in in localStorage; otherwise only for this tab. */
const memStore = {};
const remember = () => { try { return localStorage.getItem('katal.remember') !== '0'; } catch (e) { return false; } };
const authStorage = {
  getItem(k) {
    try { const v = localStorage.getItem(k); return v !== null ? v : sessionStorage.getItem(k); } catch (e) { return k in memStore ? memStore[k] : null; }
  },
  setItem(k, v) {
    try { (remember() ? localStorage : sessionStorage).setItem(k, v); } catch (e) { memStore[k] = v; }
  },
  removeItem(k) {
    try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) { /* ignore */ }
    delete memStore[k];
  }
};
const sb = window.supabase.createClient(CFG.url, CFG.key, {
  auth: { storage: authStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
});
const emailOf = (username) => String(username || '').trim().toLowerCase() + '@' + CFG.emailDomain;

/* ======================================================================
   Server calls
   ====================================================================== */
function call(action, payload) {
  const started = Date.now();
  return sb.auth.getSession().then(({ data }) => {
    const headers = { 'content-type': 'application/json', 'x-region': CFG.region };
    if (data && data.session) headers.authorization = 'Bearer ' + data.session.access_token;
    return fetch(CFG.url + '/functions/v1/api', { method: 'POST', headers, body: JSON.stringify({ action, payload: payload || {} }) })
      .catch(() => { throw new Error('Connection problem. Check your internet and try again.'); });
  }).then((r) => r.json().catch(() => { throw new Error('Unexpected reply from the server.'); }))
    .then((res) => {
      S.timing = { action, server: res.ms || 0, total: Date.now() - started };
      if (res.ok) return res.data;
      const e = new Error(res.error);
      e.code = res.code;
      throw e;
    });
}

/** Runs an action from a button: spinner, state refresh, toast. Returns the data or null. */
async function run(btn, action, payload, okMsg, opts) {
  opts = opts || {};
  if (btn) {
    if (btn.disabled) return null;
    btn.disabled = true;
    btn.classList.add('busy');
  }
  const seq = ++S.seq;
  S.pending++;
  try {
    const data = await call(action, payload);
    if (data && data.state && seq === S.seq) applyState(data.state);
    if (!opts.keepSheet) closeSheet();
    render();
    if (okMsg) toast(typeof okMsg === 'function' ? okMsg(data) : okMsg);
    return data;
  } catch (e) {
    handleErr(e);
    return null;
  } finally {
    S.pending--;
    if (btn) { btn.disabled = false; btn.classList.remove('busy'); }
  }
}

/**
 * Instant action: change the screen first, save in the background.
 * If the save fails, the real data is loaded again and the error is shown.
 */
async function instant(mutate, action, payload, okMsg, undo) {
  mutate(S.state);
  closeSheet();
  render();
  if (okMsg) toast(okMsg, false, undo);
  const seq = ++S.seq;
  S.pending++;
  try {
    const data = await call(action, payload);
    // Only the newest answer is applied, so a slow older answer can't undo a newer change.
    if (data && data.state && seq === S.seq) {
      applyState(data.state);
      if (!S.sheetOpen && !isTyping()) render();
    }
    return data;
  } catch (e) {
    handleErr(e);
    loadState(true).catch(() => {});
    return null;
  } finally {
    S.pending--;
  }
}

function applyState(st) {
  S.state = st;
  S.me = st.me;
  S.lastLoad = Date.now();
  setTimeout(refreshLive, 0);
}

/* Parts of open sheets that follow fresh data (comment lists): they redraw themselves. */
const live = new Set();
function refreshLive() { live.forEach((fn) => fn()); }
/** A part of a sheet drawn by fn(), redrawn whenever fresh data arrives (e.g. Gemini's answer). */
function liveBox(fn) {
  const box = h('div');
  let drawn = false;
  const draw = () => {
    if (drawn && !box.isConnected) { live.delete(draw); return; }
    // Someone is typing in it: redraw once they leave the box, so their text and cursor stay.
    const a = document.activeElement;
    if (drawn && a && box.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { box.dataset.stale = '1'; return; }
    drawn = true;
    box.dataset.stale = '';
    fill(box, fn());
  };
  box.addEventListener('focusout', () => setTimeout(() => { if (box.dataset.stale === '1' && !box.contains(document.activeElement)) draw(); }, 0));
  draw();
  live.add(draw);
  return box;
}

function handleErr(e) {
  if (e.code === 'AUTH') {
    sb.auth.signOut({ scope: 'local' }).catch(() => {});
    stopListening();
    S.state = null;
    closeSheet();
    S.notice = e.message;
    S.screen = 'login';
    render();
    return;
  }
  if (e.code === 'PWCHANGE') {
    closeSheet();
    S.screen = 'pwchange';
    render();
    return;
  }
  toast(e.message, true);
}

function enterApp(st) {
  applyState(st);
  if (!S.ui.tab) S.ui.tab = isStaff() ? 'today' : 'tasks';
  S.screen = 'app';
  render();
  listen();
  armBack();
}

/* Live updates: the server changes one "version" row on every save; Supabase Realtime tells us. */
function listen() {
  if (S.channel) return;
  S.channel = sb.channel('katal-version')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'Meta' }, (msg) => {
      const v = msg && msg.new && msg.new.Value;
      if (v && S.state && v !== S.state.ver && !S.pending) loadState(true).catch(() => {});
    })
    // Changes made while connecting are not sent, so check once when the connection is ready.
    .subscribe((status) => { if (status === 'SUBSCRIBED') checkForChanges(true); });
}
function stopListening() {
  if (S.channel) { sb.removeChannel(S.channel); S.channel = null; }
}

async function loadState(silent) {
  const before = S.state;
  const st = await call('state');
  if (silent && S.pending) return; // an action is saving; its answer brings fresh data
  applyState(st);
  if (!S.ui.tab) S.ui.tab = isStaff() ? 'today' : 'tasks';
  if (S.screen !== 'app') armBack();
  S.screen = 'app';
  listen();
  if (silent) announceChanges(before, st);
  if (!silent || (!S.sheetOpen && !isTyping())) render();
  else S.needsRender = true;
}

/** A short note when something new arrives for this person. */
function announceChanges(before, after) {
  if (!before || !after) return;
  const old = new Set(before.tasks.map((t) => t.key));
  const oldC = new Set((before.comments || []).map((c) => c.key));
  const newC = (after.comments || []).filter((c) => !oldC.has(c.key) && !c.mine);
  if (newC.length) { toast('💬 ' + newC[newC.length - 1].by + ' on ' + newC[newC.length - 1].id + ': ' + newC[newC.length - 1].text.slice(0, 60)); return; }
  if (!isStaff()) {
    const fresh = after.tasks.filter((t) => !old.has(t.key));
    if (fresh.length) toast('🆕 New task: ' + fresh.map(taskLabel).join(', '));
    else {
      const edits = after.tasks.filter((t) => t.review === 'Edit' && (before.tasks.find((b) => b.key === t.key) || {}).review !== 'Edit');
      const okd = after.tasks.filter((t) => t.review === 'Approved' && (before.tasks.find((b) => b.key === t.key) || {}).review !== 'Approved');
      if (edits.length) toast('✎ Changes requested on ' + edits.map(taskLabel).join(', '));
      else if (okd.length) toast('✓ Approved: ' + okd.map(taskLabel).join(', '));
    }
    return;
  }
  const wasWaiting = new Set(before.tasks.filter((t) => t.status === 'Pending Approval').map((t) => t.key));
  const nowWaiting = after.tasks.filter((t) => t.status === 'Pending Approval' && !t.cancelled && t.review !== 'Approved' && !wasWaiting.has(t.key));
  const oldIdeas = new Set(before.ideas.map((i) => i.id));
  const newIdeas = after.ideas.filter((i) => !oldIdeas.has(i.id) && !i.mine);
  if (nowWaiting.length) toast('📥 Waiting your approval: ' + nowWaiting.map((t) => taskLabel(t) + ' · ' + t.assignee).join(', '));
  else if (newIdeas.length) toast('💡 New idea from ' + newIdeas.map((i) => i.by).join(', '));
}

function isTyping() {
  if (S.uploading) return true; // don't redraw the page under an upload
  const a = document.activeElement;
  return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT'));
}

async function boot() {
  restoreUi();
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) {
      try { await loadState(); return; }
      catch (e) {
        if (e.code === 'PWCHANGE') {
          try { S.me = (await call('me')).me; } catch (e2) { /* ignore */ }
          S.screen = 'pwchange'; render(); return;
        }
        if (e.code !== 'AUTH') { showFatal(e.message); return; }
        await sb.auth.signOut({ scope: 'local' }).catch(() => {});
      }
    }
    S.status = await call('status');
    S.screen = 'login';
    render();
  } catch (e) {
    showFatal(e.message);
  }
}

function showFatal(msg) {
  fill(document.getElementById('app'),
    h('div', { class: 'auth' }, h('div', { class: 'box' },
      h('h1', null, 'Can\'t reach the app'),
      h('p', { class: 'sub' }, msg),
      h('button', { class: 'btn primary block', onclick: () => location.reload() }, 'Try again'))));
}

/*
 * Staying up to date: every 30 seconds a tiny "anything new?" check (ping).
 * Only when the data changed is the full state loaded. Every 5 minutes the
 * state is loaded anyway, so deadline colors follow the clock.
 */
async function checkForChanges(force) {
  if (S.screen !== 'app' || S.pending || S.checking || (!force && document.hidden)) return;
  S.checking = true;
  try {
    const stale = Date.now() - S.lastLoad > 300000;
    const { ver } = stale ? { ver: null } : await call('ping');
    if (stale || ver !== S.state.ver) await loadState(true);
  } catch (e) {
    if (e.code === 'AUTH') handleErr(e);
  } finally {
    S.checking = false;
  }
}
setInterval(() => checkForChanges(false), 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForChanges(false); });
/* A refresh that arrived while someone was typing is shown once they leave the field. */
document.addEventListener('focusout', () => {
  setTimeout(() => { if (S.needsRender && !isTyping() && !S.sheetOpen) { S.needsRender = false; render(); } }, 200);
});

/* ======================================================================
   DOM helpers (user text is always added as text, never as HTML)
   ====================================================================== */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const k of Object.keys(props)) {
      const v = props[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  append(el, kids);
  return el;
}
/** Replaces an element's content. Accepts nodes, text, arrays and null (skipped). */
function fill(el, ...kids) {
  el.replaceChildren();
  append(el, kids);
  return el;
}
function append(el, kids) {
  if (!Array.isArray(kids)) kids = [kids];
  kids.forEach((c) => {
    if (c === null || c === undefined || c === false || c === '') return;
    if (Array.isArray(c)) append(el, c);
    else el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  });

function pfIcon(name, size) {
  const d = PF_ICONS[name];
  if (!d) return h('span', { class: 'pfname' }, name);
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('fill', 'currentColor');
  s.setAttribute('class', 'pficon');
  s.setAttribute('width', size || 14);
  s.setAttribute('height', size || 14);
  s.setAttribute('aria-label', name);
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d);
  s.append(p);
  return s;
}

/* ======================================================================
   Labels and badges
   ====================================================================== */
function isAdmin() { return !!(S.me && S.me.role === 'Admin'); }
/** Manager: sees what the admin sees (no Scribble), comments, changes nothing. */
function isManager() { return !!(S.me && S.me.role === 'Manager'); }
function isStaff() { return isAdmin() || isManager(); }
/** Four states: not started, started, pending approval, done. */
function statusBadge(t) {
  if (t.cancelled) return h('span', { class: 'badge' }, 'Deleted');
  if (t.review === 'Approved' || t.status === 'Done') return h('span', { class: 'badge b-green' }, 'Done');
  if (t.status === 'Pending Approval') return h('span', { class: 'badge b-purple' }, 'Pending approval');
  if (t.status === 'Started' || t.review === 'Edit') return h('span', { class: 'badge b-blue' }, 'Started');
  return h('span', { class: 'badge' }, 'Not started');
}
/** The deadline as quiet text; late work is a soft red, never a block of red. */
function dueChip(t, long) {
  if (!t.deadline) return null;
  const open = isOpen(t);
  const label = long ? dayLong(t.deadline) : dayShort(t.deadline);
  return h('span', { class: 'due' + (open && t.color !== 'none' ? ' ' + t.color : '') }, label + (open && t.overdue ? ' · late' : t.late ? (long ? ' · delivered late' : ' · late') : ''));
}

function execBadge(e) {
  if (e === 'Approved') return h('span', { class: 'badge b-green' }, 'Approved');
  return h('span', { class: 'badge' }, 'Discussing');
}
function calBadge(s) {
  const cls = { Published: 'b-green', Final: 'b-blue', Cancelled: 'b-red' }[s] || '';
  return h('span', { class: 'badge ' + cls }, s === 'Published' ? '✓ Published' : s);
}

/** Social media work ends as a post; general work (print, events…) ends at Done. */
function channelField(f, onChange) {
  return field('Where', selectBox([{ value: 'Social', label: 'Social media' }, { value: 'Outside', label: 'General' }],
    f.channel || 'Social', (v) => { f.channel = v; if (onChange) onChange(v); }, { full: true }));
}

function isOpen(t) { return !t.cancelled && t.status !== 'Done' && t.review !== 'Approved'; }
function rankTask(t) {
  if (t.status === 'Pending Approval' && isAdmin()) return 0;
  if (t.review === 'Edit') return 1;
  if (t.color === 'red') return 2;
  if (t.color === 'green') return 3;
  return 4;
}
function byUrgency(a, b) {
  return rankTask(a) - rankTask(b) || (a.deadline || '9').localeCompare(b.deadline || '9') || a.id.localeCompare(b.id);
}

/* ======================================================================
   Comments: one thread per ID (idea → tasks → post)
   ====================================================================== */
function commentsOf(id) { return (S.state.comments || []).filter((c) => c.id === id).sort((a, b) => a.at.localeCompare(b.at)); }
function unreadOf(id) { return (S.state.unread || {})[id] || 0; }

/** A small gold dot when there are new comments. */
function commentBadge(id) {
  const u = unreadOf(id);
  return u ? h('span', { class: 'cdot', title: u + ' new comment' + (u === 1 ? '' : 's') }) : null;
}

/** Marks a thread as read (in the background; nobody else's screen changes). */
function markSeen(id) {
  S.seenBusy = S.seenBusy || {};
  if (!unreadOf(id) || S.seenBusy[id]) return;
  S.seenBusy[id] = true;
  delete S.state.unread[id];
  call('comment.seen', { id }).catch(() => {}).finally(() => { delete S.seenBusy[id]; });
}

function commentRow(c, pinNo) {
  const canDel = c.mine || isAdmin();
  const hasPin = c.pinX !== null && c.pinX !== undefined;
  return h('div', { class: 'cmt' },
    h('span', { class: 'avatar' }, (c.by || '?').charAt(0)),
    h('div', { class: 'body' },
      h('div', { class: 'who' }, h('b', null, c.mine ? 'You' : c.by), ' · ' + fmtDT(c.at)),
      c.time || hasPin ? h('div', null,
        c.time ? h('span', { class: 'cmt-tag' }, '▶ ' + c.time) : null,
        hasPin ? h('button', { type: 'button', class: 'cmt-tag', onclick: () => previewSheet(c.file, { id: c.id, focus: c.key }) },
          '📍 ' + (pinNo && pinNo[c.key] ? 'Pin ' + pinNo[c.key] : 'On the image')) : null) : null,
      h('div', { class: 'txt', dir: 'auto' }, c.text)),
    canDel ? h('button', { type: 'button', class: 'btn ghost tiny', style: 'color:var(--faint);align-self:flex-start', 'aria-label': 'Remove comment',
      onclick: () => ask('Remove this comment?', 'Remove', true).then((ok) => { if (ok) run(null, 'comment.delete', { key: c.key }, 'Comment removed', { keepSheet: true }); }) }, '✕') : null);
}

/** A moment in a video, from what was typed after "0:": 0:12 → 0:12, 0:75 → 1:15, 1.30 → 1:30, 12 → 0:12. */
function videoTime(v) {
  v = String(v || '').trim();
  if (!v || v === '0:' || v === ':') return '';
  const m = /^(\d{1,3})[:.,](\d{1,3})$/.exec(v);
  let s;
  if (m) s = Number(m[1]) * 60 + Number(m[2]);
  else if (/^\d{1,5}$/.test(v)) s = Number(v);
  else return v;
  const hh = Math.floor(s / 3600);
  const mm = Math.floor((s % 3600) / 60);
  const ss = String(s % 60).padStart(2, '0');
  return hh ? hh + ':' + String(mm).padStart(2, '0') + ':' + ss : mm + ':' + ss;
}

/**
 * The thread for an ID: comments + a box to write one.
 * opts.video: a small time box (seconds). opts.file + opts.pin: comments placed on that image (preview sheet).
 */
function commentsBox(id, opts) {
  opts = opts || {};
  const listEl = h('div');
  let drawn = false;
  const draw = () => {
    if (drawn && !listEl.isConnected) { live.delete(draw); return; }
    drawn = true;
    const items = commentsOf(id);
    const fid = opts.file ? driveIdOf(opts.file) : '';
    const pinNo = {};
    items.filter((c) => c.pinX !== null && c.pinX !== undefined && (!fid || driveIdOf(c.file) === fid)).forEach((c, i) => { pinNo[c.key] = i + 1; });
    fill(listEl, items.length ? items.map((c) => commentRow(c, pinNo)) : null);
    if (opts.onDraw) opts.onDraw();
    if (listEl.isConnected || !drawn) markSeen(id);
  };
  draw();
  live.add(draw);
  setTimeout(() => markSeen(id), 0);
  const d = S.cdrafts[id] || (S.cdrafts[id] = { text: '', time: '' });
  const ta = area(d, 'text', { rows: 1, placeholder: opts.pin ? 'Tap the image, then write…' : 'Write a comment…' });
  // The time box starts as "0:"; typing the seconds after it is enough (0:75 becomes 1:15).
  const timeIn = opts.video ? h('input', { class: 'in time', dir: 'ltr', inputmode: 'decimal', 'aria-label': 'Minute and second in the video', value: d.time || '0:',
    // A tap lands the cursor where the finger was (maybe before the "0:"), so it moves to the end, after "0:".
    // With a time in it already (typed, or filled by pausing the video), tapping selects it so typing replaces it.
    onfocus: (e) => { const el = e.target; setTimeout(() => (el.value === '0:' ? el.setSelectionRange(2, 2) : el.select()), 0); },
    onclick: (e) => { const el = e.target; if (el.value === '0:') el.setSelectionRange(2, 2); },
    oninput: (e) => { d.time = e.target.value; },
    onblur: (e) => { const v = videoTime(e.target.value); d.time = v; e.target.value = v || '0:'; } }) : null;

/* ======================================================================
   Files: preview (Drive), pins on images, upload to Drive

function driveIdOf(url) {
  const m = /^https:\/\/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([\w-]{10,})/.exec(url || '');
  return m ? m[1] : '';
}
/** A file link: Drive files open the preview (comments, pins); others open in a new tab. */
function fileLink(url, ctx, label) {
  if (!url) return null;
  if (!driveIdOf(url)) return /^https?:\/\//i.test(url)
    ? h('a', { class: 'fchip view', href: url, target: '_blank', rel: 'noopener noreferrer', onclick: (e) => e.stopPropagation() }, icon('eye'), label || 'View ↗') : null;
  return h('button', { type: 'button', class: 'fchip view', onclick: (e) => { e.stopPropagation(); previewSheet(url, ctx || {}); } }, icon('eye'), label || 'View');
}

/** Several files (a carousel): one button that opens them as a gallery. */
function filesLink(files, ctx, label) {

    icon('eye'), 'View ' + files.length + ' images');
}

/** Big preview of a Drive file. Images: tap to pin a comment on a spot. Videos: comment with a time. Carousels: ‹ › between images. */
function previewSheet(url, ctx) {
  const fid = driveIdOf(url);
  if (!fid) { window.open(url, '_blank', 'noopener'); return; }
  const id = ctx.id;
  const video = !!ctx.video;
  const pin = { x: null, y: null };
  const stage = h('div', { class: 'pv' }); // holds the image and its pins
  let view, fit;
  const drawPins = () => {
    stage.querySelectorAll('.pin').forEach((p) => p.remove());
    if (video || !id) return;
    commentsOf(id).filter((c) => c.pinX !== null && c.pinX !== undefined && driveIdOf(c.file) === fid).forEach((c, i) => {
      stage.append(h('div', { class: 'pin' + (ctx.focus === c.key ? ' focus' : ''), style: 'left:' + c.pinX + '%;top:' + c.pinY + '%' }, String(i + 1)));
    });
    if (pin.x !== null) stage.append(h('div', { class: 'pin new', style: 'left:' + pin.x + '%;top:' + pin.y + '%' }, '+'));
  };
  if (video) {
    // Our own player (small buttons under the video). If it can't play the file, Drive's player takes over.
    const drivePlayer = () => {
      const player = h('iframe', { src: CFG.driveWeb + '/file/d/' + fid + '/preview', allow: 'autoplay; fullscreen', allowfullscreen: true });
      const box = h('div', { class: 'pv-vid' }, player);
      view.replaceWith(box);
      view = box;
      fit = () => fitPreviewPlayer(box, player);
      fit();
      if (window.ResizeObserver) new ResizeObserver(() => { if (box.isConnected) fit(); }).observe(box);
    };
    view = videoPlayer(fid, drivePlayer, (t) => {
      // Paused at a moment: that moment goes in the comment's time box (unless a time was typed there).
      const box = body.querySelector('.cmt-compose input.time');
      if (box && (box.value === '0:' || box.value === box.dataset.auto)) {
        box.value = box.dataset.auto = fmtClock(t);
        box.dispatchEvent(new Event('input', { bubbles: true }));
      }
    });
    fit = () => {};
  } else {
    const img = h('img', {
      src: CFG.driveWeb + '/thumbnail?id=' + fid + '&sz=w2000', alt: 'Preview',
      onload: () => fit(),
      onclick: (e) => {
        if (!id) return;
        const r = img.getBoundingClientRect();
        pin.x = Math.round((e.clientX - r.left) / r.width * 1000) / 10;
        pin.y = Math.round((e.clientY - r.top) / r.height * 1000) / 10;
        drawPins();
        const ta = document.querySelector('#layer .cmt-compose textarea');
        if (ta) ta.focus();
      },
      onerror: () => fill(stage, h('div', { style: 'padding:24px;color:#fff' }, 'No preview for this file. Open it in Drive.'))
    });
    stage.append(img);
    view = h('div', { class: 'pv-frame' }, stage);
    fit = () => fitPreviewImg(view, img);
  }
  const files = ctx.files || null;
  const at = files ? ctx.index || 0 : 0;
  const go = (i) => previewSheet(files[i], Object.assign({}, ctx, { index: i, focus: null }));
  const body = h('div', null,
    files ? h('div', { class: 'row', style: 'margin-bottom:8px;justify-content:space-between' },
      h('button', { type: 'button', class: 'btn tiny', disabled: at === 0, onclick: () => go(at - 1) }, '‹'),
      h('span', { class: 'small muted' }, (at + 1) + ' / ' + files.length),
      h('button', { type: 'button', class: 'btn tiny', disabled: at === files.length - 1, onclick: () => go(at + 1) }, '›')) : null,
    view,
    h('div', { class: 'files', style: 'margin-bottom:6px' },
      h('a', { class: 'fchip', href: CFG.driveWeb + '/uc?export=download&id=' + fid, target: '_blank', rel: 'noopener noreferrer' }, 'Download'),
      h('a', { class: 'fchip', href: url, target: '_blank', rel: 'noopener noreferrer' }, 'Open in Drive ↗')),
    id ? commentsBox(id, { title: false, video, file: url, pin: video ? null : pin, onDraw: drawPins }) : null);
  openSheet((id ? id + ' · ' : '') + (video ? 'Video' : 'File'), body);
  drawPins();
  fit();
  // Turning the phone or resizing the window fits it again (only the width matters, so the keyboard doesn't).
  if (window.ResizeObserver) {
    let lastW = view.clientWidth;
    new ResizeObserver(() => { if (view.isConnected && view.clientWidth !== lastW) { lastW = view.clientWidth; fit(); } }).observe(view);
  }
}
/* ----- The app's own video player. Drive's player puts big buttons over the video; this one has a slim bar under it. ----- */
const VIDEO_MAX_LOAD = 150 * 1024 * 1024; // bigger files play in Drive's player
const videoUrls = new Map(); // file id → loaded video (this session; the last two are kept)
function fmtClock(sec) {
  const s = Math.max(0, Math.floor(sec || 0));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
/**
 * The video, then play/pause, time, a seek bar, sound and full screen under it. In the installed app the
 * service worker streams the file from Drive in pieces; elsewhere it is loaded first (with a progress note).
 * Anything that goes wrong (a link the app didn't upload, a format the phone can't play) calls fallback().
 */
function videoPlayer(fid, fallback, onPause) {
  const vid = h('video', { playsinline: true, preload: 'metadata' });
  const note = h('div', { class: 'vp-note' }, 'Loading…');
  const btn = (name, label, onclick) => h('button', { type: 'button', class: 'vp-b', 'aria-label': label, onclick }, icon(name));
  const playBtn = btn('play', 'Play', () => (vid.paused ? vid.play().catch(() => {}) : vid.pause()));
  const muteBtn = btn('volume', 'Sound', () => { vid.muted = !vid.muted; });
  const fullBtn = btn('expand', 'Full screen', () => {
    if (vid.requestFullscreen) vid.requestFullscreen().catch(() => {});
    else if (vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();
  });
  const time = h('span', { class: 'vp-t' }, '0:00 / 0:00');
  const seek = h('input', { type: 'range', class: 'vp-seek', min: '0', max: '1000', value: '0', 'aria-label': 'Position' });
  const wrap = h('div', { class: 'vp' }, h('div', { class: 'vp-stage' }, vid, note), h('div', { class: 'vp-bar' }, playBtn, time, seek, muteBtn, fullBtn));
  let dragging = false;
  let failed = false;
  const fail = () => { if (!failed && wrap.isConnected) { failed = true; fallback(); } };
  const show = (text) => { note.textContent = text; note.style.display = text ? '' : 'none'; };
  const swap = (b, name) => fill(b, icon(name));
  const tick = () => {
    time.textContent = fmtClock(vid.currentTime) + ' / ' + fmtClock(vid.duration);
    if (!dragging && vid.duration) seek.value = String(Math.round(vid.currentTime / vid.duration * 1000));
  };
  vid.addEventListener('click', () => playBtn.click());
  vid.addEventListener('play', () => { swap(playBtn, 'pause'); playBtn.setAttribute('aria-label', 'Pause'); });
  vid.addEventListener('pause', () => {
    swap(playBtn, 'play'); playBtn.setAttribute('aria-label', 'Play');
    if (!vid.ended && vid.currentTime > 0 && onPause) onPause(vid.currentTime);
  });
  vid.addEventListener('volumechange', () => swap(muteBtn, vid.muted ? 'mute' : 'volume'));
  vid.addEventListener('timeupdate', tick);
  vid.addEventListener('loadedmetadata', () => {
    tick();
    show('');
    // As tall as the video needs, never taller than the screen allows.
    // (The bar under it takes 40px of the preview's height.)
    if (vid.videoWidth && vid.videoHeight) vid.style.height = Math.round(Math.min(pvMaxH() - 40, wrap.clientWidth * vid.videoHeight / vid.videoWidth)) + 'px';
  });
  vid.addEventListener('waiting', () => show('Loading…'));
  vid.addEventListener('playing', () => show(''));
  vid.addEventListener('error', fail);
  seek.addEventListener('input', () => { dragging = true; if (vid.duration) { vid.currentTime = seek.value / 1000 * vid.duration; tick(); } });
  seek.addEventListener('change', () => { dragging = false; });
  (async () => {
    try {
      if (videoUrls.has(fid)) { vid.src = videoUrls.get(fid); return; }
      const tok = (await mediaToken()).token;
      const meta = await gapi('/drive/v3/files/' + encodeURIComponent(fid) + '?fields=size,mimeType', {}, tok);
      const size = Number(meta.size) || 0;
      if (!/^video\//.test(meta.mimeType || '') || !size) throw new Error('Not a video');
      if (!wrap.isConnected) return;
      if (window.KATAL_PWA && navigator.serviceWorker && navigator.serviceWorker.controller) {
        // The service worker answers this address itself (it never reaches a server).
        vid.src = 'drive-video/' + encodeURIComponent(fid) + '?k=' + encodeURIComponent(tok) + '&n=' + size;
        return;
      }
      if (size > VIDEO_MAX_LOAD) throw new Error('Too big to load');
      const r = await fetch(CFG.driveApi + '/drive/v3/files/' + encodeURIComponent(fid) + '?alt=media', { headers: { authorization: 'Bearer ' + tok } });
      if (!r.ok || !r.body) throw new Error('Drive answered ' + r.status);
      const reader = r.body.getReader();
      const parts = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        if (!wrap.isConnected) { reader.cancel().catch(() => {}); return; }
        parts.push(value);
        got += value.length;
        show('Loading the video · ' + Math.min(99, Math.floor(got / size * 100)) + '%');
      }
      const url = URL.createObjectURL(new Blob(parts, { type: meta.mimeType }));
      videoUrls.set(fid, url);
      while (videoUrls.size > 2) { const [old, u] = videoUrls.entries().next().value; URL.revokeObjectURL(u); videoUrls.delete(old); }
      if (wrap.isConnected) vid.src = url;
    } catch (e) {
      fail();
    }
  })();
  return wrap;
}
/** Tallest the preview may be: the comment box stays on screen under it. Same as --pv-h in the CSS. */
function pvMaxH() {
  const vh = document.documentElement.clientHeight || window.innerHeight;
  return Math.max(220, Math.min(vh * 0.62, vh - 300));
}
/** The whole image on screen: as big as fits in the width and pvMaxH(), never bigger than the file. */
function fitPreviewImg(view, img) {
  const nw = img.naturalWidth, nh = img.naturalHeight, w = view.clientWidth;
  if (!nw || !nh || !w) return;
  const s = Math.min(1, w / nw, pvMaxH() / nh);
  img.style.width = Math.floor(nw * s) + 'px';
  img.style.height = Math.floor(nh * s) + 'px';
}
/**
 * Drive's video player cuts its own buttons off when it's narrower than about 430px (most phones).
 * On a narrow screen it gets a wider page and is scaled down to fit, so every button shows.
 */
const PV_PLAYER_W = 480;
function fitPreviewPlayer(view, player) {
  const w = view.clientWidth, ht = view.clientHeight;
  if (!w || !ht) return;
  const s = Math.min(1, w / PV_PLAYER_W);
  player.style.width = s < 1 ? (w / s).toFixed(1) + 'px' : '';
  player.style.height = s < 1 ? (ht / s).toFixed(1) + 'px' : '';
  player.style.transform = s < 1 ? 'scale(' + s.toFixed(4) + ')' : '';
}

/* ----- Upload straight to Google Drive (folder per ID). The server hands out a short-lived token. ----- */
let mediaTok = null;
async function mediaToken() {
  if (mediaTok && mediaTok.exp > Date.now()) return mediaTok;
  const d = await call('media.token');
  mediaTok = { token: d.token, folderId: d.folderId, exp: Date.now() + 30 * 60 * 1000 };
  return mediaTok;
}
async function gapi(path, opts, tok) {
  const r = await fetch(CFG.driveApi + path, Object.assign({}, opts, { headers: Object.assign({ authorization: 'Bearer ' + tok }, (opts && opts.headers) || {}) }));
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error('Drive: ' + ((d.error && d.error.message) || r.status));
  return d;
}
const folderIds = {};
async function driveFolder(tok, root, name) {
  if (folderIds[name]) return folderIds[name];
  const q = "name='" + name.replace(/'/g, "\\'") + "' and '" + root + "' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false";
  const found = await gapi('/drive/v3/files?pageSize=1&fields=files(id)&q=' + encodeURIComponent(q), {}, tok);
  if (found.files && found.files.length) return (folderIds[name] = found.files[0].id);
  const made = await gapi('/drive/v3/files?fields=id', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ name, mimeType: 'application/vnd.google-apps.folder', parents: [root] }) }, tok);
  return (folderIds[name] = made.id);
}
/** Uploads a file (any size, with progress) into the ID's folder; anyone with the link can view it. Returns its link. */
async function driveUpload(file, ctx, onProgress) {
  const { token, folderId } = await mediaToken();
  const parent = ctx.id ? await driveFolder(token, folderId, ctx.id) : folderId;
  const name = [ctx.id, ctx.label, file.name].filter(Boolean).join(' · ');
  const init = await fetch(CFG.driveApi + '/upload/drive/v3/files?uploadType=resumable&fields=id', {
    method: 'POST',
    headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json; charset=UTF-8', 'x-upload-content-type': file.type || 'application/octet-stream' },
    body: JSON.stringify({ name, parents: [parent] })
  });
  // The session address is in "Location"; if the browser can't read it, it's rebuilt from the exposed upload id.
  const uid = init.headers.get('x-guploader-uploadid');
  const loc = init.headers.get('location') || (uid ? CFG.driveApi + '/upload/drive/v3/files?uploadType=resumable&upload_id=' + encodeURIComponent(uid) : '');
  if (!init.ok || !loc) throw new Error('Drive did not accept the upload (' + init.status + ').');
  const done = await new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('PUT', loc);
    x.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => (x.status === 200 || x.status === 201) ? resolve(JSON.parse(x.responseText)) : reject(new Error('Upload failed (' + x.status + ').'));
    x.onerror = () => reject(new Error('The upload stopped. Check your internet and try again.'));
    x.send(file);
  });
  await gapi('/drive/v3/files/' + done.id + '/permissions', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ role: 'reader', type: 'anyone' }) }, token);
  return 'https://drive.google.com/file/d/' + done.id + '/view';
}
/**
 * Upload button. ctx: { id, label, multi, text }. onDone gets the Drive link, or with multi
 * the list of links (a carousel: files in name order, so "slide 1, slide 2…" stay in order).
 */
function uploadButton(ctx, onDone) {
  if (!S.state.media) return null;
  const pick = h('input', { type: 'file', accept: ctx.accept || 'image/*,video/*,application/pdf', multiple: !!ctx.multi, style: 'display:none' });
  const label = ctx.text || 'Upload';
  const btn = h('button', { type: 'button', class: 'fchip add' }, icon('upload'), label);
  const bar = h('div', { class: 'progress hidden' }, h('div'));
  btn.onclick = (e) => { e.stopPropagation(); pick.click(); };
  pick.onchange = async () => {
    const files = Array.from(pick.files || []).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    if (!files.length) return;
    if (files.length > 20) { toast('Up to 20 files at once.', true); pick.value = ''; return; }
    btn.disabled = true;
    bar.classList.remove('hidden');
    S.uploading++;
    try {
      const links = [];
      for (let i = 0; i < files.length; i++) {
        links.push(await driveUpload(files[i], ctx, (p) => {
          const pct = Math.round((i + p) / files.length * 100);
          bar.firstChild.style.width = pct + '%';
          fill(btn, (files.length > 1 ? (i + 1) + '/' + files.length + ' · ' : '') + pct + '%');
        }));
      }
      onDone(ctx.multi ? links : links[0]);
    } catch (err) {
      toast(err.message, true);
    } finally {
      S.uploading--;
      btn.disabled = false;
      fill(btn, icon('upload'), label);
      bar.classList.add('hidden');
      pick.value = '';
      if (!S.uploading && S.needsRender && !S.sheetOpen) { S.needsRender = false; render(); }
    }
  };
  return h('div', { class: 'upl' }, btn, pick, bar);
}

/** ✓/✗ Spelling and ✓/✗ License (when license numbers are set). */

    r.licenses === null || r.licenses === undefined ? null

}
/** On a row: nothing while fine; a quiet mark when the check found something. */
function checkBadge(t) {
  if (t.checkStatus !== 'Done' || !t.checkResult || !t.checkResult.files) return null;
  const r = t.checkResult;
  return r.spelling && r.licenses !== false ? null : h('span', { class: 'badge b-orange' }, '✗ Check');
}
function checkNote(t) {
  if (!t.checkStatus) return null;
  const again = isAdmin() ? h('button', { type: 'button', class: 'btn tiny', style: 'margin-top:8px',
    onclick: (e) => run(e.currentTarget, 'agent.ask', { entity: 'task', key: t.key }, 'Checking again', { keepSheet: true }) }, 'Check again') : null;
  if (t.checkStatus === 'Waiting') return h('div', { class: 'note' }, h('span', { class: 'muted' }, 'Checking the design…'));
  const r = t.checkResult || {};
  if (t.checkStatus === 'Error' || !r.files) {
    const why = r.files && r.files[0] && r.files[0].error;
    return h('div', { class: 'note orange' }, h('div', { class: 't' }, 'Couldn\'t check it'), why ? h('div', { class: 'small' }, why) : null, again);
  }
  const many = r.files.length > 1;
  const lines = r.files.map((f, i) => {
    const parts = [];
    if (f.error) parts.push(h('div', null, 'Couldn\'t check: ' + f.error));
    else {
      if (!f.spelling.ok) parts.push(h('div', { dir: 'auto' }, '✗ Spelling: ' + f.spelling.mistakes.join(' · ')));
      if (f.licenses && !f.licenses.ok) parts.push(h('div', { dir: 'auto' }, '✗ Not on it: ' + (f.licenses.missing.join(', ') || 'a license number')));

    if (!parts.length) return many ? h('div', { class: 'small' }, 'Image ' + (i + 1) + ': ✓') : null;
    return h('div', { class: 'small', style: 'margin-top:4px' }, many ? h('b', null, 'Image ' + (i + 1)) : null, parts);
  });
  const fine = r.spelling && r.licenses !== false;
  return h('div', { class: 'note ' + (fine ? 'green' : 'orange') }, h('div', { class: 't row' }, 'Design check', checkMarks(r)), lines, again);
}

/* ======================================================================
   Render
   ====================================================================== */
function render() {
  const app = document.getElementById('app');
  const screens = { login: loginScreen, recover: recoverScreen, pwchange: pwChangeScreen, app: appShell };
  const fn = screens[S.screen];
  if (!fn) return;
  const y = window.scrollY;
  app.replaceChildren(fn());
  if (S.screen === 'app') {
    if (S.enter) { const m = app.querySelector('.main'); if (m) m.classList.add('enter'); S.enter = false; }
    if (S.restoreY !== undefined) { const ry = S.restoreY; S.restoreY = undefined; requestAnimationFrame(() => window.scrollTo(0, ry)); }
    else window.scrollTo(0, y);
    saveUi();
  }
}

/* ----- The back button and keeping your place after a refresh ----- */
const UI_KEY = 'katal.ui';
function saveUi() {
  try {
    const ui = Object.assign({}, S.ui, { log: null });
    sessionStorage.setItem(UI_KEY, JSON.stringify({ ui, y: window.scrollY }));
  } catch (e) { /* private mode */ }
}
function restoreUi() {
  try {
    const d = JSON.parse(sessionStorage.getItem(UI_KEY) || 'null');
    if (d && d.ui) { Object.assign(S.ui, d.ui, { log: null, expanded: {} }); S.restoreY = d.y || 0; }
  } catch (e) { /* ignore */ }
}
window.addEventListener('pagehide', saveUi);
document.addEventListener('visibilitychange', () => { if (document.hidden && S.screen === 'app') saveUi(); });

/* Back closes what's open, then goes to the first tab; on the first tab it asks before leaving. */
function armBack() {
  try { if (!history.state || !history.state.katal) history.pushState({ katal: true }, ''); } catch (e) { /* not allowed here */ }
}
window.addEventListener('popstate', () => {
  if (S.screen !== 'app') return;
  if (S.sheetOpen) { closeSheet(true); armBack(); return; }
  const home = isStaff() ? 'today' : 'tasks';
  if (S.ui.tab !== home) { goTab(home); return; }
  if (Date.now() - (S.backAt || 0) < 2500) { try { history.back(); } catch (e) { /* ignore */ } return; }
  S.backAt = Date.now();
  toast('Press back again to close');
});
/** Opens a tab (with optional filters) from the tab bar or a shortcut. */
function goTab(tab, set) {
  S.ui.tab = tab;

  S.enter = true;
  render();

/** Checks the current password, then sets the new one (Supabase Auth). */
async function changeOwnPassword(current, next) {
  if (!next || next.length < 8) throw new Error('Password must be at least 8 characters.');
  if (next === current) throw new Error('Pick a password different from the current one.');
  const username = S.me && S.me.username;
  if (!username) throw new Error('Please log in again.');
  const check = await sb.auth.signInWithPassword({ email: emailOf(username), password: current });
  if (check.error) throw new Error('Your current password is not correct.');
  const { error } = await sb.auth.updateUser({ password: next });
  if (error) throw new Error(error.message);
}

async function logout() {
  stopListening();

  S.state = null; S.me = null; S.ui.tab = ''; S.drafts = {};
  closeSheet();

  if (!S.status) { try { S.status = await call('status'); } catch (e) { /* ignore */ } }
  render();
}
