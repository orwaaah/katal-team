<style>
/* ===== Brand: swap these for KATAL's colors and font ===== */
:root {
  --brand: #1d3557;          /* primary (header, main buttons) */
  --brand-ink: #ffffff;      /* text on primary */
  --accent: #b08d57;         /* accent (logo, highlights) */
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* ========================================================= */
  --bg: #f3f4f6;
  --card: #ffffff;
  --ink: #1b1f24;
  --muted: #6b7280;
  --line: #e4e6ea;
  --soft: #f6f7f9;
  --red: #c93a3a;   --red-bg: #fdecec;
  --green: #18864b; --green-bg: #e6f5ec;
  --orange: #c26200; --orange-bg: #fff1e0;
  --blue: #2a64c9;  --blue-bg: #e9f0fc;
  --purple: #6b4bc4; --purple-bg: #f0ebfb;
  --gray-bg: #eef0f3;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --nav-h: 64px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body.noscroll { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--blue); }
h1, h2, h3 { margin: 0; line-height: 1.25; }
.pre { white-space: pre-wrap; word-break: break-word; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.hidden { display: none !important; }

/* ----- Layout ----- */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; gap: 10px; padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); padding-top: max(10px, env(safe-area-inset-top)); }
.logo { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; letter-spacing: .5px; flex: none; }
.topbar .name { font-weight: 700; font-size: 17px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-btn { background: rgba(255,255,255,.14); border: 0; color: inherit; border-radius: 999px; padding: 6px 12px 6px 6px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: #fff; color: var(--brand); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.main { max-width: 980px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right)) calc(var(--nav-h) + 28px) max(16px, env(safe-area-inset-left)); }
.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: #fff; border-top: 1px solid var(--line); display: flex; justify-content: center; padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.tabs button { flex: 1; min-width: 0; max-width: 140px; height: var(--nav-h); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; color: var(--muted); cursor: pointer; position: relative; padding: 0 2px; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button.on { color: var(--brand); font-weight: 700; }
.tabs .dot { position: absolute; top: 8px; left: calc(50% + 6px); background: var(--red); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center; }
@media (max-width: 360px) { .tabs button { font-size: 10px; letter-spacing: -.1px; } }
@media (min-width: 900px) {
  /* Right under the top bar, which is 58px plus the status bar when installed on an iPad. */
  .tabs { position: sticky; top: calc(48px + max(10px, env(safe-area-inset-top))); bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); }
  .tabs button { flex-direction: row; height: 48px; font-size: 15px; gap: 8px; max-width: 170px; }
  .tabs button svg { width: 20px; height: 20px; }
  .tabs .dot { position: static; }
  .main { padding-bottom: 40px; }
}
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 14px; flex-wrap: wrap; }
.page-head h1 { font-size: 24px; }
.section { margin: 22px 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.section h2 { font-size: 17px; }
.stack > * + * { margin-top: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.empty { text-align: center; color: var(--muted); padding: 34px 16px; background: var(--card); border-radius: var(--radius); border: 1px dashed var(--line); }

/* ----- Buttons ----- */
.btn { border: 0; border-radius: 12px; padding: 0 16px; min-height: 46px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--gray-bg); color: var(--ink); position: relative; text-decoration: none; }
.btn.primary { background: var(--brand); color: var(--brand-ink); }
.btn.good { background: var(--green); color: #fff; }
.btn.warn { background: var(--orange); color: #fff; }
.btn.danger { background: var(--red-bg); color: var(--red); }
.btn.ghost { background: transparent; color: var(--blue); padding: 0 8px; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.busy { color: transparent !important; }
.btn.busy::after { content: ""; position: absolute; width: 18px; height: 18px; border: 2.5px solid rgba(0,0,0,.25); border-top-color: var(--brand); border-radius: 50%; animation: spin .7s linear infinite; }
.btn.primary.busy::after, .btn.good.busy::after, .btn.warn.busy::after { border-color: rgba(255,255,255,.35); border-top-color: #fff; }
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn { border: 0; background: var(--gray-bg); width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 16px; flex: none; }

/* ----- Chips ----- */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 0 14px; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; font-size: 15px; position: relative; }
.chip.on { border-color: var(--brand); background: var(--brand); color: var(--brand-ink); font-weight: 600; }
.chip .n { font-size: 12px; background: rgba(0,0,0,.08); border-radius: 999px; padding: 1px 7px; }
.chip.on .n { background: rgba(255,255,255,.25); }
.chip.date input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

/* ----- Cards ----- */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; position: relative; overflow: hidden; }
.card.tap { cursor: pointer; }
.card.tap:active { transform: scale(.995); }
.card.c-red { box-shadow: inset 5px 0 0 var(--red), var(--shadow); }
.card.c-green { box-shadow: inset 5px 0 0 var(--green), var(--shadow); }
.card.approved { background: var(--green-bg); }
.card .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.card h3 { font-size: 17px; margin: 2px 0 6px; }
.idtag { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace; font-weight: 700; font-size: 13px; background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 3px 10px; background: var(--gray-bg); color: var(--muted); white-space: nowrap; }
.b-blue { background: var(--blue-bg); color: var(--blue); }
.b-green { background: var(--green-bg); color: var(--green); }
.b-red { background: var(--red-bg); color: var(--red); }
.b-orange { background: var(--orange-bg); color: var(--orange); }
.b-purple { background: var(--purple-bg); color: var(--purple); }
.due { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; border-radius: 8px; padding: 4px 10px; background: var(--soft); }
.due.red { background: var(--red-bg); color: var(--red); }
.due.green { background: var(--green-bg); color: var(--green); }
.note { border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
.note.orange { background: var(--orange-bg); border: 1px solid #f7c98f; }
.note.green { background: #d4efdf; }
.note .t { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
.brief { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 15px; }
.brief.clamp { max-height: 7.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.kv { font-size: 14px; color: var(--muted); }
.kv b { color: var(--ink); font-weight: 600; }
.related { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 8px 0; font-size: 14px; }
.related .r { display: flex; gap: 8px; align-items: center; padding: 4px 0; flex-wrap: wrap; }
.statusbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 4px; }
.statusbar .btn { min-height: 52px; border: 2px solid transparent; }
.statusbar .btn.cur { border-color: var(--brand); background: var(--blue-bg); color: var(--brand); }
.divider { height: 1px; background: var(--line); margin: 12px 0; }
.card.trow { padding: 0; }
.trow-head { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 11px 14px; cursor: pointer; font: inherit; color: inherit; }
.trow-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
.trow-line + .trow-line { margin-top: 6px; flex-wrap: wrap; }
.trow-title { flex: 1; min-width: 0; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow.open .trow-title { white-space: normal; }
.chev { font-size: 22px; line-height: 1; color: var(--muted); transition: transform .15s; flex: none; }
.trow.open .chev { transform: rotate(90deg); }
.trow-body { padding: 0 14px 14px; }
.due.sm { font-size: 13px; padding: 2px 8px; }
.list-row { display: flex; gap: 10px; align-items: flex-start; }
.list-row .main-col { flex: 1; min-width: 0; }
.list-row .t { font-weight: 600; }
.actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

/* ----- Forms ----- */
.field { display: block; margin: 0 0 14px; }
.field .lbl { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.field .hint { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }
.in { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; background: #fff; min-height: 46px; outline: none; }
.in:focus { border-color: var(--brand); }
textarea.in { resize: vertical; min-height: 80px; }
.in.private { background: #fffbea; border-color: #f1df9c; }
.check { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 0; }
.check input { width: 22px; height: 22px; accent-color: var(--brand); }

/* ----- Dashboard ----- */
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 700px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
.kpi { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; cursor: pointer; border: 0; text-align: left; }
.kpi .v { font-size: 28px; font-weight: 800; line-height: 1.1; }
.kpi .l { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
.kpi.red .v { color: var(--red); }
.kpi.purple .v { color: var(--purple); }
.kpi.orange .v { color: var(--orange); }
.kpi.zero .v { color: #b8bcc4; }
.people { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 700px) { .people { grid-template-columns: 1fr 1fr; } }

/* ----- Calendar ----- */
.day-head { font-weight: 700; margin: 18px 0 8px; display: flex; gap: 8px; align-items: baseline; }
.week { display: grid; grid-template-columns: 1fr; gap: 8px; }
@media (min-width: 900px) { .week { grid-template-columns: repeat(7, 1fr); } }
.wday { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 10px; min-height: 64px; }
.wday.today { outline: 2px solid var(--accent); }
.wday .d { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
.wentry { font-size: 13px; border-radius: 8px; padding: 6px 8px; margin-top: 6px; background: var(--soft); cursor: pointer; }
.missed { background: var(--red-bg); border: 1px solid #f3b4b4; border-radius: var(--radius); padding: 12px; margin-bottom: 16px; }
.missed-head { font-weight: 800; display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.post-links { font-size: 14px; margin: 8px 0 4px; display: grid; gap: 4px; }
.pf { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 5px; padding: 1px 6px; background: var(--gray-bg); margin: 2px 4px 0 0; }

/* ----- Sheet (dialog) ----- */
#layer .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.45); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease; }
.sheet { background: #fff; width: 100%; max-width: 640px; max-height: 92vh; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; animation: up .2s ease; }
@media (min-width: 700px) { #layer .overlay { align-items: center; } .sheet { border-radius: 18px; max-height: 88vh; } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { flex: 1; font-size: 18px; }
.sheet-body { padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
.sheet-foot .btn { flex: 1; }
@keyframes up { from { transform: translateY(30px); opacity: .5; } }
@keyframes fade { from { opacity: 0; } }

/* ----- Toast ----- */
#toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 80; background: #111827; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 15px; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.2); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
#toast.err { background: var(--red); }

/* ----- Auth screens ----- */
.auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: linear-gradient(160deg, var(--brand), #0f1d33); }
.auth .box { background: #fff; border-radius: 20px; padding: 26px 20px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.auth .logo { width: 52px; height: 52px; font-size: 20px; border-radius: 14px; margin: 0 auto 12px; }
.auth h1 { text-align: center; font-size: 22px; margin-bottom: 4px; }
.auth .sub { text-align: center; color: var(--muted); margin-bottom: 20px; font-size: 15px; }
.pw-wrap { position: relative; }
.pw-wrap .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 600; padding: 8px; cursor: pointer; }
.loading { min-height: 100vh; display: grid; place-items: center; }
.spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .7s linear infinite; }
.copybox { background: var(--soft); border: 1px dashed var(--line); border-radius: 12px; padding: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; white-space: pre-wrap; word-break: break-all; margin: 8px 0; }
.log-row { font-size: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.log-row:last-child { border-bottom: 0; }
.sub-tabs { display: flex; gap: 8px; margin-bottom: 14px; }

/* ----- Comments ----- */
.cmt { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cmt:last-child { border-bottom: 0; }
.cmt .avatar { background: var(--brand); color: #fff; flex: none; }
.cmt .body { flex: 1; min-width: 0; }
.cmt .who { font-size: 13px; color: var(--muted); }
.cmt .who b { color: var(--ink); }
.cmt .txt { white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
.cmt-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px; background: var(--blue-bg); color: var(--blue); margin: 3px 6px 0 0; border: 0; font-family: inherit; }
button.cmt-tag { cursor: pointer; }
.cmt-compose { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
.cmt-compose textarea.in { min-height: 46px; }
.cbadge { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.cbadge.new { color: #fff; background: var(--red); border-radius: 999px; padding: 1px 8px; }

/* ----- File preview, pins, uploads ----- */
.pv { position: relative; border-radius: 12px; overflow: hidden; background: #111; margin-bottom: 8px; }
.pv img { display: block; width: 100%; height: auto; cursor: crosshair; }
.pv iframe { display: block; width: 100%; height: 62vh; border: 0; }
.pin { position: absolute; transform: translate(-50%, -50%); width: 26px; height: 26px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; box-shadow: 0 2px 6px rgba(0,0,0,.4); border: 2px solid #fff; pointer-events: none; }
.pin.new { background: var(--accent); }
.pin.focus { outline: 3px solid #ffd54a; }
.upl { display: inline-flex; flex-direction: column; gap: 4px; }
.progress { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress div { height: 100%; background: var(--brand); width: 0; transition: width .2s; }

/* ----- Rhythm ----- */
.rgrid { width: 100%; border-collapse: separate; border-spacing: 3px; font-size: 13px; table-layout: fixed; }
.rgrid th { font-size: 11.5px; color: var(--muted); font-weight: 700; padding: 2px 0; text-align: center; overflow: hidden; }
.rgrid th.d { width: 76px; }
.rgrid td { text-align: center; height: 34px; border-radius: 8px; background: var(--card); cursor: pointer; font-weight: 700; }
.rgrid td.d { text-align: left; padding: 0 4px; font-weight: 600; white-space: nowrap; background: none; cursor: default; font-size: 12.5px; }
.rgrid td.off { background: var(--gray-bg); color: #b8bcc4; font-weight: 500; }
.rgrid td.ok { background: var(--green-bg); color: var(--green); }
.rgrid td.part { background: var(--orange-bg); color: var(--orange); }
.rgrid td.miss { background: var(--red-bg); color: var(--red); }
.rgrid tr.today td.d { color: var(--accent); }
.rgrid tr.past td:not(.d) { opacity: .7; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12.5px; color: var(--muted); margin: 10px 0; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 4px; }
</style>
</head>

<script>
'use strict';

/* ======================================================================
   State
   ====================================================================== */
const S = {
  screen: 'loading', state: null, status: null, me: null,
  drafts: {}, cdrafts: {}, sheetOpen: false, lastLoad: 0, notice: '', seq: 0, pending: 0, timing: null, uploading: 0,
  ui: {
    tab: '', memberTab: 'active', ideaScope: 'all', taskFilter: 'active', person: '', q: '',
    ideaFilter: 'Later', ideaSource: 'Idea', ideaType: '', ideaQ: '', calMode: 'list', weekStart: '', showPast: false,
    more: 'team', expanded: {}, open: {}, log: null, calView: 'upcoming', calFilter: { platform: '', type: '' }
  }
};

/*
 * Supabase: sign-in (Supabase Auth) and the "api" edge function. The key below is the
 * public "anon" key; it only allows sign-in. All data goes through the edge function,
 * which checks the person and their role on every call.
 */

/* "Stay logged in" keeps the sign-in in localStorage; otherwise only for this tab. */
const memStore = {};
const remember = () => { try { return localStorage.getItem('katal.remember') !== '0'; } catch (e) { return false; } };
const authStorage = {
  getItem(k) {
    try { const v = localStorage.getItem(k); return v !== null ? v : sessionStorage.getItem(k); } catch (e) { return k in memStore ? memStore[k] : null; }
  },
  setItem(k, v) {
    try { (remember() ? localStorage : sessionStorage).setItem(k, v); } catch (e) { memStore[k] = v; }
  },
  removeItem(k) {
    try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) { /* ignore */ }
    delete memStore[k];
  }
};

/* ======================================================================
   Server calls
   ====================================================================== */
function call(action, payload) {
  const started = Date.now();
  return sb.auth.getSession().then(({ data }) => {
    const headers = { 'content-type': 'application/json', 'x-region': CFG.region };
    if (data && data.session) headers.authorization = 'Bearer ' + data.session.access_token;
    return fetch(CFG.url + '/functions/v1/api', { method: 'POST', headers, body: JSON.stringify({ action, payload: payload || {} }) })
      .catch(() => { throw new Error('Connection problem. Check your internet and try again.'); });
  }).then((r) => r.json().catch(() => { throw new Error('Unexpected reply from the server.'); }))
    .then((res) => {
      S.timing = { action, server: res.ms || 0, total: Date.now() - started };
      if (res.ok) return res.data;
      const e = new Error(res.error);
      e.code = res.code;
      throw e;
    });
}

/** Runs an action from a button: spinner, state refresh, toast. Returns the data or null. */
async function run(btn, action, payload, okMsg, opts) {
  opts = opts || {};
  if (btn) {
    if (btn.disabled) return null;
    btn.disabled = true;
    btn.classList.add('busy');
  }
  const seq = ++S.seq;
  S.pending++;
  try {
    const data = await call(action, payload);
    if (data && data.state && seq === S.seq) applyState(data.state);
    if (!opts.keepSheet) closeSheet();
    render();
    if (okMsg) toast(typeof okMsg === 'function' ? okMsg(data) : okMsg);
    return data;
  } catch (e) {
    handleErr(e);
    return null;
  } finally {
    S.pending--;
    if (btn) { btn.disabled = false; btn.classList.remove('busy'); }
  }
}

/**
 * Instant action: change the screen first, save in the background.
 * If the save fails, the real data is loaded again and the error is shown.
 */
async function instant(mutate, action, payload, okMsg) {
  mutate(S.state);
  closeSheet();
  render();
  if (okMsg) toast(okMsg);
  const seq = ++S.seq;
  S.pending++;
  try {
    const data = await call(action, payload);
    // Only the newest answer is applied, so a slow older answer can't undo a newer change.
    if (data && data.state && seq === S.seq) {
      applyState(data.state);
      if (!S.sheetOpen && !isTyping()) render();
    }
    return data;
  } catch (e) {
    handleErr(e);
    loadState(true).catch(() => {});
    return null;
  } finally {
    S.pending--;
  }
}

function applyState(st) {
  S.state = st;
  S.me = st.me;
  S.lastLoad = Date.now();
  setTimeout(refreshLive, 0);
}

/* Parts of open sheets that follow fresh data (comment lists): they redraw themselves. */
const live = new Set();
function refreshLive() { live.forEach((fn) => fn()); }
/** A part of a sheet drawn by fn(), redrawn whenever fresh data arrives (e.g. Gemini's answer). */
function liveBox(fn) {
  const box = h('div');
  let drawn = false;
  const draw = () => {
    if (drawn && !box.isConnected) { live.delete(draw); return; }
    drawn = true;
    fill(box, fn());
  };
  draw();
  live.add(draw);
  return box;
}

function handleErr(e) {
  if (e.code === 'AUTH') {
    sb.auth.signOut({ scope: 'local' }).catch(() => {});
    stopListening();
    S.state = null;
    closeSheet();
    S.notice = e.message;
    S.screen = 'login';
    render();
    return;
  }
  if (e.code === 'PWCHANGE') {
    closeSheet();
    S.screen = 'pwchange';
    render();
    return;
  }
  toast(e.message, true);
}

/* Live updates: the server changes one "version" row on every save; Supabase Realtime tells us. */
function listen() {
  if (S.channel) return;
  S.channel = sb.channel('katal-version')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'Meta' }, (msg) => {
      const v = msg && msg.new && msg.new.Value;
      if (v && S.state && v !== S.state.ver && !S.pending) loadState(true).catch(() => {});
    })
    // Changes made while connecting are not sent, so check once when the connection is ready.
    .subscribe((status) => { if (status === 'SUBSCRIBED') checkForChanges(true); });
}
function stopListening() {
  if (S.channel) { sb.removeChannel(S.channel); S.channel = null; }
}

async function loadState(silent) {
  const before = S.state;
  const st = await call('state');
  if (silent && S.pending) return; // an action is saving; its answer brings fresh data
  applyState(st);
  if (!S.ui.tab) S.ui.tab = isStaff() ? 'today' : 'tasks';
  S.screen = 'app';
  listen();
  if (silent) announceChanges(before, st);
  if (!silent || (!S.sheetOpen && !isTyping())) render();
  else S.needsRender = true;
}

/** A short note when something new arrives for this person. */
function announceChanges(before, after) {
  if (!before || !after) return;
  const old = new Set(before.tasks.map((t) => t.key));
  const oldC = new Set((before.comments || []).map((c) => c.key));
  const newC = (after.comments || []).filter((c) => !oldC.has(c.key) && !c.mine);
  if (newC.length) { toast('💬 ' + newC[newC.length - 1].by + ' on ' + newC[newC.length - 1].id + ': ' + newC[newC.length - 1].text.slice(0, 60)); return; }
  if (!isStaff()) {
    const fresh = after.tasks.filter((t) => !old.has(t.key));
    if (fresh.length) toast('🆕 New task: ' + fresh.map((t) => t.task).join(', '));
    else {
      const edits = after.tasks.filter((t) => t.review === 'Edit' && (before.tasks.find((b) => b.key === t.key) || {}).review !== 'Edit');
      const okd = after.tasks.filter((t) => t.review === 'Approved' && (before.tasks.find((b) => b.key === t.key) || {}).review !== 'Approved');
      if (edits.length) toast('✎ Changes requested on ' + edits.map((t) => t.task).join(', '));
      else if (okd.length) toast('✓ Approved: ' + okd.map((t) => t.task).join(', '));
    }
    return;
  }
  const wasWaiting = new Set(before.tasks.filter((t) => t.status === 'Pending Approval').map((t) => t.key));
  const nowWaiting = after.tasks.filter((t) => t.status === 'Pending Approval' && !t.cancelled && t.review !== 'Approved' && !wasWaiting.has(t.key));
  const oldIdeas = new Set(before.ideas.map((i) => i.id));
  const newIdeas = after.ideas.filter((i) => !oldIdeas.has(i.id) && !i.mine);
  if (nowWaiting.length) toast('📥 Waiting your approval: ' + nowWaiting.map((t) => t.task + ' (' + t.assignee + ')').join(', '));
  else if (newIdeas.length) toast('💡 New idea from ' + newIdeas.map((i) => i.by).join(', '));
}

/*
 * Staying up to date: every 30 seconds a tiny "anything new?" check (ping).
 * Only when the data changed is the full state loaded. Every 5 minutes the
 * state is loaded anyway, so deadline colors follow the clock.
 */
async function checkForChanges(force) {
  if (S.screen !== 'app' || S.pending || S.checking || (!force && document.hidden)) return;
  S.checking = true;
  try {
    const stale = Date.now() - S.lastLoad > 300000;
    const { ver } = stale ? { ver: null } : await call('ping');
    if (stale || ver !== S.state.ver) await loadState(true);
  } catch (e) {
    if (e.code === 'AUTH') handleErr(e);
  } finally {
    S.checking = false;
  }
}
setInterval(() => checkForChanges(false), 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForChanges(false); });

});

/* ======================================================================
   DOM helpers (user text is always added as text, never as HTML)
   ====================================================================== */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const k of Object.keys(props)) {
      const v = props[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  append(el, kids);
  return el;
}
/** Replaces an element's content. Accepts nodes, text, arrays and null (skipped). */
function fill(el, ...kids) {
  el.replaceChildren();
  append(el, kids);
  return el;
}
function append(el, kids) {
  if (!Array.isArray(kids)) kids = [kids];
  kids.forEach((c) => {
    if (c === null || c === undefined || c === false || c === '') return;
    if (Array.isArray(c)) append(el, c);
    else el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  });
}

/* ======================================================================
   Dates (all in Asia/Dubai; the server sends "today" and "now")
   ====================================================================== */
const DAYN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAYL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function ymdUTC(ymd) { const p = ymd.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
function addDays(ymd, n) { const d = ymdUTC(ymd); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function wd(ymd) { return DAYN[ymdUTC(ymd).getUTCDay()]; }
function fmtD(ymd) { return ymd ? ymd.slice(8, 10) + '/' + ymd.slice(5, 7) + '/' + ymd.slice(0, 4) : ''; }
function fmtDT(s) { return s ? fmtD(s.slice(0, 10)) + ' ' + s.slice(11, 16) : ''; }
function dayShort(ymd) {
  const today = S.state.today;
  if (ymd === today) return 'Today';
  if (ymd === addDays(today, 1)) return 'Tomorrow';
  return wd(ymd) + ' ' + ymd.slice(8, 10) + '/' + ymd.slice(5, 7);
}
function dayLong(ymd) {
  const rel = ymd === S.state.today ? ' · Today' : ymd === addDays(S.state.today, 1) ? ' · Tomorrow'
    : ymd === addDays(S.state.today, -1) ? ' · Yesterday' : '';
  return DAYL[ymdUTC(ymd).getUTCDay()] + ' ' + fmtD(ymd) + rel;
}
function isWorkday(ymd) { return !!S.state.hours[wd(ymd)]; }

/** Deadline picker: next workdays as chips, plus any other date. */
function datePicker(value, onPick, opts) {
  opts = opts || {};
  const days = [];
  let d = S.state.today;
  for (let i = 0; days.length < (opts.count || 6) && i < 21; i++, d = addDays(d, 1)) {
    if (opts.anyDay || isWorkday(d)) days.push(d);
  }
  const wrap = h('div', { class: 'chips' });
  const draw = () => {
    const other = value && days.indexOf(value) < 0;
    const dateIn = h('input', {
      type: 'date', value: value || '', 'aria-label': 'Pick a date',
      onchange: (e) => {
        const v = e.target.value;
        if (!v) return;
        if (!opts.anyDay && !isWorkday(v)) {
          toast(DAYL[ymdUTC(v).getUTCDay()] + ' is a day off. Pick a workday.', true);
          e.target.value = value || '';
          return;
        }
        value = v; onPick(v); draw();
      }
    });
    fill(wrap, 
      ...days.map((x) => h('button', { type: 'button', class: 'chip' + (x === value ? ' on' : ''), onclick: () => { value = x; onPick(x); draw(); } }, dayShort(x))),
      h('span', { class: 'chip date' + (other ? ' on' : '') }, other ? '📅 ' + wd(value) + ' ' + fmtD(value) : '📅 Other date', dateIn),
      opts.clearable && value ? h('button', { type: 'button', class: 'chip', onclick: () => { value = ''; onPick(''); draw(); } }, 'No date') : null
    );
  };
  draw();
  return wrap;
}

   ====================================================================== */
function isAdmin() { return !!(S.me && S.me.role === 'Admin'); }
/** Manager: sees what the admin sees (no Scribble), comments, changes nothing. */
function isManager() { return !!(S.me && S.me.role === 'Manager'); }
function isStaff() { return isAdmin() || isManager(); }
function statusBadge(t) {
  if (t.cancelled) return h('span', { class: 'badge' }, 'Cancelled');
  if (t.review === 'Approved') return h('span', { class: 'badge b-green' }, '✓ Approved');
  if (t.status === 'Done') return h('span', { class: 'badge b-green' }, 'Done');
  if (t.review === 'Edit') return h('span', { class: 'badge b-orange' }, '✎ Changes requested');
  if (t.status === 'Pending Approval') return h('span', { class: 'badge b-purple' }, 'Pending approval');
  if (t.status === 'Started') return h('span', { class: 'badge b-blue' }, 'Started');
  return h('span', { class: 'badge' }, 'Not started');
}
function dueChip(t, short) {
  if (!t.deadline) return null;
  const extra = t.overdue ? ' · Overdue' : t.late ? ' · Late' : '';
  const rel = dayShort(t.deadline);
  const label = short ? rel : rel + (rel.indexOf('/') < 0 ? ' ' + fmtD(t.deadline) : '/' + t.deadline.slice(0, 4));
  return h('span', { class: 'due ' + (t.color !== 'none' ? t.color : '') + (short ? ' sm' : '') }, '⏰ ' + label + extra);
}

function execBadge(e) {
  return h('span', { class: 'badge ' + (e === 'Approved' ? 'b-green' : e === 'Rejected' ? 'b-red' : 'b-orange') }, e === 'Later' ? 'Later' : e);
}
function calBadge(s) {
  const cls = { Published: 'b-green', Final: 'b-blue', Cancelled: 'b-red' }[s] || '';
  return h('span', { class: 'badge ' + cls }, s === 'Published' ? '✓ Published' : s);

    f.channel || 'Social', (v) => { f.channel = v; if (onChange) onChange(v); }), 'Outside work never goes to Ready or the Calendar.');

function isOpen(t) { return !t.cancelled && t.status !== 'Done' && t.review !== 'Approved'; }
function rankTask(t) {
  if (t.status === 'Pending Approval' && isAdmin()) return 0;
  if (t.review === 'Edit') return 1;
  if (t.color === 'red') return 2;
  if (t.color === 'green') return 3;
  return 4;
}
function byUrgency(a, b) {
  return rankTask(a) - rankTask(b) || (a.deadline || '9').localeCompare(b.deadline || '9') || a.id.localeCompare(b.id);

function markSeen(id) {

/**
 * The thread for an ID: comments + a box to write one.
 * opts.video: offer a time (0:12). opts.file + opts.pin: comments placed on that image (preview sheet).
 */
function commentsBox(id, opts) {
  opts = opts || {};
  const list = h('div');
  let drawn = false;
  const draw = () => {
    if (drawn && !list.isConnected) { live.delete(draw); return; }
    drawn = true;
    const items = commentsOf(id);
    const fid = opts.file ? driveIdOf(opts.file) : '';
    const pinNo = {};
    items.filter((c) => c.pinX !== null && c.pinX !== undefined && (!fid || driveIdOf(c.file) === fid)).forEach((c, i) => { pinNo[c.key] = i + 1; });
    fill(list, items.length ? items.map((c) => commentRow(c, pinNo)) : h('div', { class: 'muted small', style: 'padding:4px 0' }, 'No comments yet.'));
    if (opts.onDraw) opts.onDraw();
    if (list.isConnected || !drawn) markSeen(id);
  };
  draw();
  live.add(draw);
  setTimeout(() => markSeen(id), 0);
  const d = S.cdrafts[id] || (S.cdrafts[id] = { text: '', time: '' });
  const ta = area(d, 'text', { rows: 1, placeholder: opts.pin ? 'Tap the image to place a pin, then write…' : 'Write a comment…' });
  const timeIn = opts.video ? input(d, 'time', { placeholder: '⏱ 0:12', dir: 'ltr', inputmode: 'numeric', style: 'width:92px' }) : null;
  const send = h('button', { type: 'button', class: 'btn primary' }, 'Send');
  send.onclick = async () => {
    if (!d.text.trim()) { toast('Write a comment first.', true); return; }
    const payload = { id, text: d.text, time: d.time };
    if (opts.pin && opts.pin.x !== null) Object.assign(payload, { pinX: opts.pin.x, pinY: opts.pin.y, file: opts.file });
    d.text = ''; d.time = ''; ta.value = ''; grow(ta); if (timeIn) timeIn.value = '';
    const data = await run(send, 'comment.add', payload, 'Comment sent', { keepSheet: true });
    if (!data) { d.text = payload.text; d.time = payload.time; ta.value = d.text; if (timeIn) timeIn.value = d.time; return; }
    if (opts.pin) { opts.pin.x = null; opts.pin.y = null; }
    draw();
  };
  return h('div', null,
    opts.title === false ? null : h('div', { class: 'section', style: 'margin-top:18px' }, h('h2', null, '💬 Comments')),
    list,
    h('div', { class: 'cmt-compose' }, h('div', { class: 'grow' }, ta), timeIn, send),
    opts.video ? h('div', { class: 'muted small', style: 'margin-top:4px' }, 'Add a time (like 0:12) to point at a moment in the video.') : null);
}

/* ======================================================================
   Files: preview (Drive), pins on images, upload to Drive
   ====================================================================== */
function driveIdOf(url) {
  const m = /^https:\/\/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([\w-]{10,})/.exec(url || '');
  return m ? m[1] : '';
}
/** A file link: Drive files get "👁 View" (preview, comments, pins); others open in a new tab. */
function fileLink(url, ctx, label) {
  if (!url) return null;
  if (!driveIdOf(url)) return linkTo(url, label);
  return h('span', { class: 'row', style: 'display:inline-flex;gap:6px' },
    h('button', { type: 'button', class: 'btn small', onclick: (e) => { e.stopPropagation(); previewSheet(url, ctx || {}); } }, '👁 View'),
    linkTo(url, 'Drive ↗'));
}

/** Several files (a carousel): one button that opens them as a gallery. */
function filesLink(files, ctx, label) {
  files = (files || []).filter(Boolean);
  if (files.length <= 1) return fileLink(files[0], ctx, label);
  return h('button', { type: 'button', class: 'btn small', onclick: (e) => { e.stopPropagation(); previewSheet(files[0], Object.assign({}, ctx, { files, index: 0 })); } },
    '🖼 ' + files.length + ' images');
}

/** Big preview of a Drive file. Images: tap to pin a comment on a spot. Videos: comment with a time. Carousels: ‹ › between images. */
function previewSheet(url, ctx) {
  const fid = driveIdOf(url);
  if (!fid) { window.open(url, '_blank', 'noopener'); return; }
  const id = ctx.id;
  const video = !!ctx.video;
  const pin = { x: null, y: null };
  const stage = h('div', { class: 'pv' });
  const drawPins = () => {
    stage.querySelectorAll('.pin').forEach((p) => p.remove());
    if (video || !id) return;
    commentsOf(id).filter((c) => c.pinX !== null && c.pinX !== undefined && driveIdOf(c.file) === fid).forEach((c, i) => {
      stage.append(h('div', { class: 'pin' + (ctx.focus === c.key ? ' focus' : ''), style: 'left:' + c.pinX + '%;top:' + c.pinY + '%' }, String(i + 1)));
    });
    if (pin.x !== null) stage.append(h('div', { class: 'pin new', style: 'left:' + pin.x + '%;top:' + pin.y + '%' }, '+'));
  };
  if (video) {
    stage.append(h('iframe', { src: CFG.driveWeb + '/file/d/' + fid + '/preview', allow: 'autoplay; fullscreen', allowfullscreen: true }));
  } else {
    const img = h('img', {
      src: CFG.driveWeb + '/thumbnail?id=' + fid + '&sz=w2000', alt: 'Preview',
      onclick: (e) => {
        if (!id) return;
        const r = img.getBoundingClientRect();
        pin.x = Math.round((e.clientX - r.left) / r.width * 1000) / 10;
        pin.y = Math.round((e.clientY - r.top) / r.height * 1000) / 10;
        drawPins();
        const ta = document.querySelector('#layer .cmt-compose textarea');
        if (ta) ta.focus();
      },
      onerror: () => fill(stage, h('div', { style: 'padding:24px;color:#fff' }, 'No preview for this file. Open it in Drive.'))
    });
    stage.append(img);
  }
  const files = ctx.files || null;
  const at = files ? ctx.index || 0 : 0;
  const go = (i) => previewSheet(files[i], Object.assign({}, ctx, { index: i, focus: null }));
  const body = h('div', null,
    files ? h('div', { class: 'row', style: 'margin-bottom:8px;justify-content:space-between' },
      h('button', { type: 'button', class: 'btn small', disabled: at === 0, onclick: () => go(at - 1) }, '‹ Back'),
      h('b', null, 'Image ' + (at + 1) + ' of ' + files.length),
      h('button', { type: 'button', class: 'btn small', disabled: at === files.length - 1, onclick: () => go(at + 1) }, 'Next ›')) : null,
    stage,
    h('div', { class: 'row', style: 'margin-bottom:6px' },
      h('a', { class: 'btn small', href: CFG.driveWeb + '/uc?export=download&id=' + fid, target: '_blank', rel: 'noopener noreferrer' }, '⬇ Download original'),
      h('a', { class: 'btn small', href: url, target: '_blank', rel: 'noopener noreferrer' }, 'Open in Drive ↗')),
    !video && id ? h('div', { class: 'muted small' }, '📍 Tap the image to pin a comment on that spot.') : null,
    id ? commentsBox(id, { title: false, video, file: url, pin: video ? null : pin, onDraw: drawPins }) : null);
  openSheet((id ? id + ' · ' : '') + (video ? 'Video' : 'File'), body);
  drawPins();
}

/* ----- Upload straight to Google Drive (folder per ID). The server hands out a short-lived token. ----- */
let mediaTok = null;
async function mediaToken() {
  if (mediaTok && mediaTok.exp > Date.now()) return mediaTok;
  const d = await call('media.token');
  mediaTok = { token: d.token, folderId: d.folderId, exp: Date.now() + 30 * 60 * 1000 };
  return mediaTok;
}
async function gapi(path, opts, tok) {
  const r = await fetch(CFG.driveApi + path, Object.assign({}, opts, { headers: Object.assign({ authorization: 'Bearer ' + tok }, (opts && opts.headers) || {}) }));
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error('Drive: ' + ((d.error && d.error.message) || r.status));
  return d;
}
const folderIds = {};
async function driveFolder(tok, root, name) {
  if (folderIds[name]) return folderIds[name];
  const q = "name='" + name.replace(/'/g, "\\'") + "' and '" + root + "' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false";
  const found = await gapi('/drive/v3/files?pageSize=1&fields=files(id)&q=' + encodeURIComponent(q), {}, tok);
  if (found.files && found.files.length) return (folderIds[name] = found.files[0].id);
  const made = await gapi('/drive/v3/files?fields=id', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ name, mimeType: 'application/vnd.google-apps.folder', parents: [root] }) }, tok);
  return (folderIds[name] = made.id);
}
/** Uploads a file (any size, with progress) into the ID's folder; anyone with the link can view it. Returns its link. */
async function driveUpload(file, ctx, onProgress) {
  const { token, folderId } = await mediaToken();
  const parent = ctx.id ? await driveFolder(token, folderId, ctx.id) : folderId;
  const name = [ctx.id, ctx.label, file.name].filter(Boolean).join(' · ');
  const init = await fetch(CFG.driveApi + '/upload/drive/v3/files?uploadType=resumable&fields=id', {
    method: 'POST',
    headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json; charset=UTF-8', 'x-upload-content-type': file.type || 'application/octet-stream' },
    body: JSON.stringify({ name, parents: [parent] })
  });
  // The session address is in "Location"; if the browser can't read it, it's rebuilt from the exposed upload id.
  const uid = init.headers.get('x-guploader-uploadid');
  const loc = init.headers.get('location') || (uid ? CFG.driveApi + '/upload/drive/v3/files?uploadType=resumable&upload_id=' + encodeURIComponent(uid) : '');
  if (!init.ok || !loc) throw new Error('Drive did not accept the upload (' + init.status + ').');
  const done = await new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('PUT', loc);
    x.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => (x.status === 200 || x.status === 201) ? resolve(JSON.parse(x.responseText)) : reject(new Error('Upload failed (' + x.status + ').'));
    x.onerror = () => reject(new Error('The upload stopped. Check your internet and try again.'));
    x.send(file);
  });
  await gapi('/drive/v3/files/' + done.id + '/permissions', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ role: 'reader', type: 'anyone' }) }, token);
  return 'https://drive.google.com/file/d/' + done.id + '/view';
}
/**
 * "📤 Upload" button. ctx: { id, label, multi }. onDone gets the Drive link, or with multi
 * the list of links (a carousel: files in name order, so "slide 1, slide 2…" stay in order).
 */
function uploadButton(ctx, onDone) {
  if (!S.state.media) return null;
  const pick = h('input', { type: 'file', accept: ctx.accept || 'image/*,video/*,application/pdf', multiple: !!ctx.multi, style: 'display:none' });
  const btn = h('button', { type: 'button', class: 'btn' }, '📤 Upload');
  const bar = h('div', { class: 'progress hidden' }, h('div'));
  btn.onclick = (e) => { e.stopPropagation(); pick.click(); };
  pick.onchange = async () => {
    const list = Array.from(pick.files || []).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    if (!list.length) return;
    if (list.length > 20) { toast('Up to 20 files at once.', true); pick.value = ''; return; }
    btn.disabled = true;
    bar.classList.remove('hidden');
    S.uploading++;
    try {
      const links = [];
      for (let i = 0; i < list.length; i++) {
        links.push(await driveUpload(list[i], ctx, (p) => {
          const pct = Math.round((i + p) / list.length * 100);
          bar.firstChild.style.width = pct + '%';
          btn.textContent = (list.length > 1 ? (i + 1) + '/' + list.length + ' · ' : '') + pct + '%';
        }));
      }
      onDone(ctx.multi ? links : links[0]);
    } catch (err) {
      toast(err.message, true);
    } finally {
      S.uploading--;
      btn.disabled = false;
      btn.textContent = '📤 Upload';
      bar.classList.add('hidden');
      pick.value = '';
      if (!S.uploading && S.needsRender && !S.sheetOpen) { S.needsRender = false; render(); }
    }
  };
  return h('div', { class: 'upl' }, btn, pick, bar);
}

/** ✓/✗ Spelling and ✓/✗ License (when license numbers are set). */
function checkMarks(r) {
  return [h('span', { class: 'badge ' + (r.spelling ? 'b-green' : 'b-red') }, (r.spelling ? '✓' : '✗') + ' Spelling'),
    r.licenses === null || r.licenses === undefined ? null
      : h('span', { class: 'badge ' + (r.licenses ? 'b-green' : 'b-red') }, (r.licenses ? '✓' : '✗') + ' License')];
}
function checkBadge(t) {
  if (t.checkStatus === 'Waiting') return h('span', { class: 'badge b-purple' }, '✨ Checking');
  if (t.checkStatus !== 'Done' || !t.checkResult || !t.checkResult.files) return null;
  return checkMarks(t.checkResult);
}
function checkNote(t) {
  if (!t.checkStatus) return null;
  const again = isAdmin() ? h('button', { type: 'button', class: 'btn small', style: 'margin-top:8px',
    onclick: (e) => run(e.currentTarget, 'agent.ask', { entity: 'task', key: t.key }, 'Gemini will check it again', { keepSheet: true }) }, 'Check again') : null;
  if (t.checkStatus === 'Waiting') return h('div', { class: 'note', style: 'background:var(--purple-bg)' }, '✨ Gemini is checking the design…');
  const r = t.checkResult || {};
  if (t.checkStatus === 'Error' || !r.files) {
    const why = r.files && r.files[0] && r.files[0].error;
    return h('div', { class: 'note orange' }, h('div', { class: 't' }, '⚠️ Gemini couldn\'t check it'), why ? h('div', { class: 'small' }, why) : null, again);
  }
  const many = r.files.length > 1;
  const lines = r.files.map((f, i) => {
    const parts = [];
    if (f.error) parts.push(h('div', null, 'Couldn\'t check: ' + f.error));
    else {
      if (!f.spelling.ok) parts.push(h('div', { dir: 'auto' }, '✗ Spelling: ' + f.spelling.mistakes.join(' · ')));
      if (f.licenses && !f.licenses.ok) parts.push(h('div', { dir: 'auto' }, '✗ Not on it: ' + (f.licenses.missing.join(', ') || 'a license number')));
    }
    if (!parts.length) return many ? h('div', { class: 'small' }, 'Image ' + (i + 1) + ': ✓') : null;
    return h('div', { class: 'small', style: 'margin-top:4px' }, many ? h('b', null, 'Image ' + (i + 1)) : null, parts);
  });
  const fine = r.spelling && r.licenses !== false;
  return h('div', { class: 'note ' + (fine ? 'green' : 'orange') }, h('div', { class: 't row' }, 'Gemini check', checkMarks(r)), lines, again);
}

/** Checks the current password, then sets the new one (Supabase Auth). */
async function changeOwnPassword(current, next) {
  if (!next || next.length < 8) throw new Error('Password must be at least 8 characters.');
  if (next === current) throw new Error('Pick a password different from the current one.');
  const username = S.me && S.me.username;
  if (!username) throw new Error('Please log in again.');
  const check = await sb.auth.signInWithPassword({ email: emailOf(username), password: current });
  if (check.error) throw new Error('Your current password is not correct.');
  const { error } = await sb.auth.updateUser({ password: next });
  if (error) throw new Error(error.message);
}

async function logout() {
  stopListening();
  try { await sb.auth.signOut(); } catch (e) { /* ignore */ }
  S.state = null; S.me = null; S.ui.tab = ''; S.drafts = {};
  closeSheet();
  S.screen = 'login';
  if (!S.status) { try { S.status = await call('status'); } catch (e) { /* ignore */ } }
  render();
}

  const st = S.state;

/* Installing the app (only on the app's own site; the build sets KATAL_PWA). Chrome and Android offer a button. */
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installPrompt = e; });
window.addEventListener('appinstalled', () => { S.installPrompt = null; });
function installBox() {
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (!window.KATAL_PWA || standalone) return null;
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const mac = !ios && /Macintosh/.test(navigator.userAgent) && /Safari/.test(navigator.userAgent) && !/Chrome|Chromium|Edg/.test(navigator.userAgent);
  let body;
  if (S.installPrompt) {
    const btn = h('button', { class: 'btn primary small' }, '📲 Install the app');
    btn.onclick = async () => {
      const ev = S.installPrompt;
      if (!ev) return;
      ev.prompt();
      const choice = await ev.userChoice.catch(() => null);
      if (choice && choice.outcome === 'accepted') { S.installPrompt = null; closeSheet(); toast('Installed ✓ Open KATAL Team from your home screen'); }
    };
    body = btn;
  } else if (ios) {
    body = h('div', { class: 'muted small' }, 'In Safari: tap Share ', h('b', null, '⬆︎'), ' then ', h('b', null, 'Add to Home Screen'), '.');
  } else if (mac) {
    body = h('div', { class: 'muted small' }, 'In Safari: ', h('b', null, 'File → Add to Dock'), '.');
  } else {
    body = h('div', { class: 'muted small' }, 'In your browser\'s menu: ', h('b', null, 'Install KATAL Team'), ' (or ', h('b', null, 'Add to Home screen'), ').');
  }
  return h('div', null, h('div', { class: 'section' }, h('h2', null, 'App')), h('p', { class: 'muted', style: 'margin:0 0 8px' }, 'Put KATAL Team on your home screen. It opens like an app.'), body);
}

function memberTaskCard(t) {
  const approved = t.review === 'Approved' || t.status === 'Done';
  const d = S.drafts[t.key] || (S.drafts[t.key] = { fileLink: t.fileLink, draftCaption: t.draftCaption, notes: t.notes });
  const isOpenRow = S.ui.open[t.key] !== undefined ? S.ui.open[t.key] : t.review === 'Edit';
  const cls = 'card trow' + (approved ? ' approved' : t.color !== 'none' ? ' c-' + t.color : '') + (isOpenRow ? ' open' : '');
  const toggle = () => { S.ui.open[t.key] = !isOpenRow; render(); };
  const head = h('button', { class: 'trow-head', onclick: toggle, 'aria-expanded': isOpenRow ? 'true' : 'false' },
    h('div', { class: 'trow-line' }, h('span', { class: 'idtag' }, t.id), h('span', { class: 'trow-title', dir: 'auto' }, t.task),
      h('span', { class: 'chev' }, '›')),

  const card = h('div', { class: cls }, head);
  if (!isOpenRow) return card;

  const expanded = !!S.ui.expanded[t.key];
  const longBrief = (t.brief || '').length > 220 || (t.brief || '').split('\n').length > 5;
  const save = (btn, status) => {
    if (d.fileLink && !/^(https?:\/\/)?[^\s.]+\.[^\s]+$/i.test(d.fileLink.trim())) { toast('The file link doesn\'t look like a link.', true); return; }
    if (status === 'Pending Approval' && !(d.fileLink || '').trim()) { toast('Add the file link first.', true); return; }
    const sent = { fileLink: d.fileLink, draftCaption: d.draftCaption, notes: d.notes };
    const payload = Object.assign({ key: t.key }, sent, status ? { status } : {});
    if (status === 'Pending Approval') S.ui.open[t.key] = false;
    instant((st) => {
      const x = st.tasks.find((k) => k.key === t.key);
      if (!x) return;
      Object.assign(x, sent);
      if (status) x.status = status;
      if (status === 'Pending Approval') {
        if (!x.delivered) x.delivered = st.now;
        if (x.review === 'Edit') x.review = '';
        x.color = x.late ? 'red' : 'none';
      }
    }, 'task.update', payload,
    status === 'Pending Approval' ? 'Sent for approval ✓' : status === 'Started' ? 'Marked as started' : 'Saved')
      .then((res) => {
        const cur = S.drafts[t.key];

    approved ? h('div', { class: 'note green' }, h('div', { class: 't' }, '✓ Approved — great work')) : null,
    approved ? null : checkNote(t),
    t.brief ? h('div', null,
      h('div', { class: 'brief pre' + (longBrief && !expanded ? ' clamp' : ''), dir: 'auto' }, t.brief),
      longBrief ? h('button', { class: 'btn ghost small', onclick: () => { S.ui.expanded[t.key] = !expanded; render(); } }, expanded ? 'Show less' : 'Show full brief') : null) : null,
    t.related.length ? h('div', { class: 'related' }, h('div', { class: 'small muted', style: 'font-weight:600' }, 'Team files for ' + t.id),
      t.related.map((r) => h('div', { class: 'r' }, h('b', null, r.name), h('span', { class: 'muted' }, r.task),
        statusBadge(r), h('span', { class: 'grow' }), filesLink(r.files, { id: t.id, video: t.type === 'Video' && r.task !== 'Video Cover' }) || h('span', { class: 'muted small' }, 'No file yet')))) : null,
    t.delivered ? h('div', { class: 'kv' }, 'Delivered ', h('b', null, fmtDT(t.delivered)), t.late ? h('span', { class: 'badge b-red', style: 'margin-left:6px' }, 'Late') : null) : null,
    approved ? [
      t.fileLink ? h('div', { class: 'kv', style: 'margin-top:6px' }, 'File: ', filesLink(t.files, { id: t.id, video: isVideoTask(t) })) : null,
      t.draftCaption ? h('div', { class: 'kv pre', style: 'margin-top:6px' }, 'Caption: ', h('b', { dir: 'auto' }, t.draftCaption)) : null
    ] : [
      h('div', { class: 'statusbar' },
        h('button', { class: 'btn' + (t.status === 'Started' ? ' cur' : ''), onclick: (e) => save(e.currentTarget, 'Started') }, t.status === 'Started' ? '▶ Started' : '▶ Start'),
        h('button', { class: 'btn' + (t.status === 'Pending Approval' ? ' cur' : ' primary'), onclick: (e) => save(e.currentTarget, 'Pending Approval') },
          t.status === 'Pending Approval' ? '✓ Sent for approval' : 'Send for approval')),
      h('div', { class: 'divider' }),
      field('File', h('div', null,
        input(d, 'fileLink', { type: 'url', dir: 'ltr', placeholder: S.state.media ? 'Upload, or paste a link' : 'Paste the Telegram link', inputmode: 'url' }),
        h('div', { class: 'row', style: 'margin-top:8px' }, uploadButton({ id: t.id, label: t.task, multi: true }, (links) => {
          d.fileLink = links[0];
          instant((st) => { const x = st.tasks.find((k) => k.key === t.key); if (x) { x.fileLink = links[0]; x.files = links; } }, 'task.update', { key: t.key, files: links },

  ['overdue', 'Overdue', (t) => isOpen(t) && t.overdue],
  ['edit', 'Changes requested', (t) => isOpen(t) && t.review === 'Edit'],
  ['notstarted', 'Not started', (t) => isOpen(t) && !t.status],
  ['today', 'Due today', (t) => isOpen(t) && t.deadline === S.state.today],
  ['tomorrow', 'Due tomorrow', (t) => isOpen(t) && t.deadline === addDays(S.state.today, 1)],
  ['done', 'Done', (t) => !t.cancelled && !isOpen(t)],
  ['cancelled', 'Cancelled', (t) => t.cancelled],
  ['all', 'All', () => true]
];

function adminTasksView() {
  const st = S.state;
  const q = S.ui.q.trim().toLowerCase();
  const base = st.tasks.filter((t) => !S.ui.person || t.assignedTo === S.ui.person)
    .filter((t) => !q || (t.id + ' ' + t.task + ' ' + t.idea + ' ' + t.assignee).toLowerCase().indexOf(q) >= 0);
  const filter = TASK_FILTERS.find((f) => f[0] === S.ui.taskFilter) || TASK_FILTERS[0];
  let list = base.filter(filter[2]);
  list = S.ui.taskFilter === 'done' || S.ui.taskFilter === 'cancelled' || S.ui.taskFilter === 'all'
    ? list.sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || '')) : list.sort(byUrgency);
  const searchIn = h('input', { class: 'in', type: 'search', placeholder: 'Search ID, task, person…', value: S.ui.q, dir: 'auto',
    oninput: (e) => { S.ui.q = e.target.value; clearTimeout(S.searchT); S.searchT = setTimeout(() => { render(); const el = document.querySelector('.main input[type=search]'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 250); } });
  return h('div', null,
    h('div', { class: 'page-head' }, h('h1', null, 'Tasks'),
      h('div', { class: 'row' },
        isAdmin() ? h('button', { class: 'btn', onclick: () => newTaskSheet() }, '+ New task') : null,
        h('button', { class: 'btn primary', onclick: () => quickTaskSheet() }, '⚡ Quick task'))),
    choice(TASK_FILTERS.map((f) => ({ value: f[0], label: f[1], n: base.filter(f[2]).length })), S.ui.taskFilter, (v) => { S.ui.taskFilter = v; render(); }, 'scroll'),
    h('div', { style: 'height:8px' }),
    choice([{ value: '', label: 'Everyone' }].concat((st.users || st.people.map((p) => Object.assign({ active: true }, p)))
      .filter((u) => u.active || st.tasks.some((t) => t.assignedTo === u.id))
      .map((u) => ({ value: u.id, label: u.name }))), S.ui.person, (v) => { S.ui.person = v; render(); }, 'scroll'),
    h('div', { style: 'height:10px' }), searchIn, h('div', { style: 'height:12px' }),
    list.length ? h('div', { class: 'stack' }, list.map(adminTaskRow)) : h('div', { class: 'empty' }, 'No tasks here.'));
}

function adminTaskRow(t) {
  const pending = isAdmin() && isOpen(t) && t.status === 'Pending Approval';
  return h('div', { class: 'card tap' + (t.color !== 'none' && isOpen(t) ? ' c-' + t.color : ''), onclick: () => openTask(t.key) },
    h('div', { class: 'top' }, h('span', { class: 'idtag' }, t.id), h('b', { class: 'grow', dir: 'auto' }, t.task),
      personalBadge(t), t.channel === 'Outside' && !t.personal ? h('span', { class: 'badge' }, '📦 Outside') : null, commentBadge(t.id), checkBadge(t), statusBadge(t)),
    h('div', { class: 'row small' }, h('span', { class: 'muted' }, '👤 ' + t.assignee), isOpen(t) ? dueChip(t) : h('span', { class: 'muted' }, 'Due ' + fmtD(t.deadline)),
      t.delivered ? h('span', { class: 'muted' }, 'Delivered ' + fmtDT(t.delivered)) : null, t.late ? h('span', { class: 'badge b-red' }, 'Late') : null),
    pending ? h('div', { class: 'actions', onclick: (e) => e.stopPropagation() },

        : linkTo(t.fileLink) ? h('a', { class: 'btn small', href: t.fileLink, target: '_blank', rel: 'noopener noreferrer' }, 'Open file ↗') : null,

      h('button', { class: 'btn small warn', onclick: () => requestEditSheet(t) }, '✎ Changes')) : null);
}

/** The admin edits every task; a manager edits the tasks they made and works on the ones given to them. */
function openTask(key) {
  const t = S.state.tasks.find((x) => x.key === key);
  if (!t) return;
  if (isAdmin()) taskSheet(key);
  else if (t.canEdit || t.assignedTo === S.me.id) managerTaskSheet(key);
  else taskViewSheet(key);
}

/** Personal: outside work someone gave themselves. Nobody else sees the admin's; the admin also sees a manager's. */
function personalBadge(t) {
  if (!t.personal) return null;
  return h('span', { class: 'badge b-purple' }, t.createdBy === S.me.id ? '🔒 Personal' : '🔒 ' + t.personal);
}

function approve(btn, t) {
  const ideaTasks = S.state.tasks.filter((x) => x.id === t.id && !x.cancelled && x.key !== t.key);
  const last = ideaTasks.every((x) => x.review === 'Approved');
  return instant((st) => {
    const x = st.tasks.find((k) => k.key === t.key);
    if (x) Object.assign(x, { review: 'Approved', status: 'Done', color: 'none', overdue: false });
  }, 'task.approve', { key: t.key }, last ? 'Approved · ' + t.id + ' is ready to post' : 'Approved');
}

function requestEditSheet(t) {
  const f = { key: t.key, note: '' };
  const btn = h('button', { class: 'btn warn' }, 'Send back');
  btn.onclick = () => {
    if (!f.note.trim()) { toast('Write what should change.', true); return; }
    instant((st) => {
      const x = st.tasks.find((k) => k.key === t.key);
      if (x) Object.assign(x, { review: 'Edit', reviewNotes: f.note.trim(), status: 'Started' });
    }, 'task.requestEdit', f, 'Sent back to ' + t.assignee);
  };
  openSheet('Request changes · ' + t.id, h('div', null,
    h('p', { class: 'muted', style: 'margin-top:0' }, t.task + ' · ' + t.assignee),
    t.fileLink ? h('p', null, 'File: ', linkTo(t.fileLink)) : null,
    field('What should change?', area(f, 'note', { rows: 4, placeholder: 'Be specific: what to fix, where.' }))), btn);
}

function taskSheet(key) {
  const t = S.state.tasks.find((x) => x.key === key);
  if (!t) return;
  const f = { key: t.key, task: t.task, brief: t.brief, assignedTo: t.assignedTo, deadline: t.deadline, status: t.status,
    fileLink: t.fileLink, draftCaption: t.draftCaption, notes: t.notes, reviewNotes: t.reviewNotes };
  const others = S.state.tasks.filter((o) => o.id === t.id && o.key !== t.key && !o.cancelled);
  const people = peopleOptions();
  if (!people.some((p) => p.value === t.assignedTo)) people.push({ value: t.assignedTo, label: t.assignee + ' (inactive)' });

  const save = h('button', { class: 'btn primary' }, 'Save');
  save.onclick = () => run(save, 'task.save', f, 'Saved');
  const fileIn = input(f, 'fileLink', { type: 'url', dir: 'ltr' });
  const cancel = h('button', { class: 'btn danger' }, t.cancelled ? 'Restore task' : 'Cancel task');
  cancel.onclick = () => {
    if (!t.cancelled && !confirm('Cancel this task? It disappears from ' + t.assignee + '\'s list (nothing is deleted).')) return;
    instant((st) => {
      const x = st.tasks.find((k) => k.key === t.key);
      if (x) x.cancelled = !t.cancelled;
    }, 'task.cancel', { key: t.key, cancelled: !t.cancelled }, t.cancelled ? 'Task restored' : 'Task cancelled');
  };
  const pending = isOpen(t) && t.status === 'Pending Approval';

  openSheet(t.id + ' · ' + t.task, h('div', null,
    h('div', { class: 'row', style: 'margin-bottom:10px' }, statusBadge(t), isOpen(t) ? dueChip(t) : null,
      t.delivered ? h('span', { class: 'muted small' }, 'Delivered ' + fmtDT(t.delivered)) : null),
    t.idea ? h('div', { class: 'kv', style: 'margin-bottom:12px' }, 'Idea: ', h('b', { dir: 'auto' }, t.idea)) : null,
    liveBox(() => checkNote(S.state.tasks.find((x) => x.key === t.key) || t)),
    pending ? h('div', { class: 'note', style: 'background:var(--purple-bg)' },
      h('div', { class: 't' }, 'Waiting your approval'),
      t.fileLink ? h('div', { style: 'margin:4px 0 8px' }, filesLink(t.files, { id: t.id, video: isVideoTask(t) }, 'Open delivered file ↗')) : null,
      h('div', { class: 'row' },
        h('button', { class: 'btn good', onclick: (e) => approve(e.currentTarget, t) }, '✓ Approve'),
        h('button', { class: 'btn warn', onclick: () => requestEditSheet(t) }, '✎ Request changes'))) : null,
    !pending && isOpen(t) && t.delivered ? h('div', { class: 'row', style: 'margin-bottom:12px' },
      h('button', { class: 'btn small good', onclick: (e) => approve(e.currentTarget, t) }, '✓ Approve now')) : null,
    field('Task', input(f, 'task')),
    field('Assigned to', choice(people, f.assignedTo, (v) => { f.assignedTo = v; })),
    field('Deadline', datePicker(f.deadline, (v) => { f.deadline = v; })),
    field('Brief', area(f, 'brief', { rows: 4 })),
    field('Status', choice([{ value: '', label: 'Not started' }, { value: 'Started', label: 'Started' }, { value: 'Pending Approval', label: 'Pending approval' }, { value: 'Done', label: 'Done' }], f.status, (v) => { f.status = v; })),
    field('File link', h('div', null, fileIn, h('div', { class: 'row', style: 'margin-top:8px' },
      uploadButton({ id: t.id, label: t.task, multi: true }, (links) => { f.files = links; f.fileLink = links[0]; fileIn.value = links[0]; toast((links.length > 1 ? links.length + ' files' : 'Uploaded') + ' ✓ Tap Save'); }),
      filesLink(t.files, { id: t.id, video: isVideoTask(t) })))),
    field('Draft caption (from ' + t.assignee + ')', area(f, 'draftCaption', { rows: 2 })),
    field('Notes (from ' + t.assignee + ')', area(f, 'notes', { rows: 2 })),
    field('Review notes (what to fix)', area(f, 'reviewNotes', { rows: 2 })),
    others.length ? h('div', { class: 'related' }, h('div', { class: 'small muted', style: 'font-weight:600' }, 'Other tasks on ' + t.id),
      others.map((o) => h('div', { class: 'r' }, h('b', null, o.assignee), h('span', { class: 'muted' }, o.task), statusBadge(o), h('span', { class: 'grow' }), filesLink(o.files, { id: o.id, video: isVideoTask(o) })))) : null,
    h('div', { class: 'muted small' }, 'Created ' + fmtDT(t.createdAt) + (t.updatedAt ? ' · Updated ' + fmtDT(t.updatedAt) : '')),
    commentsBox(t.id, { video: t.type === 'Video' })),
  [cancel, save]);
}

/** Manager: a task, read only, with its comments. */
function taskViewSheet(key) {
  const t = S.state.tasks.find((x) => x.key === key);
  if (!t) return;
  const others = S.state.tasks.filter((o) => o.id === t.id && o.key !== t.key && !o.cancelled);
  openSheet(t.id + ' · ' + t.task, h('div', null,
    h('div', { class: 'row', style: 'margin-bottom:10px' }, statusBadge(t), isOpen(t) ? dueChip(t) : null,
      t.delivered ? h('span', { class: 'muted small' }, 'Delivered ' + fmtDT(t.delivered)) : null),

    liveBox(() => checkNote(S.state.tasks.find((x) => x.key === t.key) || t)),
    t.brief ? h('div', { class: 'brief pre', dir: 'auto' }, t.brief) : null,
    t.fileLink ? h('div', { class: 'kv', style: 'margin:8px 0' }, 'File: ', filesLink(t.files, { id: t.id, video: isVideoTask(t) })) : null,
    others.length ? h('div', { class: 'related' }, h('div', { class: 'small muted', style: 'font-weight:600' }, 'Other tasks on ' + t.id),
      others.map((o) => h('div', { class: 'r' }, h('b', null, o.assignee), h('span', { class: 'muted' }, o.task), statusBadge(o), h('span', { class: 'grow' }),
        filesLink(o.files, { id: o.id, video: isVideoTask(o) })))) : null,
    commentsBox(t.id, { video: t.type === 'Video' })));
}

/**
 * Manager: a task they made (edit, reassign, cancel) and/or one given to them (do the work).
 * Their personal tasks they also mark done themselves; everything else is approved by the admin.
 */
function managerTaskSheet(key) {
  const t = S.state.tasks.find((x) => x.key === key);
  if (!t) return;
  const mine = t.assignedTo === S.me.id;
  const personal = !!t.personal;
  const working = mine && isOpen(t) && !personal;
  const f = { key: t.key, task: t.task, brief: t.brief, assignedTo: t.assignedTo, deadline: t.deadline, status: t.status };
  const w = { fileLink: t.fileLink, draftCaption: t.draftCaption, notes: t.notes };
  const people = peopleOptions();
  if (!people.some((p) => p.value === t.assignedTo)) people.push({ value: t.assignedTo, label: t.assignee + ' (inactive)' });
  const others = S.state.tasks.filter((o) => o.id === t.id && o.key !== t.key && !o.cancelled);

  const work = (btn, status) => {
    if (w.fileLink && !/^(https?:\/\/)?[^\s.]+\.[^\s]+$/i.test(w.fileLink.trim())) { toast('The file link doesn\'t look like a link.', true); return; }
    if (status === 'Pending Approval' && !(w.fileLink || '').trim()) { toast('Add the file link first.', true); return; }
    run(btn, 'task.update', Object.assign({ key: t.key }, w, status ? { status } : {}),
      status === 'Pending Approval' ? 'Sent for approval ✓' : status === 'Started' ? 'Marked as started' : 'Saved');
  };
  const fileIn = input(w, 'fileLink', { type: 'url', dir: 'ltr', placeholder: S.state.media ? 'Upload, or paste a link' : 'Paste the link', inputmode: 'url' });

  let footer = null;
  if (t.canEdit) {
    const save = h('button', { class: 'btn primary' }, 'Save');
    save.onclick = () => {
      if (!f.task.trim()) { toast('Write a title.', true); return; }
      run(save, 'task.save', personal ? f : { key: f.key, task: f.task, brief: f.brief, assignedTo: f.assignedTo, deadline: f.deadline }, 'Saved');
    };
    const cancel = h('button', { class: 'btn danger' }, t.cancelled ? 'Restore task' : 'Cancel task');
    cancel.onclick = () => {
      if (!t.cancelled && !confirm('Cancel this task?' + (mine ? '' : ' It disappears from ' + t.assignee + '\'s list (nothing is deleted).'))) return;
      instant((st) => { const x = st.tasks.find((k) => k.key === t.key); if (x) x.cancelled = !t.cancelled; },
        'task.cancel', { key: t.key, cancelled: !t.cancelled }, t.cancelled ? 'Task restored' : 'Task cancelled');
    };
    footer = [cancel, save];
  }

  openSheet(t.id + ' · ' + t.task, h('div', null,
    h('div', { class: 'row', style: 'margin-bottom:10px' }, personalBadge(t), statusBadge(t), isOpen(t) ? dueChip(t) : null,
      t.delivered ? h('span', { class: 'muted small' }, 'Delivered ' + fmtDT(t.delivered)) : null),
    t.idea && t.idea !== t.task ? h('div', { class: 'kv', style: 'margin-bottom:12px' }, 'Idea: ', h('b', { dir: 'auto' }, t.idea)) : null,
    t.review === 'Edit' ? h('div', { class: 'note orange' }, h('div', { class: 't' }, '✎ Changes requested'), h('div', { class: 'pre', dir: 'auto' }, t.reviewNotes)) : null,
    liveBox(() => checkNote(S.state.tasks.find((x) => x.key === t.key) || t)),
    t.canEdit ? [
      field('Task', input(f, 'task')),
      field('Assigned to', choice(people, f.assignedTo, (v) => { f.assignedTo = v; })),
      field('Deadline', datePicker(f.deadline, (v) => { f.deadline = v; })),
      field('Brief', area(f, 'brief', { rows: 4 })),
      personal ? field('Status', choice([{ value: '', label: 'Not started' }, { value: 'Started', label: 'Started' }, { value: 'Done', label: 'Done' }],
        f.status === 'Pending Approval' ? 'Started' : f.status, (v) => { f.status = v; })) : null
    ] : [
      h('div', { class: 'kv' }, '👤 ', h('b', null, t.assignee)),
      t.brief ? h('div', { class: 'brief pre', dir: 'auto' }, t.brief) : null
    ],
    working ? [
      h('div', { class: 'section' }, h('h2', null, 'Your work')),
      h('div', { class: 'statusbar' },
        h('button', { class: 'btn' + (t.status === 'Started' ? ' cur' : ''), onclick: (e) => work(e.currentTarget, 'Started') }, t.status === 'Started' ? '▶ Started' : '▶ Start'),
        h('button', { class: 'btn' + (t.status === 'Pending Approval' ? ' cur' : ' primary'), onclick: (e) => work(e.currentTarget, 'Pending Approval') },
          t.status === 'Pending Approval' ? '✓ Sent for approval' : 'Send for approval')),
      field('File', h('div', null, fileIn,
        h('div', { class: 'row', style: 'margin-top:8px' }, uploadButton({ id: t.id, label: t.task, multi: true }, (links) => {
          w.fileLink = links[0]; fileIn.value = links[0];
          run(null, 'task.update', { key: t.key, files: links }, (links.length > 1 ? links.length + ' files uploaded ✓' : 'Uploaded ✓') + ' Now tap Send for approval', { keepSheet: true });
        }), filesLink(t.files, { id: t.id, video: isVideoTask(t) })))),
      field('Draft caption', area(w, 'draftCaption', { rows: 2, placeholder: 'Rough caption or key info (optional)' })),
      field('Notes', area(w, 'notes', { rows: 2, placeholder: 'Notes or replies (optional)' })),
      h('button', { class: 'btn block', onclick: (e) => work(e.currentTarget) }, 'Save my work')
    ] : t.fileLink ? h('div', { class: 'kv', style: 'margin:8px 0' }, 'File: ', filesLink(t.files, { id: t.id, video: isVideoTask(t) })) : null,
    others.length ? h('div', { class: 'related' }, h('div', { class: 'small muted', style: 'font-weight:600' }, 'Other tasks on ' + t.id),
      others.map((o) => h('div', { class: 'r' }, h('b', null, o.assignee), h('span', { class: 'muted' }, o.task), statusBadge(o), h('span', { class: 'grow' }),
        filesLink(o.files, { id: o.id, video: isVideoTask(o) })))) : null,
    commentsBox(t.id, { video: t.type === 'Video' })), footer);
}

/* ----- Creating tasks ----- */
function templateRows(idea) {
  return S.state.templates.filter((tp) => tp.active && tp.type === idea.type).map((tp) => ({
    task: tp.task,
    assignedTo: S.state.people.some((p) => p.id === tp.assignee) ? tp.assignee : '',
    brief: [idea.brief, tp.note].filter(Boolean).join('\n\n'),
    deadline: '',
    linkRole: tp.linkRole
  }));
}

function createTasksSheet(idea, rows) {
  rows = rows && rows.length ? rows : templateRows(idea);
  if (!rows.length) rows = [blankRow(idea)];
  const body = h('div');
  const btn = h('button', { class: 'btn primary' });
  const draw = () => {
    btn.textContent = 'Create ' + rows.length + ' task' + (rows.length === 1 ? '' : 's');
    fill(body, 
      h('div', { class: 'kv', style: 'margin-bottom:12px' }, h('span', { class: 'idtag' }, idea.id), ' ', h('b', { dir: 'auto' }, idea.idea)),
      rows.map((r, i) => h('div', { class: 'card', style: 'margin-bottom:12px;border:1px solid var(--line)' },
        h('div', { class: 'top' }, h('b', { class: 'grow' }, 'Task ' + (i + 1)),
          rows.length > 1 ? h('button', { class: 'icon-btn', 'aria-label': 'Remove', onclick: () => { rows.splice(i, 1); draw(); } }, '✕') : null),
        field('Task', input(r, 'task', { placeholder: 'Short title' })),
        field('Assigned to', choice(peopleOptions(), r.assignedTo, (v) => { r.assignedTo = v; })),
        field('Deadline', datePicker(r.deadline, (v) => { r.deadline = v; })),
        field('Brief', area(r, 'brief', { rows: 4, placeholder: 'Full instructions for this person' })),
        field('Their file goes on the post as', choice(linkRoleOptions(idea.type), r.linkRole || 'Media', (v) => { r.linkRole = v; })))),
      h('button', { class: 'btn block', onclick: () => { rows.push(blankRow(idea)); draw(); } }, '+ Add another task'));
  };
  btn.onclick = () => {
    for (let i = 0; i < rows.length; i++) {
      if (!rows[i].task.trim()) { toast('Task ' + (i + 1) + ': write a title.', true); return; }
      if (!rows[i].assignedTo) { toast('Task ' + (i + 1) + ': pick who does it.', true); return; }
      if (!rows[i].deadline) { toast('Task ' + (i + 1) + ': pick a deadline.', true); return; }
    }
    run(btn, 'tasks.create', { id: idea.id, tasks: rows }, rows.length === 1 ? 'Task created' : rows.length + ' tasks created');
  };
  draw();
  openSheet('Create tasks', body, btn);
}

function newTaskSheet() {
  const approved = S.state.ideas.filter((i) => i.execution === 'Approved').slice().reverse();
  if (!approved.length) { toast('No approved ideas yet. Use Quick task for sudden work.', true); return; }
  const f = { id: '' };
  const btn = h('button', { class: 'btn primary' }, 'Next');
  btn.onclick = () => {
    const idea = S.state.ideas.find((i) => i.id === f.id);
    if (!idea) { toast('Pick an idea.', true); return; }
    createTasksSheet(idea, [blankRow(idea)]);
  };
  openSheet('New task', h('div', null,
    field('For which idea?', h('select', { class: 'in', onchange: (e) => { f.id = e.target.value; } },
      h('option', { value: '' }, 'Pick an approved idea…'),
      approved.map((i) => h('option', { value: i.id }, i.id + ' · ' + i.idea.slice(0, 60)))),
    'Sudden work with no idea? Use ⚡ Quick task instead.')), btn);
}

function quickTaskSheet() {
  const f = { task: '', brief: '', type: '', assignedTo: '', deadline: '', channel: 'Social' };
  const btn = h('button', { class: 'btn primary' }, 'Create task');
  btn.onclick = () => {
    if (!f.task.trim()) { toast('Write a title.', true); return; }
    if (!f.type) { toast('Pick a type.', true); return; }
    if (!f.assignedTo) { toast('Pick who does it.', true); return; }
    if (!f.deadline) { toast('Pick a deadline.', true); return; }
    run(btn, 'task.quick', f, (d) => 'Task created under ' + d.id);
  };
  const hint = h('div');
  const showHint = () => fill(hint, f.channel === 'Outside' && f.assignedTo === S.me.id
    ? h('div', { class: 'note', style: 'background:var(--purple-bg)' }, h('div', { class: 't' }, '🔒 Personal task'),

/** n workdays after ymd (0 = the same day, or the next workday if it's a day off). */
function addWorkdays(ymd, n) {
  let d = ymd;
  for (let g = 0; !isWorkday(d) && g < 14; g++) d = addDays(d, 1);
  for (let i = 0; i < n; i++) {
    d = addDays(d, 1);
    for (let g = 0; !isWorkday(d) && g < 14; g++) d = addDays(d, 1);
  }
  return d;
}

   ====================================================================== */
/** What the two links of a post are called, by type: a video has a video and a cover. */
function linkLabels(type) {
  if (type === 'Video') return { media: '🎬 Video', cover: '🖼 Cover' };
  if (type === 'Blog') return { media: '📝 Article', cover: '🖼 Image' };
  return { media: '🎨 Design', cover: '🖼 Cover' };
}
function linkRoleOptions(type) {
  const l = linkLabels(type);
  return [{ value: 'Media', label: l.media }, { value: 'Cover', label: l.cover }];
}

/** Posts that are put together but have no publish date yet. */
function readyPosts() {
  return (S.state.calendar || []).filter((c) => !c.publishDate && c.status !== 'Published' && c.status !== 'Cancelled');
}

/** Posts marked published in the last 3 days, newest first: the place to undo a mistake. */
function postedPosts() {
  const st = S.state;
  const since = addDays(st.now.slice(0, 10), -3) + st.now.slice(10);
  return (st.calendar || []).filter((c) => c.status === 'Published' && c.publishedAt >= since)
    .sort((a, b) => b.publishedAt.localeCompare(a.publishedAt));
}

/** Dated posts before today that never went out: the app asks about them. */
function missedPosts() {
  return (S.state.calendar || []).filter((c) => c.publishDate && c.publishDate < S.state.today && c.status !== 'Published' && c.status !== 'Cancelled')
    .sort((a, b) => a.publishDate.localeCompare(b.publishDate));
}

/** A post's main file, or its carousel. */
function mediaOf(c) {
  return (c.mediaFiles || []).length > 1 ? filesLink(c.mediaFiles, { id: c.id }) : fileLink(c.mediaLink, { id: c.id, video: c.type === 'Video' });
