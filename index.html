/* "Stay logged in" keeps the sign-in in localStorage; otherwise only for this tab. */
const memStore = {};
const remember = () => { try { return localStorage.getItem('katal.remember') !== '0'; } catch (e) { return false; } };
const authStorage = {
  getItem(k) {
    try { const v = localStorage.getItem(k); return v !== null ? v : sessionStorage.getItem(k); } catch (e) { return k in memStore ? memStore[k] : null; }
  },
  setItem(k, v) {
    try { (remember() ? localStorage : sessionStorage).setItem(k, v); } catch (e) { memStore[k] = v; }
  },
  removeItem(k) {
    try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) { /* ignore */ }
    delete memStore[k];
  }
};
const sb = window.supabase.createClient(CFG.url, CFG.key, {
  auth: { storage: authStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
});
const emailOf = (username) => String(username || '').trim().toLowerCase() + '@' + CFG.emailDomain;

/* ======================================================================
   Server calls
   ====================================================================== */
function call(action, payload, opts) {
  const started = Date.now();
  return sb.auth.getSession().then(({ data }) => {
    const headers = { 'content-type': 'application/json', 'x-region': CFG.region };
    if (data && data.session) headers.authorization = 'Bearer ' + data.session.access_token;
    // Inside someone's account (the admin only): every call runs as them on the server. Not the chat's (opts.own):
    // there everyone always writes as themselves.
    const body = S.viewAs && !(opts && opts.own) ? Object.assign({}, payload || {}, { as: S.viewAs.id }) : payload || {};
    return fetch(CFG.url + '/functions/v1/' + CFG.fn, { method: 'POST', headers, body: JSON.stringify({ action, payload: body }) })
      .catch(() => { throw new Error('Connection problem. Check your internet and try again.'); });
  }).then((r) => r.json().catch(() => { throw new Error('Unexpected reply from the server.'); }))
    .then((res) => {
      S.timing = { action, server: res.ms || 0, total: Date.now() - started };
      if (res.ok) return res.data;
      const e = new Error(res.error);
      e.code = res.code;
      throw e;
    });
}

/** Runs an action from a button: spinner, state refresh, toast. Returns the data or null. */
async function run(btn, action, payload, okMsg, opts) {
  opts = opts || {};
  if (btn) {
    if (btn.disabled) return null;
    btn.disabled = true;
    btn.classList.add('busy');
  }
  // The sheet this was done from: when it's done, that one closes, not whatever is on top by then (Back pressed meanwhile).
  const owner = (topSheet() || {}).id;
  const seq = ++S.seq;
  S.pending++;
  try {
    const data = await call(action, payload);
    if (data && data.state && seq === S.seq) applyState(data.state);
    if (!opts.keepSheet) { if (owner && (topSheet() || {}).id === owner) closeSheet(); else refreshTopSheet(); }
    else if (opts.refresh) refreshTopSheet();
    render();
    if (okMsg) toast(typeof okMsg === 'function' ? okMsg(data) : okMsg);
    return data;
  } catch (e) {
    handleErr(e);
    return null;
  } finally {
    S.pending--;
    if (btn) { btn.disabled = false; btn.classList.remove('busy'); }
  }
}

/**
 * Instant action: change the screen first, save in the background.
 * If the save fails, the real data is loaded again and the error is shown.
 */
async function instant(mutate, action, payload, okMsg, undo, opts) {
  opts = opts || {};
  mutate(S.state);
  if (opts.keepSheet || S.undoing) refreshTopSheet(); else closeSheet();
  render();
  if (okMsg) toast(okMsg, false, undo);
  const seq = ++S.seq;
  S.pending++;
  try {
    const data = await call(action, payload);
    // Only the newest answer is applied, so a slow older answer can't undo a newer change.
    if (data && data.state && seq === S.seq) {
      applyState(data.state);
      if (!S.sheetOpen && !isTyping()) render();
      else if (opts.keepSheet) refreshTopSheet();
    }
    return data;
  } catch (e) {
    handleErr(e);
    loadState(true).catch(() => {});
    return null;
  } finally {
    S.pending--;
  }
}

function applyState(st) {
  S.state = st;
  S.me = st.me;
  S.lastLoad = Date.now();
  setTimeout(refreshLive, 0);
}

/* Parts of open sheets that follow fresh data (comment lists): they redraw themselves. */
const live = new Set();
function refreshLive() { live.forEach((fn) => fn()); }
/** A part of a sheet drawn by fn(), redrawn whenever fresh data arrives (e.g. Gemini's answer). */
function liveBox(fn) {
  const box = h('div');
  let drawn = false;
  const draw = () => {
    if (drawn && !box.isConnected) { live.delete(draw); return; }
    // Someone is typing in it: redraw once they leave the box, so their text and cursor stay.
    const a = document.activeElement;
    if (drawn && a && box.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { box.dataset.stale = '1'; return; }
    drawn = true;
    box.dataset.stale = '';
    fill(box, fn());
  };
  box.addEventListener('focusout', () => setTimeout(() => { if (box.dataset.stale === '1' && !box.contains(document.activeElement)) draw(); }, 0));
  draw();
  live.add(draw);
  return box;
}

function handleErr(e) {
  if (e.code === 'AUTH') {
    sb.auth.signOut({ scope: 'local' }).catch(() => {});
    stopListening();
    S.state = null;
    closeAllSheets();
    S.notice = e.message;
    S.screen = 'login';
    render();
    return;
  }
  if (e.code === 'PWCHANGE') {
    closeAllSheets();
    S.screen = 'pwchange';
    render();
    return;
  }
  toast(e.message, true);
}

function enterApp(st) {
  applyState(st);
  if (!S.ui.tab) S.ui.tab = isStaff() ? 'today' : 'tasks';
  S.screen = 'app';
  render();
  listen();
  if (!S.chat.loaded) chatFetch();
  armBack();
}

/* Live updates: the server changes one "version" row on every save; Supabase Realtime tells us. */
function listen() {
  if (S.channel) return;
  S.channel = sb.channel('katal-version')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'Meta' }, (msg) => {
      const v = msg && msg.new && msg.new.Value;
      if (v && S.state && v !== S.state.ver && !S.pending) loadState(true).catch(() => {});
    })
    // The chat: a message or a Clear changes its pulse, and only the chat is fetched.
    .on('postgres_changes', { event: '*', schema: 'public', table: 'Pulse' }, (msg) => {
      const v = msg && msg.new && msg.new.Value;
      if (v && v !== S.chat.pulse) chatFetch();
    })
    // Changes made while connecting are not sent, so check once when the connection is ready.
    .subscribe((status) => { if (status === 'SUBSCRIBED') checkForChanges(true); });
}
function stopListening() {
  if (S.channel) { sb.removeChannel(S.channel); S.channel = null; }
}

async function loadState(silent) {
  const before = S.state;
  const st = await call('state');
  if (silent && S.pending) return; // an action is saving; its answer brings fresh data
  applyState(st);
  if (!S.ui.tab) S.ui.tab = isStaff() ? 'today' : 'tasks';
  if (S.screen !== 'app') armBack();
  S.screen = 'app';
  listen();
  if (!S.chat.loaded) chatFetch();
  if (silent) announceChanges(before, st);
  if (!silent || (!S.sheetOpen && !isTyping())) render();
  else S.needsRender = true;
}

/** A note from the background (something new arrived): it waits for the message on screen, never covers it. */
function notice(msg) {
  const wait = (S.toastUntil || 0) - Date.now();
  if (wait > 0) setTimeout(() => notice(msg), wait + 250); else toast(msg);
}
/** A short note when something new arrives for this person. */
function announceChanges(before, after) {
  if (!before || !after) return;
  const old = new Set(before.tasks.map((t) => t.key));
  const oldC = new Set((before.comments || []).map((c) => c.key));
  const newC = (after.comments || []).filter((c) => !oldC.has(c.key) && !c.mine);
  if (newC.length) { notice('💬 ' + newC[newC.length - 1].by + ' on ' + newC[newC.length - 1].id + ': ' + newC[newC.length - 1].text.slice(0, 60)); return; }
  if (!isStaff()) {
    const fresh = after.tasks.filter((t) => !old.has(t.key));
    if (fresh.length) notice('🆕 New task: ' + fresh.map(taskLabel).join(', '));
    else {
      const edits = after.tasks.filter((t) => t.review === 'Edit' && (before.tasks.find((b) => b.key === t.key) || {}).review !== 'Edit');
      const okd = after.tasks.filter((t) => t.review === 'Approved' && (before.tasks.find((b) => b.key === t.key) || {}).review !== 'Approved');
      if (edits.length) notice('✎ Changes requested on ' + edits.map(taskLabel).join(', '));
      else if (okd.length) notice('✓ Approved: ' + okd.map(taskLabel).join(', '));
    }
    return;
  }
  const wasWaiting = new Set(before.tasks.filter((t) => t.status === 'Pending Approval').map((t) => t.key));
  const nowWaiting = after.tasks.filter((t) => t.status === 'Pending Approval' && !t.cancelled && t.review !== 'Approved' && !wasWaiting.has(t.key));
  const oldIdeas = new Set(before.ideas.map((i) => i.id));
  const newIdeas = after.ideas.filter((i) => !oldIdeas.has(i.id) && !i.mine);
  if (nowWaiting.length) notice('📥 Waiting your approval: ' + nowWaiting.map((t) => taskLabel(t) + ' · ' + t.assignee).join(', '));
  else if (newIdeas.length) notice('💡 New idea from ' + newIdeas.map((i) => i.by).join(', '));
}

function isTyping() {
  if (S.uploading) return true; // don't redraw the page under an upload
  const a = document.activeElement;
  return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT'));
}

async function boot() {
  restoreUi();
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) {
      try { await loadState(); reopenPage(); return; }
      catch (e) {
        if (e.code === 'PWCHANGE') {
          try { S.me = (await call('me')).me; } catch (e2) { /* ignore */ }
          S.screen = 'pwchange'; render(); return;
        }
        if (e.code !== 'AUTH') { showFatal(e.message); return; }
        await sb.auth.signOut({ scope: 'local' }).catch(() => {});
      }
    }
    S.status = await call('status');
    S.screen = 'login';
    render();
  } catch (e) {
    showFatal(e.message);
  }
}

/** After a refresh: the task, idea or post that was open opens again, scrolled where it was. */
function reopenPage() {
  const kept = S.keptDrafts;
  S.keptDrafts = null;
  // Brought back from before the refresh: the page shows it as not saved yet.
  if (kept && kept.items && S.me && kept.me === S.me.id && !S.viewAs) Object.keys(kept.items).forEach((k) => {
    const it = kept.items[k];
    const t = S.state.tasks.find((x) => x.key === k);
    if (!t) return;
    if (!it.typed) { it.typed = {}; ['fileLink', 'draftCaption', 'notes'].forEach((f) => { if ((it[f] || '') !== (t[f] || '')) it.typed[f] = true; }); }
    if (Object.keys(it.typed).length) S.drafts[k] = it;
  });
  const p = S.reopen;
  S.reopen = null;
  if (!p || S.screen !== 'app' || S.sheets.length) return;
  const st = S.state;
  if (p.k === 'task' && st.tasks.some((t) => t.key === p.key)) taskPage(p.key);
  else if (p.k === 'idea' && st.ideas.some((i) => i.id === p.id)) ideaPage(p.id);
  else if (p.k === 'post' && isAdmin() && st.calendar.some((c) => c.key === p.key)) calSheet(p.key);

function isAdmin() { return !!(S.me && S.me.role === 'Admin'); }

 * Where a task stands, in a word, the same everywhere (rows, cards, lists of the other parts). Colour only when it
 * needs the person looking: gold waits for the admin's OK, orange is a change asked of you, green is done.
 */
function taskState(t) {
  if (t.cancelled) return { text: 'Deleted', cls: 'faint' };
  if (t.review === 'Approved' || t.status === 'Done') return { text: '✓ Done', cls: 'green' };
  if (t.status === 'Pending Approval') return isAdmin() ? { text: 'To approve', cls: 'gold' } : { text: 'Waiting approval', cls: '' };
  if (t.review === 'Edit') return { text: 'Changes asked', cls: !isStaff() || t.assignedTo === S.me.id ? 'orange' : '' };
  if (waitingFor(t)) return { text: 'Waiting', cls: 'faint' };
  if (t.status === 'Started') return { text: 'In progress', cls: '' };

/**
 * A video's cover can't start before the video is delivered: the video it waits for, else null.
 * (Only videos: a blog's image and its upload are done side by side.)
 */
function waitingFor(t) {
  if (!isOpen(t) || t.status === 'Pending Approval' || t.review === 'Edit') return null;
  const others = t.related ? t.related.map((o) => Object.assign({ assignee: o.name }, o))
    : S.state.tasks.filter((o) => o.id === t.id && o.key !== t.key && !o.cancelled);
  // A step that waits for everything else on its idea (launching a campaign once its design is approved).
  if (t.after === 'all') {
    const rest = others.filter((o) => o.after !== 'all' && o.review !== 'Approved' && o.status !== 'Done');
    return rest.length ? { all: true, label: 'After the rest', what: rest.map((o) => o.task).join(', '), name: rest[0].assignee || '', task: rest[0] } : null;
  }
  if (t.linkRole !== 'Cover' || t.type !== 'Video') return null;
  const v = others.find((o) => (o.linkRole || 'Media') === 'Media' && o.review !== 'Approved' && o.status !== 'Done' && o.status !== 'Pending Approval');
  return v ? { label: 'After the video', what: 'the video', name: v.assignee || '', task: v } : null;
}
/** What kind of work: the icon at the start of its row. */
function kindIcon(type, role) {
  return role === 'Cover' || type === 'Design' ? 'image' : type === 'Video' ? 'video' : type === 'Blog' ? 'doc' : 'tasks';
}

function calBadge(s) {
  const cls = { Published: 'b-green', Final: 'b-blue', Cancelled: 'b-red' }[s] || '';
  return h('span', { class: 'badge ' + cls }, s === 'Published' ? '✓ Published' : s);
}

/** Social media work ends as a post; general work (print, events…) ends at Done. */
function channelField(f, onChange) {
  return field('Where', selectBox([{ value: 'Social', label: 'Social media · a post' }, { value: 'Outside', label: 'General · no post' }],
    f.channel || 'Social', (v) => { f.channel = v; if (onChange) onChange(v); }, { full: true }));
}

function isOpen(t) { return !t.cancelled && t.status !== 'Done' && t.review !== 'Approved'; }

/* ======================================================================
   Stages: where a piece of work stands, in the same words and colours everywhere
   ====================================================================== */
const STAGE_ORDER = ['todo', 'doing', 'approve', 'changes', 'done'];
const STAGE = {
  todo: { label: 'Not started', short: 'To do', c: 'var(--st-todo)', bg: 'var(--st-todo-bg)' },
  doing: { label: 'In progress', short: 'Doing', c: 'var(--st-doing)', bg: 'var(--st-doing-bg)' },
  approve: { label: 'To approve', short: 'Approve', c: 'var(--st-approve)', bg: 'var(--st-approve-bg)' },
  changes: { label: 'Changes asked', short: 'Changes', c: 'var(--st-changes)', bg: 'var(--st-changes-bg)' },
  done: { label: 'Done', short: 'Done', c: 'var(--st-done)', bg: 'var(--st-done-bg)' }
};
function stageOf(t) {
  if (t.review === 'Approved' || t.status === 'Done') return 'done';
  if (t.status === 'Pending Approval') return 'approve';
  if (t.review === 'Edit') return 'changes';
  if (t.status === 'Started') return 'doing';
  return 'todo';
}
/** The stage's word for whoever is looking: "To approve" is the admin's; the team sent it, the manager waits for it. */
function stageLabel(st, short) {
  if (st === 'approve' && !isAdmin()) return short ? 'Sent' : isStaff() ? 'Waiting approval' : 'Sent for approval';
  return short ? STAGE[st].short : STAGE[st].label;
}
function stageTag(st, text) {
  return h('span', { class: 'tc-state', style: '--sc:' + STAGE[st].c + ';--sbg:' + STAGE[st].bg }, text || stageLabel(st));
}
/** The admin's name (the team reads "Waiting for Orwah"). */
function adminName() { const a = (S.state.people || []).find((p) => p.role === 'Admin'); return a ? a.name : 'the admin'; }
const PRIO_RANK = { High: 0, Medium: 1, Low: 2, '': 3 };
/** On the board: urgent first, then what's late, then by deadline. */
function byBoard(a, b) {
  return (PRIO_RANK[a.priority || ''] - PRIO_RANK[b.priority || '']) || ((b.overdue ? 1 : 0) - (a.overdue ? 1 : 0)) ||
    (a.deadline || '9').localeCompare(b.deadline || '9') || a.id.localeCompare(b.id);
}

/** How urgent: three parts on the side of a card, high at the top. The admin and the manager tap one; tap it again to clear. */
function priorityBar(t) {
  const can = isStaff() && isOpen(t) && !t.cancelled;
  const seg = (lvl, cls) => {
    const on = t.priority === lvl;
    const props = { class: cls + (on ? ' on' : ''), title: lvl + ' priority' };
    if (!can) return h('span', props);
    return h('button', Object.assign(props, { type: 'button', 'aria-label': (on ? 'Clear ' : 'Set ') + lvl.toLowerCase() + ' priority', 'aria-pressed': on ? 'true' : 'false',
      onclick: (e) => { e.stopPropagation(); setPriority(t, on ? '' : lvl); } }));
  };
  return h('div', { class: 'pbar', role: can ? 'group' : null, 'aria-label': 'Priority' + (t.priority ? ': ' + t.priority : '') },
    seg('High', 'p-high'), seg('Medium', 'p-med'), seg('Low', 'p-low'));
}
function setPriority(t, pr) {
  const p = taskParts(t);
  instant((st) => { const x = st.tasks.find((k) => k.key === t.key); if (x) x.priority = pr; }, 'task.priority', { key: t.key, priority: pr },
    (pr ? pr + ' priority' : 'Priority cleared') + ' · ' + p.main, null, { keepSheet: true });
}

/** New comments on it: a small red mark with how many. Nothing once they're read (the page has the thread). */
function commentMark(id) {
  const u = unreadOf(id);
  const say = u + ' new comment' + (u === 1 ? '' : 's');
  return u ? h('span', { class: 'cmark', title: say, 'aria-label': say }, icon('comment'), String(u)) : null;
}

/** The deadline on a card: only the date turns red when it's late. */
function dueText(t, long) {
  if (!t.deadline) return null;
  const st = stageOf(t);
  const late = isOpen(t) && t.overdue && st !== 'approve';
  return h('span', { class: 'tc-due' + (late ? ' late' : '') }, (long ? dayLong(t.deadline) : dayShort(t.deadline)) + (late ? ' · late' : ''));
}

/**
 * A task's card, the same on the board, on Today and inside an idea: what kind of work, the short name, who and when.
 * o: { who: false (the team's own board), state: true (lists that mix stages) }
 */
function taskCard(t, o) {
  o = o || {};
  const st = stageOf(t);
  const w = st === 'todo' ? waitingFor(t) : null;
  const p = taskParts(t);
  const urgent = t.priority === 'High' && isOpen(t);
  const kind = (p.part || t.type || 'Task') + (t.channel === 'Outside' ? ' · General' : '');
  const go = () => openTask(t.key);
  return h('div', { class: 'tcard' + (urgent ? ' urgent' : '') + (w ? ' wait' : '') + (t.cancelled ? ' gone' : ''), role: 'button', tabindex: 0, 'data-key': t.key,
    style: '--c:' + STAGE[st].c, onclick: (e) => { if (!selecting(e)) go(); }, onkeydown: (e) => { if (e.key === 'Enter' && e.target === e.currentTarget) go(); } },
    priorityBar(t),
    h('div', { class: 'tc-main' },
      h('div', { class: 'tc-top' },
        h('span', { class: 'k' }, icon(kindIcon(t.type, t.linkRole)), kind),
        t.personal ? h('span', { class: 'k', title: t.createdBy === S.me.id ? 'Personal' : 'Personal · ' + t.personal }, icon('lock'), t.createdBy === S.me.id ? null : t.personal) : null,
        h('span', { class: 'sp' }),
        urgent ? h('span', { class: 'urgent-tag' }, 'URGENT') : null,
        // Lists that mix stages (Today, an idea's road) say where it stands, up here, so the name below keeps its room.
        o.state ? stageTag(st, w ? w.label : null) : null,
        checkBadge(t)),
      // New comments sit right after the name, in the room it leaves on its line, so nothing else moves.
      h('div', { class: 'tc-name' }, h('div', { class: 'tc-title', dir: 'auto' }, p.main), commentMark(t.id)),
      h('div', { class: 'tc-foot' },
        o.who === false ? null : personTag(t.assignee || ''),
        w && !o.state ? h('span', { class: 'tc-due' }, w.label) : st === 'done' ? h('span', { class: 'tc-due' }, '✓ ' + (t.deadline ? dayShort(t.deadline) : 'Done')) : dueText(t))));
}

/**
 * A board: one column per stage, side by side; on a phone they slide sideways (the counts above jump to one).
 * name keeps its place; cols: [{ id, label, short, c, items, count, empty, more }]; opts.start: the column it opens on.
 */
function boardView(name, cols, opts) {
  opts = opts || {};
  let boardEl;
  const strip = h('div', { class: 'bstrip', style: '--cols:' + cols.length }, cols.map((c) => h('button', {
    type: 'button', 'data-to': c.id, style: '--c:' + c.c, 'aria-label': c.label + ': ' + c.count,
    onclick: () => { const col = boardEl.querySelector('[data-col="' + c.id + '"]'); if (col) boardEl.scrollTo({ left: col.offsetLeft - 16, behavior: 'smooth' }); }
  }, h('span', { class: 'bar' }), h('span', { class: 'bl' }, h('span', { class: 'bn' }, String(c.count)), h('span', { class: 'bt' }, c.short || c.label)))));
  boardEl = h('div', { class: 'board', 'data-scroll': name, 'data-start': opts.start || '', style: '--cols:' + cols.length },
    cols.map((c) => h('section', { class: 'bcol', 'data-col': c.id, style: '--c:' + c.c, 'aria-label': c.label },
      h('div', { class: 'bcol-head' }, h('span', { class: 'dot' }), h('h2', null, c.label), h('span', { class: 'n' }, String(c.count))),
      h('div', { class: 'bcol-body' }, c.items.length ? c.items : h('div', { class: 'bcol-empty' }, c.empty || 'Nothing here.'), c.more || null))));
  // The counts above follow the column in view; on a phone the board is as tall as that column, and a column you
  // move to starts at its top.
  let current = '';
  const mark = () => {
    if (!boardEl.isConnected) return;
    const cols2 = Array.from(boardEl.querySelectorAll('.bcol'));
    let best = cols2[0], bd = Infinity;
    cols2.forEach((el) => { const d = Math.abs(el.offsetLeft - 16 - boardEl.scrollLeft); if (d < bd) { bd = d; best = el; } });
    strip.querySelectorAll('button').forEach((b) => b.classList.toggle('on', !!best && b.dataset.to === best.dataset.col));
    const phone = window.innerWidth < 900;
    boardEl.style.height = phone && best ? (best.offsetHeight + 6) + 'px' : '';
    if (phone && best && current && best.dataset.col !== current) {
      const head = (document.querySelector('.topbar') || { offsetHeight: 0 }).offsetHeight + strip.offsetHeight;
      const top = Math.round(boardEl.getBoundingClientRect().top + window.scrollY - head - 6);
      if (window.scrollY > top) window.scrollTo({ top, behavior: 'smooth' });
    }
    current = best ? best.dataset.col : '';
  };
  boardEl.fit = mark;
  boardEl.addEventListener('scroll', () => requestAnimationFrame(mark), { passive: true });
  requestAnimationFrame(mark);
  return [strip, boardEl];
}
window.addEventListener('resize', () => { document.querySelectorAll('#app .board').forEach((b) => b.fit && b.fit()); });

/** The tasks, as a board of stages. The admin and the manager see everyone's (faces to pick one); the team their own. */
function tasksView() {
  const st = S.state;
  const staff = isStaff();
  const q = (S.ui.q || '').trim().toLowerCase();
  const person = staff ? S.ui.person || '' : '';
  let all = st.tasks.filter((t) => !t.cancelled);
  if (person) all = all.filter((t) => t.assignedTo === person);
  if (q) all = all.filter((t) => (t.id + ' ' + t.task + ' ' + t.idea + ' ' + (t.assignee || '') + ' ' + (t.type || '')).toLowerCase().indexOf(q) >= 0);
  const by = {};
  STAGE_ORDER.forEach((k) => { by[k] = []; });
  all.forEach((t) => by[stageOf(t)].push(t));
  // Not started: what can start first; what waits for another task after it.
  by.todo.sort((a, b) => ((waitingFor(a) ? 1 : 0) - (waitingFor(b) ? 1 : 0)) || byBoard(a, b));
  ['doing', 'approve', 'changes'].forEach((k) => by[k].sort(byBoard));
  // Done: the last two weeks (the rest behind "Show older").
  const since = addDays(st.today, -14);
  by.done.sort((a, b) => (b.updatedAt || b.delivered || b.deadline || '').localeCompare(a.updatedAt || a.delivered || a.deadline || ''));
  const recent = by.done.filter((t) => (t.updatedAt || t.delivered || t.deadline || '').slice(0, 10) >= since);
  const doneShown = S.ui.doneAll ? by.done : recent;
  const card = (t) => taskCard(t, { who: staff ? undefined : false });
  const cols = STAGE_ORDER.map((k) => ({
    id: k, label: stageLabel(k), short: stageLabel(k, true), c: STAGE[k].c,
    items: (k === 'done' ? doneShown : by[k]).map(card), count: (k === 'done' ? doneShown : by[k]).length,
    empty: { todo: 'Nothing waiting to start.', doing: 'Nobody is on anything right now.', approve: isAdmin() ? 'Nothing waiting for you.' : 'Nothing waiting for approval.', changes: 'No changes asked.', done: 'Nothing done in the last two weeks.' }[k],
    more: k === 'done' && by.done.length > recent.length ? h('button', { type: 'button', class: 'bcol-more', onclick: () => { S.ui.doneAll = !S.ui.doneAll; render(); } },
      S.ui.doneAll ? 'Only the last two weeks' : 'Show older (' + (by.done.length - recent.length) + ')') : null
  }));
  // It opens on the column that needs this person most.
  const start = staff ? (isAdmin() && by.approve.length ? 'approve' : by.doing.length ? 'doing' : 'todo')
    : by.changes.length ? 'changes' : by.doing.length ? 'doing' : 'todo';
  const people = staff ? (st.users || st.people.map((x) => Object.assign({ active: true }, x)))
    .filter((u) => u.active && st.tasks.some((t) => t.assignedTo === u.id && !t.cancelled)) : [];
  const searching = S.ui.search === 'q' || !!S.ui.q;
  return h('div', null,
    h('div', { class: 'ph' }, h('h1', null, staff ? 'Tasks' : 'My tasks'),
      h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Search', 'aria-pressed': searching ? 'true' : 'false', style: searching ? 'color:var(--ink);border-color:var(--ink)' : '',
        onclick: () => { if (searching) { S.ui.search = ''; S.ui.q = ''; render(); } else { S.ui.search = 'q'; render(); focusSearch(); } } }, icon('search')),
      staff ? h('button', { type: 'button', class: 'btn primary newbtn', onclick: () => quickTaskSheet() }, icon('plus'), 'Task') : null),
    searching ? h('input', { class: 'in', type: 'search', enterkeyhint: 'search', placeholder: 'Search tasks, people, IDs…', value: S.ui.q || '', dir: 'auto', style: 'margin:-2px 0 10px',
      oninput: (e) => { S.ui.q = e.target.value; clearTimeout(S.searchT); S.searchT = setTimeout(() => { render(); focusSearch(); }, 250); } }) : null,
    people.length > 1 ? h('div', { class: 'faces', 'data-scroll': 'faces' },
      h('button', { type: 'button', class: 'face all' + (person ? '' : ' on'), onclick: () => { S.ui.person = ''; render(); } }, 'Everyone'),
      people.map((u) => h('button', { type: 'button', class: 'face' + (person === u.id ? ' on' : ''), onclick: () => { S.ui.person = person === u.id ? '' : u.id; render(); } },
        h('span', { class: 'avatar' }, u.name.charAt(0)), u.name))) : null,
    boardView('tasks' + (person ? ':' + person : ''), cols, { start }));
}
function focusSearch() {
  requestAnimationFrame(() => { const el = document.querySelector('.main input[type=search]'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } });
}

/* ======================================================================
   Comments: one thread per ID (idea → tasks → post)
   ====================================================================== */
function commentsOf(id) { return (S.state.comments || []).filter((c) => c.id === id).sort((a, b) => a.at.localeCompare(b.at)); }
function unreadOf(id) { return (S.state.unread || {})[id] || 0; }


/** Marks a thread as read (in the background; nobody else's screen changes). */
function markSeen(id) {
  S.seenBusy = S.seenBusy || {};
  if (!unreadOf(id) || S.seenBusy[id]) return;
  S.seenBusy[id] = true;
  delete S.state.unread[id];
  S.needsRender = true; // its red mark on the card goes once the page is closed
  call('comment.seen', { id }).catch(() => {}).finally(() => { delete S.seenBusy[id]; });
}

/** The other people on a piece of work (its tasks, the idea's author, the admin): who a comment can be for. */
function threadPeople(id) {
  const st = S.state;
  const out = [];
  const add = (n) => { if (n && n !== S.me.name && out.indexOf(n) < 0) out.push(n); };
  (st.tasks || []).filter((t) => t.id === id && !t.cancelled).forEach((t) => { add(t.assignee); (t.related || []).forEach((r) => add(r.name)); });
  const idea = (st.ideas || []).find((i) => i.id === id);
  if (idea && !idea.mine) add(idea.by);
  if (!isAdmin()) add(adminName());
  return out;
}
/** A comment's text with "@Name" picked out (yours stands out more). */
function withMentions(text) {
  const names = (S.state.people || []).map((p) => p.name).filter(Boolean).sort((a, b) => b.length - a.length);
  if (!names.length || String(text).indexOf('@') < 0) return text;
  const re = new RegExp('@(' + names.map((n) => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![\\w\u0600-\u06ff])', 'gi');
  const out = [];
  let last = 0;
  String(text).replace(re, (m, name, at) => {
    if (at > last) out.push(text.slice(last, at));
    const real = names.find((n) => n.toLowerCase() === name.toLowerCase()) || name;
    out.push(h('span', { class: 'mention' + (real === S.me.name ? ' me' : '') }, '@' + real));
    last = at + m.length;
    return m;
  });
  if (last < text.length) out.push(text.slice(last));
  return out;
}
/** The names a comment starts with ("@Nisreen @Mohammed …"). */
function leadingMentions(text, people) {
  const got = [];
  let rest = String(text || '');
  for (;;) {
    const m = /^\s*@(\S+)/.exec(rest);
    const name = m && people.find((n) => n.toLowerCase() === m[1].toLowerCase());
    if (!name) break;
    got.push(name);
    rest = rest.slice(m[0].length);
  }
  return { names: got, rest: rest.replace(/^\s+/, '') };
}

function commentRow(c, pinNo) {
  const canDel = c.mine || isAdmin();
  const hasPin = c.pinX !== null && c.pinX !== undefined;
  return h('div', { class: 'cmt' },
    h('span', { class: 'avatar' }, (c.by || '?').charAt(0)),
    h('div', { class: 'body' },
      h('div', { class: 'who' }, h('b', null, c.mine ? 'You' : c.by), ' · ' + fmtDT(c.at)),
      c.time || hasPin ? h('div', null,
        c.time ? h('span', { class: 'cmt-tag' }, '▶ ' + c.time) : null,
        hasPin ? h('button', { type: 'button', class: 'cmt-tag', onclick: () => previewSheet(c.file, { id: c.id, focus: c.key }) },
          '📍 ' + (pinNo && pinNo[c.key] ? 'Pin ' + pinNo[c.key] : 'On the image')) : null) : null,
      h('div', { class: 'txt', dir: 'auto' }, withMentions(c.text))),
    canDel ? h('button', { type: 'button', class: 'btn ghost tiny', style: 'color:var(--faint);align-self:flex-start', 'aria-label': 'Remove comment',
      onclick: () => ask('Remove this comment?', 'Remove', true).then((ok) => { if (ok) run(null, 'comment.delete', { key: c.key }, 'Comment removed', { keepSheet: true }); }) }, '✕') : null);
}

/** A moment in a video, from what was typed after "0:": 0:12 → 0:12, 0:75 → 1:15, 1.30 → 1:30, 12 → 0:12. */
function videoTime(v) {
  v = String(v || '').trim();
  if (!v || v === '0:' || v === ':') return '';
  const m = /^(\d{1,3})[:.,](\d{1,3})$/.exec(v);
  let s;
  if (m) s = Number(m[1]) * 60 + Number(m[2]);
  else if (/^\d{1,5}$/.test(v)) s = Number(v);
  else return v;
  const hh = Math.floor(s / 3600);
  const mm = Math.floor((s % 3600) / 60);
  const ss = String(s % 60).padStart(2, '0');
  return hh ? hh + ':' + String(mm).padStart(2, '0') + ':' + ss : mm + ':' + ss;
}

/**

 */

  opts = opts || {};

    if (drawn && !listEl.isConnected) { live.delete(draw); return; }
    drawn = true;
    const items = commentsOf(id);
    const fid = opts.file ? driveIdOf(opts.file) : '';

    items.filter((c) => c.pinX !== null && c.pinX !== undefined && (!fid || driveIdOf(c.file) === fid)).forEach((c, i) => { pinNo[c.key] = i + 1; });
    fill(listEl, items.length ? items.map((c) => commentRow(c, pinNo)) : null);
    if (opts.onDraw) opts.onDraw();
    if (listEl.isConnected || !drawn) markSeen(id);
  };
  draw();
  live.add(draw);
  setTimeout(() => markSeen(id), 0);
  const d = S.cdrafts[id] || (S.cdrafts[id] = { text: '', time: '' });
  const ta = area(d, 'text', { rows: 1, placeholder: opts.pin ? 'Tap the image, then write…' : 'Write a comment…' });
  // The time box starts as "0:"; typing the seconds after it is enough (0:75 becomes 1:15).
  const timeIn = opts.video ? h('input', { class: 'in time', dir: 'ltr', inputmode: 'decimal', 'aria-label': 'Minute and second in the video', value: d.time || '0:',
    // A tap lands the cursor where the finger was (maybe before the "0:"), so it moves to the end, after "0:".
    // With a time in it already (typed, or filled by pausing the video), tapping selects it so typing replaces it.
    onfocus: (e) => { const el = e.target; setTimeout(() => (el.value === '0:' ? el.setSelectionRange(2, 2) : el.select()), 0); },
    onclick: (e) => { const el = e.target; if (el.value === '0:') el.setSelectionRange(2, 2); },
    oninput: (e) => { d.time = e.target.value; },
    onblur: (e) => { const v = videoTime(e.target.value); d.time = v; e.target.value = v || '0:'; } }) : null;
  // Work several people share: who is it for? Picking a name starts the comment with "@Name", so they read it as theirs
  // (and only they get the message on Telegram, besides the admin). "Everyone" takes the names off.
  const people = threadPeople(id);
  const forRow = people.length > 1 ? h('div', { class: 'cmt-for', role: 'group', 'aria-label': 'Who it is for' }) : null;
  const setText = (v) => { d.text = v; ta.value = v; grow(ta); };
  const drawFor = () => {
    if (!forRow) return;
    const lead = leadingMentions(d.text, people);
    fill(forRow, h('span', { class: 'cf-l' }, 'For'),
      people.map((n) => h('button', { type: 'button', class: 'chip' + (lead.names.indexOf(n) >= 0 ? ' on' : ''), onclick: () => {
        const names = lead.names.indexOf(n) >= 0 ? lead.names.filter((x) => x !== n) : lead.names.concat([n]);

    if (vid.requestFullscreen) vid.requestFullscreen().catch(() => {});

/**
 * Drive's video player cuts its own buttons off when it's narrower than about 430px (most phones).
 * On a narrow screen it gets a wider page and is scaled down to fit, so every button shows.
 */
const PV_PLAYER_W = 480;
function fitPreviewPlayer(view, player) {
  const w = view.clientWidth, ht = view.clientHeight;

let mediaTok = null;

async function gapi(path, opts, tok) {
  const r = await fetch(CFG.driveApi + path, Object.assign({}, opts, { headers: Object.assign({ authorization: 'Bearer ' + tok }, (opts && opts.headers) || {}) }));
  const d = await r.json().catch(() => ({}));

  const found = await gapi('/drive/v3/files?pageSize=1&fields=files(id)&q=' + encodeURIComponent(q), {}, tok);
  if (found.files && found.files.length) return (folderIds[name] = found.files[0].id);

 */
async function driveUpload(file, ctx, onProgress, extra) {
  extra = extra || {};
  const { token, folderId } = await mediaToken();
  const parent = ctx.id ? await driveFolder(token, folderId, ctx.id) : folderId;
  const name = extra.name || [ctx.id, ctx.label, file.name].filter(Boolean).join(' · ');
  const meta = { name, parents: [parent] };

    method: 'POST',
    headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json; charset=UTF-8', 'x-upload-content-type': file.type || 'application/octet-stream' },

  if (!init.ok || !loc) throw new Error('Drive did not accept the upload (' + init.status + ').');

    if (lightJobs.note) { lightJobs.note.remove(); lightJobs.note = null; }
    window.removeEventListener('beforeunload', lightLeaving);
  });
  window.addEventListener('beforeunload', lightLeaving);
}
function lightLeaving(e) { e.preventDefault(); e.returnValue = ''; }
function lightNote(text) {

async function makeLightCopy(file, fid, ctx) {
  lightNote('Making a light copy for smooth playing…');
  const blob = await lightVideo(file, (p) => lightNote('Making a light copy for smooth playing · ' + Math.round(p * 100) + '%'));
  if (!blob) return;
  lightNote('Saving the light copy…');
  await driveUpload(blob, ctx, () => {}, { name: [ctx.id, ctx.label, 'light', file.name.replace(/\.\w+$/, '') + '.mp4'].filter(Boolean).join(' · '), properties: { lightOf: fid }, private: true });
}
/** A 720p H.264 copy of a video (the sound as it is), or null when it can't be made here or wouldn't be lighter. */
async function lightVideo(file, onProgress) {
  const mb = await import(CFG.mediabunny);
  const input = new mb.Input({ formats: mb.ALL_FORMATS, source: new mb.BlobSource(file) });
  const track = await input.getPrimaryVideoTrack();
  if (!track) return null;
  const w = track.displayWidth, ht = track.displayHeight;
  const k = LIGHT_SIDE / Math.min(w, ht);
  if (!(k < 1)) return null; // already small
  const even = (n) => Math.max(2, Math.round(n * k / 2) * 2);
  const output = new mb.Output({ format: new mb.Mp4OutputFormat({ fastStart: 'in-memory' }), target: new mb.BufferTarget() });
  const conv = await mb.Conversion.init({ input, output,
    video: { width: even(w), height: even(ht), fit: 'fill', codec: 'avc', bitrate: LIGHT_BITRATE, keyFrameInterval: 2 } });
  if (!conv.isValid || !conv.utilizedTracks.some((t) => t.type === 'video')) return null;
  conv.onProgress = onProgress;
  await conv.execute();
  const buf = output.target.buffer;
  return buf && buf.byteLength < file.size * 0.8 ? new Blob([buf], { type: 'video/mp4' }) : null;
}
/**
 * Upload button. ctx: { id, label, multi, text }. onDone gets the Drive link, or with multi

 */
function uploadButton(ctx, onDone) {

    if (!files.length) return;

    btn.disabled = true;

function render() {
  const app = document.getElementById('app');
  const screens = { login: loginScreen, recover: recoverScreen, pwchange: pwChangeScreen, app: appShell };
  const fn = screens[S.screen];
  if (!fn) return;
  const y = window.scrollY;

/*
 * Keeping your place: every scrolling box with data-scroll="name" (the board, each of its columns, a long list) keeps
 * where it was across redraws, tab changes and a reload; each tab keeps how far down the page was.
 */
function keepScrolls() {
  S.ui.scroll = S.ui.scroll || {};
  document.querySelectorAll('#app [data-scroll]').forEach((el) => { S.ui.scroll[el.dataset.scroll] = [el.scrollLeft, el.scrollTop]; });
}
function restoreScrolls() {
  const sc = S.ui.scroll || {};
  document.querySelectorAll('#app [data-scroll]').forEach((el) => {
    const v = sc[el.dataset.scroll];
    if (v) { el.scrollLeft = v[0]; el.scrollTop = v[1]; }
    else if (el.dataset.start) {
      // First time on this board: it opens on the column that needs this person most.
      const col = el.querySelector('[data-col="' + el.dataset.start + '"]');
      if (col) el.scrollLeft = Math.max(0, col.offsetLeft - 16);
    }
    if (!el.dataset.kept) {
      el.dataset.kept = '1';
      el.addEventListener('scroll', () => { S.ui.scroll[el.dataset.scroll] = [el.scrollLeft, el.scrollTop]; clearTimeout(S.saveT); S.saveT = setTimeout(saveUi, 400); }, { passive: true });
    }
  });
}

/* ----- The back button and keeping your place after a refresh ----- */
const UI_KEY = 'katal.ui';
function saveUi() {
  try {
    const ui = Object.assign({}, S.ui, { log: null });
    // The page open at the bottom (a task, an idea, a post) comes back after a refresh, where it was.
    const bottom = (S.sheets || [])[0];

    // Unsaved work on a task (a link, a caption, notes) too: only what was typed and differs from what's saved, only
    // for this person.
    const drafts = {};

      Object.keys(S.drafts || {}).forEach((k) => {
        const t = S.state.tasks.find((x) => x.key === k);
        const d = S.drafts[k];

        if (t && typed.length) drafts[k] = { fileLink: d.fileLink, draftCaption: d.draftCaption, notes: d.notes, typed: Object.fromEntries(typed.map((f) => [f, true])) };
      });

  } catch (e) { /* private mode */ }
}
function restoreUi() {
  try {
    const d = JSON.parse(sessionStorage.getItem(UI_KEY) || 'null');
    if (d && d.ui) { Object.assign(S.ui, d.ui, { log: null, expanded: {} }); S.restoreY = d.y || 0; S.tabHist = d.tabs || []; S.reopen = d.page || null; S.keptDrafts = d.drafts || null; }

/* Back closes what's open (the top page first), then goes back to the tab you came from; on the first tab it asks before leaving. */
function armBack() {
  try { if (!history.state || !history.state.katal) history.pushState({ katal: true }, ''); } catch (e) { /* not allowed here */ }
}
window.addEventListener('popstate', () => {
  if (S.screen !== 'app') return;
  if (document.querySelector('.ask-wrap')) { armBack(); document.querySelector('.ask-wrap').click(); return; }
  if (S.sheetOpen) { armBack(); requestClose(); return; }
  const prev = (S.tabHist || []).pop();
  if (prev && prev !== S.ui.tab) { goTab(prev, null, true); return; }
  const home = isStaff() ? 'today' : 'tasks';
  if (S.ui.tab !== home) { goTab(home, null, true); return; }
  if (Date.now() - (S.backAt || 0) < 2500) { try { history.back(); } catch (e) { /* ignore */ } return; }

/** Opens a tab (with optional filters) from the tab bar or a shortcut. Each tab keeps how far down it was. */
function goTab(tab, set, isBack) {
  S.ui.tabY = S.ui.tabY || {};
  S.ui.tabY[S.ui.tab] = window.scrollY;
  if (!isBack && S.ui.tab && S.ui.tab !== tab) { S.tabHist = (S.tabHist || []).filter((x) => x !== tab).concat([S.ui.tab]).slice(-8); }

/** Checks the current password, then sets the new one (Supabase Auth). */
async function changeOwnPassword(current, next) {
  if (!next || next.length < 8) throw new Error('Password must be at least 8 characters.');
  if (next === current) throw new Error('Pick a password different from the current one.');
  const username = S.me && S.me.username;
  if (!username) throw new Error('Please log in again.');
  const check = await sb.auth.signInWithPassword({ email: emailOf(username), password: current });
  if (check.error) throw new Error('Your current password is not correct.');
  const { error } = await sb.auth.updateUser({ password: next });
  if (error) throw new Error(error.message);
}

/* ======================================================================
   Team chat: one room for everyone. Each message comes under its writer's name, one after the other; a red count
   on the button up top says something new came. Only the admin can clear it (for everyone).
   ====================================================================== */
function chatReset() {
  S.chat = { messages: [], pulse: '', unread: 0, canClear: false, draft: '', loaded: false };
}
/** The newest message the server knows of (one being sent doesn't count yet). */
function chatLast() {
  const m = S.chat.messages.filter((x) => !x.pending);
  return m.length ? m[m.length - 1].key : '';
}
/** Brings what came since the last message here (everything, after a Clear). One at a time. */
async function chatFetch() {
  if (S.screen !== 'app') return;
  if (S.chatBusy) { S.chatAgain = true; return; }
  S.chatBusy = true;
  const room = S.chat; // an answer that comes after a log out is dropped
  try { const d = await call('chat.list', { after: chatLast() }, { own: true }); if (S.chat === room) applyChat(d); }
  catch (e) { if (e.code === 'AUTH') handleErr(e); }
  finally {
    S.chatBusy = false;
    if (S.chatAgain) { S.chatAgain = false; chatFetch(); }
  }
}
function applyChat(d) {
  if (!d) return;
  const c = S.chat;
  // What's being sent stays at the end until the server has it.
  const sending = c.messages.filter((m) => m.pending && !d.messages.some((x) => x.mine && x.text === m.text));
  const kept = d.full ? [] : c.messages.filter((m) => !m.pending);
  const have = new Set(kept.map((m) => m.key));
  c.messages = kept.concat(d.messages.filter((m) => !have.has(m.key)), sending);

/** The chat is open: what's in it counts as read (not while the phone is locked). */

/** "10:42" today, "Oct 14, 10:42" before. */
function chatTime(at) {

}

    return h('div', { class: 'cmsg' + (m.mine ? ' mine' : '') + (same ? ' cont' : '') + (m.pending ? ' pending' : '') + (c.drawn && !drawn.has(m.key) ? ' new' : '') },

function chatSheet() {
  const c = S.chat;
  c.list = h('div', { class: 'chat-list', role: 'log', 'aria-label': 'Messages' });
  c.drawn = null; c.drawnSig = null;
  const box = h('textarea', { class: 'in chat-in', rows: 1, dir: 'auto', maxlength: 1000, placeholder: 'Write to the team…', enterkeyhint: 'send', 'aria-label': 'Message',
    'data-nodirty': '1', oninput: () => { c.draft = box.value; grow(box); },
    // Enter sends on a computer (Shift+Enter: a new line); on a phone Enter is a new line and the button sends.
    onkeydown: (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !matchMedia('(pointer: coarse)').matches) { e.preventDefault(); send(); } } });
  box.value = c.draft || '';
  const send = async () => {
    const text = box.value.trim();
    if (!text) { box.focus(); return; }
    const mine = { key: 'sending' + Date.now(), by: '', mine: true, text, at: '', pending: true };
    c.messages.push(mine);
    box.value = ''; c.draft = ''; grow(box);
    c.stick = true; drawChat();
    try {
      const d = await call('chat.send', { text, after: chatLast() }, { own: true });
      c.messages = c.messages.filter((m) => m !== mine);
      c.stick = true;
      applyChat(d);
    } catch (e) {
      // Not sent: it goes back in the box.
      c.messages = c.messages.filter((m) => m !== mine);
      if (!box.value) { box.value = text; c.draft = text; grow(box); }
      if (chatOpen()) drawChat();
      handleErr(e);
    }
  };
  const canClear = c.loaded ? c.canClear : isAdmin() && !S.viewAs;
  const clear = canClear ? h('button', { type: 'button', class: 'btn tiny', onclick: async () => {
    if (!await ask('Clear the chat for everyone? The messages disappear from every screen.', 'Clear chat', true)) return;
    try { applyChat(await call('chat.clear', {}, { own: true })); toast('Chat cleared'); } catch (e) { handleErr(e); }

  clearInterval(S.chatTimer);
  S.chatTimer = setInterval(() => { if (!chatOpen()) { clearInterval(S.chatTimer); return; } if (!document.hidden) chatFetch(); }, 15000);
}

/*
 * New versions: the installed app looks for one when it comes back to the screen (and every 20 minutes). It reloads
 * itself while nothing is open, typed or uploading; otherwise it says so and reloads once that's done.
 */
function checkUpdate() {
  if (!window.KATAL_PWA || !navigator.serviceWorker) return;
  navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
}
function applyUpdate() {
  if (!S.updateReady) return;
  const busy = S.sheetOpen || isTyping() || S.uploading || S.pending || (typeof lightJobs !== 'undefined' && lightJobs.n);
  if (busy) {
    if (!S.updateToast) { S.updateToast = true; toast('A new version of the app is ready. It loads when you close this.'); }
    return;
  }
  keepScrolls(); saveUi();
  location.reload();
}
if (window.KATAL_PWA && navigator.serviceWorker) {
  S.hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (S.hadController) { S.updateReady = true; applyUpdate(); } S.hadController = true; });
  setInterval(checkUpdate, 20 * 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkUpdate(); applyUpdate(); } });
  document.addEventListener('focusout', () => setTimeout(applyUpdate, 300));
}

/** "2 hours ago", "yesterday 15:40", "Tue 13 Oct" (Dubai time). */
function agoText(dt) {
  if (!dt) return '';
  const now = S.state.now;
  const mins = (Date.parse(now.replace(' ', 'T') + ':00Z') - Date.parse(dt.replace(' ', 'T') + ':00Z')) / 60000;
  if (mins < 2) return 'just now';
  if (mins < 60) return Math.round(mins) + ' minutes ago';
  if (mins < 60 * 12 && dt.slice(0, 10) === now.slice(0, 10)) return Math.round(mins / 60) + ' hour' + (Math.round(mins / 60) === 1 ? '' : 's') + ' ago';
  return dayShort(dt.slice(0, 10)).replace('Today', 'today').replace('Yesterday', 'yesterday') + ' ' + dt.slice(11, 16);
}

/** Where the post of this work stands, in a few words. */
function postFact(t) {
  if (t.channel === 'Outside') return h('span', { class: 'muted' }, 'No post · general work');
  if ((S.state.flows || {})[t.type] && S.state.flows[t.type].post === false) return h('span', { class: 'muted' }, 'No post · ends at Done');
  const post = (S.state.calendar || []).find((c) => c.id === t.id && c.status !== 'Cancelled');
  if (post) return [post.publishDate ? dayShort(post.publishDate) : 'In Ready', postStateTag(post)];
  if (t.postDate) return 'Planned · ' + dayShort(t.postDate);
  return h('span', { class: 'muted' }, 'After approval');
}

/** The steps of a task, left to right, and where it is now. */
function stepsBar(st) {
  const at = { todo: 0, doing: 1, changes: 1, approve: 2, done: 3 }[st];
  const labels = ['Not started', st === 'changes' ? 'Changes asked' : 'In progress', isAdmin() ? 'To approve' : 'Approval', 'Done'];
  return h('div', { class: 'steps', style: '--sc:' + STAGE[st].c + ';--sbg:' + STAGE[st].bg },
    labels.map((l, i) => {
      const cls = st === 'done' ? 'past' + (i === 3 ? ' done-all' : '') : i < at ? 'past' : i === at ? 'now' : '';
      return h('div', { class: 'step ' + cls }, h('span', { class: 'o' }, cls.indexOf('past') >= 0 ? icon('check') : null), h('span', { class: 'sl' }, l));
    }));
}

/**
 * A task's page: its stage, what happens next and who does it, its facts, files, brief, the other parts of its post,
 * comments. The buttons at the bottom are what this person can do now: start, send it, approve, ask for changes.
 */
function taskPage(key, o) {
  o = o || {};
  const t = S.state.tasks.find((x) => x.key === key);
  if (!t) { if (o.replace) closeSheet(false, { noRebuild: true }); return; }
  const admin = isAdmin();
  const staff = isStaff();
  const mine = !staff || t.assignedTo === S.me.id;
  const personal = !!t.personal;
  const canEdit = admin || !!t.canEdit;
  const st = stageOf(t);
  const open = isOpen(t) && !t.cancelled;
  const w = st === 'todo' ? waitingFor(t) : null;
  const p = taskParts(t);
  const working = mine && open; // the person doing it (their files, caption, notes)
  const WORK = ['fileLink', 'draftCaption', 'notes'];
  // What this person typed and hasn't saved yet (a link, a caption, notes) stays while they move around the app and
  // across a refresh. Only what was typed is kept; everything else is read fresh from the saved task every time.
  const prev = S.drafts[t.key];
  const had = prev && prev.typed && Object.keys(prev.typed).length ? prev : null;
  const d = had || (S.drafts[t.key] = { fileLink: t.fileLink, draftCaption: t.draftCaption, notes: t.notes, typed: {} });
  WORK.forEach((k) => { if (!d.typed[k]) d[k] = t[k]; }); // what wasn't typed shows as saved now
  const f = { brief: t.brief, deadline: t.deadline }; // what the admin (or the manager who made it) changes here
  const edited = {};
  let dirty = !!had && (working || (admin && open)) && WORK.some((k) => d.typed[k] && (d[k] || '') !== (t[k] || ''));
  const markDirty = () => { if (!dirty) { dirty = true; drawFoot(); } };
  const typeWork = (k, v) => { d[k] = v; d.typed[k] = true; markDirty(); };
  const reopen = () => taskPage(key, { replace: true });
  const fresh = () => S.state.tasks.find((x) => x.key === t.key) || t;
  /**
   * What a save sends: only what was changed on this page (the server keeps the rest), so work sent meanwhile (a file,
   * "sent for approval") is never written over by what this page showed when it opened.
   */
  const savePayload = (extra) => {
    const out = { key: t.key };
    if (edited.brief) out.brief = f.brief;
    if (admin) WORK.forEach((k) => { if (d.typed[k]) out[k] = d[k]; }); // the admin may paste a link on anyone's task
    return Object.assign(out, extra || {});
  };
  const saveEdits = (btn, extra, msg) => run(btn, 'task.save', savePayload(extra), msg || 'Saved', { keepSheet: true, refresh: true })
    .then((r) => {
      if (r) { edited.brief = false; if (admin) { dirty = false; delete S.drafts[t.key]; } else dirty = WORK.some((k) => d.typed[k]); }
      return r;
    });
  /** The person doing it: what they typed (a link, a caption, notes), and maybe a new status. */
  const saveWork = async (btn, status) => {
    const sent = {};
    WORK.forEach((k) => { if (d.typed[k]) sent[k] = d[k]; });
    const c = fresh();
    const link = 'fileLink' in sent ? sent.fileLink : c.fileLink;
    if (sent.fileLink && !/^(https?:\/\/)?[^\s.]+\.[^\s]+$/i.test(sent.fileLink.trim())) { toast('The file link doesn\'t look like a link.', true); return; }
    if (status === 'Pending Approval' && !(link || '').trim() && !(c.files || []).length && t.linkRole !== 'Other') { toast('Add the file first.', true); return; }
    if (admin) { saveEdits(btn, status ? { status } : {}, status ? 'Sent' : 'Saved'); return; }
    // A brief changed here (a manager's own task) goes first, through a save.
    if (edited.brief && canEdit) {
      if (!await saveEdits(btn)) return;
      if (!status && !Object.keys(sent).length) return;
    }
    dirty = false;
    // Sent: the draft goes now (the page is drawn again with what was sent); if sending fails, what was typed comes
    // back into the draft the page uses now.
    const kept = S.drafts[t.key];
    delete S.drafts[t.key];
    const res = await instant((stt) => {
      const x = stt.tasks.find((k) => k.key === t.key);
      if (!x) return;
      Object.assign(x, sent);
      if ('fileLink' in sent && sent.fileLink !== c.fileLink) x.files = [];
      if (status) x.status = status;
      if (status === 'Pending Approval') { if (!x.delivered) x.delivered = stt.now; if (x.review === 'Edit') x.review = ''; x.color = x.late ? 'red' : 'none'; }
    }, 'task.update', Object.assign({ key: t.key }, sent, status ? { status } : {}),
    status === 'Pending Approval' ? 'Sent for approval ✓' : status === 'Started' ? 'Started · good luck' : status === 'Done' ? '✓ Done' : 'Saved', null, { keepSheet: true });
    if (!res && kept) {
      const cur = S.drafts[t.key];
      if (!cur) S.drafts[t.key] = kept;
      else Object.keys(kept.typed || {}).forEach((k) => { if (!cur.typed[k]) { cur[k] = kept[k]; cur.typed[k] = true; } });
      refreshTopSheet();
    }
  };
  /** Someone's own personal task (the manager's): the brief through a save, the work and "done" through an update. */
  const saveOwn = (btn, status) => saveWork(btn, status);
  /** Approve or mark done: what was typed here (a pasted link) is saved first; nothing happens if the page was left meanwhile. */
  const thenApprove = async (btn) => {
    const page = (topSheet() || {}).id;
    if (dirty && !await saveEdits(btn)) return;
    if ((topSheet() || {}).id !== page) return;
    approve(btn, t);
  };
  const markDone = (btn) => {
    if (personal && !admin) { saveOwn(btn, 'Done'); return; }
    thenApprove(btn);
  };

  // What happens next, in one line, for whoever is looking.
  const who = t.assignee || 'They';
  const boss = adminName();
  let next;
  if (t.cancelled) next = 'Deleted. Bring it back from ⋯ above.';
  else if (st === 'done') next = '✓ Approved' + (t.delivered ? ' · sent ' + agoText(t.delivered) : '') + '.';
  else if (st === 'approve') next = admin && !mine ? who + ' sent it ' + agoText(t.delivered) + '. It\'s waiting for you.' : mine ? 'Sent ' + agoText(t.delivered) + '. Waiting for ' + boss + '\'s approval.' : 'Waiting for ' + boss + '\'s approval.';
  else if (st === 'changes') next = [h('span', { class: 'note-t' }, mine ? boss + ' asked for changes' : 'Sent back to ' + who), h('span', { class: 'pre', dir: 'auto' }, t.reviewNotes || '')];
  else if (w) next = 'Starts after ' + (w.all ? 'the rest is approved (' + w.what + ')' : (w.name ? w.name + '\'s video' : 'the video')) + '.';
  else if (st === 'doing') next = mine ? (t.linkRole === 'Other' ? 'When it\'s done, ' + (admin ? 'mark it done.' : 'send it for approval.') : 'When it\'s ready, add the file and send it for approval.') : who + ' is working on it.';
  else next = mine ? (admin ? 'Yours to do.' : 'Tap Start when you begin.') : who + ' hasn\'t started yet.';

  const kindLine = h('div', { class: 'pk' }, icon(kindIcon(t.type, t.linkRole)),
    dots(p.part || t.type || 'Task', t.part && t.type ? t.type : null, t.channel === 'Outside' ? 'General' : null),
    personal ? h('span', { class: 'ptag', style: '--sc:var(--purple);--sbg:var(--purple-bg)' }, icon('lock'), t.createdBy === S.me.id ? 'Personal' : t.personal) : null);
  const prio = staff && open ? h('div', { class: 'prio', role: 'group', 'aria-label': 'Priority' },
    [['', 'None', '#d8d2c7'], ['High', 'High', 'var(--pr-high)'], ['Medium', 'Medium', 'var(--pr-med)'], ['Low', 'Low', 'var(--pr-low)']].map(([v, l, c]) =>
      h('button', { type: 'button', class: (t.priority || '') === v ? 'on' : '', style: '--pc:' + c, 'aria-pressed': (t.priority || '') === v ? 'true' : 'false',
        onclick: () => { if ((t.priority || '') !== v) setPriority(t, v); } }, h('i'), l))) : null;
  const dueBox = canEdit && open
    ? dateField(f.deadline, (v) => { f.deadline = v; saveEdits(null, { deadline: v }, 'Deadline: ' + dayShort(v)); }, { autosave: true, label: 'Deadline', short: true })
    : [t.deadline ? dayShort(t.deadline) : '—', open && t.overdue && st !== 'approve' ? h('span', { class: 'due red' }, 'late') : null];
  const idea = (S.state.ideas || []).find((i) => i.id === t.id);
  const ideaFact = idea && idea.source !== 'Quick'
    ? h('button', { type: 'button', class: 'flink', dir: 'auto', onclick: () => ideaPage(t.id) }, firstLine(idea.idea))
    : h('span', { class: 'muted', style: 'font-weight:500' }, 'Made as a task');
  const more = t.ideaDetails || restLines(t.idea);

  // The files: the person doing it (and the admin) adds, takes off and orders them; everyone else views them.
  const files = t.files && t.files.length ? t.files : (t.fileLink ? [t.fileLink] : []);
  let filesBox = null;
  if (working || (admin && open)) {
    const linkIn = input(d, 'fileLink', { type: 'url', dir: 'ltr', placeholder: S.state.media ? 'Or paste a link' : 'Paste the link', inputmode: 'url', oninput: (e) => typeWork('fileLink', e.target.value) });
    filesBox = h('div', null,
      filesEditor(files, { id: t.id, label: t.task, video: isVideoTask(t) }, (links) => {
        const had = files.length;
        d.fileLink = links[0] || ''; linkIn.value = d.fileLink; delete d.typed.fileLink; // saved right away below
        if (admin && !mine) { saveEdits(null, { files: links, fileLink: links[0] || '' }, links.length ? 'Files saved ✓' : 'File taken off'); return; }
        instant((stt) => { const x = stt.tasks.find((k) => k.key === t.key); if (x) { x.fileLink = links[0] || ''; x.files = links; } }, 'task.update', { key: t.key, files: links },
          links.length > had ? (links.length > 1 ? links.length + ' files ✓' : 'Uploaded ✓') + (st !== 'approve' ? ' Now send it for approval' : '') : links.length ? 'Files saved ✓' : 'File taken off', null, { keepSheet: true });
      }),
      linkIn);
  } else if (files.length) filesBox = fileTiles(files, { id: t.id, video: isVideoTask(t) });

  // The brief: the admin (and the manager who made it) change it here; Auto may be writing it.
  let briefBox = null;
  if (canEdit && open) {
    const briefIn = area(f, 'brief', { rows: 3, oninput: (e) => { f.brief = e.target.value; edited.brief = true; grow(e.target); markDirty(); } });
    let lastBrief = t.brief;
    briefBox = [briefIn, liveBox(() => {
      const cur = S.state.tasks.find((x) => x.key === t.key) || t;
      if (cur.brief !== lastBrief && f.brief === lastBrief) { f.brief = cur.brief; briefIn.value = f.brief; grow(briefIn); }
      lastBrief = cur.brief;
      briefIn.classList.toggle('auto', cur.autoBrief === 'Waiting');
      const tag = autoTag(cur.autoBrief, 'scribble', 'the brief');
      return tag ? h('div', { class: 'auto-under' }, tag) : null;
    })];
  } else if (t.brief) briefBox = h('div', { class: 'brief pre', dir: 'auto', style: 'margin:0' }, t.brief);

  const history = [
    t.createdAt ? ['Made', fmtDT(t.createdAt)] : null,
    t.delivered ? ['Sent', fmtDT(t.delivered) + (t.late ? ' · late' : '')] : null,
    st === 'done' && t.updatedAt ? ['Approved', fmtDT(t.updatedAt)] : null
  ].filter(Boolean);

  const body = h('div', null,
    kindLine,
    h('div', { class: 'ptitle-row' }, h('h1', { class: 'ptitle', dir: 'auto' }, p.main),
      canEdit && (open || admin) ? h('button', { type: 'button', class: 'btn tiny pedit', 'aria-label': 'Edit name, person, status', onclick: () => (admin ? editTaskSheet(fresh()) : managerEditSheet(fresh())) }, icon('edit'), 'Edit') : null),
    h('div', { class: 'ptags' },
      t.priority === 'High' && open ? h('span', { class: 'ptag', style: '--sc:#fff;--sbg:var(--pr-high)' }, 'URGENT') : null,
      prio),
    h('div', { class: 'pcard' }, stepsBar(st),
      h('div', { class: 'nextline', style: '--sc:' + (w ? 'var(--muted)' : STAGE[st].c) + ';--sbg:' + (w ? 'var(--gray-bg)' : STAGE[st].bg) }, next)),
    h('div', { class: 'fgrid' },
      h('div', null, h('div', { class: 'fl' }, 'Who'), h('div', { class: 'fv' }, personTag(t.assignee || S.me.name))),
      h('div', null, h('div', { class: 'fl' }, 'Due'), h('div', { class: 'fv' }, dueBox)),
      h('div', null, h('div', { class: 'fl' }, 'Idea'), h('div', { class: 'fv' }, ideaFact)),
      h('div', null, h('div', { class: 'fl' }, 'Post'), h('div', { class: 'fv' }, postFact(t)))),
    liveBox(() => checkNote(S.state.tasks.find((x) => x.key === t.key) || t)),
    filesBox ? [h('div', { class: 'psec' }, h('h2', null, 'Files'), files.length ? h('span', { class: 'n' }, String(files.length)) : null), h('div', { class: 'pcard', style: 'margin-top:0' }, filesBox)] : null,
    postStrip(t),
    briefBox || more || t.reference ? [h('div', { class: 'psec' }, h('h2', null, 'Brief')),
      h('div', { class: 'pcard', style: 'margin-top:0' }, briefBox,
        more ? h('div', { class: 'small muted pre', dir: 'auto', style: briefBox ? 'margin-top:10px' : '' }, more) : null,
        t.reference ? h('div', { style: 'margin-top:10px' }, refLinks(t.reference)) : null)] : null,
    working && !personal ? [h('div', { class: 'psec' }, h('h2', null, 'Your caption')),
      h('div', { class: 'pcard', style: 'margin-top:0' },
        field('Draft caption', area(d, 'draftCaption', { rows: 2, oninput: (e) => { typeWork('draftCaption', e.target.value); grow(e.target); } })),
        // Notes now go in the comments; notes written before stay here to read.
        t.notes ? h('div', { class: 'small muted pre', dir: 'auto', style: 'margin-top:8px' }, h('b', null, 'Earlier notes: '), t.notes) : null)] :
      !mine && (t.draftCaption || t.notes) ? [h('div', { class: 'psec' }, h('h2', null, 'From ' + who)),
        h('div', { class: 'pcard pre', dir: 'auto', style: 'margin-top:0;font-size:14px' }, [t.draftCaption, t.notes].filter(Boolean).join('\n\n'))] : null,
    history.length ? h('div', { class: 'small faint', style: 'margin:16px 2px 0' }, history.map(([k, v]) => k + ' ' + v).join(' · ')) : null,
    h('div', { class: 'pcard' }, commentsBox(t.id, { video: t.type === 'Video', title: false })));

  // The buttons at the bottom: what this person can do with it now.
  const foot = h('div', { style: 'display:contents' });
  const btn = (label, onclick, cls) => { const b = h('button', { type: 'button', class: 'btn ' + (cls || '') }, label); b.onclick = () => onclick(b); return b; };
  function drawFoot() {
    const b = [];
    if (t.cancelled) { if (canEdit) b.push(btn('Bring it back', () => setTaskCancelled(t, false), 'primary')); }
    else if (st === 'done') { /* nothing left to do */ }
    else if (admin && st === 'approve' && !mine) b.push(btn('Ask for changes', () => requestEditSheet(t), 'warn'), btn('✓ Approve', (x) => thenApprove(x), 'good'));
    else if (working && (admin || (personal && mine))) b.push(dirty ? btn('Save', (x) => (admin ? saveEdits(x) : saveOwn(x))) : null, btn('✓ Mark done', markDone, 'good'));
    else if (working) {
      if (st === 'approve') b.push(btn(dirty ? 'Save' : 'Sent ✓', (x) => saveWork(x), dirty ? 'primary' : ''));
      else if (st === 'todo') b.push(btn(w ? '▶ Start anyway' : '▶ Start', (x) => saveWork(x, 'Started')), btn('Send for approval', (x) => saveWork(x, 'Pending Approval'), 'primary'));
      else b.push(btn('Save', (x) => saveWork(x)), btn(st === 'changes' ? 'Send again' : 'Send for approval', (x) => saveWork(x, 'Pending Approval'), 'primary'));
    } else if (canEdit && dirty) b.push(btn('Save changes', (x) => saveEdits(x), 'primary'));
    fill(foot, b.filter(Boolean));
    const bar = foot.closest('.sheet-foot');
    if (bar) bar.style.display = b.filter(Boolean).length ? '' : 'none';
  }
  drawFoot();
  const menu = canEdit ? () => menuSheet(taskSheetTitle(t), [
    open || admin ? { label: 'Edit name, person, status', icon: 'edit', onclick: () => (admin ? editTaskSheet(fresh()) : managerEditSheet(fresh())) } : null,
    idea && idea.source !== 'Quick' ? { label: 'Open the idea', icon: 'ideas', onclick: () => ideaPage(t.id) } : null,
    t.cancelled ? { label: 'Bring it back', icon: 'undo', onclick: () => setTaskCancelled(t, false) }
      : { label: 'Delete task', icon: 'trash', danger: true, onclick: () => ask('Delete "' + taskLabel(t) + '"? It leaves ' + who + '\'s list.', 'Delete', true).then((ok) => { if (ok) setTaskCancelled(t, true); }) }
  ]) : null;
  openSheet(t.id + ' · ' + (p.part || t.type || 'Task'), body, foot, { page: true, back: o.back || 'Back', replace: o.replace, rebuild: reopen, dirty: () => dirty, menu, reopen: { k: 'task', key }, discard: () => { delete S.drafts[t.key]; } });
  drawFoot();
}


function approve(btn, t) {
  const ideaTasks = S.state.tasks.filter((x) => x.id === t.id && !x.cancelled && x.key !== t.key);
  const last = ideaTasks.every((x) => x.review === 'Approved');
  return instant((st) => {
    const x = st.tasks.find((k) => k.key === t.key);
    if (x) Object.assign(x, { review: 'Approved', status: 'Done', color: 'none', overdue: false });
  }, 'task.approve', { key: t.key }, last ? 'Approved · ' + t.id + ' is ready to post' : 'Approved');
}

function requestEditSheet(t) {
  const f = { key: t.key, note: '' };
  const btn = h('button', { class: 'btn primary' }, 'Send back');
  btn.onclick = () => {
    if (!f.note.trim()) { toast('Write what should change.', true); return; }
    instant((st) => {
      const x = st.tasks.find((k) => k.key === t.key);
      if (x) Object.assign(x, { review: 'Edit', reviewNotes: f.note.trim(), status: 'Started' });
    }, 'task.requestEdit', f, 'Sent back to ' + t.assignee);
  };
  openSheet('Send back · ' + t.id, h('div', null,
    h('p', { class: 'muted small', style: 'margin-top:0' }, t.assignee + ' gets it back with your note.'),
    field('What to change', area(f, 'note', { rows: 4 }))), btn);
}

const STATUS_OPTIONS = [{ value: '', label: 'Not started' }, { value: 'Started', label: 'Started' }, { value: 'Pending Approval', label: 'Pending approval' }, { value: 'Done', label: 'Done' }];

/** A task's files as pictures to tap (images, or a video's frame with ▶); a link elsewhere is a View chip. */
function fileTiles(files, ctx) {
  files = (files || []).filter(Boolean);
  const drive = files.filter((u) => driveIdOf(u));
  const other = files.filter((u) => !driveIdOf(u));
  if (!files.length) return null;
  const shown = drive.slice(0, 6);
  return [
    shown.length ? h('div', { class: 'tiles' }, shown.map((u, i) => h('button', {
      type: 'button', class: 'tile', 'aria-label': ctx.video ? 'Play the video' : 'View ' + (drive.length > 1 ? 'image ' + (i + 1) : 'the file'),
      onclick: (e) => { e.stopPropagation(); previewSheet(u, Object.assign({}, ctx, drive.length > 1 ? { files: drive, index: i } : {})); }
    },
    h('img', { src: CFG.driveWeb + '/thumbnail?id=' + driveIdOf(u) + '&sz=w300', alt: '', loading: 'lazy', onerror: (e) => e.target.remove() }),
    ctx.video ? h('span', { class: 'play' }, icon('play')) : null,
    i === shown.length - 1 && drive.length > shown.length ? h('span', { class: 'n' }, '+' + (drive.length - shown.length)) : null))) : null,
    other.length ? h('div', { class: 'files', style: 'margin-bottom:6px' }, other.map((u) => fileLink(u, ctx))) : null];
}
/**
 * The files of a piece of work, to manage: tap one to view it, ✕ takes it off (the file stays on Drive), ‹ › moves it
 * (a carousel goes out in this order), "+ Add" uploads more after the others. onChange gets the new list.
 * ctx: { id, label, video }.
 */
function filesEditor(files, ctx, onChange) {
  files = (files || []).filter(Boolean);
  const box = h('div', { class: 'fedit' });
  const changed = () => { draw(); onChange(files.slice()); };
  const move = (i, j) => { const x = files[i]; files[i] = files[j]; files[j] = x; changed(); };
  const draw = () => {
    const drive = files.filter((u) => driveIdOf(u));
    const add = uploadButton({ id: ctx.id, label: ctx.label, multi: true, text: files.length ? 'Add more' : 'Upload' }, (links) => { files = files.concat([].concat(links)); changed(); });
    fill(box,
      files.length ? h('div', { class: 'tiles' }, files.map((u, i) => {
        const fid = driveIdOf(u);
        return h('div', { class: 'tile' + (fid ? '' : ' link') },
          h('button', { type: 'button', class: 'tview', 'aria-label': 'View file ' + (i + 1),
            onclick: (e) => { e.stopPropagation(); if (!fid) { window.open(u, '_blank', 'noopener'); return; } previewSheet(u, Object.assign({ id: ctx.id, video: ctx.video }, drive.length > 1 ? { files: drive, index: drive.indexOf(u) } : {})); } },
          fid ? h('img', { src: CFG.driveWeb + '/thumbnail?id=' + fid + '&sz=w300', alt: '', loading: 'lazy', onerror: (e) => e.target.remove() }) : h('span', { class: 'lnk' }, 'Link ↗'),

/** Where an idea stands: to decide, in work (its tasks), ready to post, done. */
function ideaStage(i) {
  if (i.execution !== 'Approved') return 'decide';
  const tasks = (S.state.tasks || []).filter((t) => t.id === i.id && !t.cancelled);
  const post = (S.state.calendar || []).find((c) => c.id === i.id && c.status !== 'Cancelled');
  if (!isStaff()) return 'approved';
  if (!tasks.length || tasks.some(isOpen)) return 'work';
  const flow = (S.state.flows || {})[i.type];
  if (post && post.status !== 'Published') return 'post';
  if (!post && i.channel !== 'Outside' && (!flow || flow.post !== false)) return 'post';
  return 'done';
}

/** The ideas as a board: to decide, in work, ready to post, done (the team sees all ideas: discussed and approved). */

  let pool = st.ideas.filter((i) => !i.hidden && i.source !== 'Quick');
  if (!staff && S.ui.ideaScope === 'mine') pool = pool.filter((i) => i.mine);
  if (staff && S.ui.ideaBy) pool = pool.filter((i) => i.byId === S.ui.ideaBy);
  if (q) pool = pool.filter((i) => (i.id + ' ' + i.idea + ' ' + i.by + ' ' + (i.type || '')).toLowerCase().indexOf(q) >= 0);
  const keys = staff ? ['decide', 'work', 'post', 'done'] : ['decide', 'approved'];
  const by = {};
  keys.forEach((k) => { by[k] = []; });

  const newest = (a, b) => (b.updatedAt || b.submittedAt || '').localeCompare(a.updatedAt || a.submittedAt || '');
