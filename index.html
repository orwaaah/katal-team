/**
 * An idea's page. The admin decides (Approve), changes the details, the Scribble and the brief, plans its post day and
 * adds tasks; the manager and the team read it and comment.
 */
function ideaPage(id, o) {
  o = o || {};
  const i = S.state.ideas.find((x) => x.id === id);
  if (!i) { if (o.replace) closeSheet(false, { noRebuild: true }); return; }
  const admin = isAdmin();
  const approved = i.execution === 'Approved';
  const k = ideaStage(i);
  const f = { id: i.id, idea: i.idea, details: i.details || '', type: i.type, scribble: i.scribble || '', brief: i.brief || '', reference: i.reference || '', execution: i.execution, channel: i.channel };
  let dirty = false;
  const foot = h('div', { style: 'display:contents' });
  const drawFoot = () => {
    const save = dirty ? h('button', { type: 'button', class: 'btn primary', onclick: (e) => run(e.currentTarget, 'idea.save', f, 'Saved', { keepSheet: true, refresh: true }).then((r) => { if (r) dirty = false; }) }, 'Save changes') : null;
    fill(foot, save);
    const bar = foot.closest('.sheet-foot');
    if (bar) bar.style.display = save ? '' : 'none';
  };
  const mark = () => { if (!dirty) { dirty = true; drawFoot(); } };
  const ta = (key, rows, attrs) => area(f, key, Object.assign({ rows, oninput: (e) => { f[key] = e.target.value; grow(e.target); mark(); } }, attrs || {}));
  let body;
  if (admin) {
    const briefIn = ta('brief', 3);
    let lastBrief = i.brief;
    const toBrief = S.state.ai ? h('button', { type: 'button', class: 'btn tiny', style: 'margin:-6px 0 12px' }, '✨ Turn into brief') : null;
    if (toBrief) toBrief.onclick = () => { if (!f.scribble.trim()) { toast('Write the Scribble first.', true); return; } run(toBrief, 'idea.save', Object.assign({}, f, { askBrief: true }), 'Writing the brief…', { keepSheet: true }); };
    const sugBox = liveBox(() => {
      const cur = S.state.ideas.find((x) => x.id === i.id) || i;
      if (cur.brief !== lastBrief && f.brief === lastBrief) { f.brief = cur.brief; briefIn.value = f.brief; grow(briefIn); }
      lastBrief = cur.brief;
      briefIn.classList.toggle('auto', cur.agentStatus === 'Waiting');
      if (cur.agentStatus === 'Error') return h('div', { class: 'note orange' }, S.state.aiLimit ? aiLimitText() : 'Couldn\'t write it. Tap "Turn into brief" again.');
      const tag = autoTag(cur.agentStatus, cur.agentStatus === 'Copied' ? 'scribble' : '', 'the brief');
      return tag ? h('div', { class: 'auto-under' }, tag) : null;
    });
    body = [
      field(h('span', null, 'Details', h('i', null, 'what the idea is')), ta('details', 4, { placeholder: 'What the idea is: the text, the slides, the angle…' })),
      field(h('span', null, 'Scribble', h('i', null, 'only you')), ta('scribble', 3, { class: 'in private', placeholder: 'Your notes' })),
      toBrief,
      field(h('span', null, 'Brief', h('i', null, 'the team sees this')), briefIn), sugBox,
      field('Reference', ta('reference', 1, { dir: 'ltr', placeholder: 'Links to similar work' }))];
  } else {
    body = [
      i.details ? field('Details', h('div', { class: 'brief pre', dir: 'auto' }, i.details)) : null,
      i.brief ? field('Brief', h('div', { class: 'brief pre', dir: 'auto' }, i.brief)) : null,
      i.reference ? field('Reference', refLinks(i.reference)) : null];
    if (!body.filter(Boolean).length) body = null;
  }
  const flow = (S.state.flows || {})[i.type] || { post: true };
  // Once its post is made, the day is the post's: shown here, changed on the post.
  const madePost = (S.state.calendar || []).find((c) => c.id === i.id && c.status !== 'Cancelled');
  const plan = madePost
    ? h('button', { type: 'button', class: 'flink', onclick: () => (admin ? calSheet(madePost.key, null, { back: 'Back' }) : postViewSheet(madePost)) }, madePost.publishDate ? dayShort(madePost.publishDate) : 'In Ready')
    : admin && i.channel !== 'Outside' && flow.post !== false
    ? dateField(i.postDate || '', (v) => run(null, 'idea.plan', { id: i.id, postDate: v, postPlatform: v ? i.postPlatform || '' : '' }, v ? 'Planned for ' + dayShort(v) : 'No post day', { keepSheet: true, refresh: true }), { anyDay: true, clearable: true, autosave: true, placeholder: 'Pick a day', label: 'Post day', short: true })
    : i.postDate ? dayShort(i.postDate) : h('span', { class: 'muted', style: 'font-weight:500' }, i.channel === 'Outside' || flow.post === false ? 'No post' : '—');
  const content = h('div', null,
    h('div', { class: 'pk' }, icon('ideas'), dots(i.type, i.channel === 'Outside' ? 'General' : null, (i.mine ? 'You' : i.by) + ' · ' + fmtShort((i.submittedAt || '').slice(0, 10)))),
    h('div', { class: 'ptitle-row' }, h('h1', { class: 'ptitle', dir: 'auto' }, firstLine(i.idea)),
      admin ? h('button', { type: 'button', class: 'btn tiny pedit', 'aria-label': 'Edit name, type, where', onclick: () => editIdeaSheet(i) }, icon('edit'), 'Edit') : null),
    h('div', { class: 'ptags' }, h('span', { class: 'ptag', style: '--sc:' + (IDEA_STAGE[k] || IDEA_STAGE.approved).c + ';--sbg:' + (IDEA_STAGE[k] || IDEA_STAGE.approved).bg },
      k === 'decide' ? (isStaff() ? 'To decide' : 'Being discussed') : (IDEA_STAGE[k] || IDEA_STAGE.approved).label)),
    admin && !approved ? h('div', { class: 'pcard' },
      h('button', { type: 'button', class: 'btn good block', style: 'min-height:48px;font-size:15px', onclick: () => approveSheet(i, f) }, '✓ Approve'),
      h('div', { class: 'small muted', style: 'margin-top:8px;text-align:center' }, 'Approving makes its tasks, from Flows in More.')) : null,
    h('div', { class: 'fgrid' },
      h('div', null, h('div', { class: 'fl' }, 'By'), h('div', { class: 'fv' }, personTag(i.mine ? 'You' : i.by))),
      h('div', null, h('div', { class: 'fl' }, 'Type'), h('div', { class: 'fv' }, dots(i.type, i.variant || null))),
      h('div', null, h('div', { class: 'fl' }, 'Post day'), h('div', { class: 'fv' }, plan)),
      h('div', null, h('div', { class: 'fl' }, 'Ends'), h('div', { class: 'fv' }, i.channel === 'Outside' ? 'General · no post' : flow.post === false ? 'At Done · no post' : 'As a post'))),
    approved && isStaff() ? [h('div', { class: 'psec' }, h('h2', null, 'The road'),
      admin ? h('button', { class: 'btn ghost tiny', onclick: () => createTasksSheet(i, S.state.tasks.some((t) => t.id === i.id && !t.cancelled) ? [blankRow(i)] : null) }, '+ Task') : null), ideaRoad(i)] : null,
    body ? [h('div', { class: 'psec' }, h('h2', null, 'About it')), h('div', { class: 'pcard', style: 'margin-top:0' }, body)] : null,
    h('div', { class: 'pcard' }, commentsBox(i.id, { video: i.type === 'Video', title: false })));
  const del = () => {
    if (i.hidden) { instant((st) => { const x = st.ideas.find((q) => q.id === i.id); if (x) x.hidden = false; }, 'idea.restore', { id: i.id }, i.id + ' restored'); return; }
    const hard = deletable(i);
    ask(hard ? 'Delete ' + i.id + ' "' + firstLine(i.idea) + '"?' : i.id + ' already has work, so it will be hidden (not deleted).', hard ? 'Delete' : 'Hide', true).then((ok) => {
      if (!ok) return;
      instant((st) => {
        if (hard) st.ideas = st.ideas.filter((q) => q.id !== i.id);
        else { const x = st.ideas.find((q) => q.id === i.id); if (x) x.hidden = true; }
      }, 'idea.delete', { id: i.id }, hard ? i.id + ' deleted' : i.id + ' hidden',
      hard ? null : () => instant((st) => { const x = st.ideas.find((q) => q.id === i.id); if (x) x.hidden = false; }, 'idea.restore', { id: i.id }, i.id + ' restored'));
    });
  };
  const menu = admin ? () => menuSheet(i.id + ' · Idea', [
    { label: 'Edit name, type, where', icon: 'edit', onclick: () => editIdeaSheet(i) },
    approved ? { label: 'Add a task', icon: 'plus', onclick: () => createTasksSheet(i, S.state.tasks.some((t) => t.id === i.id && !t.cancelled) ? [blankRow(i)] : null) } : null,
    { label: i.hidden ? 'Bring it back' : 'Delete idea', icon: i.hidden ? 'undo' : 'trash', danger: !i.hidden, onclick: del }
  ]) : i.mine && i.execution === 'Later' ? () => menuSheet(i.id + ' · Idea', [{ label: 'Edit my idea', icon: 'edit', onclick: () => editOwnIdea(i) }]) : null;
  openSheet(i.id + ' · Idea', content, foot, { page: true, back: o.back || 'Back', replace: o.replace, rebuild: () => ideaPage(id, { replace: true, back: o.back }), dirty: () => dirty, menu, reopen: { k: 'idea', id } });
  drawFoot();
}

/** Admin: a new idea. */
function newIdeaAdminSheet() {
  const f = { idea: '', details: '', type: '', scribble: '', brief: '', reference: '', execution: 'Later', channel: 'Social' };
  const valid = () => {
    if (!f.idea.trim()) { toast('Give the idea a name.', true); return false; }
    if (f.idea.trim().length > NAME_MAX) { toast('Keep the name to ' + NAME_MAX + ' characters. The rest goes in Details.', true); return false; }
    if (!f.type) { toast('Pick a type.', true); return false; }
    return true;
  };
  const toBrief = S.state.ai ? h('button', { type: 'button', class: 'btn tiny', style: 'margin:-6px 0 12px' }, '✨ Turn into brief') : null;
  if (toBrief) {
    toBrief.onclick = async () => {
      if (!f.scribble.trim()) { toast('Write the Scribble first.', true); return; }
      if (!valid()) return;
      const d = await run(toBrief, 'idea.save', Object.assign({}, f, { askBrief: true }), 'Writing the brief…', { keepSheet: true });

    field(h('span', null, 'Name', h('i', null, 'short')), nameInput(f, 'idea', { placeholder: 'e.g. Missoni carousel' })),
    field('Details', detailsArea(f)),

    field(h('span', null, 'Scribble', h('i', null, 'only you')), area(f, 'scribble', { rows: 3, class: 'in private', placeholder: 'Your notes' })),
    toBrief,
    field(h('span', null, 'Brief', h('i', null, 'the team sees this')), area(f, 'brief', { rows: 3 })),
    field('Reference', area(f, 'reference', { rows: 1, dir: 'ltr', placeholder: 'Links to similar work' }))),
  editFoot((btn) => { if (valid()) run(btn, 'idea.save', f, (d) => 'Idea ' + d.id + ' saved'); }));
}

/** The rarely changed parts of an idea. */
function editIdeaSheet(i) {
  const f = { id: i.id, idea: i.idea, details: i.details || '', type: i.type, scribble: i.scribble, brief: i.brief, reference: i.reference || '', execution: i.execution, channel: i.channel };
  const types = Array.from(new Set(S.state.types.concat([i.type])));
  openSheet('Edit ' + i.id, h('div', null,
    field(h('span', null, 'Name', h('i', null, 'short')), nameInput(f, 'idea')),
    h('div', { class: 'two' }, field('Type', selectBox(types.map((x) => ({ value: x, label: x })), f.type, (v) => { f.type = v; }, { full: true })), channelField(f))),
  editFoot((btn) => {
    if (!f.idea.trim()) { toast('Give the idea a name.', true); return; }
    if (f.idea.trim().length > NAME_MAX) { toast('Keep the name to ' + NAME_MAX + ' characters. The rest goes in Details.', true); return; }

}

function deletable(i) {
  return i.execution !== 'Approved' && !S.state.tasks.some((t) => t.id === i.id) && !S.state.calendar.some((c) => c.id === i.id);
}

function blankRow(idea) {
  return { task: '', assignedTo: '', brief: idea.brief || '', deadline: '', linkRole: 'Media', after: '' };
}

/**
 * Approve: pick one deadline (and the way, when the type has two: a campaign as a design or a video); the type's flow
 * makes every task at once. A post day can be picked too: the post lands there once everything is approved.
 */
function approveSheet(i, f) {
  const ways = ((S.state.flows || {})[f.type] || {}).variants || [];
  const pick = { deadline: '', variant: ways[0] || '', postDate: i.postDate || '' };
  const steps = () => S.state.templates.filter((t) => t.active && t.type === f.type && (!t.variant || t.variant === pick.variant));
  const preview = h('div');
  const go = h('button', { class: 'btn primary' }, 'Approve');
  const custom = h('button', { class: 'btn' }, 'Customize');
  const foot = h('div', { style: 'display:contents' });
  const drawPreview = () => {
    const tpls = steps();
    const missing = tpls.filter((t) => !S.state.people.some((p) => p.id === t.assignee));
    fill(preview, tpls.length ? h('div', { class: 'related' },
      h('div', { class: 'head' }, 'Tasks that will be made'),
      tpls.map((t) => h('div', { class: 'r' }, personTag(S.state.names[t.assignee] || '— nobody —'), h('span', { class: 'muted grow' }, t.task),
        h('span', { class: 'small muted' }, t.after === 'all' ? 'after the rest' : pick.deadline ? dayShort(addWorkdays(pick.deadline, t.daysAfter)) : (t.daysAfter ? '+' + t.daysAfter + ' day' : ''))))) :
      h('div', { class: 'note orange' }, 'No flow for ' + f.type + ' yet. Set it in More → Flows, or use Customize.'),
      missing.length ? h('div', { class: 'note orange' }, 'A step has no active person. Fix it in More → Flows, or use Customize.') : null);
    fill(foot, tpls.length && !missing.length ? [custom, go] : [custom]);
  };
  go.onclick = async () => {
    if (!pick.deadline) { toast('Pick the deadline.', true); return; }
    await run(go, 'idea.approve', Object.assign({}, f, { id: i.id, deadline: pick.deadline, variant: pick.variant, postDate: pick.postDate }),
      (d) => d.created + ' task' + (d.created === 1 ? '' : 's') + ' made for ' + i.id);
  };
  custom.onclick = async () => {
    const d = await run(custom, 'idea.save', Object.assign({}, f, { execution: 'Approved', postDate: pick.postDate }, ways.length ? { variant: pick.variant } : {}), null, { keepSheet: true });
    if (d) { closeSheet(false, { noRebuild: true }); createTasksSheet(S.state.ideas.find((x) => x.id === i.id)); }
  };
  const flow = (S.state.flows || {})[f.type] || { post: true };
  const waysBox = h('div');
  const drawWays = () => fill(waysBox, ways.length ? field('Made as', h('div', { class: 'choices' }, ways.map((v) => h('button', {
    type: 'button', class: 'choice' + (pick.variant === v ? ' on' : ''), style: 'min-height:64px', onclick: () => { pick.variant = v; drawWays(); drawPreview(); }
  }, h('b', null, v), h('span', null, steps().filter((t) => t.variant === v).map((t) => (S.state.names[t.assignee] || '?') + ': ' + t.task).join(', ') || '—'))))) : null);
  drawWays();
  drawPreview();
  openSheet('Approve ' + i.id, h('div', null,
    h('div', { class: 'kv', style: 'margin-bottom:12px' }, h('b', { dir: 'auto' }, firstLine(f.idea))),
    waysBox,
    field('Deadline', dateField('', (v) => { pick.deadline = v; drawPreview(); })),
    f.channel !== 'Outside' && flow.post !== false ? field(h('span', null, 'Post day', h('i', null, 'optional')), dateField(pick.postDate, (v) => { pick.postDate = v; }, { anyDay: true, clearable: true, placeholder: 'When it should go out' })) : null,
    preview), foot);
  drawPreview();
}

/* ======================================================================
   Admin: Calendar
   ====================================================================== */
/** What the two links of a post are called, by type: a video has a video and a cover. */
function linkLabels(type) {
  if (type === 'Video') return { media: 'Video', cover: 'Cover' };
  if (type === 'Blog') return { media: 'Article', cover: 'Image' };
  return { media: 'Design', cover: 'Cover' };
}
function linkRoleOptions(type) {
  const l = linkLabels(type);
  return [{ value: 'Media', label: l.media }, { value: 'Cover', label: l.cover }, { value: 'Other', label: 'Not on the post (no file needed)' }];
}

/** Posts that are put together but have no publish date yet. */
function readyPosts() {
  return (S.state.calendar || []).filter((c) => !c.publishDate && c.status !== 'Published' && c.status !== 'Cancelled');
}

/**
 * What a post still needs before it can go out: its media, its platforms, a caption for each (being written counts as
 * on its way), and Orwah's OK (a Draft becomes Final). [] = nothing, it just needs its day.
 */
function postMissing(c) {
  const out = [];
  const on = Object.keys(c.platforms || {}).filter((p) => c.platforms[p]);
  if (!c.mediaLink && !(c.mediaFiles || []).length) out.push('Media');
  if (!on.length) out.push('Platforms');
  const caps = c.captions || {};
  const written = (x) => x && (x.status === 'Waiting' || ['text', 'story', 'title', 'spotlight', 'description'].some((k) => String(x[k] || '').trim()));
  if (on.length && on.some((p) => !written(caps[p])) && !String(c.caption || '').trim()) out.push('Captions');
  if (c.status === 'Draft') out.push('Your OK');
  return out;
}
function postNeedsYou(c) { return c.status !== 'Published' && c.status !== 'Cancelled' && postMissing(c).length > 0; }

/** Posts marked published in the last 3 days, newest first: the place to undo a mistake. */
function postedPosts() {
  const st = S.state;
  const since = addDays(st.now.slice(0, 10), -3) + st.now.slice(10);
  return (st.calendar || []).filter((c) => c.status === 'Published' && c.publishedAt >= since)
    .sort((a, b) => b.publishedAt.localeCompare(a.publishedAt));
}

/** Dated posts before today that never went out: the app asks about them. */
function missedPosts() {
  return (S.state.calendar || []).filter((c) => c.publishDate && c.publishDate < S.state.today && c.status !== 'Published' && c.status !== 'Cancelled')
    .sort((a, b) => a.publishDate.localeCompare(b.publishDate));
}

/** A post inside a week day: its name, platforms, and whether it went out. */
function weekEntry(c) {
  const on = Object.keys(c.platforms || {}).filter((p) => c.platforms[p]);
  const missed = c.status !== 'Published' && c.publishDate < S.state.today;
  const mark = c.status === 'Published' ? h('span', { class: 'wmark ok' }, '✓ Posted')
    : missed ? h('span', { class: 'wmark miss' }, 'Didn\'t go out')
      : c.status === 'Draft' ? h('span', { class: 'wmark draft' }, 'Draft') : null;
  return h('div', { class: 'wentry', onclick: () => (isAdmin() ? calSheet(c.key) : postViewSheet(c)) },
    h('div', { class: 'wt', dir: 'auto' }, firstLine(c.idea) || c.id),
    on.length || mark ? h('div', { class: 'wsub' }, on.length ? h('span', { class: 'pfs' }, on.map((p) => pfIcon(p, 11))) : null, mark) : null);
}

/** Where a post stands, in a word. */
function postState(c) {
  if (c.status === 'Published') return { text: '✓ Posted', cls: 'green' };
  if (c.status === 'Cancelled') return { text: 'Cancelled', cls: 'faint' };
  if (c.publishDate && c.publishDate < S.state.today) return { text: 'Didn\'t go out', cls: 'red' };
  if (isAdmin() && postNeedsYou(c)) return { text: 'Needs you', cls: 'gold' };
  if (c.status === 'Draft') return { text: 'Draft', cls: 'faint' };
  return { text: '✓ Ready', cls: 'green' };
}
function postStateTag(c) { const x = postState(c); return h('span', { class: 'st ' + x.cls }, x.text); }
/** A post in a list: the one row (name, where it stands; ID, platforms, day under it). Tapping opens it. */
function postRow(c, opts) {
  opts = opts || {};
  const on = Object.keys(c.platforms || {}).filter((p) => c.platforms[p]);
  const open = () => (opts.onclick ? opts.onclick(c) : isAdmin() ? calSheet(c.key) : postViewSheet(c));
  const needs = opts.needs && isAdmin() && postNeedsYou(c);
  return itemRow({
    onclick: open, icon: kindIcon(c.type), title: rowTitle(firstLine(c.idea) || c.id),
    state: needs ? h('span', { class: 'st gold' }, 'Needs ' + postMissing(c).join(', ').toLowerCase().replace('your ok', 'your OK')) : postStateTag(c),
    who: on.length ? h('span', { class: 'pfs' }, on.map((p) => pfIcon(p, 12))) : h('span', { class: 'faint' }, 'No platform'),
    when: c.publishDate ? dayShort(c.publishDate) : opts.needs ? '' : 'No date',
    marks: [commentMark(c.id), opts.postedAt && c.publishedAt ? h('span', { class: 'small faint' }, 'marked ' + fmtDT(c.publishedAt)) : null,
]
  });
}

/** A post's main file, or its carousel. */
function mediaOf(c) {
  return (c.mediaFiles || []).length > 1 ? filesLink(c.mediaFiles, { id: c.id }) : fileLink(c.mediaLink, { id: c.id, video: c.type === 'Video' });
}

/** Shown where generated text would be, once today's limit is used. */
function aiLimitText() { return 'Today\'s limit of ' + S.state.aiLimit + ' is used up. It works again tomorrow.'; }
/** Under a box Auto writes in: "Auto · writing…" while it writes; what went in instead when nothing came. */
function autoTag(status, from, what) {
  if (status === 'Waiting') return h('div', { class: 'auto-lbl' }, 'Auto · writing' + (what ? ' ' + what : '') + '… you can type here meanwhile');
  if (status !== 'Copied' && status !== 'Kept') return null;
  const text = status === 'Kept' || from === 'before' ? 'Kept the last one · Auto didn\'t write a new one'
    : from === 'scribble' ? 'Copied from the Scribble · Auto didn\'t write it'
    : from === 'none' ? 'Auto didn\'t write it · write it here'
    : 'Copied from the draft · Auto didn\'t write it';
  return h('div', null, h('span', { class: 'copied-tag' }, text), S.state.aiLimit ? h('div', { class: 'small muted', style: 'margin-bottom:6px' }, aiLimitText()) : null);
}

/** One-tap post moves: published, back to Ready, back to the calendar, cancelled. */
function calMove(c, action) {
  const msg = { published: c.id + ' marked as published', ready: c.id + ' moved back to Ready', cancel: c.id + ' cancelled',
    unpublish: c.id + ' back on the calendar' }[action];
  return instant((st) => {
    const x = st.calendar.find((k) => k.key === c.key);
    if (!x) return;
    const wasPublished = x.status === 'Published';
    if (action === 'published') { x.status = 'Published'; x.publishedAt = S.state.now; }
    if (action === 'cancel') { x.status = 'Cancelled'; x.publishedAt = ''; }
    if (action === 'ready') { x.publishDate = ''; x.status = x.status === 'Draft' ? 'Draft' : 'Final'; x.publishedAt = ''; }
    if (action === 'unpublish') { x.status = 'Final'; x.publishedAt = ''; }
    if (wasPublished && (action === 'ready' || action === 'unpublish')) x.postLinks = x.postLinks.map(() => '');
  }, 'cal.status', { key: c.key, action }, msg);
}

/** Read-only view of a post (team and manager). */
function postViewSheet(c) {
  const l = linkLabels(c.type);
  const on = Object.keys(c.platforms).filter((p) => c.platforms[p]);
  const links = c.postLinks.filter(Boolean);

/** The platforms a planned idea will go on: its type's usual ones, plus the one picked on the rhythm. */
function plannedPlatforms(i) {
  const base = (((S.state.settings || {}).postPlatforms || {})[i.type] || []).slice();
  if (i.postPlatform && base.indexOf(i.postPlatform) < 0) base.push(i.postPlatform);

/**
 * A platform's week (Sun–Sat) against its rule. The days are the rule (each wants one post, or r.min), but the week is
 * what counts: a post on another day covers a rule day still short — one already gone by first (it can't be posted any
 * more), else the nearest one ahead (LinkedIn on a Monday instead of the Tuesday: the Tuesday stops asking, the Friday
 * still does). Days gone by count what went out; today on, what is planned. Every platform works the same way.
 */
function rhythmWeek(p, d) {
  const st = S.state;
  if (!rhythmWeek.cache || rhythmWeek.cache.st !== st) rhythmWeek.cache = { st, m: {} };
  const sun = addDays(d, -DAYN.indexOf(wd(d)));
  const key = p + '|' + sun;
  if (rhythmWeek.cache.m[key]) return rhythmWeek.cache.m[key];
  const r = (st.rhythm || {})[p] || { days: [], min: 0, time: '' };
  const per = r.days.length ? Math.max(1, r.min || 0) : 0;
  const days = DAYN.map((x, i) => addDays(sun, i));
  const need = {}, short = {}, coveredBy = {};
  const surplus = [];
  days.forEach((x) => {
    const have = rhythmPosts(x, p).filter((c) => x >= st.today || c.status === 'Published').length + (x >= st.today ? plannedOn(x, p).length : 0);
    need[x] = per && r.days.indexOf(wd(x)) >= 0 ? per : 0;
    short[x] = Math.max(0, need[x] - have);
    for (let i = need[x]; i < have; i++) surplus.push(x);
  });
  const gap = (a, b) => Math.abs(ymdUTC(a) - ymdUTC(b));
  const gone = (x) => (x < st.today ? 0 : 1);
  surplus.forEach((from) => {
    const open = days.filter((x) => short[x] > 0).sort((a, b) => gone(a) - gone(b) || gap(a, from) - gap(b, from) || (a < b ? -1 : 1));
    if (open.length) { short[open[0]]--; coveredBy[open[0]] = from; }
  });
  return (rhythmWeek.cache.m[key] = { r, per, need, short, coveredBy });
}

/**

 * didn't go out or a rule day was missed; otherwise an empty square. A number when there are more.

  const w = rhythmWeek(p, d);
  const posts = rhythmPosts(d, p);
  const plan = d >= S.state.today ? plannedOn(d, p) : [];
  const past = d < S.state.today;
  const short = w.short[d];
  const n = posts.length + plan.length;
  let cls = '', mark = '';
  if (posts.length && past && posts.some((c) => c.status !== 'Published')) { cls = 'miss'; mark = '✕'; }
  else if (n) {
    const ready = !plan.length && posts.every((c) => c.status === 'Published' || (c.status !== 'Draft' && !(isAdmin() && postNeedsYou(c))));
    cls = ready ? 'post' : 'work';
    mark = short ? n + '/' + w.need[d] : n > 1 ? String(n) : ready ? '✓' : '●';
  } else if (short) { cls = past ? 'miss' : 'need'; mark = past ? '✕' : '+'; }
  return { cls, mark, need: w.need[d], short, posts, plan, r: w.r, coveredBy: w.coveredBy[d] || '' };

/* ======================================================================
   Play: a building on an island. Guess the word letter by letter; each wrong letter takes a floor off.
   ====================================================================== */
/** The keys in the order of a keyboard, row by row. */
const GAME_ROWS = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'].map((r) => r.split(''));
function loadGame(force) {
  if (S.gameBusy || (!force && S.game && Date.now() - S.gameAt < 60000)) return;
  S.gameBusy = true;
  call('game.state').then((d) => { S.game = d; S.gameAt = Date.now(); S.gameFailed = false; })
    .catch((e) => { S.gameFailed = true; handleErr(e); })
    .finally(() => { S.gameBusy = false; if (S.ui.tab === 'play' && !S.sheetOpen) render(); });
}
async function gameAct(action, payload, btn) {
  if (S.gamePending) return;
  S.gamePending = true;
  if (btn) btn.classList.add('busy');
  try {
    const d = await call(action, payload);
    const before = S.game && S.game.game;
    S.game = d; S.gameAt = Date.now();
    S.gameFx = d.miss ? { fall: (before ? before.floors - before.wrong : 0) - 1 }
      : action === 'game.start' && d.game && !before ? { start: true }
        : action === 'game.guess' && !d.game && d.last && d.last.status === 'Won' ? { won: true } : null;
    if (d.repeat) { toast(d.repeat + ' was tried already. Nothing changes.'); S.gameFx = { shake: d.repeat }; }
    else if (action === 'game.guess' && !d.game && d.last) toast(d.last.status === 'Won' ? '✓ You saved the building! The word was ' + d.last.word : 'The building fell. The word was ' + d.last.word);
  } catch (e) { handleErr(e); } finally {
    S.gamePending = false;
    render();

 * A letter: one already tried says so at once (nothing changes); letters typed quickly one after another wait their
 * turn, so none is lost.
 */
function guessLetter(ch) {
  const g = S.game && S.game.game;
  if (!g) return;
  S.gameQueue = S.gameQueue || [];
  if (g.guesses.indexOf(ch) >= 0 || S.gameQueue.indexOf(ch) >= 0 || S.gameNow === ch) {
    toast(ch + ' was tried already. Nothing changes.');
    S.gameFx = { shake: ch };
    render();
    return;
  }
  S.gameQueue.push(ch);
  nextGuess();
}
async function nextGuess() {
  if (S.gamePending || !S.gameQueue.length) return;
  if (!S.game || !S.game.game) { S.gameQueue = []; return; }
  S.gameNow = S.gameQueue.shift();
  await gameAct('game.guess', { letter: S.gameNow });
  S.gameNow = '';

}

function copyText(s) {
  const fallback = () => {
    const t = h('textarea', { style: 'position:fixed;opacity:0' });
    t.value = s;
    document.body.append(t);
    t.select();
    try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Select the text and copy it.', true); }
    t.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(() => toast('Copied'), fallback);
  else fallback();
}

          h('button', { class: 'btn primary small', onclick: (e) => run(e.currentTarget, 'settings.save', adv, 'Saved') }, 'Save')))));
}

/** One platform: how its caption is written (format, examples, notes), or remove it. */
function platformSheet(name) {
  const set = S.state.settings;
  const x = (set.captionStyles || {})[name] || { format: 'instagram', examples: '', notes: '' };
  const f = { format: x.format || 'instagram', examples: x.examples || '', notes: x.notes || '' };
  const save = h('button', { class: 'btn primary' }, 'Save');
  save.onclick = () => run(save, 'settings.save', { captionStyles: { [name]: f } }, name + ' saved');
  const del = h('button', { class: 'btn danger' }, 'Remove');
  del.onclick = async () => {
    if (set.platforms.length <= 1) { toast('Keep at least one platform.', true); return; }
    if (!await ask('Remove ' + name + '? Posts keep what they had.', 'Remove', true)) return;
    run(del, 'settings.save', { platforms: set.platforms.filter((p) => p !== name) }, name + ' removed');
  };
  openSheet(name, h('div', null,
    field(h('span', null, 'Writes with', h('i', null, 'your caption skill')), selectBox(CAP_SKILLS, f.format, (v) => { f.format = v; }, { full: true })),
    h('div', { class: 'small muted', style: 'margin:-6px 0 14px' }, 'The skill decides the structure, the CTA, the hashtags and the emojis. What you add below comes after it, and the skill wins when they disagree.'),
    field(h('span', null, 'Extra notes', h('i', null, 'optional')), area(f, 'notes', { rows: 3, dir: 'ltr', placeholder: 'Anything to add for ' + name })),
    field(h('span', null, 'Examples', h('i', null, 'optional · for the voice · a line with --- between two')), area(f, 'examples', { rows: 6, dir: 'ltr', placeholder: 'Past posts you like' }))), [del, save]);
}

/** App: name, idea types, work hours. */
function appSettingsView() {
  const st = S.state;
  const set = st.settings;
  const listEditor = (key, items, label) => {
    const items2 = items.slice();
    const box = h('div');
    const add = { v: '' };
    const draw = () => fill(box,
      h('div', { class: 'chips' }, items2.map((x, i) => h('span', { class: 'chip' }, x,
        h('button', { type: 'button', class: 'btn ghost tiny', style: 'min-height:20px;padding:0 2px;color:var(--faint)', 'aria-label': 'Remove ' + x, onclick: () => { items2.splice(i, 1); draw(); } }, '✕')))),
      h('div', { class: 'row', style: 'margin-top:10px' },
        h('div', { class: 'grow' }, input(add, 'v', { placeholder: 'Add a ' + label.toLowerCase() })),
        h('button', { class: 'btn small', onclick: () => { const v = add.v.trim(); if (v) { items2.push(v); add.v = ''; draw(); } } }, 'Add')),
      h('button', { class: 'btn primary small', style: 'margin-top:10px', onclick: (e) => run(e.currentTarget, 'settings.save', { [key]: items2 }, 'Saved') }, 'Save'));
    draw();
    return box;
  };
  const hours = {};
  DAYN.forEach((d) => { hours[d] = set.hours[d] ? Object.assign({}, set.hours[d]) : null; });
  const hoursBox = h('div');
  const drawHours = () => fill(hoursBox,
    DAYN.map((d, i) => h('div', { class: 'row', style: 'padding:6px 0;border-bottom:1px solid var(--line)' },
      h('span', { style: 'width:44px;font-weight:550' }, d),
      selectBox([{ value: 'on', label: 'Work' }, { value: 'off', label: 'Off' }], hours[d] ? 'on' : 'off', (v) => { hours[d] = v === 'on' ? (hours[d] || { start: '09:00', end: '18:00' }) : null; drawHours(); }),
      hours[d] ? h('div', { class: 'row' },
        h('input', { class: 'in', type: 'time', style: 'width:auto;min-height:34px;padding:4px 8px', value: hours[d].start, onchange: (e) => { hours[d].start = e.target.value; } }), '–',
        h('input', { class: 'in', type: 'time', style: 'width:auto;min-height:34px;padding:4px 8px', value: hours[d].end, onchange: (e) => { hours[d].end = e.target.value; } })) : null)),
    h('button', { class: 'btn primary small', style: 'margin-top:10px', onclick: (e) => run(e.currentTarget, 'settings.save', { hours }, 'Work hours saved') }, 'Save'));
  drawHours();
  const app = { appName: set.appName };
  return h('div', null,
    h('div', { class: 'section', style: 'margin-top:4px' }, h('h2', null, 'Idea types')), h('div', { class: 'card' }, listEditor('types', set.types, 'Type')),
    h('div', { class: 'section' }, h('h2', null, 'Work hours')), h('div', { class: 'card' }, hoursBox),
    h('div', { class: 'section' }, h('h2', null, 'App name')), h('div', { class: 'card' }, input(app, 'appName'),
      h('button', { class: 'btn primary small', style: 'margin-top:10px', onclick: (e) => run(e.currentTarget, 'settings.save', { appName: app.appName }, 'Saved') }, 'Save')));
}

function templateSheet(key, type) {
  const t = key ? S.state.templates.find((x) => x.key === key) : null;
  const f = t ? { key: t.key, type: t.type, task: t.task, assignee: t.assignee, note: t.note, active: t.active, daysAfter: t.daysAfter, linkRole: t.linkRole, after: t.after || '', variant: t.variant || '' }
    : { type: type || '', task: '', assignee: '', note: '', active: true, daysAfter: 0, linkRole: 'Media', after: '', variant: '' };
  const btn = h('button', { class: 'btn primary' }, 'Save');
  btn.onclick = () => run(btn, 'template.save', f, 'Saved');
  const ways = Array.from(new Set(S.state.templates.filter((x) => x.type === f.type).map((x) => x.variant || '').filter(Boolean)));
  const wayIn = input(f, 'variant', { placeholder: 'e.g. Design', list: 'ways-' + f.type });
  openSheet(t ? 'Step' : 'New step', h('div', null,
    field(h('span', null, 'Task', h('i', null, 'short name')), nameInput(f, 'task')),
    h('div', { class: 'two' },
      field('Type', selectBox(S.state.types.map((x) => ({ value: x, label: x })), f.type, (v) => { f.type = v; }, { full: true })),
      field('Person', selectBox(peopleOptions(true), f.assignee, (v) => { f.assignee = v; }, { full: true }))),
    h('div', { class: 'two' },
      field('Starts', selectBox([{ value: '', label: 'Right away' }, { value: 'all', label: 'After the rest is approved' }], f.after, (v) => { f.after = v; }, { full: true })),
      field('Deadline', selectBox([0, 1, 2, 3, 5].map((n) => ({ value: String(n), label: n ? '+' + n + ' workday' + (n > 1 ? 's' : '') : 'Same day' })), String(f.daysAfter), (v) => { f.daysAfter = Number(v); }, { full: true }))),
    h('div', { class: 'two' },
      field('Goes on the post as', selectBox(linkRoleOptions(f.type), f.linkRole, (v) => { f.linkRole = v; }, { full: true })),
      field(h('span', null, 'Way', h('i', null, 'only if made two ways')), [wayIn, h('datalist', { id: 'ways-' + f.type }, ways.map((w) => h('option', { value: w })))])),
    field(h('span', null, 'Note', h('i', null, 'added under the brief')), area(f, 'note', { rows: 2 })),
    field('Active', selectBox([{ value: 'on', label: 'On' }, { value: 'off', label: 'Off' }], f.active ? 'on' : 'off', (v) => { f.active = v === 'on'; }, { full: true }))), btn);
}

/* ----- Activity log ----- */
function describeKey(l) {
  const st = S.state;
  if (l.entity === 'Settings') return l.key;
  if (l.entity === 'Task') { const t = st.tasks.find((x) => x.key === l.key); return t ? t.id + ' · ' + t.task + ' (' + t.assignee + ')' : 'task'; }
  if (l.entity === 'Calendar') { const c = st.calendar.find((x) => x.key === l.key); return c ? 'calendar ' + c.id : 'calendar'; }
  if (l.entity === 'User') return st.names[l.key] || l.key;
  if (l.entity === 'Template') { const t = (st.templates || []).find((x) => x.key === l.key); return t ? 'template ' + t.type + ' · ' + t.task : 'template'; }
  return l.entity === 'Idea' ? l.key : l.entity + ' ' + l.key;
}
/** Makes log values readable: dates, people, yes/no. */
function niceVal(v) {
  if (!v) return '—';
  if (v === 'TRUE') return 'Yes';
  if (v === 'FALSE') return 'No';
  if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(v)) return fmtDT(v);
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return fmtD(v);
  v = v.replace(/\bU\d{3,}\b/g, (id) => S.state.names[id] || id);
  return v.length > 80 ? v.slice(0, 80) + '…' : v;
}
/** One save writes one log row per field; show them as one entry. */
function groupLog(rows) {
  const out = [];
  rows.forEach((l) => {
    const g = out[out.length - 1];
    if (g && g.at === l.at && g.user === l.user && g.action === l.action && g.key === l.key && g.entity === l.entity) g.items.push(l);
    else out.push({ at: l.at, user: l.user, action: l.action, entity: l.entity, key: l.key, items: [l] });
  });
  return out;
}
function logRow(g) {
  return h('div', { class: 'log-row' },
    h('div', null, h('b', null, g.user), ' · ', g.action.toLowerCase(), ' ', h('span', null, describeKey(g))),
    g.items.map((l) => l.field
      ? h('div', { class: 'small', dir: 'auto' }, l.field + ': ', h('span', { class: 'muted' }, niceVal(l.old)), ' → ', niceVal(l.new))
      : l.new ? h('div', { class: 'small muted', dir: 'auto' }, niceVal(l.new)) : null),
    h('div', { class: 'small faint' }, fmtDT(g.at)));
}
function activityView() {
  if (!S.ui.log) {
    S.ui.log = 'loading';
    call('log.list', { limit: 300 }).then((d) => { S.ui.log = d.log; render(); }).catch((e) => { S.ui.log = null; handleErr(e); });
  }
  if (S.ui.log === 'loading') return h('div', { class: 'loading', style: 'min-height:200px' }, h('div', { class: 'spinner' }));
  return S.ui.log.length ? h('div', { class: 'list' }, groupLog(S.ui.log).map(logRow)) : h('div', { class: 'empty' }, 'Nothing yet.');
}

boot();
</script>
