/* Installing the app (only on the app's own site; the build sets KATAL_PWA). Chrome and Android offer a button. */
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installPrompt = e; });
window.addEventListener('appinstalled', () => { S.installPrompt = null; });
function installBox() {
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (!window.KATAL_PWA || standalone) return null;
  const mac = !IOS && /Macintosh/.test(navigator.userAgent) && /Safari/.test(navigator.userAgent) && !/Chrome|Chromium|Edg/.test(navigator.userAgent);
  let body;
  if (S.installPrompt) {
    const btn = h('button', { class: 'btn primary small' }, 'Install the app');
    btn.onclick = async () => {
      const ev = S.installPrompt;
      if (!ev) return;
      ev.prompt();
      const choice = await ev.userChoice.catch(() => null);
      if (choice && choice.outcome === 'accepted') { S.installPrompt = null; closeSheet(); toast('Installed ✓ Open KATAL Team from your home screen'); }
    };
    body = btn;
  } else if (IOS) {
    body = h('div', { class: 'small muted' }, 'Safari: Share ', h('b', null, '⬆︎'), ' → ', h('b', null, 'Add to Home Screen'));
  } else if (mac) {
    body = h('div', { class: 'small muted' }, 'Safari: ', h('b', null, 'File → Add to Dock'));
  } else {
    body = h('div', { class: 'small muted' }, 'Browser menu → ', h('b', null, 'Install app'));
  }
  return h('div', null, h('div', { class: 'section' }, h('h2', null, 'App')), body);
}

/** One task as a slim row; tap it to open the details. Rows with requested changes start open. */
function memberTaskCard(t) {
  const approved = t.review === 'Approved' || t.status === 'Done';
  const d = S.drafts[t.key] || (S.drafts[t.key] = { fileLink: t.fileLink, draftCaption: t.draftCaption, notes: t.notes });
  // Open/closed is remembered per review state, so a task sent back always opens again.
  const ok = t.key + '|' + (t.review || '');
  const isOpenRow = S.ui.open[ok] !== undefined ? S.ui.open[ok] : t.review === 'Edit';
  const late = !approved && t.color === 'red';
  const cls = 'card trow' + (late ? ' late' : '') + (isOpenRow ? ' open' : '');
  const toggle = () => { S.ui.open[ok] = !isOpenRow; render(); };
  const head = h('button', { class: 'trow-head', onclick: toggle, 'aria-expanded': isOpenRow ? 'true' : 'false' },
    h('div', { class: 'main-col grow' },
      h('div', { style: 'font-weight:550;font-size:14.5px' }, taskTitle(t)),
      h('div', { class: 'small muted', style: 'margin-top:2px' }, dots(h('span', { class: 'idtag' }, t.id), approved ? null : dueChip(t), rowStatus(t), checkBadge(t)))),
    commentBadge(t.id), h('span', { class: 'chev' }));
  const card = h('div', { class: cls, style: approved ? 'opacity:.7' : '' }, head);
  if (!isOpenRow) return card;

  const expanded = !!S.ui.expanded[t.key];
  const longBrief = (t.brief || '').length > 220 || (t.brief || '').split('\n').length > 5;
  const save = (btn, status) => {
    if (d.fileLink && !/^(https?:\/\/)?[^\s.]+\.[^\s]+$/i.test(d.fileLink.trim())) { toast('The file link doesn\'t look like a link.', true); return; }
    if (status === 'Pending Approval' && !(d.fileLink || '').trim()) { toast('Add the file first.', true); return; }
    const sent = { fileLink: d.fileLink, draftCaption: d.draftCaption, notes: d.notes };
    const payload = Object.assign({ key: t.key }, sent, status ? { status } : {});
    if (status === 'Pending Approval') S.ui.open[t.key + '|'] = false;
    instant((st) => {
      const x = st.tasks.find((k) => k.key === t.key);
      if (!x) return;
      Object.assign(x, sent);
      if (status) x.status = status;
      if (status === 'Pending Approval') {
        if (!x.delivered) x.delivered = st.now;
        if (x.review === 'Edit') x.review = '';
        x.color = x.late ? 'red' : 'none';
      }
    }, 'task.update', payload,
    status === 'Pending Approval' ? 'Sent for approval ✓' : status === 'Started' ? 'Marked as started' : 'Saved')
      .then((res) => {
        const cur = S.drafts[t.key];
        if (res && cur && cur.fileLink === sent.fileLink && cur.draftCaption === sent.draftCaption && cur.notes === sent.notes) delete S.drafts[t.key];
      });
  };

  append(card, h('div', { class: 'trow-body' },
    h('div', { class: 'small muted', style: 'margin-bottom:6px' }, dots(t.type, approved ? null : dueChip(t, true))),
    t.review === 'Edit' ? h('div', { class: 'note orange' }, h('div', { class: 't' }, 'To fix'), h('div', { class: 'pre', dir: 'auto' }, t.reviewNotes)) : null,
    approved ? h('div', { class: 'note green' }, h('div', { class: 't' }, '✓ Approved, great work')) : null,
    approved ? null : checkNote(t),
    t.brief ? h('div', null,
      h('div', { class: 'brief pre' + (longBrief && !expanded ? ' clamp' : ''), dir: 'auto' }, t.brief),
      longBrief ? h('button', { class: 'btn ghost tiny', onclick: () => { S.ui.expanded[t.key] = !expanded; render(); } }, expanded ? 'Show less' : 'Show all') : null) : null,
    t.reference ? field('Reference', refLinks(t.reference)) : null,
    t.related.length ? h('div', { class: 'related' }, h('div', { class: 'head' }, 'Team files'),
      t.related.map((r) => h('div', { class: 'r' }, h('b', null, r.name), h('span', { class: 'muted grow' }, r.task), rowStatus(r),
        filesLink(r.files, { id: t.id, video: t.type === 'Video' && r.task !== 'Video Cover' })))) : null,
    approved ? [
      t.fileLink ? h('div', { class: 'files', style: 'margin-top:6px' }, filesLink(t.files, { id: t.id, video: isVideoTask(t) })) : null,
      t.draftCaption ? h('div', { class: 'brief pre', dir: 'auto' }, t.draftCaption) : null
    ] : [
      h('div', { class: 'statusbar' },
        h('button', { class: 'btn' + (t.status === 'Started' ? ' cur' : ''), onclick: (e) => save(e.currentTarget, 'Started') }, t.status === 'Started' ? '▶ Started' : '▶ Start'),
        h('button', { class: 'btn' + (t.status === 'Pending Approval' ? ' cur' : ' primary'), onclick: (e) => save(e.currentTarget, 'Pending Approval') },
          t.status === 'Pending Approval' ? '✓ Sent' : 'Send for approval')),
      h('div', { class: 'divider' }),
      field('File', h('div', null,
        h('div', { class: 'files', style: 'margin-bottom:6px' }, filesLink(t.files, { id: t.id, video: isVideoTask(t) }),
          uploadButton({ id: t.id, label: t.task, multi: true }, (links) => {
            d.fileLink = links[0];
            instant((st) => { const x = st.tasks.find((k) => k.key === t.key); if (x) { x.fileLink = links[0]; x.files = links; } }, 'task.update', { key: t.key, files: links },
              (links.length > 1 ? links.length + ' files uploaded ✓' : 'Uploaded ✓') + ' Now tap Send for approval');
          })),
        input(d, 'fileLink', { type: 'url', dir: 'ltr', placeholder: S.state.media ? 'Or paste a link' : 'Paste the link', inputmode: 'url' }))),
      h('details', { class: 'more', open: t.draftCaption || t.notes ? true : null }, h('summary', null, 'Caption & notes'),
        field('Draft caption', area(d, 'draftCaption', { rows: 2 })),
        field('Notes', area(d, 'notes', { rows: 2 }))),
      h('button', { class: 'btn block', onclick: (e) => save(e.currentTarget) }, 'Save')
    ],
    commentsBox(t.id, { video: t.type === 'Video' })));
  return card;
}

/** Links to similar work: each link a small chip, other text as written. */
function refLinks(text) {
  const parts = String(text || '').split(/(https?:\/\/[^\s]+)/i).map((p) => p.trim()).filter(Boolean);
  const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return 'Link'; } };
  return h('div', { class: 'files' }, parts.map((p) => /^https?:\/\//i.test(p)
    ? h('a', { class: 'fchip', href: p, target: '_blank', rel: 'noopener noreferrer', onclick: (e) => e.stopPropagation() }, host(p) + ' ↗')
    : h('span', { class: 'small', dir: 'auto' }, p)));
}

/** On a row, "Not started" says nothing; the other states say a word. */
/** Every row says where the task stands, "Not started" included. */
function rowStatus(t) { return statusBadge(t); }

/** The main file of a video task is a video; its cover is an image. */
/** A task goes by the name typed for it (its idea); a part of it, like "Video Cover", shows small next to that. */
function taskParts(t) { return { main: t.idea || t.task, part: t.idea && t.task !== t.idea ? t.task : '' }; }
function taskTitle(t) {
  const p = taskParts(t);
  return h('span', { class: 'ttl' }, h('span', { class: 'tm', dir: 'auto' }, p.main), p.part ? h('span', { class: 'tpart', dir: 'auto' }, p.part) : null);
}
/** The same in plain text, for messages: "Ali video 1 (Video Cover)". */
function taskLabel(t) { const p = taskParts(t); return p.part ? p.main + ' (' + p.part + ')' : p.main; }
function isVideoTask(t) { return t.type === 'Video' && (t.linkRole ? t.linkRole === 'Media' : !/cover/i.test(t.task)); }

  const f = { id: i.id, idea: i.idea, type: i.type };
  openSheet('Edit ' + i.id, h('div', null,
    field('Idea', area(f, 'idea', { rows: 3 })),
    field('Type', selectBox(S.state.types.map((x) => ({ value: x, label: x })), f.type, (v) => { f.type = v; }, { full: true }))),
  editFoot((btn) => run(btn, 'idea.editOwn', f, 'Idea updated')));
}

/* ======================================================================
   Admin: Today
   ====================================================================== */
function todayView() {
  const st = S.state;
  const today = st.today;
  const tomorrow = addDays(today, 1);
  const open = st.tasks.filter(isOpen);
  const pending = open.filter((t) => t.status === 'Pending Approval').sort(byUrgency);
  const working = open.filter((t) => t.status !== 'Pending Approval');
  const overdue = working.filter((t) => t.overdue).sort(byUrgency);
  const dueToday = working.filter((t) => t.deadline === today && !t.overdue).sort(byUrgency);
  const dueTomorrow = working.filter((t) => t.deadline === tomorrow).sort(byUrgency);
  const later = st.ideas.filter((i) => i.execution === 'Later' && !i.hidden && i.source !== 'Quick');
  const notReady = st.calendar.filter((c) => (c.publishDate === today || c.publishDate === tomorrow) && c.status === 'Draft');
  const hour = Number((st.now || '').slice(11, 13));
  const hello = (hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening') + ', ' + S.me.name;
  // A counter jumps to its list below; ideas and posts open their tab.
  const jump = (id) => () => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  const stat = (n, label, cls, go) => n ? h('button', { class: 'stat ' + (cls || ''), onclick: go }, h('div', { class: 'v' }, n), h('div', { class: 'l' }, label)) : null;
  const stats = [
    stat(pending.length, isAdmin() ? 'To approve' : 'Pending approval', 'gold', jump('sec-pending')),
    stat(overdue.length, 'Overdue', 'red', jump('sec-overdue')),
    stat(dueToday.length, 'Due today', '', jump('sec-today')),
    stat(dueTomorrow.length, 'Due tomorrow', '', jump('sec-tomorrow')),
    stat(later.length, 'Ideas to decide', '', () => goTab('ideas', { ideaView: 'Later' })),
    stat(readyPosts().length, 'Ready to schedule', '', () => goTab('calendar', { calSeg: 'ready' })),
    stat(missedPosts().length, 'Didn\'t go out', 'red', () => goTab('calendar', { calSeg: 'missed' })),
    stat(notReady.length, 'Drafts due soon', '', jump('sec-drafts'))
  ].filter(Boolean);
  const sec = (id, title, items, rowFn) => items.length ? [h('div', { class: 'section', id }, h('h2', null, title)), list(items.map(rowFn))] : null;
  const people = st.people.map((p) => {
    const mine = open.filter((t) => t.assignedTo === p.id);
    return { p, open: mine.length, overdue: mine.filter((t) => t.overdue).length, waiting: mine.filter((t) => t.status === 'Pending Approval').length };
  }).filter((x) => x.open || x.p.id !== S.me.id);
  const log = groupLog(st.log).slice(0, 5);
  return h('div', null,
    h('div', { class: 'page-head' },
      h('div', null, h('div', { class: 'eyebrow' }, wd(today) + ' ' + fmtShort(today)), h('h1', null, hello)),
      h('button', { class: 'btn primary quick', onclick: () => quickTaskSheet() }, '+ Quick task')),
    stats.length ? h('div', { class: 'stats' }, stats) : h('div', { class: 'allclear' }, h('b', null, '✓ '), 'All clear. Nothing waiting.'),
    sec('sec-pending', isAdmin() ? 'To approve' : 'Pending approval', pending, taskRow),
    sec('sec-overdue', 'Overdue', overdue, taskRow),
    sec('sec-today', 'Due today', dueToday, taskRow),
    sec('sec-tomorrow', 'Due tomorrow', dueTomorrow, taskRow),
    sec('sec-drafts', 'Publishing soon, still a draft', notReady, (c) => postRow(c, { date: true })),
    h('div', { class: 'section' }, h('h2', null, 'Team')),
    list(people.map((x) => lrow({
      onclick: () => goTab('tasks', { taskFilter: 'active', person: x.p.id }),
      left: h('span', { class: 'avatar' }, x.p.name.charAt(0)),
      title: x.p.name,
      sub: dots(x.open ? x.open + ' open' : 'Nothing open', x.waiting ? x.waiting + ' pending approval' : null),
      end: [x.overdue ? h('span', { class: 'due red' }, x.overdue + ' late') : null]
    }))),
    log.length ? [h('div', { class: 'section' }, h('h2', null, 'Recent activity'),
      h('button', { class: 'btn ghost tiny', onclick: () => goTab('more', { more: 'activity', log: null }) }, 'See all')),
      h('div', { class: 'list' }, log.map(logRow))] : null);
}

/* ======================================================================
   Admin: Tasks
   ====================================================================== */
const TASK_FILTERS = [
  ['active', 'All open', isOpen],
  ['notstarted', 'Not started', (t) => isOpen(t) && !t.status && t.review !== 'Edit'],
  ['started', 'Started', (t) => isOpen(t) && (t.status === 'Started' || (!t.status && t.review === 'Edit'))],
  ['pending', 'Pending approval', (t) => isOpen(t) && t.status === 'Pending Approval'],
  ['done', 'Done', (t) => !t.cancelled && !isOpen(t)]
];

/** The filters of a list on one line, and a search box that opens from the magnifier. */
function filterBar(controls, qKey, placeholder) {
  const shown = S.ui.search === qKey || !!S.ui[qKey];
  const focusSearch = () => { const el = document.querySelector('.main input[type=search]'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
  const btn = h('button', { type: 'button', class: 'icon-btn search-btn', 'aria-label': 'Search', style: shown ? 'color:var(--ink);border-color:var(--ink)' : '',
    onclick: () => { if (shown) { S.ui.search = ''; S.ui[qKey] = ''; render(); } else { S.ui.search = qKey; render(); focusSearch(); } } }, icon('search'));
  const inp = shown ? h('input', { class: 'in', type: 'search', placeholder, value: S.ui[qKey], dir: 'auto', style: 'margin:-4px 0 12px',
    oninput: (e) => { S.ui[qKey] = e.target.value; clearTimeout(S.searchT); S.searchT = setTimeout(() => { render(); focusSearch(); }, 250); } }) : null;
  return [h('div', { class: 'filters' }, controls, btn), inp];
}

function adminTasksView() {
  const st = S.state;
  const q = S.ui.q.trim().toLowerCase();
  const base = st.tasks.filter((t) => !S.ui.person || t.assignedTo === S.ui.person)
    .filter((t) => !q || (t.id + ' ' + t.task + ' ' + t.idea + ' ' + t.assignee).toLowerCase().indexOf(q) >= 0);
  const filter = TASK_FILTERS.find((f) => f[0] === S.ui.taskFilter) || TASK_FILTERS[0];
  let items = base.filter(filter[2]);
  items = filter[0] === 'done' ? items.sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || '')) : items.sort(byUrgency);
  const people = (st.users || st.people.map((p) => Object.assign({ active: true }, p)))
    .filter((u) => u.active || st.tasks.some((t) => t.assignedTo === u.id));
  return h('div', null,
    h('div', { class: 'page-head' }, h('h1', null, 'Tasks'),
      h('button', { class: 'btn primary quick', onclick: () => quickTaskSheet() }, '+ Quick task')),
    filterBar([
      selectBox(TASK_FILTERS.map((f) => ({ value: f[0], label: f[1], n: base.filter(f[2]).length })), filter[0],
        (v) => { S.ui.taskFilter = v; render(); }, { label: 'Show', on: filter[0] !== 'active' }),
      selectBox([{ value: '', label: 'Everyone' }].concat(people.map((u) => ({ value: u.id, label: u.name }))), S.ui.person,
        (v) => { S.ui.person = v; render(); }, { label: 'Person', on: !!S.ui.person })
    ], 'q', 'Search ID, task, person…'),
    list(items.map(taskRow), 'No tasks here.'));
}

/** A task as one line: title; ID, person and deadline under it; its state on the right. */
function taskRow(t) {
  const open = isOpen(t);
  return lrow({
    onclick: () => openTask(t.key), late: open && t.color === 'red', done: !open,
    title: taskTitle(t),
    sub: dots(h('span', { class: 'idtag' }, t.id), personTag(t.assignee), dueChip(t)),
    end: [personalBadge(t), commentBadge(t.id), checkBadge(t), rowStatus(t)]
  });
}

/** The admin edits every task; a manager edits the tasks they made and works on the ones given to them. */
function openTask(key) {
  const t = S.state.tasks.find((x) => x.key === key);
  if (!t) return;
  if (isAdmin()) taskSheet(key);
  else if (t.canEdit || t.assignedTo === S.me.id) managerTaskSheet(key);
  else taskViewSheet(key);
}

/** Personal: outside work someone gave themselves. Nobody else sees the admin's; the admin also sees a manager's. */
function personalBadge(t) {
  if (!t.personal) return null;
  return h('span', { class: 'badge b-purple' }, t.createdBy === S.me.id ? '🔒 Personal' : '🔒 ' + t.personal);
}

function approve(btn, t) {
  const ideaTasks = S.state.tasks.filter((x) => x.id === t.id && !x.cancelled && x.key !== t.key);
  const last = ideaTasks.every((x) => x.review === 'Approved');
  return instant((st) => {
    const x = st.tasks.find((k) => k.key === t.key);
    if (x) Object.assign(x, { review: 'Approved', status: 'Done', color: 'none', overdue: false });
  }, 'task.approve', { key: t.key }, last ? 'Approved · ' + t.id + ' is ready to post' : 'Approved');
}

function requestEditSheet(t) {
  const f = { key: t.key, note: '' };
  const btn = h('button', { class: 'btn primary' }, 'Send back');
  btn.onclick = () => {
    if (!f.note.trim()) { toast('Write what should change.', true); return; }
    instant((st) => {
      const x = st.tasks.find((k) => k.key === t.key);
      if (x) Object.assign(x, { review: 'Edit', reviewNotes: f.note.trim(), status: 'Started' });
    }, 'task.requestEdit', f, 'Sent back to ' + t.assignee);
  };
  openSheet('Send back · ' + t.id, h('div', null,
    h('p', { class: 'muted small', style: 'margin-top:0' }, t.assignee + ' gets it back with your note.'),
    field('What to change', area(f, 'note', { rows: 4 }))), btn);
}

const STATUS_OPTIONS = [{ value: '', label: 'Not started' }, { value: 'Started', label: 'Started' }, { value: 'Pending Approval', label: 'Pending approval' }, { value: 'Done', label: 'Done' }];

/** The file of a task: view what's there, upload (saved at once), or paste a link. */
function fileField(t, f, onUploaded) {
  const fileIn = input(f, 'fileLink', { type: 'url', dir: 'ltr', placeholder: 'Or paste a link' });
  return field('File', h('div', null,
    h('div', { class: 'files', style: 'margin-bottom:6px' }, filesLink(t.files && t.files.length ? t.files : (t.fileLink ? [t.fileLink] : []), { id: t.id, video: isVideoTask(t) }),
      uploadButton({ id: t.id, label: t.task, multi: true, text: t.fileLink ? 'Replace' : 'Upload' }, (links) => { f.files = links; f.fileLink = links[0]; fileIn.value = links[0]; onUploaded(links); })),
    fileIn));
}

function personSelect(f, key, current) {
  const people = peopleOptions();
  if (current && !people.some((p) => p.value === current.id)) people.push({ value: current.id, label: current.name + ' (inactive)' });
  return selectBox([{ value: '', label: 'Pick…' }].concat(people), f[key], (v) => { f[key] = v; }, { full: true, label: 'Person' });
}

/** Deletes or brings back a task; a delete can be undone from the message for a few seconds. */
function setTaskCancelled(t, cancelled) {
  return instant((st) => { const x = st.tasks.find((k) => k.key === t.key); if (x) x.cancelled = cancelled; },
    'task.cancel', { key: t.key, cancelled }, cancelled ? 'Task deleted' : 'Task restored',
    cancelled ? () => setTaskCancelled(t, false) : null);
}

/**
 * Admin: a task as an info card. Approve or comment; the brief, file and deadline change in place;
 * the rest (title, person, status) sits behind a small Edit. Delete is the small red button below.
 */
function taskSheet(key) {
  const t = S.state.tasks.find((x) => x.key === key);
  if (!t) return;
  const f = { key: t.key, task: t.task, brief: t.brief, assignedTo: t.assignedTo, deadline: t.deadline, status: t.status,
    fileLink: t.fileLink, draftCaption: t.draftCaption, notes: t.notes, reviewNotes: t.reviewNotes };
  const others = S.state.tasks.filter((o) => o.id === t.id && o.key !== t.key && !o.cancelled);
  const pending = isOpen(t) && t.status === 'Pending Approval';
  const saveNow = (extra, msg) => run(null, 'task.save', Object.assign({}, f, extra || {}), msg, { keepSheet: true });
  const del = t.cancelled
    ? () => setTaskCancelled(t, false)
    : () => ask('Delete "' + taskLabel(t) + '"? It leaves ' + t.assignee + '\'s list.', 'Delete', true).then((ok) => { if (ok) setTaskCancelled(t, true); });
  openSheet(t.id + ' · Task', h('div', null,
    h('div', { class: 'info' },
      h('div', { class: 'info-top' }, h('h3', null, taskTitle(t)), h('button', { class: 'btn ghost tiny', onclick: () => editTaskSheet(t) }, 'Edit')),
      h('div', { class: 'info-line' }, personTag(t.assignee), statusBadge(t), personalBadge(t), t.type ? h('span', { class: 'small muted' }, t.type) : null),
      h('div', { class: 'info-line' }, dateField(f.deadline, (v) => { f.deadline = v; saveNow({ deadline: v }, 'Deadline: ' + dayShort(v)); }, { autosave: true }),
        isOpen(t) && t.overdue ? h('span', { class: 'due red' }, 'late') : null),
      t.delivered ? h('div', { class: 'small muted' }, 'Delivered ' + fmtDT(t.delivered) + (t.late ? ' · late' : '')) : null,
      t.cancelled ? h('div', { class: 'small', style: 'color:var(--red)' }, 'Deleted. Tap the red button below to bring it back.') : null),
    liveBox(() => checkNote(S.state.tasks.find((x) => x.key === t.key) || t)),
    pending ? h('div', { class: 'approve-box' },
      h('button', { class: 'btn good block', onclick: (e) => approve(e.currentTarget, t) }, '✓ Approve'),
      h('button', { class: 'btn ghost tiny', onclick: () => requestEditSheet(t) }, '↩ Send back with a note')) : null,
    t.review === 'Edit' ? h('div', { class: 'note orange' }, h('div', { class: 't' }, 'Sent back'), h('div', { class: 'pre small', dir: 'auto' }, t.reviewNotes)) : null,
    fileField(t, f, (links) => saveNow({ files: links, fileLink: links[0] }, (links.length > 1 ? links.length + ' files' : 'File') + ' saved ✓')),
    field('Brief', area(f, 'brief', { rows: 3 })),
    t.reference ? field('Reference', refLinks(t.reference)) : null,
    t.draftCaption || t.notes ? field('From ' + t.assignee, h('div', { class: 'brief pre', dir: 'auto' }, [t.draftCaption, t.notes].filter(Boolean).join('\n\n'))) : null,
    others.length ? h('div', { class: 'related' }, h('div', { class: 'head' }, 'Other tasks on ' + t.id),
      others.map((o) => h('div', { class: 'r' }, personTag(o.assignee), h('span', { class: 'muted grow' }, o.task), rowStatus(o), filesLink(o.files, { id: o.id, video: isVideoTask(o) })))) : null,
    h('div', { class: 'small faint' }, 'Created ' + fmtDT(t.createdAt)),
    commentsBox(t.id, { video: t.type === 'Video' })),
  editFoot((btn) => run(btn, 'task.save', f, 'Saved'), del, { deleteLabel: t.cancelled ? 'Restore task' : 'Delete task' }));
}

/** The rarely changed parts of a task. */
function editTaskSheet(t) {
  const f = { key: t.key, task: t.task, brief: t.brief, assignedTo: t.assignedTo, deadline: t.deadline, status: t.status,
    fileLink: t.fileLink, draftCaption: t.draftCaption, notes: t.notes, reviewNotes: t.reviewNotes };
  openSheet('Edit ' + t.id, h('div', null,
    field('Task', input(f, 'task')),
    h('div', { class: 'two' },
      field('Assigned to', personSelect(f, 'assignedTo', { id: t.assignedTo, name: t.assignee })),
      field('Status', selectBox(STATUS_OPTIONS, f.status, (v) => { f.status = v; }, { full: true })))),
  editFoot((btn) => { if (!f.task.trim()) { toast('Write a title.', true); return; } run(btn, 'task.save', f, 'Saved'); }));
}

/** Manager: a task, read only, with its comments. */
function taskViewSheet(key) {
  const t = S.state.tasks.find((x) => x.key === key);
  if (!t) return;
  const others = S.state.tasks.filter((o) => o.id === t.id && o.key !== t.key && !o.cancelled);
  openSheet(t.id + ' · Task', h('div', null,
    h('div', { class: 'info' },
      h('div', { class: 'info-top' }, h('h3', null, taskTitle(t))),
      h('div', { class: 'info-line' }, personTag(t.assignee), statusBadge(t), t.type ? h('span', { class: 'small muted' }, t.type) : null),
      h('div', { class: 'info-line small muted' }, 'Deadline ', h('b', { style: 'color:var(--ink);font-weight:550' }, dayLong(t.deadline)))),
    t.review === 'Edit' ? h('div', { class: 'note orange' }, h('div', { class: 't' }, 'Sent back'), h('div', { class: 'pre small', dir: 'auto' }, t.reviewNotes)) : null,
    liveBox(() => checkNote(S.state.tasks.find((x) => x.key === t.key) || t)),
    t.brief ? field('Brief', h('div', { class: 'brief pre', dir: 'auto' }, t.brief)) : null,
    t.reference ? field('Reference', refLinks(t.reference)) : null,
    t.fileLink ? field('File', h('div', { class: 'files' }, filesLink(t.files, { id: t.id, video: isVideoTask(t) }))) : null,
    others.length ? h('div', { class: 'related' }, h('div', { class: 'head' }, 'Other tasks on ' + t.id),
      others.map((o) => h('div', { class: 'r' }, personTag(o.assignee), h('span', { class: 'muted grow' }, o.task), rowStatus(o),
        filesLink(o.files, { id: o.id, video: isVideoTask(o) })))) : null,
    commentsBox(t.id, { video: t.type === 'Video' })), editFoot(null));
}

/**
 * Manager: a task they made (deadline in place, Edit, delete) and/or one given to them (do the work).
 * Their personal tasks they also mark done themselves; everything else is approved by the admin.
 */
function managerTaskSheet(key) {
  const t = S.state.tasks.find((x) => x.key === key);
  if (!t) return;
  const mine = t.assignedTo === S.me.id;
  const personal = !!t.personal;
  const working = mine && isOpen(t) && !personal;
  const f = { key: t.key, task: t.task, brief: t.brief, assignedTo: t.assignedTo, deadline: t.deadline, status: t.status };
  const w = { fileLink: t.fileLink, draftCaption: t.draftCaption, notes: t.notes };
  const others = S.state.tasks.filter((o) => o.id === t.id && o.key !== t.key && !o.cancelled);
  const mgrSave = (extra) => (personal ? Object.assign({}, f, extra) : Object.assign({ key: f.key, task: f.task, brief: f.brief, assignedTo: f.assignedTo, deadline: f.deadline }, extra || {}));
  const work = (btn, status) => {
    if (w.fileLink && !/^(https?:\/\/)?[^\s.]+\.[^\s]+$/i.test(w.fileLink.trim())) { toast('The file link doesn\'t look like a link.', true); return; }
    if (status === 'Pending Approval' && !(w.fileLink || '').trim()) { toast('Add the file first.', true); return; }
    run(btn, 'task.update', Object.assign({ key: t.key }, w, status ? { status } : {}),
      status === 'Pending Approval' ? 'Sent for approval ✓' : status === 'Started' ? 'Marked as started' : 'Saved');
  };
  const del = !t.canEdit ? null : t.cancelled ? () => setTaskCancelled(t, false)
    : () => ask('Delete "' + taskLabel(t) + '"?', 'Delete', true).then((ok) => { if (ok) setTaskCancelled(t, true); });

  openSheet(t.id + ' · Task', h('div', null,
    h('div', { class: 'info' },
      h('div', { class: 'info-top' }, h('h3', null, taskTitle(t)), t.canEdit ? h('button', { class: 'btn ghost tiny', onclick: () => managerEditSheet(t) }, 'Edit') : null),
      h('div', { class: 'info-line' }, personTag(t.assignee), statusBadge(t), personalBadge(t)),
      h('div', { class: 'info-line' }, t.canEdit
        ? dateField(f.deadline, (v) => { f.deadline = v; run(null, 'task.save', mgrSave({ deadline: v }), 'Deadline: ' + dayShort(v), { keepSheet: true }); }, { autosave: true })
        : h('span', { class: 'small muted' }, 'Deadline ', h('b', { style: 'color:var(--ink);font-weight:550' }, dayLong(t.deadline))))),
    t.review === 'Edit' ? h('div', { class: 'note orange' }, h('div', { class: 't' }, 'Sent back'), h('div', { class: 'pre small', dir: 'auto' }, t.reviewNotes)) : null,
    liveBox(() => checkNote(S.state.tasks.find((x) => x.key === t.key) || t)),
    t.canEdit ? field('Brief', area(f, 'brief', { rows: 3 })) : t.brief ? field('Brief', h('div', { class: 'brief pre', dir: 'auto' }, t.brief)) : null,
    t.reference ? field('Reference', refLinks(t.reference)) : null,
    working ? [
      h('div', { class: 'section' }, h('h2', null, 'Your work')),
      h('div', { class: 'statusbar' },
        h('button', { class: 'btn' + (t.status === 'Started' ? ' cur' : ''), onclick: (e) => work(e.currentTarget, 'Started') }, t.status === 'Started' ? '▶ Started' : '▶ Start'),
        h('button', { class: 'btn' + (t.status === 'Pending Approval' ? ' cur' : ' primary'), onclick: (e) => work(e.currentTarget, 'Pending Approval') },
          t.status === 'Pending Approval' ? '✓ Sent' : 'Send for approval')),
      fileField(t, w, (links) => run(null, 'task.update', { key: t.key, files: links }, (links.length > 1 ? links.length + ' files uploaded ✓' : 'Uploaded ✓') + ' Now tap Send for approval', { keepSheet: true })),
      h('details', { class: 'more', open: t.draftCaption || t.notes ? true : null }, h('summary', null, 'Caption & notes'),
        field('Draft caption', area(w, 'draftCaption', { rows: 2 })),
        field('Notes', area(w, 'notes', { rows: 2 }))),
      h('button', { class: 'btn block', onclick: (e) => work(e.currentTarget) }, 'Save my work')
    ] : t.fileLink ? field('File', h('div', { class: 'files' }, filesLink(t.files, { id: t.id, video: isVideoTask(t) }))) : null,
    others.length ? h('div', { class: 'related' }, h('div', { class: 'head' }, 'Other tasks on ' + t.id),
      others.map((o) => h('div', { class: 'r' }, personTag(o.assignee), h('span', { class: 'muted grow' }, o.task), rowStatus(o),
        filesLink(o.files, { id: o.id, video: isVideoTask(o) })))) : null,
    commentsBox(t.id, { video: t.type === 'Video' })),
  editFoot(t.canEdit ? (btn) => run(btn, 'task.save', mgrSave(), 'Saved') : null, del, { deleteLabel: 'Delete task' }));
}

/** Manager: the rarely changed parts of a task they made. */
function managerEditSheet(t) {
  const personal = !!t.personal;
  const f = { key: t.key, task: t.task, brief: t.brief, assignedTo: t.assignedTo, deadline: t.deadline, status: t.status };
  openSheet('Edit ' + t.id, h('div', null,
    field('Task', input(f, 'task')),
    h('div', { class: 'two' },
      field('Assigned to', personSelect(f, 'assignedTo', { id: t.assignedTo, name: t.assignee })),

/* ----- Creating tasks ----- */
function templateRows(idea) {
  return S.state.templates.filter((tp) => tp.active && tp.type === idea.type).map((tp) => ({
    task: tp.task,
    assignedTo: S.state.people.some((p) => p.id === tp.assignee) ? tp.assignee : '',
    brief: [idea.brief, tp.note].filter(Boolean).join('\n\n'),
    deadline: '',

  }));
}

      h('div', { class: 'kv', style: 'margin-bottom:12px' }, h('span', { class: 'idtag' }, idea.id), ' ', h('b', { dir: 'auto' }, idea.idea)),

        field('Task', input(r, 'task', { placeholder: 'Short title' })),
        h('div', { class: 'two' },

          field('Goes on the post as', selectBox(linkRoleOptions(idea.type), r.linkRole || 'Media', (v) => { r.linkRole = v; }, { full: true }))),
        field('Deadline', dateField(r.deadline, (v) => { r.deadline = v; })),
        field('Brief', area(r, 'brief', { rows: 3 })))),
      h('button', { class: 'btn block small', onclick: () => { rows.push(blankRow(idea)); draw(); } }, '+ Another task'));
  };
  btn.onclick = () => {

const IDEA_VIEWS = [['Later', 'Discussing'], ['Approved', 'Approved']];
/** An idea is being discussed, or approved (it became tasks). Quick tasks and hidden ones aren't listed. */
function ideaIn(i, v) {
  if (i.hidden || i.source === 'Quick') return false;
  return v === 'Approved' ? i.execution === 'Approved' : i.execution === 'Later';
}

/** Admin: an idea as an info card. Scribble, brief and reference change in place; the title and type behind Edit. */
function ideaSheet(id) {
  if (!id) { newIdeaAdminSheet(); return; }
  const i = S.state.ideas.find((x) => x.id === id);
  if (!i) return;
  const f = { id: i.id, idea: i.idea, type: i.type, scribble: i.scribble, brief: i.brief, reference: i.reference || '', execution: i.execution, channel: i.channel };
  const tasks = S.state.tasks.filter((t) => t.id === i.id);
  const cal = S.state.calendar.filter((c) => c.id === i.id);
  const approved = i.execution === 'Approved';
  const briefIn = area(f, 'brief', { rows: 3 });
  let lastBrief = i.brief;
  const toBrief = S.state.ai ? h('button', { type: 'button', class: 'btn tiny', style: 'margin:-6px 0 12px' }, '✨ Turn into brief') : null;
  if (toBrief) {
    toBrief.onclick = () => {
      if (!f.scribble.trim()) { toast('Write the Scribble first.', true); return; }
      run(toBrief, 'idea.save', Object.assign({}, f, { askBrief: true }), 'Writing the brief…', { keepSheet: true });
    };
  }
  const sugBox = liveBox(() => {
    const cur = S.state.ideas.find((x) => x.id === i.id) || i;
    // The written brief arrived while this is open: show it (unless the brief was edited here meanwhile).
    if (cur.brief !== lastBrief && f.brief === lastBrief) { f.brief = cur.brief; briefIn.value = f.brief; grow(briefIn); }
    lastBrief = cur.brief;
    if (cur.agentStatus === 'Waiting') return h('div', { class: 'small', style: 'margin:-8px 0 12px;color:var(--gold-ink)' }, 'Writing the brief…');
    if (cur.agentStatus === 'Error') return h('div', { class: 'note orange' }, S.state.aiLimit ? aiLimitText() : 'Couldn\'t write it. Tap "Turn into brief" again.');
    return null;
  });
  const del = i.hidden
    ? () => instant((st) => { const x = st.ideas.find((k) => k.id === i.id); if (x) x.hidden = false; }, 'idea.restore', { id: i.id }, i.id + ' restored')
    : () => {
      const hard = deletable(i);
      ask(hard ? 'Delete ' + i.id + ' "' + i.idea.slice(0, 40) + '"?' : i.id + ' already has work, so it will be hidden (not deleted).', hard ? 'Delete' : 'Hide', true).then((ok) => {
        if (!ok) return;
        instant((st) => {
          if (hard) st.ideas = st.ideas.filter((k) => k.id !== i.id);
          else { const x = st.ideas.find((k) => k.id === i.id); if (x) x.hidden = true; }
        }, 'idea.delete', { id: i.id }, hard ? i.id + ' deleted' : i.id + ' hidden',

      });

  openSheet(i.id + ' · Idea', h('div', null,
    h('div', { class: 'info' },
      h('div', { class: 'info-top' }, h('h3', { dir: 'auto' }, i.idea), h('button', { class: 'btn ghost tiny', onclick: () => editIdeaSheet(i) }, 'Edit')),
      h('div', { class: 'info-line' }, personTag(i.by), i.hidden ? null : approved ? h('span', { class: 'badge b-green' }, 'Approved') : h('span', { class: 'badge b-blue' }, 'Discussing'),
        h('span', { class: 'small muted' }, dots(i.type, i.channel === 'Outside' ? 'General' : 'Social media', fmtShort((i.submittedAt || '').slice(0, 10))))),
      i.hidden ? h('div', { class: 'small', style: 'color:var(--red)' }, 'Hidden. Tap the red button below to bring it back.') : null,
      !approved && !i.hidden ? h('button', { class: 'btn good block', style: 'margin-top:10px', onclick: () => approveSheet(i, f) }, '✓ Approve') : null),
    field(h('span', null, 'Scribble', h('i', null, 'only you')), area(f, 'scribble', { rows: 3, class: 'in private', placeholder: 'Your notes' })),
    toBrief,
    field(h('span', null, 'Brief', h('i', null, 'the team sees this')), briefIn),
    sugBox,
    field('Reference', area(f, 'reference', { rows: 1, dir: 'ltr', placeholder: 'Links to similar work' })),
    approved ? h('div', null,
      h('div', { class: 'section' }, h('h2', null, 'Tasks'), h('button', { class: 'btn ghost tiny', onclick: () => createTasksSheet(i, tasks.some((t) => !t.cancelled) ? [blankRow(i)] : null) }, '+ Add')),
      tasks.length ? list(tasks.map(taskRow)) : h('div', { class: 'small muted' }, 'No tasks yet.'),
      h('div', { class: 'section' }, h('h2', null, 'Post'), cal.length ? null : h('button', { class: 'btn ghost tiny', onclick: () => calSheet(null, i.id) }, '+ Add')),
      cal.length ? list(cal.map((c) => postRow(c, { date: true }))) : h('div', { class: 'small muted' }, 'Lands in Ready once every task is approved.')) : null,
    commentsBox(i.id, { video: i.type === 'Video' })),

}

/* ======================================================================
   Admin: Calendar
   ====================================================================== */
/** What the two links of a post are called, by type: a video has a video and a cover. */
function linkLabels(type) {
  if (type === 'Video') return { media: 'Video', cover: 'Cover' };
  if (type === 'Blog') return { media: 'Article', cover: 'Image' };
  return { media: 'Design', cover: 'Cover' };
}
function linkRoleOptions(type) {
  const l = linkLabels(type);
  return [{ value: 'Media', label: l.media }, { value: 'Cover', label: l.cover }];
}

/** Posts that are put together but have no publish date yet. */
function readyPosts() {
  return (S.state.calendar || []).filter((c) => !c.publishDate && c.status !== 'Published' && c.status !== 'Cancelled');
}

/** Posts marked published in the last 3 days, newest first: the place to undo a mistake. */
function postedPosts() {
  const st = S.state;
  const since = addDays(st.now.slice(0, 10), -3) + st.now.slice(10);
  return (st.calendar || []).filter((c) => c.status === 'Published' && c.publishedAt >= since)
    .sort((a, b) => b.publishedAt.localeCompare(a.publishedAt));
}

/** Dated posts before today that never went out: the app asks about them. */
function missedPosts() {
  return (S.state.calendar || []).filter((c) => c.publishDate && c.publishDate < S.state.today && c.status !== 'Published' && c.status !== 'Cancelled')
    .sort((a, b) => a.publishDate.localeCompare(b.publishDate));
}

/** A post inside a week day: its name, platforms, and whether it went out. */
function weekEntry(c) {
  const on = Object.keys(c.platforms || {}).filter((p) => c.platforms[p]);
  const missed = c.status !== 'Published' && c.publishDate < S.state.today;
  const mark = c.status === 'Published' ? h('span', { class: 'wmark ok' }, '✓ Posted')
    : missed ? h('span', { class: 'wmark miss' }, 'Didn\'t go out')
      : c.status === 'Draft' ? h('span', { class: 'wmark draft' }, 'Draft') : null;
  return h('div', { class: 'wentry', onclick: () => (isAdmin() ? calSheet(c.key) : postViewSheet(c)) },
    h('div', { class: 'wt' }, h('span', { class: 'idtag' }, c.id), ' ', h('span', { dir: 'auto' }, (c.idea || '').slice(0, 40))),
    on.length || mark ? h('div', { class: 'wsub' }, on.length ? h('span', { class: 'pfs' }, on.map((p) => pfIcon(p, 11))) : null, mark) : null);
}

/** A post as one line: title; ID, date, type and platform icons under it. Tapping opens it. */
function postRow(c, opts) {
  opts = opts || {};
  const on = Object.keys(c.platforms || {}).filter((p) => c.platforms[p]);
  const open = () => (opts.onclick ? opts.onclick(c) : isAdmin() ? calSheet(c.key) : postViewSheet(c));
  return lrow({
    onclick: open,

/* ----- Rhythm: are we posting as often as planned? Days × platforms. ----- */

/**
 * One day × one platform. Past days: ✓ went out, ✕ missed. Today on: ✓ planned, ✎ still a draft, + needs a post.
 * With no rule for the day, it just shows how many posts there are.
 */
function rhythmCell(d, p) {
  const st = S.state;
  const r = (st.rhythm || {})[p] || { days: [], min: 0, time: '' };
  const need = r.min > 0 && r.days.indexOf(wd(d)) >= 0 ? r.min : 0;
  const posts = st.calendar.filter((c) => c.publishDate === d && c.platforms[p] && c.status !== 'Cancelled');
  const past = d < st.today;
  const counted = past ? posts.filter((c) => c.status === 'Published') : posts;
  const ready = counted.filter((c) => c.status !== 'Draft').length;
  let cls, mark;
  if (!need) { cls = posts.length ? 'extra' : 'off'; mark = posts.length ? String(posts.length) : ''; }
  else if (past) { cls = counted.length >= need ? 'ok' : 'miss'; mark = counted.length >= need ? '✓' : '✕'; }
  else if (counted.length < need) { cls = 'need'; mark = counted.length ? counted.length + '/' + need : '+'; }
  else if (ready < need) { cls = 'part'; mark = '✎'; }
  else { cls = 'ok'; mark = '✓'; }
  return { cls, mark, need, posts, r };
}

    const linkIn = input(f, key2, { type: 'url', dir: 'ltr', placeholder: 'Paste a link', class: 'in' + (f[key2] && !driveIdOf(f[key2]) ? '' : ' hidden'), style: 'margin:0 0 8px' });

      h('div', { class: 'files grow' },
        key2 === 'mediaLink' && (f.mediaFiles || []).length > 1 ? filesLink(f.mediaFiles, { id: f.id }) : fileLink(f[key2], { id: f.id, video: key2 === 'mediaLink' && typeOf() === 'Video' }),
        uploadButton({ id: f.id || 'posts', label: key2 === 'coverLink' ? 'cover' : 'post', multi, accept, text: f[key2] ? 'Replace' : 'Upload' }, (links) => {

        }),

    return [r, linkIn];
  };
  const drawSlots = () => { const l = linkLabels(typeOf()); fill(slotsBox, slot(l.media, 'mediaLink', true), slot(l.cover, 'coverLink', false, 'image/*')); };
  drawSlots();

  const platformsBox = h('div');
  let picked = !!c; // a new post follows its type's usual platforms until one is tapped
  const usual = () => {
    if (picked) return;
    const list = ((S.state.settings && S.state.settings.postPlatforms) || {})[typeOf()] || [];
    S.state.platforms.forEach((p) => { f.platforms[p] = list.indexOf(p) >= 0; });
    drawPlatforms();
  if (!c && f.id) usual(); // opened from an idea: its type's platforms
    refreshLive();
  };
  const drawPlatforms = () => fill(platformsBox, h('div', { class: 'chips' }, S.state.platforms.map((p) => h('button', {

    onclick: () => {
      f.platforms[p] = !f.platforms[p];
      picked = true;
      drawPlatforms();
      refreshLive();
      // An existing post saves its platforms at once, so each new one gets its caption written.
      if (c) run(null, 'cal.platforms', { key: c.key, platforms: f.platforms }, null, { keepSheet: true });
      else { const save = document.querySelector('#layer .sheet-foot [data-save]'); if (save) save.disabled = false; }
    }

  drawPlatforms();

  const helpers = h('div');
  const drawHelpers = () => {
    const l = linkLabels(typeOf());
    const tasks = S.state.tasks.filter((t) => t.id === f.id && !t.cancelled && t.fileLink);
    fill(helpers, tasks.length ? h('details', { class: 'more' }, h('summary', null, 'Files from the team'),

          t.fileLink ? h('button', { class: 'btn tiny', onclick: () => { f.coverLink = t.fileLink; drawSlots(); toast('Set as ' + l.cover + ' · tap Save'); } }, 'Use as ' + l.cover) : null)))) : null);
  };
  drawHelpers();

  // A new post: from an idea, or on its own (a title and a type are enough).
  const approved = S.state.ideas.filter((i) => i.execution === 'Approved' && !i.hidden).slice().reverse();
  const own = h('div');
  const drawOwn = () => fill(own, f.id ? null : h('div', { class: 'two' },
    field('Title', input(f, 'title', { placeholder: 'What is the post?' })),
    field('Type', selectBox([{ value: '', label: 'Pick…' }].concat(S.state.types.map((x) => ({ value: x, label: x }))), f.type, (v) => { f.type = v; drawSlots(); usual(); }, { full: true }))));
  drawOwn();
  const ideaSel = c ? null : [
    field(h('span', null, 'From an idea', h('i', null, 'optional')), selectBox([{ value: '', label: 'No idea, a post on its own' }].concat(approved.map((i) => ({ value: i.id, label: i.id + ' · ' + i.idea.slice(0, 50) }))),
      f.id, (v) => { f.id = v; drawOwn(); drawSlots(); drawHelpers(); usual(); }, { full: true })),
    own];

  const filled = f.postLinks.filter(Boolean).length;
  const linksBox = h('div');
  let shown = Math.min(5, Math.max(1, filled + 1));
  const drawLinks = () => {
    fill(linksBox, ...f.postLinks.slice(0, shown).map((v, i) => h('input', { class: 'in', type: 'url', dir: 'ltr', style: 'margin-bottom:8px', placeholder: 'Post link ' + (i + 1), value: v, oninput: (e) => { f.postLinks[i] = e.target.value; } })),
      shown < 5 ? h('button', { class: 'btn tiny', onclick: () => { shown++; drawLinks(); } }, '+ Another link') : null);
  };
  drawLinks();

  // What happened to it, answered right here.
  const missed = c && c.publishDate && c.publishDate < S.state.today && c.status !== 'Published' && c.status !== 'Cancelled';
  const state = !c ? null
    : missed ? h('div', { class: 'note gold' }, h('div', { class: 't' }, 'Its day passed. Did it go out?'),
      h('div', { class: 'row', style: 'margin-top:6px' },
        h('button', { class: 'btn good small', onclick: () => calMove(c, 'published') }, '✓ It went out'),
        h('button', { class: 'btn small', onclick: () => calMove(c, 'ready') }, '↩ Back to Ready')))
    : c.status === 'Published' ? h('div', { class: 'note green' }, h('div', { class: 't' }, '✓ Published' + (c.publishedAt ? ' · ' + fmtDT(c.publishedAt) : '')),
      h('button', { class: 'btn tiny', style: 'margin-top:6px', onclick: () => calMove(c, 'unpublish') }, '↩ It didn\'t go out'))
    : c.status === 'Cancelled' ? h('div', { class: 'note' }, h('div', { class: 't' }, 'Cancelled'),
      h('button', { class: 'btn tiny', style: 'margin-top:6px', onclick: () => calMove(c, 'ready') }, '↩ Back to Ready'))
    : null;

  const body = h('div', null,
    c ? h('div', { class: 'info' },
      h('div', { class: 'info-top' }, h('h3', { dir: 'auto' }, c.idea)),
      h('div', { class: 'info-line' }, calBadge(c.status), h('span', { class: 'small muted' }, dots(c.type, c.publishDate ? dayLong(c.publishDate) : 'No date')))) : ideaSel,
    state,
    slotsBox,
    h('div', { class: 'two' },
      field('Publish date', dateField(f.publishDate, (v) => { f.publishDate = v; }, { anyDay: true, clearable: true })),
      field('Status', selectBox([{ value: 'Draft', label: 'Draft' }, { value: 'Final', label: 'Final · ready' }, { value: 'Published', label: 'Published' }, { value: 'Cancelled', label: 'Cancelled' }],
        f.status, (v) => { f.status = v; }, { full: true }))),
    field('Platforms', platformsBox),
    captionsBox(c, f),
    helpers,
    h('details', { class: 'more', open: filled ? true : null }, h('summary', null, 'Post links'), linksBox),
    c ? commentsBox(c.id, { video: c.type === 'Video' }) : null);
  const onSave = (btn) => {
    if (!c && !f.id) {
      if (!String(f.title || '').trim()) { toast('Write a title, or pick an idea.', true); return; }
      if (!f.type) { toast('Pick a type.', true); return; }
    }
    const edits = f.capEdits && Object.keys(f.capEdits).length ? f.capEdits : null;
    run(btn, 'cal.save', Object.assign({}, f, { capEdits: undefined, captions: edits || undefined }), f.publishDate ? 'Saved' : 'Saved · it\'s in Ready');
  };
  const del = c && c.status !== 'Cancelled' ? () => ask('Cancel ' + c.id + ' "' + (c.idea || '').slice(0, 40) + '"? It leaves the calendar.', 'Cancel post', true).then((ok) => { if (ok) calMove(c, 'cancel'); }) : null;
  openSheet(c ? c.id + ' · Post' : 'New post', body, editFoot(onSave, del, { deleteLabel: 'Cancel post', dirty: !c }));
}

function copyText(s) {
  const fallback = () => {
    const t = h('textarea', { style: 'position:fixed;opacity:0' });
    t.value = s;
    document.body.append(t);
    t.select();
    try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Select the text and copy it.', true); }
    t.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(() => toast('Copied'), fallback);
  else fallback();
}

function userSheet(id) {
  const u = id ? S.state.users.find((x) => x.id === id) : null;
  const f = u ? { id: u.id, name: u.name, prefix: u.prefix, role: u.role, title: u.title, username: u.username }
    : { name: '', prefix: '', role: 'Member', title: '', username: '' };
  const hasIdeas = u && S.state.ideas.some((i) => i.byId === u.id);
  const prefixIn = input(f, 'prefix', { dir: 'ltr', maxlength: 3, style: 'text-transform:uppercase', disabled: hasIdeas });
  const userIn = input(f, 'username', { dir: 'ltr', autocapitalize: 'none' });
  const nameIn = input(f, 'name', {
    oninput: (e) => {
      f.name = e.target.value;
      if (u) return;
      // Suggest a free prefix: first letter, else first two letters, else first + last.
      const letters = f.name.replace(/[^A-Za-z]/g, '').toUpperCase();
      const free = [letters.charAt(0), letters.slice(0, 2), letters.charAt(0) + letters.slice(-1)]
        .filter((x) => /^[A-Z]{1,3}$/.test(x)).find((x) => !S.state.users.some((o) => o.prefix === x));
      if (free) { f.prefix = free; prefixIn.value = free; }
      f.username = f.name.toLowerCase().replace(/[^a-z0-9.]/g, '');
      userIn.value = f.username;
    }
  });
  const save = h('button', { class: 'btn primary' }, u ? 'Save' : 'Add person');
  save.onclick = async () => {
    const d = await run(save, 'user.save', f, u ? 'Saved' : 'Person added');
    if (d && d.temp) showTemps([d.temp], 'Login details for ' + d.temp.name);
  };
  const footer = [save];
  if (u) {
    const reset = h('button', { class: 'btn' }, 'Reset password');
    reset.onclick = async () => {
      if (!await ask('Reset ' + u.name + '\'s password? They will be logged out everywhere.', 'Reset')) return;
      const d = await run(reset, 'user.reset', { id: u.id }, 'Password reset');
      if (d && d.temp) showTemps([d.temp], 'New login for ' + d.temp.name);
    };
    const act = h('button', { class: 'btn ' + (u.active ? 'danger' : 'good') }, u.active ? 'Deactivate' : 'Reactivate');
    act.onclick = async () => {
      if (u.active && !await ask('Deactivate ' + u.name + '? They can\'t log in anymore. Their ideas and tasks stay.', 'Deactivate', true)) return;
      run(act, 'user.active', { id: u.id, active: !u.active }, u.active ? u.name + ' deactivated' : u.name + ' reactivated');
    };
    if (u.id !== S.me.id) footer.unshift(act);
    footer.unshift(reset);
  }
  openSheet(u ? u.name : 'Add person', h('div', null,
    field('Name', nameIn),
    field('Title', input(f, 'title', { placeholder: 'e.g. Graphic Designer' })),
    field('Role', selectBox([{ value: 'Member', label: 'Member · their own tasks' }, { value: 'Manager', label: 'Manager · sees all, own tasks' }, { value: 'Admin', label: 'Admin · everything' }],
      f.role, (v) => { f.role = v; }, { full: true })),
    h('div', { class: 'two' },
      field('Username', userIn),
      field(h('span', null, 'ID prefix', h('i', null, hasIdeas ? 'locked' : 'unique')), prefixIn))), footer);
}

    const draw = () => fill(box,
      h('div', { class: 'chips' }, items2.map((x, i) => h('span', { class: 'chip' }, x,
        h('button', { type: 'button', class: 'btn ghost tiny', style: 'min-height:20px;padding:0 2px;color:var(--faint)', 'aria-label': 'Remove ' + x, onclick: () => { items2.splice(i, 1); draw(); } }, '✕')))),
      h('div', { class: 'row', style: 'margin-top:10px' },
        h('div', { class: 'grow' }, input(add, 'v', { placeholder: 'Add a ' + label.toLowerCase() })),
        h('button', { class: 'btn small', onclick: () => { const v = add.v.trim(); if (v) { items2.push(v); add.v = ''; draw(); } } }, 'Add')),
      h('button', { class: 'btn primary small', style: 'margin-top:10px', onclick: (e) => run(e.currentTarget, 'settings.save', { [key]: items2 }, 'Saved') }, 'Save'));
    draw();
    return box;
  };
  const hours = {};
  DAYN.forEach((d) => { hours[d] = set.hours[d] ? Object.assign({}, set.hours[d]) : null; });
  const hoursBox = h('div');
  const drawHours = () => fill(hoursBox,
    DAYN.map((d, i) => h('div', { class: 'row', style: 'padding:6px 0;border-bottom:1px solid var(--line)' },
      h('span', { style: 'width:44px;font-weight:550' }, d),
      selectBox([{ value: 'on', label: 'Work' }, { value: 'off', label: 'Off' }], hours[d] ? 'on' : 'off', (v) => { hours[d] = v === 'on' ? (hours[d] || { start: '09:00', end: '18:00' }) : null; drawHours(); }),
      hours[d] ? h('div', { class: 'row' },
        h('input', { class: 'in', type: 'time', style: 'width:auto;min-height:34px;padding:4px 8px', value: hours[d].start, onchange: (e) => { hours[d].start = e.target.value; } }), '–',
        h('input', { class: 'in', type: 'time', style: 'width:auto;min-height:34px;padding:4px 8px', value: hours[d].end, onchange: (e) => { hours[d].end = e.target.value; } })) : null)),
    h('button', { class: 'btn primary small', style: 'margin-top:10px', onclick: (e) => run(e.currentTarget, 'settings.save', { hours }, 'Work hours saved') }, 'Save'));
  drawHours();
  const app = { appName: set.appName };
  return h('div', null,
    h('div', { class: 'section', style: 'margin-top:4px' }, h('h2', null, 'Idea types')), h('div', { class: 'card' }, listEditor('types', set.types, 'Type')),
    h('div', { class: 'section' }, h('h2', null, 'Work hours')), h('div', { class: 'card' }, hoursBox),
    h('div', { class: 'section' }, h('h2', null, 'App name')), h('div', { class: 'card' }, input(app, 'appName'),
      h('button', { class: 'btn primary small', style: 'margin-top:10px', onclick: (e) => run(e.currentTarget, 'settings.save', { appName: app.appName }, 'Saved') }, 'Save')));
}

function templateSheet(key, type) {
  const t = key ? S.state.templates.find((x) => x.key === key) : null;
  const f = t ? { key: t.key, type: t.type, task: t.task, assignee: t.assignee, note: t.note, active: t.active, daysAfter: t.daysAfter, linkRole: t.linkRole }
    : { type: type || '', task: '', assignee: '', note: '', active: true, daysAfter: 0, linkRole: 'Media' };
  const btn = h('button', { class: 'btn primary' }, 'Save');
  btn.onclick = () => run(btn, 'template.save', f, 'Saved');
  openSheet(t ? 'Auto task' : 'New auto task', h('div', null,
    field('Task', input(f, 'task')),
    h('div', { class: 'two' },
      field('Type', selectBox(S.state.types.map((x) => ({ value: x, label: x })), f.type, (v) => { f.type = v; }, { full: true })),
      field('Person', selectBox(peopleOptions(true), f.assignee, (v) => { f.assignee = v; }, { full: true }))),
    h('div', { class: 'two' },
      field('Deadline', selectBox([0, 1, 2, 3].map((n) => ({ value: String(n), label: n ? '+' + n + ' workday' + (n > 1 ? 's' : '') : 'Same day' })), String(f.daysAfter), (v) => { f.daysAfter = Number(v); }, { full: true })),
      field('Goes on the post as', selectBox(linkRoleOptions(f.type), f.linkRole, (v) => { f.linkRole = v; }, { full: true }))),
    field(h('span', null, 'Note', h('i', null, 'added under the brief')), area(f, 'note', { rows: 2 })),
    field('Active', selectBox([{ value: 'on', label: 'On' }, { value: 'off', label: 'Off' }], f.active ? 'on' : 'off', (v) => { f.active = v === 'on'; }, { full: true }))), btn);
}

/* ----- Activity log ----- */
function describeKey(l) {
  const st = S.state;
  if (l.entity === 'Settings') return l.key;
  if (l.entity === 'Task') { const t = st.tasks.find((x) => x.key === l.key); return t ? t.id + ' · ' + t.task + ' (' + t.assignee + ')' : 'task'; }
  if (l.entity === 'Calendar') { const c = st.calendar.find((x) => x.key === l.key); return c ? 'calendar ' + c.id : 'calendar'; }
  if (l.entity === 'User') return st.names[l.key] || l.key;
  if (l.entity === 'Template') { const t = (st.templates || []).find((x) => x.key === l.key); return t ? 'template ' + t.type + ' · ' + t.task : 'template'; }
  return l.entity === 'Idea' ? l.key : l.entity + ' ' + l.key;
}
/** Makes log values readable: dates, people, yes/no. */
function niceVal(v) {
  if (!v) return '—';
  if (v === 'TRUE') return 'Yes';
  if (v === 'FALSE') return 'No';
  if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(v)) return fmtDT(v);
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return fmtD(v);
  v = v.replace(/\bU\d{3,}\b/g, (id) => S.state.names[id] || id);
  return v.length > 80 ? v.slice(0, 80) + '…' : v;
}
/** One save writes one log row per field; show them as one entry. */
function groupLog(rows) {
  const out = [];
  rows.forEach((l) => {
    const g = out[out.length - 1];
    if (g && g.at === l.at && g.user === l.user && g.action === l.action && g.key === l.key && g.entity === l.entity) g.items.push(l);
    else out.push({ at: l.at, user: l.user, action: l.action, entity: l.entity, key: l.key, items: [l] });
  });
  return out;
}
function logRow(g) {
  return h('div', { class: 'log-row' },
    h('div', null, h('b', null, g.user), ' · ', g.action.toLowerCase(), ' ', h('span', null, describeKey(g))),
    g.items.map((l) => l.field
      ? h('div', { class: 'small', dir: 'auto' }, l.field + ': ', h('span', { class: 'muted' }, niceVal(l.old)), ' → ', niceVal(l.new))
      : l.new ? h('div', { class: 'small muted', dir: 'auto' }, niceVal(l.new)) : null),
    h('div', { class: 'small faint' }, fmtDT(g.at)));
}
function activityView() {
  if (!S.ui.log) {
    S.ui.log = 'loading';
    call('log.list', { limit: 300 }).then((d) => { S.ui.log = d.log; render(); }).catch((e) => { S.ui.log = null; handleErr(e); });
  }
  if (S.ui.log === 'loading') return h('div', { class: 'loading', style: 'min-height:200px' }, h('div', { class: 'spinner' }));
  return S.ui.log.length ? h('div', { class: 'list' }, groupLog(S.ui.log).map(logRow)) : h('div', { class: 'empty' }, 'Nothing yet.');
}

boot();
</script>

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
